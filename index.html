// Agregar a mano a la lista de almuerzo del chalet (después de las 11 el Puesto ya no anota solo).
// Se elige de la gente que está EN EL PREDIO (misma cuenta que "En Predio"), buscando por DNI, nombre o apellido;
// primero aparecen los que ya están en el chalet y después los del camino. El admin puede ver toda la base.
function ConteoViandasChaletAddModal({user,proyectoId,existentes,onClose,onAdded}){
  const[search,setSearch]=useState("");
  const[personas,setPersonas]=useState([]);
  const[enPredio,setEnPredio]=useState(null); // Set de persona_id / dni dentro del predio
  const[pos,setPos]=useState({});             // persona_id → "chalet" | "camino"
  const[todaLaBase,setTodaLaBase]=useState(false);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(null);
  useEffect(()=>{
    Promise.all([
      db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc",lim:5000}),
      calcPersonasEnPredio().catch(()=>null),
      calcPosicionesMontana().catch(()=>null),
    ]).then(([{data},pred,mont])=>{
      if(data)setPersonas(data);
      setEnPredio(pred?pred.inSet:new Set());
      setPos((mont&&mont.persona)||{});
      setLoading(false);
    });
  },[]);
  const existSet=new Set(existentes.map(e=>e.persona_id));
  const lugar=(p)=>pos[p.id]==="chalet"?"chalet":(pos[p.id]==="camino"?"camino":"predio");
  const orden={chalet:0,camino:1,predio:2};
  const q=search.trim().toLowerCase();
  const filtered=personas
    .filter(p=>!existSet.has(p.id))
    .filter(p=>todaLaBase||(enPredio&&(enPredio.has(p.id)||enPredio.has(p.dni))))
    .filter(p=>!q||`${p.nombre} ${p.apellido} ${p.dni}`.toLowerCase().includes(q))
    .sort((a,b)=>orden[lugar(a)]-orden[lugar(b)]);
  const LUGAR_TAG={chalet:{t:"en chalet",c:"#A78BFA"},camino:{t:"en camino",c:"#60A5FA"},predio:{t:"en predio (campamento o caminos)",c:"var(--tx2)"}};
  const add=async(persona)=>{
    setSaving(persona.id);
    const todayStr=today();
    const{ok}=await db.ins("comidas_diarias",{
      proyecto_id:proyectoId,persona_id:persona.id,fecha:todayStr,
      tipo:"almuerzo",ubicacion:"chalet",come:true,fuente:"manual",
      creada_por:user.id,modificada_por:user.id,
    },true,"persona_id,fecha,tipo");
    setSaving(null);
    if(!ok){alert("No se pudo agregar.");return;}
    onAdded&&onAdded();
  };
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">Agregar comensal en chalet</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div style={{fontSize:12,color:"var(--tx2)",marginBottom:10}}>Queda anotado para <strong style={{color:"var(--tx)"}}>almorzar hoy en el chalet</strong> (también se ve en Viandas). Solo aparece la gente que está en el predio.</div>
      <div className="f"><label>Buscar por DNI, nombre o apellido</label><input placeholder="Ej: 30456789 o Pérez" value={search} onChange={e=>setSearch(e.target.value)} autoFocus/></div>
      {user.rol==="admin"&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--tx2)",margin:"-4px 0 8px",cursor:"pointer"}}><input type="checkbox" checked={todaLaBase} onChange={e=>setTodaLaBase(e.target.checked)} style={{width:"auto"}}/> Buscar en toda la base (no solo en el predio)</label>}
      {loading?<Spin/>:<div style={{maxHeight:340,overflowY:"auto",marginTop:4}}>
        {filtered.slice(0,40).map(p=>{const lg=LUGAR_TAG[lugar(p)];return <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:5,marginBottom:3,cursor:saving?"wait":"pointer",opacity:saving===p.id?.5:1}} onMouseOver={e=>e.currentTarget.style.background="var(--s2)"} onMouseOut={e=>e.currentTarget.style.background="transparent"} onClick={()=>!saving&&add(p)}>
          <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
          <div style={{flex:1}}><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa||"—"} · DNI {p.dni}</div></div>
          {(!todaLaBase||enPredio.has(p.id)||enPredio.has(p.dni))&&<span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:lg.c,border:"1px solid currentColor",borderRadius:3,padding:"1px 6px",whiteSpace:"nowrap"}}>{lg.t}</span>}
          {saving===p.id&&<span style={{fontSize:11,color:"var(--tx2)"}}>agregando...</span>}
        </div>;})}
        {filtered.length>40&&<div style={{textAlign:"center",color:"var(--tx3)",padding:8,fontSize:11}}>Hay {filtered.length-40} más: escribí parte del nombre o del DNI para encontrarlo.</div>}
        {filtered.length===0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:20,fontSize:13}}>{q?"Nadie en el predio coincide con la búsqueda (o ya está en la lista).":"No hay nadie más en el predio para agregar."}</div>}
      </div>}
    </div>
  </div></div>;
}

function ConteoViandasChalet({user,proyectoId}){
  const[comidas,setComidas]=useState([]);
  const[personasMap,setPersonasMap]=useState({});
  const[lastEvents,setLastEvents]=useState({});
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[filterEmpresa,setFilterEmpresa]=useState({});
  const[dieta,setDieta]=useState({});        // DNI normalizado → {nota,hasta} (menú dieta cargado en Viandas)
  const[soloDieta,setSoloDieta]=useState(false);
  // Agregar / quitar comensales: admin y los puestos de montaña (P2 y P3)
  const canEdit=user.rol==="admin"||user.puesto_nombre==="Puesto 2"||user.puesto_nombre==="Puesto 3";
  const todayStr=today();

  const load=async()=>{
    const[{data:c},pos,di]=await Promise.all([
      db.sel("comidas_diarias",{f:[["fecha","eq",todayStr],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],ord:"creada_at.asc",lim:1000}),
      calcPosicionesMontana(),
      cmdFetchDieta().catch(()=>({})),
    ]);
    const items=c||[];
    setComidas(items);
    setLastEvents(pos.personaLast||{});
    const dm={};Object.entries(di||{}).forEach(([k,v])=>{dm[normDni(k)]=v;});setDieta(dm);
    const pids=items.map(x=>x.persona_id);
    if(pids.length>0){
      const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido,empresa,dni",inFilter:["id",pids]});
      const pm={};(pers||[]).forEach(p=>{pm[p.id]=p;});
      setPersonasMap(pm);
    }else setPersonasMap({});
    setLoading(false);
  };
  useEffect(()=>{load();const i=setInterval(load,15000);return()=>clearInterval(i);},[]);

  const quitar=async(c)=>{
    const p=personasMap[c.persona_id];
    const nom=p?`${p.nombre} ${p.apellido}`:"esta persona";
    if(!confirm(`Quitar a ${nom} de la lista de comensales en chalet?`))return;
    await db.upd("comidas_diarias",{come:false,modificada_por:user.id,modificada_at:new Date().toISOString()},[["id","eq",c.id]]);
    load();
  };

  const empresas=[...new Set(comidas.map(c=>{const p=personasMap[c.persona_id];return p?(p.empresa||"Sin empresa"):"—";}))].sort();
  const activeEmpresas=Object.keys(filterEmpresa).filter(e=>filterEmpresa[e]);
  // Menú dieta vigente hoy (la misma regla que Viandas: con fecha "hasta" vale hasta ese día inclusive)
  const dietaDe=(p)=>{if(!p)return null;const v=dieta[normDni(p.dni)];return cmdIsDietaActiveForDate(v,todayStr)?v:null;};
  const porEmpresa=activeEmpresas.length===0?comidas:comidas.filter(c=>{const p=personasMap[c.persona_id];const e=p?(p.empresa||"Sin empresa"):"—";return filterEmpresa[e];});
  const nDieta=porEmpresa.filter(c=>dietaDe(personasMap[c.persona_id])).length;
  const filtered=soloDieta?porEmpresa.filter(c=>dietaDe(personasMap[c.persona_id])):porEmpresa;
  const DIETA_COL="#FBBF24";

  return <div>
    <div className="ph2">
      <div className="ptit">Conteo Viandas Chalet · <span>Almuerzo</span> de hoy</div>
      {canEdit&&<button className="badd" onClick={()=>setShowAdd(true)}>+ Agregar comensal en chalet</button>}
    </div>
    <div style={{background:"linear-gradient(135deg,rgba(245,158,11,.15),rgba(139,92,246,.08))",border:"2px solid var(--acc)",borderRadius:10,padding:"18px 24px",marginBottom:18,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
      <div style={{fontFamily:"var(--fh)",fontSize:64,fontWeight:900,color:"var(--acc)",lineHeight:1}}>{filtered.length}</div>
      <div>
        <div style={{fontFamily:"var(--fh)",fontSize:18,fontWeight:800,color:"var(--acc)",textTransform:"uppercase",letterSpacing:".05em"}}>Comensales en Chalet</div>
        <div style={{fontSize:13,color:"var(--tx2)",marginTop:2}}>{fmtD(todayStr)} · actualiza cada 15 seg</div>
        {nDieta>0&&<div style={{fontSize:13,fontWeight:700,color:DIETA_COL,marginTop:4}}>🥗 {nDieta} con menú dieta</div>}
      </div>
      <button onClick={()=>{
        const lines=filtered.map(c=>{const p=personasMap[c.persona_id];if(!p)return`(${c.persona_id})`;const d=dietaDe(p);return`${p.nombre} ${p.apellido} — ${p.empresa||""}${d?` — DIETA${d.nota?": "+d.nota:""}`:""}`;});
        const txt=`COMENSALES EN CHALET ${fmtD(todayStr)} — TOTAL ${filtered.length}${nDieta?` (${nDieta} con dieta)`:""}\n\n${lines.join("\n")}`;
        navigator.clipboard.writeText(txt).catch(()=>{const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);});
      }} style={{background:"rgba(245,158,11,.15)",border:"1px solid var(--acc)",color:"var(--acc)",borderRadius:5,padding:"7px 14px",fontFamily:"var(--fh)",fontSize:13,fontWeight:700,textTransform:"uppercase",cursor:"pointer",marginLeft:"auto"}}>Copiar lista</button>
    </div>
    {(empresas.length>1||nDieta>0||soloDieta)&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
      {(nDieta>0||soloDieta)&&<button onClick={()=>setSoloDieta(!soloDieta)} style={{padding:"3px 10px",borderRadius:12,border:"1px solid",fontSize:11,fontFamily:"var(--fm)",fontWeight:700,cursor:"pointer",background:soloDieta?DIETA_COL:"var(--s2)",color:soloDieta?"#000":DIETA_COL,borderColor:DIETA_COL}}>🥗 Solo dieta ({nDieta})</button>}
      {empresas.length>1&&empresas.map(e=>{const on=!!filterEmpresa[e];return <button key={e} onClick={()=>setFilterEmpresa(f=>({...f,[e]:!f[e]}))} style={{padding:"3px 10px",borderRadius:12,border:"1px solid",fontSize:11,fontFamily:"var(--fm)",cursor:"pointer",background:on?"var(--acc2)":"var(--s2)",color:on?"#fff":"var(--tx2)",borderColor:on?"var(--acc2)":"var(--bd)"}}>{e}</button>;})}
      {(activeEmpresas.length>0||soloDieta)&&<button className="bsm" onClick={()=>{setFilterEmpresa({});setSoloDieta(false);}} style={{fontSize:11}}>x Limpiar filtro</button>}
    </div>}
    {loading?<Spin/>:<div className="tw"><table>
      <thead><tr><th>Persona</th><th>Empresa</th><th>Última fichada</th>{canEdit&&<th></th>}</tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={canEdit?4:3} style={{textAlign:"center",color:"var(--tx2)",padding:28}}>{comidas.length===0?"Aún nadie está contado para almorzar en chalet.":"Sin coincidencias con el filtro."}</td></tr>}
        {filtered.map(c=>{
          const p=personasMap[c.persona_id];
          const le=lastEvents[c.persona_id];
          const d=dietaDe(p);
          return <tr key={c.id} style={d?{boxShadow:`inset 3px 0 0 ${DIETA_COL}`}:undefined}>
            <td><div style={{display:"flex",alignItems:"center",gap:8}}>
              <div className="av">{p?ini(`${p.nombre} ${p.apellido}`):"?"}</div>
              <div>
                <div style={{fontWeight:500,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>{p?`${p.nombre} ${p.apellido}`:"(persona borrada)"}
                  {d&&<span style={{background:DIETA_COL,color:"#000",fontSize:10,fontWeight:800,padding:"1px 6px",borderRadius:3,textTransform:"uppercase",letterSpacing:".03em"}}>🥗 Dieta</span>}
                </div>
                {p&&<div style={{fontSize:11,color:"var(--tx2)"}}>DNI {p.dni}</div>}
                {d&&(d.nota||d.hasta)&&<div style={{fontSize:11,color:DIETA_COL,marginTop:2}}>{d.nota?"Nota: "+d.nota:""}{d.nota&&d.hasta?" · ":""}{d.hasta?"hasta "+fmtD(d.hasta):""}</div>}
              </div>
            </div></td>
            <td style={{color:"var(--tx2)",fontSize:12}}>{p?p.empresa||"—":"—"}</td>
            <td style={{fontSize:12,color:"var(--tx2)"}}>
              {le?<><span className={`ld ld-${le.dir==="entrada"?"in":"out"}`} style={{fontSize:10}}>{dirVerbo(le.puesto,le.dir)}</span> <span style={{marginLeft:6,fontFamily:"var(--fm)"}}>{le.puesto} · {fmtTs(new Date(le.t).toISOString())}</span></>:"sin fichada hoy"}
            </td>
            {canEdit&&<td><button className="bsm bsm-r" onClick={()=>quitar(c)}>Quitar</button></td>}
          </tr>;
        })}
      </tbody>
    </table></div>}
    {showAdd&&<ConteoViandasChaletAddModal user={user} proyectoId={proyectoId} existentes={comidas} onClose={()=>setShowAdd(false)} onAdded={()=>{setShowAdd(false);load();}}/>}
  </div>;
}

// ═══════════════════════════════════════════════════════════════════════════
// MÓDULO COMEDOR (tab "Viandas" nuevo) — Fase B: conectado a Supabase.
// Tablas: obra.viandas_calendario, obra.viandas_despachos, obra.viandas_dieta.
// Realtime en despachos + dieta para sync entre los 2 puestos.
// ═══════════════════════════════════════════════════════════════════════════
const CMD_COMIDAS=[
  {key:'desayuno',label:'Desayuno',short:'DES',em:'☕'},
  {key:'almuerzo',label:'Almuerzo',short:'ALM',em:'🍽️'},
  {key:'merienda',label:'Merienda',short:'MER',em:'🥐'},
  {key:'cena',    label:'Cena',    short:'CEN',em:'🌙'},
];
const CMD_LETRAS={C:'Campamento',O:'Omega',R:'Río Villegas',H:'Hostel',N:'Sin información',I:'Viaje a obra',V:'Viaje desde obra',F:'Franco'};

// Cargar personas del día: cruza viandas_calendario × personas por DNI.
// Retorna [{dni,nombre,apellido,empresa,id,code,letra,letraNom,numero,comidas:[]}]
// Solo devuelve personas que tienen al menos una comida marcada.
const cmdFetchPersonasFecha=async(fecha)=>{
  const{data:cal}=await db.sel("viandas_calendario",{f:[["fecha","eq",fecha]],lim:5000});
  const rows=(cal||[]).filter(r=>r.desayuno||r.almuerzo||r.merienda||r.cena);
  if(rows.length===0)return[];
  // Se busca cada DNI tal cual, en mayúsculas y en minúsculas (los extranjeros pueden tener letras y estar
  // cargados distinto en el Radar y en Personal); para los numéricos las tres variantes son la misma.
  const dnis=[...new Set(rows.flatMap(r=>{const s=String(r.dni).trim();return[s,s.toUpperCase(),s.toLowerCase()];}))];
  const{data:pers}=await db.sel("personas",{cols:"dni,nombre,apellido,empresa",inFilter:["dni",dnis]});
  const persMap={};(pers||[]).forEach(p=>{persMap[normDni(p.dni)]=p;});
  return rows.map(r=>{
    const p=persMap[normDni(r.dni)]||{nombre:'(no registrado)',apellido:'',empresa:''};
    const comidas=[];
    if(r.desayuno)comidas.push('desayuno');
    if(r.almuerzo)comidas.push('almuerzo');
    if(r.merienda)comidas.push('merienda');
    if(r.cena)comidas.push('cena');
    return{dni:r.dni,id:r.dni,nombre:p.nombre,apellido:p.apellido,empresa:p.empresa,code:r.codigo,letra:r.letra,letraNom:CMD_LETRAS[r.letra]||'',numero:r.numero,comidas};
  });
};
const cmdFetchDespachos=async(fecha)=>{
  const{data}=await db.sel("viandas_despachos",{f:[["fecha","eq",fecha]],ord:"ts.asc",lim:5000});
  return(data||[]).map(d=>({id:d.id,personaId:d.dni,dni:d.dni,comida:d.comida,puesto:d.puesto,operador:d.operador_email,ts:d.ts,fecha:d.fecha}));
};
const cmdFetchDieta=async()=>{
  const{data}=await db.sel("viandas_dieta",{lim:5000});
  const m={};(data||[]).forEach(d=>{m[d.dni]={nota:d.nota||'',hasta:d.hasta||null};});
  return m;
};
// cmdFetchComeChalet(fecha): Set<dni> de personas que comen en el chalet ese día.
// Se lee de la tabla comidas_diarias (ya existente, se llena en el Puesto al fichar):
// entrada a P2/P3 antes de 11 AM marca por default "come arriba" (el garitero puede modificar).
// Retorna Set de DNIs para hacer lookup rápido en el listado del comedor.
const cmdFetchComeChalet=async(fecha)=>{
  const{data:cd}=await db.sel("comidas_diarias",{f:[["fecha","eq",fecha||today()],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],cols:"persona_id",lim:2000});
  const personaIds=(cd||[]).map(x=>x.persona_id).filter(Boolean);
  if(personaIds.length===0)return new Set();
  const{data:pers}=await db.sel("personas",{cols:"id,dni",inFilter:["id",personaIds]});
  return new Set((pers||[]).map(p=>p.dni).filter(Boolean));
};
// Plato/tarjeta: se entrega una sola vez y queda fijo para la persona (no es por día). Map dni → entregado_at.
const cmdFetchPlatos=async()=>{
  const{data}=await db.sel("viandas_plato",{cols:"dni,entregado_at",lim:5000});
  const m={};(data||[]).forEach(r=>{m[r.dni]=r.entregado_at;});
  return m;
};
// Almuerzo y cena se pueden entregar más de una vez por persona por día (con aviso); desayuno y merienda, una sola.
const CMD_REPETIBLES=['almuerzo','cena'];
const cmdRepetible=(k)=>CMD_REPETIBLES.includes(k);
const cmdHora=(ts)=>new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const cmdOtro=(k)=>(k==='cena'||k==='merienda')?'otra':'otro';
// Aviso al entregar por segunda vez la misma comida: cuántas veces, a qué hora y en qué puesto la retiró.
const cmdAvisoRepetir=(persona,comida,desps)=>{
  const c=CMD_COMIDAS.find(x=>x.key===comida);
  const l=desps.filter(d=>d.dni===persona.dni&&d.comida===comida).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  return '⚠️ ATENCIÓN: '+persona.nombre+' '+persona.apellido+' YA RETIRÓ '+c.label.toUpperCase()+' HOY'+(l.length>1?' ('+l.length+' veces)':'')+'\n'
    +l.map(d=>'· '+cmdHora(d.ts)+' en '+cmdPuestoShort(d.puesto)).join('\n')
    +'\n\n¿Entregar '+cmdOtro(comida)+' '+c.label.toLowerCase()+'?';
};
// Agregados: personas que no están en el listado del día, o comidas que no tenían programadas, que la cocina
// entrega igual. Quedan registrados en obra.viandas_agregados (quién, cuándo, en qué puesto) y se suman al listado.
const cmdFetchAgregados=async(fecha)=>{
  const{data}=await db.sel("viandas_agregados",{f:[["fecha","eq",fecha]],lim:2000});
  const m={};(data||[]).forEach(r=>{m[r.dni]=r;});
  return m;
};
const cmdMergeAgregados=(radar,ag)=>{
  const keys=CMD_COMIDAS.map(c=>c.key);
  const enRadar=new Set();
  const out=radar.map(p=>{
    enRadar.add(normDni(p.dni));
    const a=ag[p.dni];if(!a)return p;
    const extras=(a.comidas||[]).filter(k=>!p.comidas.includes(k));
    if(!extras.length)return p;
    return{...p,comidas:keys.filter(k=>p.comidas.includes(k)||extras.includes(k)),extras,agregado:a};
  });
  Object.values(ag).forEach(a=>{
    if(enRadar.has(normDni(a.dni)))return;
    const comidas=keys.filter(k=>(a.comidas||[]).includes(k));
    if(!comidas.length)return;
    out.push({dni:a.dni,id:a.dni,nombre:a.nombre||'(sin nombre)',apellido:a.apellido||'',empresa:a.empresa||'',code:null,letra:null,letraNom:'',numero:null,comidas,extras:comidas,agregado:a,noListado:true});
  });
  return out;
};
// DNI válido para agregar: 5 a 15 letras/números con al menos un número (argentinos y extranjeros con letras)
const cmdPareceDni=(s)=>{const t=normDni(s);return /^[A-Z0-9]{5,15}$/.test(t)&&/\d/.test(t);};
const cmdComidaPorHora=()=>{const h=new Date().getHours();return h<10?'desayuno':(h<15?'almuerzo':(h<19?'merienda':'cena'));};
// Resumen por día: programadas (viandas_calendario) y despachadas (viandas_despachos, cuenta repeticiones de cena).
const cmdFetchResumen=async(desde,hasta)=>{
  const[{data:cal},{data:desp}]=await Promise.all([
    dbSelAll("viandas_calendario",{cols:"fecha,dni,desayuno,almuerzo,merienda,cena",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"fecha.asc,dni.asc"}),
    dbSelAll("viandas_despachos",{cols:"id,fecha,comida",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"id.asc"}),
  ]);
  const byDay={};
  const get=(f)=>byDay[f]||(byDay[f]={prog:{desayuno:0,almuerzo:0,merienda:0,cena:0},desp:{desayuno:0,almuerzo:0,merienda:0,cena:0},hayProg:false});
  (cal||[]).forEach(r=>{const x=get(r.fecha);x.hayProg=true;CMD_COMIDAS.forEach(c=>{if(r[c.key])x.prog[c.key]++;});});
  (desp||[]).forEach(r=>{const x=get(r.fecha);if(x.desp[r.comida]!==undefined)x.desp[r.comida]++;});
  return byDay;
};
// Dieta helpers: cmdIsDietaActive/ForDate/Note/Hasta acepta {nota,hasta}|null
const cmdGetDietaObj=(v)=>{
  if(v===undefined||v===null||v===false)return null;
  if(v===true)return{nota:'',hasta:null};
  if(typeof v==='string')return{nota:v,hasta:null};
  if(typeof v==='object')return{nota:v.nota||'',hasta:v.hasta||null};
  return null;
};
const cmdIsDietaActive=(v)=>cmdGetDietaObj(v)!==null;
const cmdIsDietaActiveForDate=(v,fecha)=>{const o=cmdGetDietaObj(v);if(!o)return false;if(!o.hasta)return true;return fecha<=o.hasta;};
const cmdGetDietaNote=(v)=>{const o=cmdGetDietaObj(v);return o?o.nota:'';};
const cmdGetDietaHasta=(v)=>{const o=cmdGetDietaObj(v);return o?(o.hasta||''):'';};
const cmdUuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'_'+Math.random().toString(36).slice(2));
// Fecha local (no UTC): con toISOString, en Argentina después de las 21 hs saltaba al día siguiente.
const cmdIsoDate=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cmdAddDays=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return cmdIsoDate(new Date(y,m-1,d+n));};
const cmdFmtDate=(iso)=>{const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const cmdPuestoClass=(p)=>p==='DESPACHO CAMPAMENTO'?'camp':(p==='DESPACHO CHALET'?'chal':'admin');
const cmdPuestoShort=(p)=>p==='DESPACHO CAMPAMENTO'?'Camp.':(p==='DESPACHO CHALET'?'Chalet':'Admin');
// Rol de ControlObra → puesto del comedor
const cmdPuestoFromRol=(rol)=>{
  if(rol==='cocina_campamento')return 'DESPACHO CAMPAMENTO';
  if(rol==='cocina_chalet')return 'DESPACHO CHALET';
  return 'ADMIN';
};

// ─── Sub-componentes del módulo Comedor ─────────────────────────────────────
function CmdDietaModal({persona,currentValue,fecha,onSave,onQuit,onClose}){
  const[note,setNote]=useState(cmdGetDietaNote(currentValue));
  const[hasta,setHasta]=useState(cmdGetDietaHasta(currentValue));
  const active=cmdIsDietaActive(currentValue);
  // "Aplica hasta" anterior al día que se está mirando = dieta vencida: no se lista ni se marca. Se avisa en el modal
  // y se pide confirmar al guardar (pasaba que una fecha vieja quedaba precargada al editar la nota).
  const ref=fecha||cmdIsoDate(new Date());
  const vencida=!!(hasta&&hasta<ref);
  const guardar=()=>{
    if(vencida&&!confirm('La fecha "Aplica hasta" ('+cmdFmtDate(hasta)+') es anterior al '+cmdFmtDate(ref)+': la dieta queda guardada pero vencida, no se va a mostrar en la lista.\n\n¿Guardar igual?'))return;
    onSave({nota:note,hasta:hasta||null});
  };
  return <div className="cmd-modov" onClick={onClose}>
    <div className="cmd-modal" onClick={e=>e.stopPropagation()}>
      <h3>🥗 Menú dieta</h3>
      <div className="who">{persona.nombre} {persona.apellido} · DNI {persona.dni}</div>
      <label>Nota / comentario (para la cocina)</label>
      <textarea autoFocus value={note} onChange={e=>setNote(e.target.value)} placeholder='Ej: "diabético", "sin sal", "vegetariano", "sin gluten"'/>
      <label style={{marginTop:14}}>Aplica hasta el (opcional)</label>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{padding:8,background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx)',borderRadius:6,fontFamily:'var(--fm)',fontSize:13,flex:1}}/>
        {hasta&&<button onClick={()=>setHasta('')} style={{background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx3)',padding:'8px 10px',borderRadius:6,fontSize:11,cursor:'pointer'}}>Sin fecha</button>}
      </div>

      {vencida&&<div style={{marginTop:8,padding:'8px 10px',borderRadius:6,background:'rgba(239,68,68,.12)',border:'1px solid var(--cmd-err)',color:'var(--cmd-err)',fontSize:12,fontWeight:700}}>⚠️ Con esta fecha la dieta está vencida (ya pasó el {cmdFmtDate(hasta)}): no se va a mostrar en la lista. Tocá "Sin fecha" o poné una fecha a partir del {cmdFmtDate(ref)}.</div>}
      <div className="actions">
        <button className="btnSave" onClick={guardar}>{active?'Actualizar':'Marcar dieta'}</button>

}
// Alta de alguien que no está en el listado del día: se busca el DNI en la base de personas para completar
// nombre/empresa, se eligen las comidas que se le entregan y queda registrado en viandas_agregados.
function CmdAgregarModal({dniInicial,personas,onClose,onConfirm}){
  const[dni,setDni]=useState(dniInicial||'');
  const[nombre,setNombre]=useState('');
  const[apellido,setApellido]=useState('');
  const[empresa,setEmpresa]=useState('');
  const[comidas,setComidas]=useState(()=>new Set([cmdComidaPorHora()]));
  const[motivo,setMotivo]=useState('');
  const[base,setBase]=useState(null); // null = sin buscar · false = no está en la base · objeto = encontrado
  const[saving,setSaving]=useState(false);
  const clean=normDni(dni);
  const enLista=personas.find(p=>sameDni(p.dni,clean));
  useEffect(()=>{
    if(!cmdPareceDni(clean)){setBase(null);return;}
    let vivo=true;
    db.sel("personas",{cols:"dni,nombre,apellido,empresa",f:[["dni","ilike",clean],["deleted_at","is","null"]],lim:1}).then(({data})=>{
      if(!vivo)return;
      const p=data&&data[0];
      setBase(p||false);
      if(p){setNombre(p.nombre||'');setApellido(p.apellido||'');setEmpresa(p.empresa||'');}
    });
    return()=>{vivo=false;};
  },[clean]);
  const toggle=(k)=>setComidas(prev=>{const n=new Set(prev);if(n.has(k))n.delete(k);else n.add(k);return n;});
  const valido=cmdPareceDni(clean)&&!enLista&&(nombre.trim()||apellido.trim())&&comidas.size>0;
  const confirmar=async()=>{
    if(!valido||saving)return;
    setSaving(true);
    // Si está en la base de personal se usa el DNI tal como figura ahí (para que coincida en todos lados)
    await onConfirm({dni:base?String(base.dni).trim():clean,nombre:nombre.trim(),apellido:apellido.trim(),empresa:empresa.trim()},CMD_COMIDAS.map(c=>c.key).filter(k=>comidas.has(k)),motivo.trim());
    setSaving(false);
  };
  return <div className="cmd-modov" onClick={onClose}>
    <div className="cmd-modal" onClick={e=>e.stopPropagation()}>
      <h3 style={{color:'var(--cmd-info)'}}>➕ Agregar persona al listado de hoy</h3>
      <div className="who">Para alguien que no figura en el Radar. Queda registrado quién lo agregó, cuándo y en qué puesto.</div>
      <label>DNI</label>
      <input className="cmd-inp" autoCapitalize="characters" autoComplete="off" autoFocus={!dniInicial} value={dni} onChange={e=>setDni(e.target.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase())} placeholder="Sin puntos (extranjeros: con letras)"/>
      {enLista&&<div className="cmd-aviso">{enLista.nombre} {enLista.apellido} ya está en el listado de hoy. Buscalo y tocá la comida: si no la tiene programada, la app te deja entregarla igual.</div>}
      {!enLista&&base&&<div style={{fontSize:11,color:'var(--cmd-ok)',marginTop:-6,marginBottom:10}}>✓ Encontrado en la base de personal</div>}
      {!enLista&&base===false&&<div style={{fontSize:11,color:'var(--cmd-dieta)',marginTop:-6,marginBottom:10}}>No está en la base de personal: completá el nombre a mano.</div>}
      {!enLista&&<>
        <div style={{display:'flex',gap:8}}>
          <div style={{flex:1}}><label>Nombre</label><input className="cmd-inp" value={nombre} onChange={e=>setNombre(e.target.value)} autoFocus={!!dniInicial}/></div>
          <div style={{flex:1}}><label>Apellido</label><input className="cmd-inp" value={apellido} onChange={e=>setApellido(e.target.value)}/></div>
        </div>
        <label>Empresa</label>
        <input className="cmd-inp" value={empresa} onChange={e=>setEmpresa(e.target.value)}/>
        <label>Comida que se le entrega ahora</label>
        <div className="cmd-fbar" style={{marginBottom:10}}>
          {CMD_COMIDAS.map(c=><button key={c.key} className={'cmd-fbtn '+(comidas.has(c.key)?'active':'')} onClick={()=>toggle(c.key)}>{c.em} {c.label}</button>)}
        </div>
        <label>Motivo (opcional)</label>
        <input className="cmd-inp" value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder='Ej: "visita", "no estaba en el Radar", "subcontratista nuevo"'/>
      </>}
      <div className="actions">
        <button className="btnSave" style={{background:'var(--cmd-info)'}} disabled={!valido||saving} onClick={confirmar}>{saving?'Guardando…':'Agregar y entregar'}</button>
        <button className="btnCancel" onClick={onClose}>Cancelar</button>
      </div>
    </div>
  </div>;
}
function CmdMealPill({comida,aplica,despachado,count,onClick,clickable,agregable}){
  const cls=!aplica?'na':(despachado?'disp':'pend');
  const canClick=clickable&&onClick&&(aplica||agregable);
  const repetible=cmdRepetible(comida.key);
  const tip=!canClick?undefined:(!aplica?'No programado · click para entregar igual (queda como agregado)':(!despachado?'Click para despachar':(repetible?'Ya retiró · click para entregar '+cmdOtro(comida.key)+' (con aviso)':'Click para deshacer')));
  return <div className={'cmd-mp '+cls} onClick={canClick?onClick:undefined} style={canClick?{cursor:'pointer'}:undefined} title={tip}>
    <span className="em">{comida.em}</span>
    <span className="lbl">{comida.short}</span>
    {despachado&&<span className="check">{count>1?count:'✓'}</span>}
  </div>;
}

    {isPast&&(readOnly?<span className="warn">📖 día pasado — solo lectura</span>:<span className="warn" style={{color:'var(--cmd-pri)'}}>✏️ carga atrasada</span>)}
  </div>;
}
function CmdPrefixBar({prefix,togglePref}){

function CmdListado({personas,despachos,fecha,setFecha,dieta,chaletSet,platos,onTogglePlato,isAdmin,onOpenDieta,onPick,onDispatch,onUndispatch,canDispatch,isReadOnly,onAgregarComida,onAgregarPersona}){
  const[q,setQ]=useState('');
  const[mealFilters,setMealFilters]=useState(new Set());
  const[locFilters,setLocFilters]=useState(new Set());
  const[statusFilter,setStatusFilter]=useState(null);
  const[dietaOnly,setDietaOnly]=useState(false);
  const[chaletOnly,setChaletOnly]=useState(false);
  const[agregOnly,setAgregOnly]=useState(false);

  // Último despacho de esa comida (para deshacer; en cena puede haber varios)
  const lastDispId=(pid,ckey)=>{const l=despachos.filter(d=>d.personaId===pid&&d.comida===ckey).sort((a,b)=>new Date(b.ts)-new Date(a.ts));return l[0]?l[0].id:null;};

  const chSet=chaletSet||new Set();
  const pl=platos||{};
  const chaletCount=useMemo(()=>personas.filter(p=>chSet.has(p.dni)).length,[personas,chSet]);

  const toggleMealFor=(e,p,ckey)=>{
    e.stopPropagation();
    if(isReadOnly||!canDispatch)return;
    if(!p.comidas.includes(ckey)){if(onAgregarComida)onAgregarComida(p,ckey);return;}
    const n=dispCount(p.id,ckey);

    const id=lastDispId(p.id,ckey);if(!id)return;
    if(!confirm('¿Deshacer el último despacho de '+CMD_COMIDAS.find(c=>c.key===ckey).label.toLowerCase()+' de '+p.nombre+' '+p.apellido+'?'))return;
    onUndispatch(id);
  };
  const locCounts=useMemo(()=>{const m={};personas.forEach(p=>{if(p.letra)m[p.letra]=(m[p.letra]||0)+1;});return m;},[personas]);

  const dietaCount=useMemo(()=>personas.filter(p=>cmdIsDietaActiveForDate(dieta[p.dni],fecha)).length,[personas,dieta,fecha]);
  // Todos los filtros salvo Pendientes/Completos (así se pueden contar ambos sobre la misma base).

  const base=useMemo(()=>{
    const s=q.trim().toLowerCase();
    return personas.filter(p=>{
      if(s&&!(String(p.dni).toLowerCase().includes(s)||(p.nombre+' '+p.apellido).toLowerCase().includes(s)||(p.empresa||'').toLowerCase().includes(s)))return false;
      if(locFilters.size>0&&!locFilters.has(p.letra))return false;
      if(dietaOnly&&!cmdIsDietaActiveForDate(dieta[p.dni],fecha))return false;
      if(chaletOnly&&!chSet.has(p.dni))return false;
      if(agregOnly&&!p.agregado)return false;

  },[q,personas,mealFilters,locFilters,dietaOnly,chaletOnly,agregOnly,chSet,dieta,fecha]);
  // Pendientes/Completos miran SOLO las comidas tildadas (antes miraban todas las de la persona, y por eso

  //  · Sin comidas tildadas: pendiente = le falta retirar alguna; completo = retiró todas.
  //  · Con comidas tildadas: pendiente = no retiró NINGUNA de las tildadas; completo = retiró TODAS las tildadas.
  const esPend=(p)=>mealFilters.size?[...mealFilters].every(c=>!isDisp(p.id,c)):p.comidas.some(c=>!isDisp(p.id,c));
  const esComp=(p)=>(mealFilters.size?[...mealFilters]:p.comidas).every(c=>isDisp(p.id,c));
  const nPend=useMemo(()=>base.filter(esPend).length,[base,despachos,mealFilters]);
  const nComp=useMemo(()=>base.filter(esComp).length,[base,despachos,mealFilters]);
  const filtered=useMemo(()=>statusFilter==='pendientes'?base.filter(esPend):(statusFilter==='completos'?base.filter(esComp):base),[base,despachos,statusFilter,mealFilters]);
  // Frase que explica qué se está mostrando
  const descFiltro=(()=>{

    const lista=ms.length>1?ms.slice(0,-1).join(', ')+' y '+ms[ms.length-1]:ms[0];
    if(!ms.length)return statusFilter==='pendientes'?'Personas a las que les falta retirar alguna comida':(statusFilter==='completos'?'Personas que ya retiraron todas sus comidas':null);
    const prog='Personas con '+lista+' programad'+(ms.length>1?'os':(mealFilters.has('cena')||mealFilters.has('merienda')?'a':'o'));
    if(statusFilter==='pendientes')return prog+(ms.length>1?' que todavía no retiraron ninguna de esas comidas':' que todavía no lo retiraron');

    return prog;
  })();
  return <div>
    <CmdDateBar fecha={fecha} setFecha={setFecha} readOnly={isReadOnly}/>
    <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
      <input className="cmd-search" style={{flex:1}} placeholder="Buscar por DNI, nombre o empresa..." value={q} onChange={e=>setQ(e.target.value)}/>
      {puedeAgregar&&onAgregarPersona&&<button className="cmd-btn pri" style={{padding:'12px 14px',whiteSpace:'nowrap'}} onClick={()=>onAgregarPersona(cmdPareceDni(q)?normDni(q):'')} title="Registrar a alguien que no está en el listado de hoy y entregarle la comida">➕ Agregar persona</button>}

      {CMD_COMIDAS.map(c=>(
        <button key={c.key} className={'cmd-fbtn '+(mealFilters.has(c.key)?'active':'')} onClick={()=>toggleMeal(c.key)}>{c.em} {c.short}</button>
      ))}
    </div>
    {locKeys.length>0&&<div className="cmd-fbar">
      <span className="lbl">Lugar donde duerme:</span>
      {locKeys.map(l=>(
        <button key={l} className={'cmd-fbtn loc '+(locFilters.has(l)?'active':'')} onClick={()=>toggleLoc(l)} title={CMD_LETRAS[l]||l}>
          <span style={{fontFamily:'var(--fm)',fontWeight:800,marginRight:4}}>[{l}]</span>
          {CMD_LETRAS[l]||l} <span style={{opacity:.6,marginLeft:2}}>({locCounts[l]})</span>
        </button>
      ))}
      {(mealFilters.size>0||locFilters.size>0||statusFilter||dietaOnly||chaletOnly||agregOnly||q)&&<button className="cmd-fclear" onClick={clearFilters}>Limpiar todo</button>}
    </div>}
    <div style={{fontSize:11,color:'var(--tx3)',marginBottom:8,padding:'0 4px'}}>{filtered.length} persona{filtered.length===1?'':'s'} · {personas.length} en total del día{descFiltro&&<span style={{color:'var(--cmd-pri)',marginLeft:6}}>· {descFiltro}</span>}</div>
    {filtered.length===0?<div className="cmd-empty">Sin resultados con esos filtros.</div>:

        const dietaHasta=cmdGetDietaHasta(dv);

        </div>;
      })
    }
  </div>;
}
function CmdEscanear({personas,despachos,dieta,platos,onTogglePlato,prefix,togglePref,onDispatch,onUndispatch,preloadPersona,clearPreload,fecha,isReadOnly,onAgregarComida,onAgregarPersona}){

  useEffect(()=>{
    if(preloadPersona){setPersona(preloadPersona);setDni(preloadPersona.dni);setMsg(null);clearPreload&&clearPreload();}
    setTimeout(()=>inputRef.current&&inputRef.current.focus(),30);
  },[preloadPersona]);
  const dispCount=(ckey)=>persona?despachos.filter(d=>d.personaId===persona.id&&d.comida===ckey).length:0;
  const isDisp=(ckey)=>dispCount(ckey)>0;
  // Último despacho de esa comida (en cena puede haber varios)
  const getDispId=(ckey)=>{if(!persona)return null;const l=despachos.filter(d=>d.personaId===persona.id&&d.comida===ckey).sort((a,b)=>new Date(b.ts)-new Date(a.ts));return l[0]?l[0].id:null;};
  const buscar=()=>{
    const clean=dni.trim();if(!clean)return;
    if(isReadOnly){setMsg({t:'err',txt:'Es un día pasado: para cargar despachos atrasados tocá "✏️ Cargar despachos atrasados" arriba.'});return;}
    const p=personas.find(x=>sameDni(x.dni,clean));
    if(!p){setMsg({t:'err',txt:'DNI '+normDni(clean)+' no está en el listado del '+cmdFmtDate(fecha),agregar:normDni(clean)});setPersona(null);setDni('');return;}
    setPersona(p);setMsg(null);
    const auto=[...prefix].filter(c=>p.comidas.includes(c)&&!despachos.some(d=>d.personaId===p.id&&d.comida===c));
    auto.forEach(c=>onDispatch(p,c));
    // Si ya retiró alguna de las comidas del modo prefijado, se avisa fuerte (no se vuelve a despachar sola)
    const ya=[...prefix].filter(c=>p.comidas.includes(c)&&despachos.some(d=>d.personaId===p.id&&d.comida===c));
    const partes=[];
    if(ya.length>0)partes.push('⚠️ YA RETIRÓ HOY: '+ya.map(k=>{const c=CMD_COMIDAS.find(x=>x.key===k);const l=despachos.filter(d=>d.personaId===p.id&&d.comida===k).sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];return c.em+' '+c.label.toUpperCase()+' ('+cmdHora(l.ts)+' · '+cmdPuestoShort(l.puesto)+')';}).join(' · ')+(ya.some(cmdRepetible)?' — si corresponde entregar '+cmdOtro(ya.find(cmdRepetible))+', tocá la comida':''));
    if(auto.length>0)partes.push(auto.map(k=>CMD_COMIDAS.find(c=>c.key===k).em).join(' ')+' · auto-despachado');
    if(partes.length)setMsg({t:ya.length?'warn':'ok',txt:partes.join('   ·   ')});
    setDni('');setTimeout(()=>inputRef.current&&inputRef.current.focus(),30);
  };
  const tapMeal=(ckey)=>{
    if(isReadOnly||!persona)return;
    if(!persona.comidas.includes(ckey)){if(onAgregarComida)onAgregarComida(persona,ckey);return;}
    const n=dispCount(ckey);
    if(n>0&&cmdRepetible(ckey)){
      if(!confirm(cmdAvisoRepetir(persona,ckey,despachos)))return;
      onDispatch(persona,ckey,true);return;
    }
    const id=getDispId(ckey);
    if(id){if(!confirm('¿Deshacer despacho de '+CMD_COMIDAS.find(c=>c.key===ckey).label+' para '+persona.nombre+' '+persona.apellido+'?'))return;onUndispatch(id);}
    else onDispatch(persona,ckey);
  };
  const deshacerUltima=(ckey)=>{
    const id=getDispId(ckey);if(!id)return;
    if(!confirm('¿Deshacer el último despacho de '+CMD_COMIDAS.find(c=>c.key===ckey).label.toLowerCase()+' de '+persona.nombre+' '+persona.apellido+'?'))return;
    onUndispatch(id);
  };
  const reset=()=>{setPersona(null);setDni('');setMsg(null);setTimeout(()=>inputRef.current&&inputRef.current.focus(),30);};
  const dv=persona?dieta[persona.dni]:undefined;
  const hasDieta=cmdIsDietaActiveForDate(dv,fecha);
  const dietaNote=hasDieta?cmdGetDietaNote(dv):'';
  const dietaHasta=hasDieta?cmdGetDietaHasta(dv):'';
  const platoAt=persona&&platos?platos[persona.dni]:null;
  return <div>
    <CmdPrefixBar prefix={prefix} togglePref={togglePref}/>
    <div className="cmd-scaninp">
      <input ref={inputRef} placeholder={isReadOnly?'Solo lectura — fecha pasada':'DNI (escaneá o tipeá + Enter)'} value={dni} onChange={e=>setDni(e.target.value)} onKeyDown={e=>e.key==='Enter'&&buscar()} inputMode={teclado} autoCapitalize="characters" autoComplete="off" autoFocus disabled={isReadOnly}/>
      <button onClick={cambiarTeclado} disabled={isReadOnly} title={teclado==='numeric'?'Teclado con letras (DNI de extranjeros)':'Volver al teclado numérico'} style={{background:'var(--s2)',color:'var(--tx2)',border:'1px solid var(--bd)'}}>{teclado==='numeric'?'ABC':'123'}</button>
      <button onClick={buscar} disabled={isReadOnly}>Buscar</button>
    </div>
    {msg&&<div className={'cmd-empty'+(msg.t==='warn'?' cmd-warnbox':'')} style={msg.t==='warn'?undefined:{color:msg.t==='err'?'var(--cmd-err)':'var(--cmd-ok)',padding:12}}>
      {msg.txt}
      {msg.agregar&&onAgregarPersona&&!isReadOnly&&<div style={{marginTop:10}}><button className="cmd-btn pri" onClick={()=>onAgregarPersona(msg.agregar)}>➕ Agregar a la lista y entregar</button></div>}
    </div>}
    {persona?<div className={'cmd-pcard'+(hasDieta?' dieta':'')}>
      <h2>{persona.nombre} {persona.apellido}</h2>
      <div className="metaRow">
        <span>DNI {persona.dni}</span><span>·</span><span>{persona.empresa}</span>
        {persona.letra&&<span className="letra" title={persona.letraNom}>{persona.letra}-{persona.numero} · {persona.letraNom}</span>}
        {persona.agregado&&<span className="cmd-ptag camp" style={{fontSize:10,padding:'3px 7px'}}>{persona.noListado?'➕ No listado · agregado':'➕ Con comida agregada'} {cmdHora(persona.agregado.agregado_at)} · {cmdPuestoShort(persona.agregado.puesto)}</span>}
      </div>
      {hasDieta&&<div className="cmd-dbanner">
        <div>🥗 MENÚ DIETA — servir almuerzo dietético</div>
        {dietaNote&&<div style={{fontSize:12,fontWeight:600,letterSpacing:.2,textTransform:'none',opacity:.85}}>Nota: {dietaNote}</div>}
        {dietaHasta&&<div style={{fontSize:11,fontWeight:600,textTransform:'none',opacity:.75}}>⏱ aplica hasta {cmdFmtDate(dietaHasta)}</div>}
      </div>}
      {platoAt
        ?<div className="cmd-plato ok">
          <span>✓ Ya tiene plato/tarjeta <span style={{opacity:.75,fontWeight:500}}>(desde {fmtTs(platoAt)})</span></span>
          {onTogglePlato&&<button onClick={()=>onTogglePlato(persona)}>quitar</button>}
        </div>
        :(onTogglePlato&&<button className="cmd-plato pend" onClick={()=>onTogglePlato(persona)}>
          ☐ Se entregó plato / tarjeta
          <span style={{display:'block',fontSize:10,fontWeight:600,opacity:.8,marginTop:2,textTransform:'none',letterSpacing:0}}>Todavía no tiene · tocá cuando se lo entregues (queda fijo)</span>
        </button>)}
      <div className="cmd-mgrid">
        {CMD_COMIDAS.map(c=>{
          const aplica=persona.comidas.includes(c.key);const cnt=dispCount(c.key);const disp=cnt>0;
          const cls=!aplica?'na':(disp?'disp':'pend');
          const showDT=hasDieta&&c.key==='almuerzo'&&aplica;
          const repetible=cmdRepetible(c.key);
          const esExtra=(persona.extras||[]).includes(c.key);
          const st=!aplica?(onAgregarComida?'No programado · tocar para entregar igual':'No corresponde')
            :!disp?'Tocar para despachar'
            :repetible?('Retirado'+(cnt>1?' ×'+cnt:'')+' '+cmdHora(despachos.filter(d=>d.personaId===persona.id&&d.comida===c.key).sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0].ts)+' · tocar para '+cmdOtro(c.key))
            :'Despachado ✓ (tocar deshace)';
          return <button key={c.key} className={'cmd-mbtn '+cls+(!aplica&&onAgregarComida?' agr':'')} onClick={()=>tapMeal(c.key)} disabled={isReadOnly||(!aplica&&!onAgregarComida)}>
            {showDT&&<span className="dtag">DIETA</span>}
            {esExtra&&<span className="dtag" style={{background:'var(--cmd-info)',left:6,right:'auto'}}>AGREGADO</span>}
            <span className="em">{c.em}</span>
            <span className="lbl">{c.label}</span>
            <span className="st">{st}</span>
          </button>;
        })}
      </div>
      {!isReadOnly&&CMD_REPETIBLES.filter(k=>dispCount(k)>0).map(k=><button key={k} className="cmd-undo" style={{marginTop:8,marginRight:6}} onClick={()=>deshacerUltima(k)}>↶ Deshacer {k==='cena'?'la última cena':'el último almuerzo'}</button>)}
      <button onClick={reset} style={{marginTop:14,width:'100%',padding:10,background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx2)',borderRadius:6,fontWeight:600,cursor:'pointer',fontFamily:'var(--fh)'}}>Escanear otro</button>
    </div>:(!msg&&<div className="cmd-empty">Escaneá un DNI (o tipealo y Enter)<br/>para ver las comidas de la persona.</div>)}
  </div>;
}
// Resumen de 7 días desde una fecha elegible (programadas vs despachadas; por defecto los últimos 7 hasta hoy)
// y 7 días adelante de hoy (programadas). Click en un día → abre el Listado de esa fecha con el detalle por persona.
// La fecha elegida vive en Comedor (inicio/setInicio) para no perderla al ir y volver del Listado.
function CmdResumenSemanal({onVerDia,inicio,setInicio}){
  const hoy=cmdIsoDate(new Date());
  const defInicio=cmdAddDays(hoy,-6);
  const ini=inicio||defInicio,fin=cmdAddDays(ini,6);
  const esDefault=ini===defInicio;
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const reqRef=useRef(0);
  const load=async()=>{
    const req=++reqRef.current;setLoading(true);
    // Dos rangos separados: si la fecha elegida es vieja, no traemos todos los días intermedios.
    const[a,b]=await Promise.all([cmdFetchResumen(ini,fin),cmdFetchResumen(cmdAddDays(hoy,1),cmdAddDays(hoy,7))]);
    if(req!==reqRef.current)return; // cambiaron la fecha mientras cargaba
    setData({...b,...a});setLoading(false);
  };
  useEffect(()=>{load();},[ini]);
  const pasados=[];for(let i=0;i<7;i++)pasados.push(cmdAddDays(ini,i));
  const proximos=[];for(let i=1;i<=7;i++)proximos.push(cmdAddDays(hoy,i));
  const diaLbl=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});};
  const row=(iso)=>(data&&data[iso])||{prog:{desayuno:0,almuerzo:0,merienda:0,cena:0},desp:{desayuno:0,almuerzo:0,merienda:0,cena:0},hayProg:false};
  const sum=(dias,campo,k)=>dias.reduce((a,iso)=>a+row(iso)[campo][k],0);
  const trStyle={cursor:'pointer'};
  return <div className="cmd-rep">
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
      <h3 style={{margin:0}}>{esDefault?'Últimos 7 días':('Del '+cmdFmtDate(ini).slice(0,5)+' al '+cmdFmtDate(fin).slice(0,5))} · despachadas / programadas</h3>
      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--tx2)',textTransform:'uppercase',fontWeight:700,letterSpacing:.5}}>Desde
        <input type="date" value={ini} max={hoy} onChange={e=>setInicio(e.target.value||null)} style={{background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx)',borderRadius:4,padding:'4px 8px',fontFamily:'var(--fm)',fontSize:12}}/>
      </label>
      {!esDefault&&<button onClick={()=>setInicio(null)} style={{background:'none',border:'1px solid var(--cmd-pri)',color:'var(--cmd-pri)',borderRadius:4,padding:'4px 10px',fontSize:11,cursor:'pointer'}} title="Volver a los últimos 7 días hasta hoy">↺ últimos 7 días</button>}
      <button onClick={load} style={{marginLeft:'auto',background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx2)',borderRadius:4,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>{loading?'…':'↻ actualizar'}</button>
    </div>
    {loading?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Cargando…</div>:<>
      <table>
        <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
        <tbody>
          {pasados.map(iso=>{const r=row(iso);const fut=iso>hoy;return <tr key={iso} style={trStyle} onClick={()=>onVerDia(iso)} title="Ver el detalle de ese día">
            <td>{diaLbl(iso)}{iso===hoy&&<span style={{fontSize:10,color:'var(--cmd-pri)',marginLeft:6}}>hoy · en curso</span>}{fut&&<span style={{fontSize:10,color:'var(--tx3)',marginLeft:6}}>próximo</span>}</td>
            {CMD_COMIDAS.map(c=>{const d=r.desp[c.key],p=r.prog[c.key];
              const col=(!r.hayProg||fut)?'var(--tx3)':d<p?'var(--cmd-dieta)':'var(--cmd-ok)';
              return <td key={c.key} className="n" style={{color:col}}>{r.hayProg?<>{d}<span style={{color:'var(--tx3)',fontWeight:500}}> / {p}</span></>:'—'}</td>;})}
          </tr>;})}
          <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{sum(pasados,'desp',c.key)}<span style={{color:'var(--tx3)',fontWeight:500}}> / {sum(pasados,'prog',c.key)}</span></td>)}</tr>
        </tbody>
      </table>
      <h3 style={{marginTop:18}}>Próximos 7 días · programadas</h3>
      <table>
        <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
        <tbody>
          {proximos.map(iso=>{const r=row(iso);return <tr key={iso} style={trStyle} onClick={()=>onVerDia(iso)} title="Ver el detalle de ese día">
            <td>{diaLbl(iso)}</td>
            {CMD_COMIDAS.map(c=><td key={c.key} className="n" style={{color:r.hayProg?'var(--tx)':'var(--tx3)'}}>{r.hayProg?r.prog[c.key]:'—'}</td>)}
          </tr>;})}
          <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{sum(proximos,'prog',c.key)}</td>)}</tr>
        </tbody>
      </table>
      <div style={{marginTop:10,fontSize:11,color:'var(--tx3)',lineHeight:1.5}}>
        Tocá un día para ver el detalle por persona. "—" = el día todavía no se sincronizó desde el Radar (el sync trae hoy + 10 días).
        Las cenas cuentan todos los platos entregados, incluidas las repeticiones.
      </div>
    </>}
  </div>;
}
// ─── Quiénes no retiraron (Rev118, solo admin) ───────────────────────────────
// Cruza lo programado en el Radar (viandas_calendario) con lo despachado (viandas_despachos) en un período y lista a
// quienes tenían comidas programadas y no las retiraron. Orden: primero el que más almuerzos dejó de retirar (se
// puede ordenar por otra comida tocando su columna). Lo despachado cuenta por fecha + DNI + comida, venga del puesto
// que venga (Campamento, Chalet, carga atrasada).
const CMD_NR_ORDEN=['almuerzo','cena','desayuno','merienda'];
function CmdNoRetiraron(){
  const hoy=cmdIsoDate(new Date()),ayer=cmdAddDays(hoy,-1);
  const[desde,setDesde]=useState(cmdAddDays(ayer,-6));
  const[hasta,setHasta]=useState(ayer);
  const[datos,setDatos]=useState(null); // {filas} | {err:true}
  const[cargando,setCargando]=useState(false);
  const[q,setQ]=useState('');
  const[orden,setOrden]=useState('almuerzo');
  const[soloOrden,setSoloOrden]=useState(true);
  const[abierto,setAbierto]=useState(null);
  const rangoOk=!!(desde&&hasta&&desde<=hasta&&hasta<=hoy&&cmdAddDays(desde,62)>=hasta);
  useEffect(()=>{
    if(!rangoOk)return;
    let vivo=true;setCargando(true);setAbierto(null);
    (async()=>{
      const[{data:cal},{data:desp},{data:pers}]=await Promise.all([
        dbSelAll("viandas_calendario",{cols:"fecha,dni,desayuno,almuerzo,merienda,cena",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"fecha.asc,dni.asc"}),
        dbSelAll("viandas_despachos",{cols:"id,fecha,dni,comida",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"id.asc"}),
        dbSelAll("personas",{cols:"id,dni,nombre,apellido,empresa,deleted_at",ord:"id.asc"}),
      ]);
      if(!vivo)return;
      if(!cal||!desp){setDatos({err:true});setCargando(false);return;}
      const pm={};(pers||[]).forEach(p=>{const k=normDni(p.dni);if(k&&(!pm[k]||!p.deleted_at))pm[k]=p;});
      const ret=new Set(desp.map(d=>d.fecha+'|'+normDni(d.dni)+'|'+d.comida));
      const por={};
      cal.forEach(r=>{
        const k=normDni(r.dni);
        CMD_COMIDAS.forEach(c=>{
          if(!r[c.key])return;
          const x=por[k]||(por[k]={dni:r.dni,p:pm[k]||null,prog:{},falta:{},dias:{}});
          x.prog[c.key]=(x.prog[c.key]||0)+1;
          const ok=ret.has(r.fecha+'|'+k+'|'+c.key);
          (x.dias[r.fecha]||(x.dias[r.fecha]={}))[c.key]=ok;
          if(!ok)x.falta[c.key]=(x.falta[c.key]||0)+1;
        });
      });
      setDatos({filas:Object.values(por)});setCargando(false);
    })().catch(()=>{if(vivo){setDatos({err:true});setCargando(false);}});
    return()=>{vivo=false;};
  },[desde,hasta,rangoOk]);
  const F=(x,k)=>x.falta[k]||0,P=(x,k)=>x.prog[k]||0;
  const tot=(x)=>CMD_COMIDAS.reduce((s,c)=>s+F(x,c.key),0);
  const nom=(x)=>x.p?`${x.p.apellido}, ${x.p.nombre}`:'(no está en Personal)';
  const cOrden=CMD_COMIDAS.find(c=>c.key===orden);
  let filas=(datos&&datos.filas)||[];
  const nProg=filas.filter(x=>P(x,orden)>0).length;
  if(q.trim())filas=filas.filter(x=>joNorm(`${nom(x)} ${x.dni} ${x.p?x.p.empresa||'':''}`).includes(joNorm(q)));
  filas=filas.filter(x=>soloOrden?F(x,orden)>0:tot(x)>0)
    .sort((a,b)=>F(b,orden)-F(a,orden)||(P(a,orden)-F(a,orden))-(P(b,orden)-F(b,orden))||tot(b)-tot(a)||nom(a).localeCompare(nom(b),'es'));
  const periodo=(n)=>{setHasta(ayer);setDesde(cmdAddDays(ayer,-(n-1)));};
  const excel=async()=>{
    try{
      const XLSX=await joLoadXLSX();
      const enc=['Apellido','Nombre','DNI','Empresa'];
      CMD_NR_ORDEN.forEach(k=>{const c=CMD_COMIDAS.find(x=>x.key===k);enc.push(c.label+' no retirados',c.label+' programados');});
      enc.push('Total no retiradas','Días sin '+cOrden.label.toLowerCase());
      const rows=[enc];
      filas.forEach(x=>{
        const r=[x.p?x.p.apellido:'',x.p?x.p.nombre:'(no está en Personal)',x.dni,x.p?x.p.empresa||'':''];
        CMD_NR_ORDEN.forEach(k=>r.push(F(x,k),P(x,k)));
        r.push(tot(x),Object.keys(x.dias).sort().filter(d=>x.dias[d][orden]===false).map(d=>cmdFmtDate(d).slice(0,5)).join(', '));
        rows.push(r);
      });
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:18},{wch:18},{wch:11},{wch:26},...CMD_NR_ORDEN.flatMap(()=>[{wch:9},{wch:9}]),{wch:9},{wch:40}];
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'No retiraron');
      XLSX.writeFile(wb,`No retiraron ${cOrden.label.toLowerCase()} ${desde} al ${hasta}.xlsx`);
    }catch(e){alert('No se pudo generar el Excel: '+((e&&e.message)||e));}
  };
  return <div className="cmd-rep">
    <h3>🚫 Quiénes no retiraron <span style={{fontSize:10,color:'var(--tx3)',textTransform:'none',letterSpacing:0,fontWeight:400}}>· solo admin</span></h3>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
      <input className="fi" type="date" value={desde} max={hoy} onChange={e=>setDesde(e.target.value)}/>
      <span style={{color:'var(--tx3)'}}>al</span>
      <input className="fi" type="date" value={hasta} max={hoy} onChange={e=>setHasta(e.target.value)}/>
      <button className="cmd-btn" onClick={()=>periodo(7)}>Últimos 7 días</button>
      <button className="cmd-btn" onClick={()=>periodo(14)}>Últimos 14</button>
      <button className="cmd-btn" onClick={()=>periodo(30)}>Últimos 30</button>
    </div>
    {!rangoOk&&<div className="cmd-aviso">Revisá las fechas: "desde" antes de "hasta", hasta hoy como máximo y no más de 2 meses.</div>}
    {rangoOk&&hasta===hoy&&<div className="cmd-aviso">Incluye hoy, que está en curso: las comidas que todavía no se sirvieron figuran como no retiradas.</div>}
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
      <input className="fi" style={{flex:1,minWidth:200}} placeholder="Filtrar por nombre, DNI o empresa..." value={q} onChange={e=>setQ(e.target.value)}/>
      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--tx2)',cursor:'pointer'}}><input type="checkbox" checked={soloOrden} onChange={e=>setSoloOrden(e.target.checked)}/> Solo quienes dejaron de retirar {cOrden.label.toLowerCase()}</label>
      <button className="cmd-btn" onClick={excel} disabled={!filas.length}>⬇️ Excel</button>
    </div>
    {cargando?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Cargando…</div>
      :datos&&datos.err?<div className="cmd-aviso">No se pudieron leer los datos. Revisá la conexión.</div>
      :datos&&<>
        <div style={{fontSize:12,color:'var(--tx2)',marginBottom:8}}>

// ═══════════════════════════════════════════════════════════════════════════
// PEDIDO SEMANAL Y CERTIFICADOS (proveedor Lagunas del Radal) — Rev99
// Semana de facturación: sábado a viernes. El pedido se pasa el mié/jue/vie anterior: la app saca una
// "foto" del Radar (obra.viandas_fotos) que queda congelada como base de la facturación.
// Rev107 (regla acordada el 2026-10-07): la foto se puede corregir con revisiones 1, 2, 3… que rigen desde el día
// subsiguiente a su confirmación hasta el viernes. El certificado de cada miércoles factura el pedido vigente de la
// semana en curso + las diferencias de los 7 días de miércoles a martes (lo despachado contra lo ya cobrado por
// cada día). Los certificados guardados antes (regla 1: diferencias de la semana anterior sáb→vie) se siguen viendo igual.
// Reglas de la orden de compra:
//  · Almuerzo: se factura lo pedido; se pueden restar hasta 25 por día avisando antes de las 11 hs.
//  · Cena: se pide el 60% de lo proyectado, con piso de 50 por día (si lo proyectado es ≤ 50, todo).
//  · Todas: si se despacha menos de lo acordado se factura lo acordado; si se despacha más, la
//    diferencia se suma en el certificado siguiente.
// Solo los admins de obra (rol admin) sacan la foto, cargan ajustes y generan certificados;
// Lagunas (admin_viandas) lo ve en solo lectura. Tablas: viandas_fotos, viandas_ajustes, viandas_certificados.
// ═══════════════════════════════════════════════════════════════════════════
const CERT_ALM_MAX_RESTA=25;

const CERT_CENA_PISO=50;
const certCero=()=>({desayuno:0,almuerzo:0,merienda:0,cena:0});
// Sábado de la semana de facturación que contiene la fecha
const certSemanaDe=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return cmdAddDays(iso,-((new Date(y,m-1,d).getDay()+1)%7));};
const certDias=(semana)=>{const a=[];for(let i=0;i<7;i++)a.push(cmdAddDays(semana,i));return a;};
const certPedidoCena=(prog)=>prog<=CERT_CENA_PISO?prog:Math.max(CERT_CENA_PISO,Math.ceil(prog*CERT_CENA_PCT));
const certPedidoDe=(prog)=>({...prog,cena:certPedidoCena(prog.cena)});
const certLblDia=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});};
const certLblSemana=(s)=>'sáb '+cmdFmtDate(s).slice(0,5)+' → vie '+cmdFmtDate(cmdAddDays(s,6)).slice(0,5);
const certDifTxt=(n)=>n>0?'+'+n:String(n);

// ¿Se puede cargar/cambiar el ajuste de ese día? Hasta las 11 hs del mismo día (hora del dispositivo).
const certAjusteAbierto=(iso)=>{const hoy=cmdIsoDate(new Date());if(iso!==hoy)return iso>hoy;return new Date().getHours()<CERT_ALM_HORA_LIM;};
// Días (ISO) de a hasta b, inclusive
const certRango=(a,b)=>{const r=[];for(let d=a;d<=b;d=cmdAddDays(d,1))r.push(d);return r;};
// ── Fotos nuevas del pedido ──
// Una foto confirmada se actualiza con fotos nuevas 1, 2, 3… (viandas_fotos.revisiones, jsonb). Desde Rev121 cada foto
// nueva cambia el pedido con 24 hs de aviso y un horario límite por comida (CERT_HORA_LIM, pedido del 2026-10-21):
// sacada hoy antes de las 11 hs, el almuerzo cambia desde mañana; a las 11 o después, desde pasado mañana. Merienda y
// cena: límite 19 hs. Desayuno: 7 hs. Cada foto guarda desdeC = {comida: día desde el que rige}. Las fotos de antes
// (Rev107–120) tienen un solo "desde" para todas las comidas y se siguen leyendo así.
// "editado" = corregido a mano con el lápiz ({at, por, k:[comidas]}).
const CERT_HORA_LIM={desayuno:7,almuerzo:11,merienda:19,cena:19};

const certDesdeFoto=(ts,semana)=>{

  CMD_COMIDAS.forEach(c=>{let x=cmdAddDays(iso,h<CERT_HORA_LIM[c.key]?1:2);if(x<semana)x=semana;o[c.key]=x;});
  return o;
};
const certRevDesdeK=(r,k)=>(r.desdeC&&r.desdeC[k])||r.desde;
// "almuerzo, merienda y cena desde el jue 22-10 · desayuno desde el vie 23-10" (fin = viernes de la semana, si se sabe)
const certTxtDesdeC=(r,fin)=>{
  if(!r.desdeC)return'desde el '+certLblDia(r.desde);
  const g={};
  CMD_COMIDAS.forEach(c=>{const d=r.desdeC[c.key];const k=(fin&&d>fin)?'_no':d;(g[k]=g[k]||[]).push(c.label.toLowerCase());});

// Pedido vigente de un día, comida por comida: el de la última foto nueva que ya rige esa comida ese día; si no hay,
// el de la foto inicial. maxN: tener en cuenta solo las fotos nuevas hasta esa (para reconstruir versiones anteriores).
const certVigente=(foto,iso,maxN)=>{

  const revs=certRevs(foto).filter(r=>r.estado==='confirmada'&&r.dias&&r.dias[iso]&&(maxN===undefined||r.n<=maxN)).sort((a,b)=>a.n-b.n);

    revs.forEach(r=>{const d=certRevDesdeK(r,c.key);if(d&&d<=iso){src=r.dias[iso];rev=r.n;}});
    pedido[c.key]=(src&&src.pedido&&src.pedido[c.key])||0;
    prog[c.key]=(src&&src.prog&&src.prog[c.key])||0;
    revK[c.key]=rev;
    const e=src&&src.editado;
    if(e&&(!e.k||e.k.includes(c.key))){edK[c.key]=true;ed=e;}
  });

};
// Etiqueta "foto 2" (o "foto 1·2" si ese día unas comidas rigen por una foto y otras por otra)
const certChipRev=(v)=>{const s=[...new Set(Object.values(v.revK||{}).filter(Boolean))].sort((a,b)=>a-b);return s.length?'foto '+s.join('·'):null;};
const certChipRevTit=(v)=>CMD_COMIDAS.map(c=>c.label+': '+(v.revK&&v.revK[c.key]?'foto '+v.revK[c.key]:'foto inicial')).join(' · ');
// Un día/comida. cobrado = lo que ya se facturó por ese día (en el certificado que cobró su semana);
// vigente = el pedido con sus revisiones; acordado = vigente + ajuste (almuerzo −25). A facturar = lo acordado,
// o lo despachado si fue más (si se despacha menos no hay devolución). Diferencia = a facturar − cobrado
// = cambio por revisiones + ajustes + despachado de más.
const certCalc=(cobrado,vigente,ajuste,desp)=>{
  const acordado=Math.max(0,vigente+ajuste),exced=Math.max(0,desp-acordado);

const certCalcDias=(isos,cobradoDe,vigenteDe,ajustes,desp)=>{
  const dias={},tot={};
  CMD_COMIDAS.forEach(c=>{tot[c.key]={cobrado:0,vigente:0,revision:0,pedido:0,ajuste:0,acordado:0,desp:0,exced:0,fact:0,dif:0};});
  isos.forEach(iso=>{

    dias[iso]={};

      const aj=(ajustes&&ajustes[iso]&&ajustes[iso][c.key])?ajustes[iso][c.key].cantidad:0;
      const r=certCalc(cob[c.key]||0,vig[c.key]||0,aj,dd[c.key]||0);

    });
  });
  return{dias,tot};

// Seguimiento de una semana, contra el pedido vigente (foto + revisiones confirmadas)
const certCalcSemana=(foto,ajustes,desp,semana)=>{const v=iso=>certVigente(foto,iso).pedido;return certCalcDias(certDias(semana),v,v,ajustes,desp);};
const certFetchCert=async(semana)=>{const{data}=await db.sel("viandas_certificados",{f:[["semana","eq",semana]]});return data===null?null:{cert:data[0]||null};};
// Lecturas: devuelven null si la consulta falló (ej. todavía no se crearon las tablas).
const certFetchFoto=async(semana)=>{const{data}=await db.sel("viandas_fotos",{f:[["semana","eq",semana]]});return data===null?null:{foto:data[0]||null};};
const certFetchAjustes=async(desde,hasta)=>{
  const{data}=await db.sel("viandas_ajustes",{f:[["fecha","gte",desde],["fecha","lte",hasta]],lim:1000});
  if(data===null)return null;
  const m={};data.forEach(r=>{(m[r.fecha]||(m[r.fecha]={}))[r.comida]=r;});return m;
};
const certFetchDesp=async(desde,hasta)=>{
  const{data}=await dbSelAll("viandas_despachos",{cols:"id,fecha,comida",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"id.asc"});
  if(data===null)return null;
  const m={};data.forEach(r=>{const x=m[r.fecha]||(m[r.fecha]=certCero());if(x[r.comida]!==undefined)x[r.comida]++;});return m;

// Programadas del Radar por día/comida + código de cada persona (la foto guarda quiénes estaban en el pedido)
const certFetchRadar=async(desde,hasta)=>{
  const{data}=await dbSelAll("viandas_calendario",{cols:"fecha,dni,codigo,desayuno,almuerzo,merienda,cena",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"fecha.asc,dni.asc"});

    const p=prog[r.fecha]||(prog[r.fecha]=certCero());
    if(!(r.desayuno||r.almuerzo||r.merienda||r.cena))return;
    CMD_COMIDAS.forEach(c=>{if(r[c.key])p[c.key]++;});
    (personas[r.fecha]||(personas[r.fecha]={}))[r.dni]=r.codigo||'';
  });

const certCopiar=async(txt,showToast)=>{try{await navigator.clipboard.writeText(txt);showToast({msg:'📋 Copiado'});}catch(e){prompt('Copiá el texto:',txt);}};
const certTxtPedido=(semana,dias)=>{

  certDias(semana).forEach(iso=>{const p=dias[iso]||certCero();CMD_COMIDAS.forEach(c=>{tot[c.key]+=p[c.key]||0;});L.push(certLblDia(iso)+': '+CMD_COMIDAS.map(c=>c.label+' '+(p[c.key]||0)).join(' · '));});

// Frase que explica de dónde sale el pedido cobrado: la foto (cuándo y quién la confirmó) y, si hubo, sus revisiones.
// Los certificados guardados antes de Rev106 no tienen esos datos y muestran la frase sin fecha.
const certFotoTxt=(ped)=>{
  const meta=ped&&ped.foto,revs=(ped&&ped.revs)||[];
  let t='Es el pedido «foto» que se confirmó'+(meta&&meta.confirmada_at?' el '+fmtTs(meta.confirmada_at)+(meta.confirmada_por?' ('+meta.confirmada_por+')':''):'')+' antes de empezar la semana';
  if(revs.length)t+=', corregido por '+revs.map(r=>'la revisión '+r.n+' (confirmada el '+fmtTs(r.confirmada_at)+', rige desde el '+certLblDia(r.desde)+')').join(' y ');

// Cómo se calcula la diferencia: regla 2 (Rev107, mié→mar contra lo cobrado) o regla 1 (semana anterior completa)
const certTxtFact=(df)=>df&&df.desde
  ?'Cada pedido (sábado a viernes) se cierra en dos certificados: de sábado a martes en el suyo, y de miércoles a viernes en el del miércoles siguiente. Por día: a facturar = lo acordado (pedido vigente con revisiones y ajustes), o lo despachado si fue más (si se despachó menos, no hay devolución). Diferencia = a facturar − lo que ya se cobró por ese día.'
  :'A facturar se calcula día por día: si se despachó menos de lo acordado se factura lo acordado (no hay devolución); si se despachó más, se suma. Diferencia = a facturar − pedido.';

const certDifGrupos=(df,semanaCert)=>{

        {!fotoVis?<div style={{color:'var(--tx3)',fontSize:12,padding:8,lineHeight:1.5}}>{canEdit?'Todavía no hay pedido para esta semana. La foto se saca el miércoles, jueves o viernes anterior, con el Radar actualizado.':(foto?'El pedido de esta semana todavía no fue confirmado por la obra.':'Todavía no hay pedido para esta semana.')}</div>:
        <div className="cmd-tblw"><table>
          <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
          <tbody>
            {dias.map(iso=>{const v=vig(iso);return <tr key={iso}><td>{certLblDia(iso)}
              {!draft&&certChipRev(v)?<span className="cmd-chip ok" style={{marginLeft:6,fontSize:9,padding:'1px 5px'}} title={certChipRevTit(v)}>{certChipRev(v)}</span>:null}
              {!draft&&v.ed?<span style={{marginLeft:6,fontSize:11}} title={'Corregido a mano'+(v.ed.por?' por '+v.ed.por:'')+(v.ed.at?' el '+fmtTs(v.ed.at):'')}>✍️</span>:null}
            </td>{CMD_COMIDAS.map(c=>{const pv=pedVal(iso,c.key),gv=progVal(iso,c.key),av=baseComp?((baseComp.ped[iso]||{})[c.key]||0):pv,cambio=!draft&&av!==pv;return <td key={c.key} className="n" style={cambio?{background:'rgba(251,191,36,.14)'}:undefined} title={cambio?'Antes: '+av+' ('+certLblVersion(baseComp)+')':undefined}>
              {cambio&&<s style={{color:'var(--tx3)',marginRight:6,fontWeight:400}}>{av}</s>}
              {draft?<input className="cmd-num" inputMode="numeric" value={draft[iso][c.key]} onChange={e=>setCelda(iso,c.key,e.target.value)}/>:pv}
              {deRadar&&gv!==pv&&<div style={{fontSize:9,color:'var(--tx3)',fontWeight:500}}>Radar {gv}</div>}
            </td>;})}</tr>;})}
            <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{dias.reduce((a,iso)=>a+(draft?draftNum(iso,c.key):pedVal(iso,c.key)),0)}</td>)}</tr>
          </tbody>
        </table></div>}
        {draft&&<div className="cmd-hint">Corregís lo que se ve: cada comida queda guardada en la foto que la rige{est==='confirmada'?' y Lagunas ve el cambio':''}. Queda marcado con ✍️.</div>}
        {!draft&&baseComp&&certCambios(actual,baseComp.ped)>0&&<div className="cmd-hint">En amarillo, lo que cambió respecto a: {certLblVersion(baseComp)} (tachado = antes). Así sale también en "📋 Copiar".</div>}
        {fotoVis&&est==='confirmada'&&(revsConf.length>0||revsBorr.length>0)&&<div style={{marginTop:14,borderTop:'1px solid var(--bd)',paddingTop:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:8}}>
            <strong style={{fontSize:13}}>📸 Fotos nuevas de la semana</strong>
            <span style={{fontSize:11,color:'var(--tx3)'}}>Cada una cambia el pedido con 24 hs de aviso: desayuno si se sacó antes de las {CERT_HORA_LIM.desayuno}, almuerzo antes de las {CERT_HORA_LIM.almuerzo}, merienda y cena antes de las {CERT_HORA_LIM.cena} hs (si no, un día más tarde).</span>
          </div>
          {revsConf.map((r,i)=>{const isos=Object.keys(r.dias||{}).sort();const tot=certCero();isos.forEach(iso=>CMD_COMIDAS.forEach(c=>{tot[c.key]+=((r.dias[iso].pedido||{})[c.key]||0);}));const ult=i===revsConf.length-1;
            return <div key={r.n} style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',background:'var(--s2)',border:'1px solid var(--bd)',borderLeft:'3px solid var(--cmd-info)',borderRadius:6,padding:'8px 10px',marginBottom:6}}>
              <strong>Foto {r.n}</strong>
              <span style={{fontSize:12,color:'var(--tx2)'}}>sacada {fmtTs(r.tomada_at||r.confirmada_at)}{r.tomada_por_nombre?' por '+r.tomada_por_nombre:''} · {certTxtDesdeC(r,hasta)}</span>
              <span style={{fontFamily:'var(--fm)',fontSize:12,marginLeft:'auto'}}>{CMD_COMIDAS.map(c=>c.em+' '+tot[c.key]).join('  ')}</span>
              {canEdit&&ult&&<button className="cmd-btn" disabled={busy} onClick={()=>quitarFoto(r)} title="Si la sacaste por error">🗑 Quitar</button>}
            </div>;})}
          {canEdit&&revsBorr.length>0&&<div className="cmd-aviso" style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>Hay {revsBorr.length===1?'una revisión':revsBorr.length+' revisiones'} en borrador de la versión anterior: no se usan.<button className="cmd-btn" disabled={busy} onClick={descartarBorradores}>🗑 Descartar</button></div>}
        </div>}
        {fotoVis&&est==='confirmada'&&vers.length>0&&<div style={{marginTop:14,borderTop:'1px solid var(--bd)',paddingTop:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <button className="cmd-btn" onClick={()=>setVerHist(!verHist)}>{verHist?'▾':'▸'} 📜 Historial del pedido ({vers.length} versi{vers.length===1?'ón':'ones'})</button>
            <span style={{fontSize:11,color:'var(--tx3)'}}>El rastro de cómo fue cambiando el pedido de esta semana.</span>
          </div>
          {verHist&&<div style={{marginTop:8}}>
            {canEdit&&!tieneColHist&&<div className="cmd-aviso" style={{fontSize:11}}>Se reconstruye con la foto inicial y las fotos nuevas; para que también queden las correcciones a mano como versión, un admin tiene que correr una vez en Supabase: <code style={{fontFamily:'var(--fm)'}}>{CERT_SQL_HIST}</code></div>}
            {[...vers].reverse().map(x=>{const idx=vers.indexOf(x),prev=vers[idx-1],n=prev?certCambios(x.ped,prev.ped):0,ab=verV===x.v;
              return <div key={x.v} style={{background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:6,padding:'8px 10px',marginBottom:6}}>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <strong style={{fontFamily:'var(--fm)'}}>v{x.v}</strong>
                  <span style={{fontSize:12}}>{x.desc||'Versión '+x.v}</span>
                  <span style={{fontSize:11,color:'var(--tx3)'}}>{fmtTs(x.at)}{x.por?' · '+x.por:''}{prev?' · '+(n?n+' cambio'+(n===1?'':'s'):'sin cambios')+' respecto a v'+prev.v:''}</span>
                  <div style={{marginLeft:'auto',display:'flex',gap:6}}>
                    <button className="cmd-btn" onClick={()=>setVerV(ab?null:x.v)}>{ab?'Ocultar':'Ver'}</button>
                    {!certPedIgual(x.ped,actual)&&<button className="cmd-btn" title="Copia el pedido actual para el mail, marcando lo que cambió respecto a esta versión" onClick={()=>certCopiarPedido({semana,ped:actual,ant:x.ped,antLbl:certLblVersion(x),showToast})}>📋 Copiar el actual vs. esta</button>}
                  </div>
                </div>
                {ab&&<div style={{marginTop:8}}><CmdPedTablaDif semana={semana} ped={x.ped} ant={prev?prev.ped:null}/>{prev&&<div className="cmd-hint">Tachado = cómo estaba en la v{prev.v}.</div>}</div>}
              </div>;})}
          </div>}
        </div>}
        <div className="cmd-hint">El pedido es la última foto del Radar: la inicial (mié a vie de la semana anterior) y las fotos nuevas que se saquen durante la semana, que lo cambian con 24 hs de aviso (horario límite: desayuno {CERT_HORA_LIM.desayuno} hs, almuerzo {CERT_HORA_LIM.almuerzo} hs, merienda y cena {CERT_HORA_LIM.cena} hs). Encima se puede corregir a mano con ✏️. Cena: se pide el {Math.round(CERT_CENA_PCT*100)}% de lo que proyecta el Radar, con un mínimo de {CERT_CENA_PISO} por día (si hay {CERT_CENA_PISO} o menos, se pide todo).</div>
      </div>
      {calc&&<div className="cmd-rep">
        <h3>📊 Seguimiento de la semana · pedido vs. despachado</h3>
        <div className="cmd-mcards">
          {CMD_COMIDAS.map(c=>{const x=calc.tot[c.key];return <button key={c.key} className={'cmd-mcard'+(comida===c.key?' on':'')} onClick={()=>setComida(c.key)}>
            <div className="t">{c.em} {c.label}</div>
            <div className="v">Pedido {x.acordado}{c.key==='desayuno'?'':' · Desp. '+x.desp}</div>
            <div className="v" style={{fontWeight:800,color:'var(--cmd-pri)'}}>A facturar {x.fact}</div>
          </button>;})}
        </div>
        <div className="cmd-tblw"><table>
          <thead><tr><th>Día</th><th className="n" title="Lo que dice hoy el Radar (puede haber cambiado desde la foto)">Radar hoy</th><th className="n">Pedido</th>{comida==='almuerzo'&&<th className="n">Ajuste</th>}<th className="n">Desp.</th>{colDif&&<th className="n">{colDif}</th>}<th className="n">A facturar</th></tr></thead>
          <tbody>
            {dias.map(iso=>{const r=calc.dias[iso][comida],fut=iso>hoy,gv=progVal(iso,comida),v=vig(iso);
              const rh=radar?(radar[iso]?radar[iso][comida]:0):null;
              const aj=ajustes[iso]&&ajustes[iso][comida];
              const sinD=!fut&&r.sinDesp;
              return <tr key={iso} style={iso===hoy?{background:'rgba(245,158,11,.06)'}:undefined}>
                <td>{certLblDia(iso)}{iso===hoy&&<span style={{fontSize:10,color:'var(--cmd-pri)',marginLeft:6}}>hoy</span>}{v.revK&&v.revK[comida]?<span className="cmd-chip ok" style={{marginLeft:6,fontSize:9,padding:'1px 5px'}}>foto {v.revK[comida]}</span>:null}{v.edK&&v.edK[comida]?<span style={{marginLeft:4,fontSize:11}} title="Corregido a mano">✍️</span>:null}</td>
                <td className="n" style={{color:(rh!==null&&deRadar&&rh!==gv)?'var(--cmd-dieta)':'var(--tx3)'}} title={deRadar?'En la foto el Radar decía '+gv:''}>{rh===null?(radar===undefined?'…':'—'):rh}</td>
                <td className="n">{r.pedido}</td>
                {comida==='almuerzo'&&<td className="n" style={{whiteSpace:'nowrap'}}>
                  {r.ajuste!==0&&<span className={certDifCls(r.ajuste)} title={aj?((aj.motivo?aj.motivo+' · ':'')+(aj.cargado_por_nombre||'')+(aj.cargado_at?' '+fmtTs(aj.cargado_at):'')):''}>{r.ajuste}</span>}
                  {canEdit&&certAjusteAbierto(iso)&&<button className="cmd-undo" style={{marginLeft:6}} onClick={()=>ajustar(iso)}>{r.ajuste?'cambiar':'− restar'}</button>}
                </td>}
                <td className="n" style={{color:'var(--tx3)'}}>{comida==='desayuno'||fut?'—':(sinD?<span title="Ese día no hay despachos registrados en la app">s/d</span>:<span style={{color:'var(--tx)'}}>{r.desp}</span>)}</td>
                {colDif&&<td className="n">{fut||sinD?'—':(valDif(r)?<span className={comida==='merienda'&&r.devueltas?'dif-neg':'dif-pos'}>{valDif(r)}</span>:<span className="dif-0">0</span>)}</td>}
                <td className="n">{fut&&comida!=='desayuno'?'—':r.fact}</td>
              </tr>;})}
            <tr style={{borderTop:'2px solid var(--bd)'}}>
              <td style={{fontWeight:800}}>Total</td>
              <td className="n" style={{color:'var(--tx3)'}}>{radar?dias.reduce((a,iso)=>a+(radar[iso]?radar[iso][comida]:0),0):'…'}</td>
              <td className="n">{t.pedido}</td>
              {comida==='almuerzo'&&<td className={'n '+certDifCls(t.ajuste)}>{t.ajuste||''}</td>}
              <td className="n">{comida==='desayuno'?'—':t.desp}</td>
              {colDif&&<td className="n">{comida==='merienda'?t.devueltas:t.demas}</td>}
              <td className="n" style={{fontWeight:800,color:'var(--cmd-pri)'}}>{t.fact}</td>
            </tr>
          </tbody>
        </table></div>
        <div className="cmd-hint">{CMD_COMIDAS.find(c=>c.key===comida).label}: se factura {CERT3_REGLA[comida]}.{comida==='almuerzo'?' Ajuste = almuerzos restados avisando antes de las '+CERT_ALM_HORA_LIM+' hs.':''}{comida==='cena'?' Las cenas repetidas cuentan como despachadas.':''} Los días sin despachos registrados en la app (s/d) se facturan por lo pedido. La semana se certifica completa en la semana {nSem+1}. "Radar hoy" en amarillo = cambió desde la foto.</div>
      </div>}
    </>)}
  </div>;
}
// Detalle de un certificado (guardado o vista previa antes de guardar)
function CmdCertDetalle({cert,preview,onVolver,onGuardar,busy,showToast}){

    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>

      <h3 style={{margin:0}}>🧾 Certificado del mié {cmdFmtDate(cert.fecha)}</h3>
      {preview?<span className="cmd-chip bor">Vista previa · sin guardar</span>:<span style={{fontSize:11,color:'var(--tx3)'}}>generado {cert.generado_at?fmtTs(cert.generado_at):''}{cert.generado_por_nombre?' por '+cert.generado_por_nombre:''}</span>}
      <div style={{marginLeft:'auto',display:'flex',gap:6,flexWrap:'wrap'}}>
        {preview&&<button className="cmd-btn ok" disabled={busy} onClick={onGuardar}>💾 Guardar certificado</button>}
        <button className="cmd-btn" onClick={()=>certImprimir(cert)}>🖨️ Imprimir / PDF</button>
        <button className="cmd-btn" onClick={()=>certCopiar(certTxtCert(cert),showToast)}>📋 Copiar</button>
      </div>
    </div>
    {(d.avisos||[]).map((a,i)=><div key={i} className="cmd-aviso">⚠️ {a}</div>)}
    <div className="cmd-tblw"><table>
      <thead><tr><th>Concepto</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
      <tbody>
        <tr><td>Pedido semana {certLblSemana(d.semana)} {regla2?'(foto + revisiones)':'(foto)'}</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{d.pedido.tot[c.key]}</td>)}</tr>
        {grupos.map(g=><tr key={g.semana}><td>Diferencias del pedido {certLblSemana(g.semana)} <span style={{color:'var(--tx3)',fontSize:11}}>({g.lbl})</span></td>{CMD_COMIDAS.map(c=><td key={c.key} className={'n '+certDifCls(g.tot[c.key].dif)}>{certDifTxt(g.tot[c.key].dif)}</td>)}</tr>)}
        <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total a certificar</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n" style={{color:'var(--cmd-pri)',fontSize:14}}>{d.total[c.key]}</td>)}</tr>
      </tbody>
    </table></div>
    <h3 style={{marginTop:18}}>Pedido por día · semana {certLblSemana(d.semana)}</h3>
    <div className="cmd-hint" style={{marginTop:-4,marginBottom:8}}>{certFotoTxt(d.pedido)}</div>
    <div className="cmd-tblw"><table>
      <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
      <tbody>
        {certDias(d.semana).map(iso=>{const p=d.pedido.dias[iso]||certCero(),rv=d.pedido.rev&&d.pedido.rev[iso];return <tr key={iso}><td>{certLblDia(iso)}{rv?<span className="cmd-chip ok" style={{marginLeft:6,fontSize:9,padding:'1px 5px'}}>Rev {rv}</span>:null}</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{p[c.key]||0}</td>)}</tr>;})}
        <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{d.pedido.tot[c.key]}</td>)}</tr>
      </tbody>
    </table></div>
