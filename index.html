function HabCell({hab:habInit,tipo,entityType,entityId,proyectoId,canEdit,currentUserId,onRefresh,tdClass}){
  const[show,setShow]=useState(false);
  const[localHab,setLocalHab]=useState(null); // null = usar habInit, object = guardado local
  const[saving,setSaving]=useState(false);

  const hab=localHab!==null?localHab:habInit;
  const _d=new Date();
  const _t=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
  const st=!hab?"none":hab.suspendida?"sus":(hab.fecha_hasta&&hab.fecha_hasta<_t)?"exp":"ok";

  const save=async(form)=>{
    setSaving(true);
    try{
      const{data,ok}=await db.rpc("set_habilitacion",{
        p_entity_type:entityType,
        p_persona_id:entityType==="persona"?entityId:null,
        p_vehiculo_id:entityType==="vehiculo"?entityId:null,
        p_tipo:tipo,
        p_proyecto_id:proyectoId,
        p_otorgado_por:currentUserId,
        p_fecha_hasta:form.fecha_hasta,
        p_suspendida:form.suspendida||false,
        p_motivo:form.motivo_suspension||null
      });
      if(!ok){alert("Error: "+JSON.stringify(data));setSaving(false);return;}
      const saved=typeof data==="object"&&data!==null?data:{...form,tipo,entity_type:entityType,fecha_hasta:form.fecha_hasta};
      setLocalHab(saved);
      setShow(false);
    }catch(e){alert("Error: "+e.message);}
    setSaving(false);
  };

  const remove=async()=>{
    if(!confirm("Eliminar esta habilitacion?"))return;
    const delF=entityType==="persona"
      ?[["persona_id","eq",entityId],["tipo","eq",tipo],["proyecto_id","eq",proyectoId]]
      :[["vehiculo_id","eq",entityId],["tipo","eq",tipo],["proyecto_id","eq",proyectoId]];
    await db.del("habilitaciones",delF);
    setLocalHab({_deleted:true});
    setShow(false);
  };

  const habForModal=localHab&&!localHab._deleted?localHab:habInit;

  return <td className={tdClass||""} style={{minWidth:88}}>
    {st==="none"
      ?canEdit?<button className="hc-add" onClick={()=>setShow(true)}>+ Agregar</button>:<span style={{color:"var(--tx2)",opacity:.3,fontSize:12}}>—</span>
      :<span className={`hc hc-${st}${canEdit?" hc-edit":""}`} onClick={canEdit?()=>setShow(true):undefined}>
        {st==="ok"?"ok "+fmtD(hab.fecha_hasta):st==="exp"?"VENC "+fmtD(hab.fecha_hasta):"SUSP"}
      </span>
    }
    {show&&<HabModal hab={habForModal} tipo={tipo} saving={saving} onClose={()=>setShow(false)} onSave={save} onDelete={habForModal?remove:null}/>}
  </td>;
}

// HabCellRadar — pill de solo lectura para CP Ingreso derivado del Radar de Obra.
// Rev86+: cp_ingreso ya no es manual; se calcula de viandas_calendario del día.
// Si letra != 'F' y no es null → OK (verde). Si es F o vacía → bloqueado (rojo).
function HabCellRadar({dni,radarMap,tdClass}){
  const r=radarDe(radarMap,dni)||null;
  const ok=r&&r.letra&&r.letra!=="F";
  const codigo=r&&r.codigo?r.codigo:"—";
  const tip=r
    ?(ok?`CP Ingreso derivado del Radar de Obra (${codigo})`:`Bloqueado — hoy figura ${r.letra==="F"?"como Franco":"sin agendamiento"} en el Radar`)
    :"Sin registro en el Radar de Obra del día";
  return <td className={tdClass||""} style={{minWidth:88}} title={tip}>
    <span className={`hc hc-${ok?"ok":"exp"}`} style={{cursor:"help",display:"inline-flex",alignItems:"center",gap:4}}>
      {ok?"ok":r?(r.letra==="F"?"FRANCO":"sin CP"):"sin dato"}
      <span style={{fontSize:9,opacity:.7,fontFamily:"var(--fm)"}}>{codigo}</span>
    </span>
  </td>;
}


// ─── HABILITACION MASIVA POR EMPRESA ──────────────────────────────────────────
function HabMasivaModal({proyectoId,currentUserId,habs,onClose,onSaved}){
  const[empresas,setEmpresas]=useState([]);
  const[empresa,setEmpresa]=useState("");
  const[personas,setPersonas]=useState([]);
  const[selected,setSelected]=useState({});
  const[tipo,setTipo]=useState("sh_ingreso");
  const[fecha,setFecha]=useState("");
  const[saving,setSaving]=useState(false);
  const[step,setStep]=useState("empresa"); // empresa | personas | fecha

  useEffect(()=>{
    db.sel("personas",{cols:"empresa",f:[["deleted_at","is","null"]]}).then(({data})=>{
      if(data){
        const emp=[...new Set(data.map(p=>p.empresa).filter(Boolean))].sort();
        setEmpresas(emp);
      }
    });
  },[]);

  const loadPersonas=async(emp)=>{
    const{data}=await db.sel("personas",{f:[["empresa","eq",emp],["deleted_at","is","null"]],ord:"apellido.asc"});
    if(data){
      setPersonas(data);
      const sel={};
      data.forEach(p=>{sel[p.id]=true;});
      setSelected(sel);
    }
  };

  const toggleAll=()=>{
    const allOn=personas.every(p=>selected[p.id]);
    const sel={};
    personas.forEach(p=>{sel[p.id]=!allOn;});
    setSelected(sel);
  };

  const save=async()=>{
    const ids=Object.entries(selected).filter(([_,v])=>v).map(([k])=>k);
    if(!ids.length||!fecha)return;
    setSaving(true);
    const tipos=tipo==="todas"?TODOS_TIPOS:[tipo];
    for(const pid of ids){
      for(const t of tipos){
        // DELETE+INSERT para evitar duplicados
        await db.del("habilitaciones",[["persona_id","eq",pid],["tipo","eq",t],["proyecto_id","eq",proyectoId]]);
        await db.ins("habilitaciones",{entity_type:"persona",persona_id:pid,tipo:t,proyecto_id:proyectoId,otorgado_por:currentUserId,fecha_desde:today(),fecha_hasta:fecha,suspendida:false});
      }
    }
    setSaving(false);onSaved();onClose();
  };

  // Rev86: cp_ingreso deriva del Radar, cp_almuerzo/cp_cena eliminados (viven en módulo Viandas)
  const TODOS_TIPOS=["sh_ingreso","sh_chalet","sh_manejo"];
  const tiposLabel={"todas":"⭐ TODAS las S&H","sh_ingreso":"S&H Ingreso","sh_chalet":"S&H Subir a Chalet","sh_manejo":"S&H Manejo en Montana"};
  const selectedCount=Object.values(selected).filter(Boolean).length;

  return <div className="mo"><div className="md md-lg">
    <div className="mh"><div className="mt">Habilitacion masiva por empresa</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {step==="empresa"&&<>
        <div className="f"><label>Tipo de habilitacion</label>
          <select value={tipo} onChange={e=>setTipo(e.target.value)}>
            {Object.entries(tiposLabel).map(([k,v])=><option key={k} value={k}>{v}</option>)}
          </select>
        </div>
        <div className="f"><label>Empresa</label>
          {empresas.length===0
            ?<div style={{color:"var(--tx2)",fontSize:13,padding:"8px 0"}}>Cargando empresas...</div>
            :<select value={empresa} onChange={e=>{setEmpresa(e.target.value);if(e.target.value)loadPersonas(e.target.value);}}>
              <option value="">-- seleccionar empresa --</option>
              {empresas.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          }
        </div>
        {empresa&&personas.length===0&&<div style={{color:"var(--tx2)",fontSize:13}}>Cargando personal...</div>}
        {empresa&&personas.length>0&&<button className="bp" onClick={()=>setStep("personas")}>Ver {personas.length} personas de {empresa} →</button>}
      </>}
      {step==="personas"&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{fontWeight:600}}>{empresa}</div>
            <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{tiposLabel[tipo]} — vence {fmtD(fecha)}</div>
          </div>
          <button className="bsm" onClick={toggleAll}>{personas.every(p=>selected[p.id])?"Quitar todos":"Seleccionar todos"}</button>
        </div>
        <div className="cbl">
          {personas.map(p=>{
            const st=habSt(getHab("persona",p.id,tipo,habs));
            return <div key={p.id} className="cbl-item" onClick={()=>setSelected(s=>({...s,[p.id]:!s[p.id]}))}>
              <input type="checkbox" checked={!!selected[p.id]} readOnly/>
              <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
              <div style={{flex:1}}><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:11,color:"var(--tx2)"}}>DNI {p.dni}</div></div>
              {st!=="none"&&<span className={`hc hc-${st}`} style={{fontSize:10}}>{st==="ok"?"actual":st==="exp"?"venc":"susp"}</span>}
            </div>;
          })}
        </div>
        <div style={{marginTop:12,fontSize:13,color:"var(--tx2)"}}>{selectedCount} personas seleccionadas</div>
        <div style={{marginTop:16}}><button className="bp" disabled={selectedCount===0} onClick={()=>setStep("fecha")}>Continuar → elegir fecha</button></div>
      </>}
      {step==="fecha"&&<>
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:600}}>{empresa}</div>
          <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{tiposLabel[tipo]} · {selectedCount} personas</div>
        </div>
        <div className="f"><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} autoFocus/></div>
      </>}
    </div>
    <div className="mf">
      {step==="personas"&&<button className="bcanc" onClick={()=>setStep("empresa")}>Atras</button>}
      {step==="fecha"&&<button className="bcanc" onClick={()=>setStep("personas")}>Atras</button>}
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      {step==="fecha"&&<button className="bp" disabled={saving||!fecha} onClick={save}>{saving?"Aplicando...":"Aplicar a "+selectedCount+" personas"}</button>}
    </div>
  </div></div>;
}

// ─── HABILITAR TODO MODAL ────────────────────────────────────────────────────
function HabTodoModal({proyectoId,currentUserId,tipo,onClose,onSaved}){
  const[fecha,setFecha]=useState("2027-01-01");
  const[saving,setSaving]=useState(false);
  const[prog,setProg]=useState(null); // {done, total}
  // Rev86: cp_ingreso deriva del Radar de Obra automáticamente; cp_almuerzo/cp_cena eliminados
  const TODOS_TIPOS_P=["sh_ingreso","sh_chalet","sh_manejo"];
  const TODOS_TIPOS_V=["sh_ingreso","sh_manejo"];

  const save=async()=>{
    if(!fecha)return;
    setSaving(true);
    const tipos=tipo==="persona"?TODOS_TIPOS_P:TODOS_TIPOS_V;
    // Fetch all entities
    const{data:entities}=tipo==="persona"
      ?await db.sel("personas",{cols:"id",f:[["deleted_at","is","null"]],lim:5000})
      :await db.sel("vehiculos",{cols:"id",f:[["activo","eq",true]],lim:2000});
    const{data:habsExist}=await db.sel("habilitaciones",{f:[["entity_type","eq",tipo==="persona"?"persona":"vehiculo"]],lim:10000});
    const habMap={};
    (habsExist||[]).forEach(h=>{
      const eid=tipo==="persona"?h.persona_id:h.vehiculo_id;
      habMap[`${eid}_${h.tipo}`]=h.id;
    });
    const total=(entities||[]).length*tipos.length;
    let done=0;
    for(const ent of(entities||[])){
      for(const t of tipos){
        const key=`${ent.id}_${t}`;
        if(habMap[key]){
          await db.upd("habilitaciones",{fecha_hasta:fecha,suspendida:false,motivo_suspension:null},[["id","eq",habMap[key]]]);
        } else {
          const payload={entity_type:tipo==="persona"?"persona":"vehiculo",tipo,proyecto_id:proyectoId,otorgado_por:currentUserId,fecha_hasta:fecha,suspendida:false};
          if(tipo==="persona")payload.persona_id=ent.id;else payload.vehiculo_id=ent.id;
          payload.tipo=t;
          await db.ins("habilitaciones",payload);
        }
        done++;
        if(done%20===0)setProg({done,total});
      }
    }
    setSaving(false);setProg(null);onSaved();onClose();
  };

  return <div className="mo"><div className="md" style={{maxWidth:400}}>
    <div className="mh"><div className="mt">⭐ Habilitar todo — {tipo==="persona"?"Personal":"Vehiculos"}</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div style={{color:"var(--tx2)",fontSize:13,marginBottom:16}}>
        Aplica <strong>todas</strong> las habilitaciones a {tipo==="persona"?"todas las personas":"todos los vehículos"} del sistema. Los que ya tienen habilitación actualiza la fecha; los que no la tienen la crea.
      </div>
      <div className="f"><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
      {prog&&<div style={{marginTop:12,fontSize:13,color:"var(--tx2)",textAlign:"center"}}>{prog.done} / {prog.total} habilitaciones...</div>}
      <button className="bp" style={{marginTop:8,background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} disabled={saving||!fecha} onClick={save}>
        {saving?"Procesando...":"Aplicar a todos"}
      </button>
    </div>
  </div></div>;
}

// ─── PERSONA DETALLE MODAL ───────────────────────────────────────────────────
function PersonaDetalleModal({persona,proyectoId,onClose}){
  const[ubicacion,setUbicacion]=useState(null); // null | "chalet" | "camino" | "predio" | "fuera"
  const[historial,setHistorial]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const load=async()=>{
      // Verificar ubicación actual: chalet/camino desde calcPosicionesMontana (mismo día),
      // predio desde calcPersonasEnPredio (última fichada global). Jerarquía: chalet > camino > predio > fuera.
      // Ojo: la vista v_ultima_fichada usa COALESCE(persona_id::text, dni_raw) como clave — si el garitero
      // tipeó el DNI en vez de escanear el QR, la fichada quedó con persona_id=NULL y clave=dni_raw.
      // Chequeamos por id (UUID) O por dni para cubrir los 2 casos.
      const[pos,pred]=await Promise.all([calcPosicionesMontana(),calcPersonasEnPredio()]);
      const p=pos.persona[persona.id]||pos.persona[persona.dni];
      const enPredio=pred.inSet.has(persona.id)||pred.inSet.has(persona.dni);
      if(p==="chalet")setUbicacion("chalet");
      else if(p==="camino")setUbicacion("camino");
      else if(enPredio)setUbicacion("predio");
      else setUbicacion("fuera");

      // Historial de accesos (últimos 20)
      const todayStr=today();
      const[{data:regs},{data:mans}]=await Promise.all([
        db.sel("registros_acceso",{cols:"sesion_id,resultado,orden_escaneo",f:[["persona_id","eq",persona.id]],lim:2000}),
        db.sel("movimientos_manuales",{cols:"id,created_at,direccion,puesto",f:[["persona_id","eq",persona.id]],ord:"created_at.desc",lim:30}),
      ]);
      let sesiones=[];
      if(regs&&regs.length){
        const sesIds=[...new Set(regs.map(r=>r.sesion_id))];
        const{data:ses}=await db.sel("sesiones_acceso",{cols:"id,cerrada_at,direccion,puesto,vehiculo_id",inFilter:["id",sesIds],ord:"cerrada_at.desc",lim:50});
        const vids=[...new Set((ses||[]).filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
        let vm={};
        if(vids.length){const{data:vehs}=await db.sel("vehiculos",{cols:"id,patente",inFilter:["id",vids]});(vehs||[]).forEach(v=>{vm[v.id]=v;});}
        sesiones=(ses||[]).map(s=>({...s,veh:vm[s.vehiculo_id]||null,tipo:"sesion"}));
      }
      const manuales=(mans||[]).map(m=>({id:m.id,cerrada_at:m.created_at,direccion:m.direccion,puesto:m.puesto,veh:null,tipo:"manual"}));
      // Combinar y ordenar por fecha
      const todo=[...sesiones,...manuales].sort((a,b)=>new Date(b.cerrada_at)-new Date(a.cerrada_at)).slice(0,30);
      setHistorial(todo);
      setLoading(false);
    };
    load();
  },[persona.id]);

  const ubColor=ubicacion==="chalet"?"#A78BFA":ubicacion==="camino"?"#60A5FA":ubicacion==="predio"?"#F59E0B":"var(--tx2)";
  const ubLabel=ubicacion==="chalet"?"En Chalet":ubicacion==="camino"?"En Camino (P2→P3)":ubicacion==="predio"?"En Predio":"Fuera de la obra";
  const ubIcon=ubicacion==="chalet"?"🏔️":ubicacion==="camino"?"🚗":ubicacion==="predio"?"🏕️":"—";

  return <div className="mo"><div className="md">
    <div className="mh">
      <div>
        <div className="mt">{persona.nombre} {persona.apellido}</div>
        <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{persona.empresa} · DNI {persona.dni}</div>
      </div>
      <button className="mc" onClick={onClose}>x</button>
    </div>
    <div className="mb">
      {loading?<div style={{textAlign:"center",padding:20,color:"var(--tx2)"}}>Cargando...</div>:<>
        {/* Ubicación actual */}
        <div style={{background:"var(--s2)",border:`1px solid ${ubColor}44`,borderRadius:8,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>{ubIcon}</span>
          <div>
            <div style={{fontSize:11,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",marginBottom:2}}>Ubicación ahora</div>
            <div style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:700,color:ubColor}}>{ubLabel}</div>
          </div>
        </div>
        {/* Historial */}
        <div style={{fontSize:11,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>Historial reciente</div>
        {historial.length===0
          ?<div style={{color:"var(--tx2)",textAlign:"center",padding:12}}>Sin registros.</div>
          :<div style={{maxHeight:280,overflowY:"auto"}}>
            {historial.map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--bd)"}}>
              <span className={`ld ld-${s.direccion==="entrada"?"in":"out"}`} style={{fontSize:11,flexShrink:0}}>{s.direccion}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:500}}>{s.puesto}{s.veh?` · ${s.veh.patente}`:""}</div>
                <div style={{fontSize:11,color:"var(--tx2)"}}>{fmtTs(s.cerrada_at)}</div>
              </div>
            </div>)}
          </div>
        }
      </>}
    </div>
  </div></div>;
}

// ─── VEHICULO DETALLE MODAL ──────────────────────────────────────────────────
function VehiculoDetalleModal({vehiculo,proyectoId,onClose}){
  const[ubicacion,setUbicacion]=useState(null);
  const[historial,setHistorial]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const load=async()=>{
      // Ubicación actual basada en netos P2/P3
      const pos=await calcPosicionesMontana();
      const p=pos.vehiculo[vehiculo.id];
      setUbicacion(p==="chalet"?"chalet":p==="camino"?"camino":"fuera");

      // Últimas 30 sesiones del vehículo
      const{data:ses}=await db.sel("sesiones_acceso",{
        cols:"id,cerrada_at,direccion,puesto,total_personas,total_aprobados,total_rechazados",
        f:[["vehiculo_id","eq",vehiculo.id]],
        ord:"cerrada_at.desc",
        lim:30
      });
      let regsBySes={};let personasMap={};
      if(ses&&ses.length){
        const sesIds=ses.map(s=>s.id);
        const{data:regs}=await db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado",inFilter:["sesion_id",sesIds]});
        (regs||[]).forEach(r=>{if(!regsBySes[r.sesion_id])regsBySes[r.sesion_id]=[];regsBySes[r.sesion_id].push(r);});
        const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
        if(pids.length){
          const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido"});
          (pers||[]).forEach(p=>{personasMap[p.id]=p;});
        }
      }
      setHistorial((ses||[]).map(s=>({...s,regs:regsBySes[s.id]||[],personasMap})));
      setLoading(false);
    };
    load();
  },[vehiculo.id]);

  const ubColor=ubicacion==="chalet"?"#A78BFA":ubicacion==="camino"?"#60A5FA":"var(--tx2)";
  const ubLabel=ubicacion==="chalet"?"En Chalet":ubicacion==="camino"?"En Camino (P2 → P3)":"Fuera de la obra";
  const ubIcon=ubicacion==="chalet"?"🏔️":ubicacion==="camino"?"🚗":"—";

  return <div className="mo"><div className="md">
    <div className="mh">
      <div>
        <div className="mt">{VI[vehiculo.tipo]||"🚗"} {vehiculo.patente}</div>
        <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{vehiculo.descripcion||vehiculo.tipo} · {vehiculo.empresa||"—"}</div>
      </div>
      <button className="mc" onClick={onClose}>x</button>
    </div>
    <div className="mb">
      {loading?<div style={{textAlign:"center",padding:20,color:"var(--tx2)"}}>Cargando...</div>:<>
        <div style={{background:"var(--s2)",border:`1px solid ${ubColor}44`,borderRadius:8,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>{ubIcon}</span>
          <div>
            <div style={{fontSize:11,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",marginBottom:2}}>Ubicación ahora</div>
            <div style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:700,color:ubColor}}>{ubLabel}</div>
          </div>
        </div>
        <div style={{fontSize:11,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>Historial de circulación</div>
        {historial.length===0
          ?<div style={{color:"var(--tx2)",textAlign:"center",padding:12}}>Sin registros.</div>
          :<div style={{maxHeight:340,overflowY:"auto"}}>
            {historial.map(s=>{
              const ok=s.regs.filter(r=>r.resultado==="aprobado");
              const names=ok.map(r=>{const p=s.personasMap[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
              const max=2;
              const namesStr=names.length===0?"sin pasajeros":names.length<=max?names.join(", "):names.slice(0,max).join(", ")+" y "+(names.length-max)+" más";
              return <div key={s.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 0",borderBottom:"1px solid var(--bd)"}}>
                <span className={`ld ld-${s.direccion==="entrada"?"in":"out"}`} style={{fontSize:11,flexShrink:0,marginTop:2}}>{s.direccion}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500}}>{s.puesto} · {s.total_personas} pers.{(s.total_rechazados||0)>0?<span style={{color:"var(--rd)",marginLeft:6}}>{s.total_rechazados} deneg.</span>:null}</div>
                  <div style={{fontSize:11,color:"var(--tx2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{namesStr}</div>
                  <div style={{fontSize:10,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:2}}>{fmtTs(s.cerrada_at)}</div>
                </div>
              </div>;
            })}
          </div>
        }
      </>}
    </div>
  </div></div>;
}

// ─── REGISTRO MANUAL DE ACCESO ───────────────────────────────────────────────
function RegistroManualAcceso({persona,user,proyectoId,onClose,onSaved}){
  const[dir,setDir]=useState(null);
  const[conVehiculo,setConVehiculo]=useState(null);
  const[patente,setPatente]=useState("");
  const[saving,setSaving]=useState(false);
  const[step,setStep]=useState("dir"); // dir | vehiculo | confirm
  const isP1=user.puesto_nombre==="Puesto 1";
  const labels=isP1?{entrada:"Ingreso a obra",salida:"Salio de obra"}:{entrada:"Subio al chalet",salida:"Bajo del chalet"};

  const guardar=async()=>{
    setSaving(true);
    // Si tiene vehículo, buscar o registrar el vehículo
    let vehiculoId=null;
    if(conVehiculo&&patente.trim()){
      const pat=patente.trim().toUpperCase();
      const{data:v}=await db.sel("vehiculos",{f:[["patente","eq",pat]],lim:1});
      if(v&&v[0]){
        vehiculoId=v[0].id;
      } else {
        // Auto-registrar vehículo
        const{data:nuevo}=await db.ins("vehiculos",{patente:pat,tipo:"Camioneta",descripcion:"Registrado via acceso manual",activo:true});
        if(nuevo&&nuevo[0])vehiculoId=nuevo[0].id;
      }
    }

    if(vehiculoId){
      // Registrar como sesión de acceso
      const{data:ses}=await db.ins("sesiones_acceso",{
        proyecto_id:proyectoId,puesto:user.puesto_nombre,operador_id:user.id,
        vehiculo_id:vehiculoId,vehiculo_ok:false,
        direccion:dir,total_personas:1,total_aprobados:1,total_rechazados:0,
      });
      if(ses&&ses[0]){
        await db.ins("registros_acceso",[{
          sesion_id:ses[0].id,persona_id:persona.id,
          dni_raw:persona.dni,resultado:"aprobado",orden_escaneo:1,
        }]);
      }
    } else {
      // Registrar como movimiento manual
      await db.ins("movimientos_manuales",{
        proyecto_id:proyectoId,puesto:user.puesto_nombre,operador_id:user.id,
        persona_id:persona.id,dni_raw:persona.dni,
        nombre_raw:`${persona.nombre} ${persona.apellido}`,direccion:dir,
      });
    }
    setSaving(false);onSaved&&onSaved();onClose();
  };

  return <div className="mo"><div className="md">
    <div className="mh">
      <div>
        <div className="mt">Registro manual de acceso</div>
        <div style={{fontSize:13,color:"var(--tx2)",marginTop:2}}>{persona.nombre} {persona.apellido} · DNI {persona.dni}</div>
      </div>
      <button className="mc" onClick={onClose}>x</button>
    </div>
    <div className="mb">
      {step==="dir"&&<>
        <div style={{fontSize:13,color:"var(--tx2)",marginBottom:14}}>¿Qué movimiento registrás?</div>
        <div className="dir-big">
          <button className="dir-big-btn in" onClick={()=>{setDir("entrada");setStep("vehiculo");}}>
            <div style={{fontSize:32,marginBottom:6}}>⬆️</div>
            {labels.entrada}
          </button>
          <button className="dir-big-btn out" onClick={()=>{setDir("salida");setStep("vehiculo");}}>
            <div style={{fontSize:32,marginBottom:6}}>⬇️</div>
            {labels.salida}
          </button>
        </div>
      </>}
      {step==="vehiculo"&&<>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <span className={`ld ld-${dir==="entrada"?"in":"out"}`}>{dir==="entrada"?labels.entrada:labels.salida}</span>
          <button onClick={()=>setStep("dir")} style={{background:"none",border:"none",color:"var(--tx2)",cursor:"pointer",fontSize:12}}>cambiar</button>
        </div>
        <div style={{fontSize:13,color:"var(--tx2)",marginBottom:14}}>¿Vino con vehículo?</div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button onClick={()=>setConVehiculo(true)} className={`db${conVehiculo===true?" db-in on":""}`} style={{flex:1}}>Sí</button>
          <button onClick={()=>{setConVehiculo(false);setPatente("");}} className={`db${conVehiculo===false?" db-out on":""}`} style={{flex:1}}>No</button>
        </div>
        {conVehiculo===true&&<div className="f">
          <label>Patente del vehículo</label>
          <input placeholder="Ej: AB123CD" value={patente} onChange={e=>setPatente(e.target.value.toUpperCase())} autoFocus/>
        </div>}
        {conVehiculo!==null&&<button className="bp" disabled={conVehiculo===true&&!patente.trim()||saving} onClick={guardar}>
          {saving?"Guardando...":"Confirmar registro"}
        </button>}
      </>}
    </div>
  </div></div>;
}

// ─── HABILITACION MASIVA VEHICULOS ───────────────────────────────────────────
function HabMasivaVehModal({proyectoId,currentUserId,habs,onClose,onSaved}){
  const[empresas,setEmpresas]=useState([]);
  const[empresa,setEmpresa]=useState("");
  const[vehiculos,setVehiculos]=useState([]);
  const[selected,setSelected]=useState({});
  const[tipo,setTipo]=useState("sh_ingreso");
  const[fecha,setFecha]=useState("");
  const[saving,setSaving]=useState(false);
  const[step,setStep]=useState("empresa");
  const tiposLabel={"sh_ingreso":"S&H Ingreso","sh_manejo":"S&H Subir a Chalet"};
  const selectedCount=Object.values(selected).filter(Boolean).length;

  useEffect(()=>{
    db.sel("vehiculos",{cols:"empresa",f:[["activo","eq",true]]}).then(({data})=>{
      if(data){const emp=[...new Set(data.map(v=>v.empresa).filter(Boolean))].sort();setEmpresas(emp);}
    });
  },[]);

  const loadVehiculos=async(emp)=>{
    const{data}=await db.sel("vehiculos",{f:[["empresa","eq",emp],["activo","eq",true]],ord:"patente.asc"});
    if(data){setVehiculos(data);const sel={};data.forEach(v=>{sel[v.id]=true;});setSelected(sel);}
  };
  const toggleAll=()=>{const allOn=vehiculos.every(v=>selected[v.id]);const sel={};vehiculos.forEach(v=>{sel[v.id]=!allOn;});setSelected(sel);};
  const save=async()=>{
    const ids=Object.entries(selected).filter(([_,v])=>v).map(([k])=>k);
    if(!ids.length||!fecha)return;
    setSaving(true);
    for(const vid of ids){
      const existing=getHab("vehiculo",vid,tipo,habs);
      if(existing)await db.upd("habilitaciones",{fecha_hasta:fecha,suspendida:false,motivo_suspension:null},[["id","eq",existing.id]]);
      else await db.ins("habilitaciones",{entity_type:"vehiculo",vehiculo_id:vid,tipo,proyecto_id:proyectoId,otorgado_por:currentUserId,fecha_desde:today(),fecha_hasta:fecha,suspendida:false});
    }
    setSaving(false);onSaved();onClose();
  };

  return <div className="mo"><div className="md md-lg">
    <div className="mh"><div className="mt">Hab. masiva vehiculos por empresa</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {step==="empresa"&&<>
        <div className="f"><label>Tipo de habilitacion</label>
          <select value={tipo} onChange={e=>setTipo(e.target.value)}>
            {Object.entries(tiposLabel).map(([k,v])=><option key={k} value={k}>{v}</option>)}
          </select>
        </div>
        <div className="f"><label>Empresa</label>
          <select value={empresa} onChange={e=>{setEmpresa(e.target.value);if(e.target.value)loadVehiculos(e.target.value);}}>
            <option value="">-- seleccionar empresa --</option>
            {empresas.map(e=><option key={e} value={e}>{e}</option>)}
          </select>
        </div>
        {empresa&&vehiculos.length>0&&<button className="bp" onClick={()=>setStep("vehiculos")}>Ver vehiculos de {empresa}</button>}
      </>}
      {step==="vehiculos"&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div><div style={{fontWeight:600}}>{empresa}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{tiposLabel[tipo]}</div></div>
          <button className="bsm" onClick={toggleAll}>{vehiculos.every(v=>selected[v.id])?"Quitar todos":"Seleccionar todos"}</button>
        </div>
        <div className="cbl">
          {vehiculos.map(v=>{
            const st=habSt(getHab("vehiculo",v.id,tipo,habs));
            return <div key={v.id} className="cbl-item" onClick={()=>setSelected(s=>({...s,[v.id]:!s[v.id]}))}>
              <input type="checkbox" checked={!!selected[v.id]} readOnly/>
              <span style={{fontSize:18}}>{VI[v.tipo]||"🚗"}</span>
              <div style={{flex:1}}><div style={{fontWeight:500,fontFamily:"var(--fm)"}}>{v.patente}</div><div style={{fontSize:11,color:"var(--tx2)"}}>{v.descripcion||v.tipo}</div></div>
              {st!=="none"&&<span className={`hc hc-${st}`} style={{fontSize:10}}>{st==="ok"?"actual":st==="exp"?"venc":"susp"}</span>}
            </div>;
          })}
        </div>
        <div style={{marginTop:12,fontSize:13,color:"var(--tx2)"}}>{selectedCount} vehiculos seleccionados</div>
        <div style={{marginTop:16}}><button className="bp" disabled={selectedCount===0} onClick={()=>setStep("fecha")}>Continuar → elegir fecha</button></div>
      </>}
      {step==="fecha"&&<>
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:600}}>{empresa}</div>
          <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{tiposLabel[tipo]} · {selectedCount} vehiculos</div>
        </div>
        <div className="f"><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} autoFocus/></div>
      </>}
    </div>
    <div className="mf">
      {step==="vehiculos"&&<button className="bcanc" onClick={()=>setStep("empresa")}>Atras</button>}
      {step==="fecha"&&<button className="bcanc" onClick={()=>setStep("vehiculos")}>Atras</button>}
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      {step==="fecha"&&<button className="bp" disabled={saving||!fecha} onClick={save}>{saving?"Aplicando...":"Aplicar a "+selectedCount+" vehiculos"}</button>}
    </div>
  </div></div>;
}

  const[registroP,setRegistroP]=useState(null);
  const[detalleP,setDetalleP]=useState(null);
  const[habKey,setHabKey]=useState(0); // persona para registro manual
  const canSH=userRole==="sh"||userRole==="admin";
  const canCP=userRole==="cp"||userRole==="admin";
  const readOnly=userRole==="puesto"||userRole==="logistica";
  const onHabSaved=(newHab)=>{
    setHabs(prev=>{
      // Remove old hab for same entity+tipo+proyecto
      const filtered=prev.filter(h=>!(
        h.entity_type===newHab.entity_type&&
        h.persona_id===newHab.persona_id&&
        h.vehiculo_id===newHab.vehiculo_id&&
        h.tipo===newHab.tipo&&
        h.proyecto_id===newHab.proyecto_id
      ));
      return [...filtered, newHab];
    });
    setHabKey(k=>k+1);
  };
  const load=async()=>{
    setLoading(true);
    const[r1,r2,rMap]=await Promise.all([
      db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc",lim:5000}),
      db.sel("habilitaciones",{f:[["entity_type","eq","persona"]],lim:5000}),
      fetchRadarDia(),
    ]);
    if(r1.data)setPersonas(r1.data);
    if(r2.data)setHabs(r2.data);
    setRadarMap(rMap||{});setRadarLoaded(Date.now());
    setHabKey(k=>k+1);
    setLoading(false);
  };
  // refreshRadar: llamado por el interval de 1 hora → solo re-lee la tabla local (rápido, sin chupar del sheet)
  const refreshRadar=async()=>{
    setRefreshingRadar(true);
    const rMap=await fetchRadarDia();
    setRadarMap(rMap||{});setRadarLoaded(Date.now());
    setRefreshingRadar(false);
  };
  // refreshRadarManual: llamado por el botón "🔄 Actualizar" → PRIMERO dispara el sync remoto del sheet
  // (si hay URL/secret configurados), DESPUÉS re-lee. Lento (~30-60s) pero trae lo cargado en el sheet ahora.
  const refreshRadarManual=async()=>{
    setRefreshingRadar(true);
    const res=await runRadarSync();
    // Siempre re-leer (aunque el sync remoto haya fallado, quizás refresque algo de la última corrida)
    const rMap=await fetchRadarDia();
    setRadarMap(rMap||{});setRadarLoaded(Date.now());
    setRefreshingRadar(false);
    if(!res.ok)alert(res.msg);
  };
  useEffect(()=>{load();},[]);
  // Auto-refresh del Radar cada 1 hora — usa refreshRadar (rápido, sin sync remoto)
  useEffect(()=>{const i=setInterval(()=>{refreshRadar();},60*60*1000);return()=>clearInterval(i);},[]);
  const saveP=async f=>{
    f={...f,dni:normDni(f.dni)}; // sin espacios y en mayúsculas (DNI de extranjeros con letras)
    if(editP){
      const{ok,data}=await db.upd("personas",f,[["id","eq",editP.id]]);
      if(!ok){alert("No se pudo actualizar la persona.\n\nDetalle: "+JSON.stringify(data));return;}
    } else {
      // Blindaje contra duplicados por DNI
      const{data:exist}=await db.sel("personas",{f:[["dni","ilike",f.dni]],lim:1});
      if(exist&&exist[0]){
        if(exist[0].deleted_at){
          // Restaurar el que estaba borrado con los datos nuevos
          const{ok,data}=await db.upd("personas",{...f,deleted_at:null},[["id","eq",exist[0].id]]);
          if(!ok){alert("No se pudo restaurar la persona borrada.\n\nDetalle: "+JSON.stringify(data));return;}
        } else {
          alert("Ya existe una persona ACTIVA con el DNI "+f.dni+" ("+(exist[0].nombre||"")+" "+(exist[0].apellido||"")+"). No se guarda para evitar duplicado.");
          return;
        }
      } else {
        const{ok,data}=await db.ins("personas",f);
        if(!ok){alert("No se pudo guardar la persona.\n\nRevisá que estén completos:\n· DNI\n· Nombre\n· Apellido\n\nDetalle del servidor: "+JSON.stringify(data));return;}
      }
    }
    load();
  };
  const delP=async id=>{if(!confirm("Eliminar?"))return;await db.upd("personas",{deleted_at:new Date().toISOString()},[["id","eq",id]]);load();};
  let filtered=personas.filter(p=>!filter||`${p.nombre} ${p.apellido} ${p.dni} ${p.empresa||""}`.toLowerCase().includes(filter.toLowerCase()));
  if(filterEst==="venc"){
    // Filtro "próximas a vencer": personas con alguna hab S&H bloqueante (ing/chalet) o
    // informativa (manejo) que vence en los próximos 3 días.
    const hoyISO=today();const hoyT=new Date(hoyISO).getTime();const limT=hoyT+3*24*60*60*1000;
    filtered=filtered.filter(p=>habs.some(h=>h.persona_id===p.id&&["sh_ingreso","sh_chalet","sh_manejo"].includes(h.tipo)&&!h.suspendida&&h.fecha_hasta&&(()=>{const t=new Date(String(h.fecha_hasta).slice(0,10)).getTime();return t>=hoyT&&t<=limT;})()));
  } else if(filterEst){
    filtered=filtered.filter(p=>personaEstado(p.id,habs,radarMap,p.dni)===filterEst);
  }
  // Contar habs S&H próximas a vencer (< 3 días) — para el badge del botón
  const proxVenc=(()=>{
    const hoyISO=today();const hoyT=new Date(hoyISO).getTime();const limT=hoyT+3*24*60*60*1000;
    const ids=new Set();
    habs.forEach(h=>{
      if(!["sh_ingreso","sh_chalet","sh_manejo"].includes(h.tipo))return;
      if(h.suspendida||!h.fecha_hasta)return;
      const t=new Date(String(h.fecha_hasta).slice(0,10)).getTime();
      if(t>=hoyT&&t<=limT)ids.add(h.persona_id);
    });
    return ids.size;
  })();
  const btns=[];
  if(!readOnly&&(canSH||canCP))btns.push(<button key="add" className="badd" onClick={()=>{setEditP(null);setShowModal(true);}}>+ Nuevo</button>);
  if(canSH)btns.push(<button key="mas" className="badd" style={{background:"var(--acc2)",marginLeft:6}} onClick={()=>setShowMasivo(true)}>Hab. masiva por empresa</button>);
  if(userRole==="admin")btns.push(<button key="todo" className="badd" style={{background:"rgba(16,185,129,.2)",border:"1px solid var(--gr)",color:"var(--gr)",marginLeft:6}} onClick={()=>setShowMasivoTodo(true)}>⭐ Habilitar todo</button>);
  return <div>
    <div className="ph2"><div className="ptit"><span>Personal</span>{readOnly&&<span style={{fontSize:14,fontWeight:400,color:"var(--tx2)",marginLeft:10}}>solo lectura</span>}</div><div style={{display:"flex",gap:6}}>{btns}</div></div>
    <div className="sg">
      <div className="sc"><div className="sv">{personas.length}</div><div className="slb">Total</div></div>
      <div className="sc sc-btn" onClick={()=>setFilterEst(filterEst==="ok"?"":"ok")} style={filterEst==="ok"?{borderColor:"var(--gr)"}:{}}><div className="sv" style={{color:"var(--gr)"}}>{personas.filter(p=>personaEstado(p.id,habs,radarMap,p.dni)==="ok").length}</div><div className="slb">Habilitados</div></div>
      <div className="sc sc-btn" onClick={()=>setFilterEst(filterEst==="par"?"":"par")} style={filterEst==="par"?{borderColor:"var(--acc)"}:{}}><div className="sv" style={{color:"var(--acc)"}}>{personas.filter(p=>personaEstado(p.id,habs,radarMap,p.dni)==="par").length}</div><div className="slb">Parciales</div></div>
      <div className="sc sc-btn" onClick={()=>setFilterEst(filterEst==="no"?"":"no")} style={filterEst==="no"?{borderColor:"var(--rd)"}:{}}><div className="sv" style={{color:"var(--rd)"}}>{personas.filter(p=>personaEstado(p.id,habs,radarMap,p.dni)==="no").length}</div><div className="slb">Bloqueados</div></div>
      <div className="sc sc-btn" onClick={()=>setFilterEst(filterEst==="venc"?"":"venc")} title="Habilitaciones S&H que vencen en los próximos 3 días" style={{borderColor:filterEst==="venc"?"#FBBF24":(proxVenc>0?"rgba(251,191,36,.5)":undefined),animation:proxVenc>0&&filterEst!=="venc"?"pulseWarn 2s infinite":undefined}}>
        <div className="sv" style={{color:proxVenc>0?"#FBBF24":"var(--tx2)"}}>{proxVenc}</div>
        <div className="slb">⚠️ Prox. vencer</div>
      </div>
    </div>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,alignItems:"center",marginBottom:8,fontSize:11,color:"var(--tx2)",fontFamily:"var(--fm)"}}>
      <span title="Info del Radar de Obra (viandas_calendario del día) — se usa para derivar CP Ingreso">
        📅 Radar {radarLoaded?"actualizado "+new Date(radarLoaded).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"..."}
        {" · "}{Object.keys(radarMap).length} registros del día
      </span>
      <button className="bsm" onClick={refreshRadarManual} disabled={refreshingRadar} style={{fontSize:11}} title="Dispara el sync completo del sheet Radar → Supabase y refresca la vista (~30-60 seg)">{refreshingRadar?"⏳ sincronizando…":"🔄 Actualizar desde el sheet"}</button>
    </div>
    <div className="fb">
      <input className="fi" placeholder="Buscar nombre, DNI o empresa..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:300}}/>
      {filterEst&&<button className="bsm" onClick={()=>setFilterEst("")}>x Filtro activo</button>}
    </div>
    {loading?<Spin/>:<div className="tw"><table>
      <thead>
        <tr>
          <th rowSpan={2} style={{verticalAlign:"bottom",borderRight:"1px solid var(--bd)",top:0}}>Persona</th>
          <th rowSpan={2} style={{verticalAlign:"bottom",top:0}}>DNI</th>
          <th rowSpan={2} style={{verticalAlign:"bottom",borderRight:"1px solid var(--bd)",top:0}}>Empresa</th>
          <th colSpan={3} className="sh-h" style={{textAlign:"center",paddingBottom:4,top:0}}>S&H</th>
          <th colSpan={1} className="cp-h" style={{textAlign:"center",paddingBottom:4,top:0}}>CP</th>
          <th rowSpan={2} style={{verticalAlign:"bottom",top:0}}>Estado</th>
          {!readOnly&&<th rowSpan={2} style={{top:0}}></th>}
        </tr>
        <tr>
          <th className="sh-h" style={{top:28}}>Ingreso</th><th style={{top:28}}>Subir a Chalet</th><th style={{top:28}}>Manejo en Monta&ntilde;a</th>
          <th className="cp-h" style={{top:28}}>Ingreso <span style={{fontSize:9,opacity:.6,fontWeight:400}}>(del Radar)</span></th>
        </tr>
      </thead>
      <tbody key={habKey}>
        {filtered.length===0&&<tr><td colSpan={readOnly?8:9} style={{textAlign:"center",color:"var(--tx2)",padding:28}}>Sin registros</td></tr>}
        {filtered.map(p=>{
          const est=personaEstado(p.id,habs,radarMap,p.dni);
          return <tr key={p.id}>
            <td style={{borderRight:"1px solid var(--bd)",cursor:"pointer"}} onClick={()=>setDetalleP(p)}><div style={{display:"flex",alignItems:"center",gap:8}}><div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div><div><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div>{p.cargo&&<div style={{fontSize:11,color:"var(--tx2)"}}>{p.cargo}</div>}</div></div></td>
            <td className="mn">{p.dni}</td>
            <td style={{color:"var(--tx2)",fontSize:12,borderRight:"1px solid var(--bd)",maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.empresa||"—"}</td>
            <HabCell hab={getHab("persona",p.id,"sh_ingreso",habs)} tipo="sh_ingreso" entityType="persona" entityId={p.id} proyectoId={proyectoId} canEdit={canSH&&!readOnly} currentUserId={currentUserId} onRefresh={load} onHabSaved={onHabSaved} tdClass="sh-c"/>
            <HabCell hab={getHab("persona",p.id,"sh_chalet",habs)} tipo="sh_chalet" entityType="persona" entityId={p.id} proyectoId={proyectoId} canEdit={canSH&&!readOnly} currentUserId={currentUserId} onRefresh={load}/>
            <HabCell hab={getHab("persona",p.id,"sh_manejo",habs)} tipo="sh_manejo" entityType="persona" entityId={p.id} proyectoId={proyectoId} canEdit={canSH&&!readOnly} currentUserId={currentUserId} onRefresh={load}/>
            <HabCellRadar dni={p.dni} radarMap={radarMap} tdClass="cp-c"/>
            <td>{est==="ok"?<span className="est-ok">ok</span>:est==="par"?<span className="est-par">parcial</span>:<span className="est-no">bloq.</span>}</td>
            {!readOnly&&<td><div style={{display:"flex",gap:5}}>
              {(canSH||canCP)&&<button className="bsm" onClick={()=>{setEditP(p);setShowModal(true);}}>Editar</button>}
              {(userRole==="puesto"||userRole==="admin")&&<button className="bsm" style={{color:"var(--acc2)",borderColor:"rgba(59,130,246,.3)"}} onClick={()=>setRegistroP(p)}>Acceso</button>}
              {(userRole==="admin"||userRole==="sh")&&<button className="bsm bsm-r" onClick={()=>delP(p.id)}>x</button>}
            </div></td>}
          </tr>;
        })}
      </tbody>
    </table></div>}
    {showModal&&<PersonModal p={editP} onClose={()=>setShowModal(false)} onSave={saveP}/>}
    {detalleP&&<PersonaDetalleModal persona={detalleP} proyectoId={proyectoId} onClose={()=>setDetalleP(null)}/>}
    {registroP&&user&&<RegistroManualAcceso persona={registroP} user={user} proyectoId={proyectoId} onClose={()=>setRegistroP(null)} onSaved={()=>setRegistroP(null)}/>}
    {showMasivoTodo&&<HabTodoModal proyectoId={proyectoId} currentUserId={currentUserId} tipo="persona" onClose={()=>setShowMasivoTodo(false)} onSaved={load}/>}
    {showMasivo&&<HabMasivaModal proyectoId={proyectoId} currentUserId={currentUserId} habs={habs} onClose={()=>setShowMasivo(false)} onSaved={load}/>}
  </div>;
}

function PersonModal({p,onClose,onSave}){
  const[f,setF]=useState({dni:p?p.dni:"",nombre:p?p.nombre:"",apellido:p?p.apellido:"",empresa:p?p.empresa:"",cargo:p?p.cargo:""});
  const[dniWarn,setDniWarn]=useState(null); // {id, nombre, apellido}
  const isNew=!p;

  const checkDni=async(dni)=>{
    if(!isNew||!dni||dni.length<6)return;
    // Only warn if active (not deleted) — deleted ones will be restored silently
    const{data}=await db.sel("personas",{f:[["dni","ilike",normDni(dni)],["deleted_at","is","null"]],lim:1});
    if(data&&data[0])setDniWarn(data[0]);
    else setDniWarn(null);
  };

  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">{p?"Editar":"Nueva"} Persona</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div className="f">
        <label>DNI</label>
        <input placeholder="30456789" value={f.dni} onChange={e=>setF(x=>({...x,dni:e.target.value}))} onBlur={e=>checkDni(e.target.value)}/>
      </div>
      {dniWarn&&<div className="warn">
        Ya existe: <strong>{dniWarn.nombre} {dniWarn.apellido}</strong>
        <button onClick={onClose} style={{marginLeft:10,background:"none",border:"1px solid var(--acc)",color:"var(--acc)",borderRadius:3,padding:"2px 8px",cursor:"pointer",fontSize:12}}>Ver</button>
      </div>}
      <div className="row2">
        <div className="f"><label>Nombre</label><input placeholder="Carlos" value={f.nombre} onChange={e=>setF(x=>({...x,nombre:e.target.value}))}/></div>
        <div className="f"><label>Apellido</label><input placeholder="Rodriguez" value={f.apellido} onChange={e=>setF(x=>({...x,apellido:e.target.value}))}/></div>
      </div>
      <div className="f"><label>Empresa</label><input placeholder="Constructora SA" value={f.empresa} onChange={e=>setF(x=>({...x,empresa:e.target.value}))}/></div>
      <div className="f"><label>Cargo (opcional)</label><input value={f.cargo} onChange={e=>setF(x=>({...x,cargo:e.target.value}))}/></div>
    </div>
    <div className="mf">
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      <button className="bp" disabled={!f.dni||!f.nombre||!f.apellido||!!dniWarn} onClick={()=>{onSave(f);onClose();}}>Guardar</button>
    </div>
  </div></div>;
}

function VehiculosPanel({userRole,currentUserId,proyectoId}){

        h.tipo===newHab.tipo&&

function VehModal({v,onClose,onSave}){
  const[f,setF]=useState({patente:v?v.patente:"",tipo:v?v.tipo:"Camioneta",descripcion:v?v.descripcion:"",capacidad:v?v.capacidad:"",empresa:v?v.empresa:""});
  const[patenteWarn,setPatenteWarn]=useState(null); // {id, patente, descripcion, empresa}
  const isNew=!v;
  const checkPatente=async(patente)=>{
    if(!isNew||!patente||patente.length<3)return;
    const{data}=await db.sel("vehiculos",{f:[["patente","eq",patente.toUpperCase()],["activo","eq",true]],lim:1});
    if(data&&data[0])setPatenteWarn(data[0]);
    else setPatenteWarn(null);
  };
  // Campos requeridos: patente, tipo, capacidad. Sin capacidad el server rechaza (NOT NULL).
  const missing=[];
  if(!f.patente)missing.push("patente");
  if(!f.tipo)missing.push("tipo");
  if(!f.capacidad&&f.capacidad!==0)missing.push("capacidad");
  const canSave=missing.length===0&&!patenteWarn;
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">{v?"Editar":"Nuevo"} Vehiculo</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div className="row2">
        <div className="f"><label>Patente *</label><input placeholder="AB123CD" value={f.patente} onChange={e=>setF(x=>({...x,patente:e.target.value.toUpperCase()}))} onBlur={e=>checkPatente(e.target.value)}/></div>
        <div className="f"><label>Tipo *</label><select value={f.tipo} onChange={e=>setF(x=>({...x,tipo:e.target.value}))}><option>Camioneta</option><option>Combi</option><option>Colectivo</option><option>Camion</option><option>Auto</option><option>Maquinaria</option><option>Otro</option></select></div>
      </div>
      {patenteWarn&&<div className="warn">
        Ya existe un vehiculo activo con la patente <strong>{patenteWarn.patente}</strong>{patenteWarn.descripcion?" ("+patenteWarn.descripcion+")":""}{patenteWarn.empresa?" — "+patenteWarn.empresa:""}
      </div>}
      <div className="f"><label>Descripcion</label><input placeholder="Ford Ranger Blanca" value={f.descripcion} onChange={e=>setF(x=>({...x,descripcion:e.target.value}))}/></div>
      <div className="row2">
        <div className="f"><label>Capacidad (pax) *</label><input type="number" placeholder="5" value={f.capacidad} onChange={e=>setF(x=>({...x,capacidad:e.target.value===""?"":Number(e.target.value)}))}/></div>
        <div className="f"><label>Empresa</label><input placeholder="Transporte SA" value={f.empresa} onChange={e=>setF(x=>({...x,empresa:e.target.value}))}/></div>
      </div>
      {missing.length>0&&<div style={{fontSize:12,color:"var(--tx2)",marginTop:6}}>Falta completar: <strong style={{color:"var(--acc)"}}>{missing.join(", ")}</strong></div>}
    </div>
    <div className="mf"><button className="bcanc" onClick={onClose}>Cancelar</button><button className="bp" disabled={!canSave} onClick={()=>{onSave(f);onClose();}}>Guardar</button></div>
  </div></div>;
}

function SesionDetalle({ses,onClose,onInverted}){
  const[regs,setRegs]=useState([]);
  const[pers,setPers]=useState([]);
  const[veh,setVeh]=useState(null);
  const[loading,setLoading]=useState(true);
  const[inverting,setInverting]=useState(false);
  useEffect(()=>{
    const load=async()=>{
      const[{data:r},{data:v}]=await Promise.all([
        db.sel("registros_acceso",{f:[["sesion_id","eq",ses.id]],ord:"orden_escaneo.asc"}),
        ses.vehiculo_id?db.sel("vehiculos",{f:[["id","eq",ses.vehiculo_id]],lim:1}):{data:null},
      ]);
      if(r){
        setRegs(r);
        const ids=r.filter(x=>x.persona_id).map(x=>x.persona_id);
        if(ids.length){const{data:p}=await db.sel("personas",{cols:"id,nombre,apellido,empresa,dni"});setPers((p||[]).filter(x=>ids.includes(x.id)));}
      }
      if(v&&v[0])setVeh(v[0]);
      setLoading(false);
    };
    load();
  },[ses.id]);
  return <div className="mo"><div className="md md-lg">
    <div className="mh">
      <div><div className="mt">{veh?veh.patente:"Sesion"} — detalle</div><div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:2}}>{ses.puesto} · {fmtTs(ses.cerrada_at)} · <span className={`ld ld-${ses.direccion==="entrada"?"in":"out"}`}>{ses.direccion}</span></div></div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button className="bsm" onClick={()=>{
          const dir=ses.direccion==="entrada"?"ENTRA":"SALE";
          const pat=veh?veh.patente:"SIN PATENTE";
          const desc=veh?` ${veh.descripcion||veh.tipo}`:"";
          const paxStr=pers.map(p=>`${p.nombre} ${p.apellido} ${p.empresa||""} DNI ${p.dni}`).join("; ");
          const txt=`${dir} — ${pat}${desc}${paxStr?` - ${paxStr}`:""}`;
          navigator.clipboard.writeText(txt).then(()=>{}).catch(()=>{
            const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);
          });
        }} style={{fontSize:11,padding:"4px 10px"}}>Copiar</button>
        <button className="mc" onClick={onClose}>x</button>
      </div>
    </div>
    <div style={{padding:"10px 24px",borderBottom:"1px solid var(--bd)",background:"rgba(245,158,11,.05)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <span style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>¿El operario marcó mal el sentido?</span>
      <button disabled={inverting} onClick={async()=>{
        const nueva=ses.direccion==="entrada"?"salida":"entrada";
        if(!confirm(`Confirmás invertir? Quedará como ${nueva.toUpperCase()} en lugar de ${ses.direccion.toUpperCase()}.`))return;
        setInverting(true);
        const r=await db.upd("sesiones_acceso",{direccion:nueva},[["id","eq",ses.id]]);
        setInverting(false);
        if(!r.ok){alert("Error de red al invertir. Reintentá.");return;}
        if(!r.data||r.data.length===0){
          alert("Supabase respondió OK pero no actualizó ninguna fila.\n\nLa política RLS de la tabla sesiones_acceso no permite UPDATE. El admin tiene que agregar una policy de UPDATE en Supabase para que esta función trabaje.");
          return;
        }
        if(r.data[0].direccion!==nueva){
          alert("La inversión no quedó aplicada (sigue como "+r.data[0].direccion+"). Revisar triggers o políticas RLS en Supabase.");
          return;
        }
        onInverted&&onInverted();
        onClose();
      }} style={{background:"rgba(245,158,11,.15)",border:"1px solid var(--acc)",color:"var(--acc)",borderRadius:4,padding:"5px 12px",cursor:"pointer",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,textTransform:"uppercase"}}>
        ↔ {inverting?"Invirtiendo...":`Pasar a ${ses.direccion==="entrada"?"SALIDA":"ENTRADA"}`}
      </button>
    </div>
    <div className="mb">
      {veh&&<div style={{marginBottom:14,padding:"10px 14px",background:"var(--s2)",borderRadius:4,display:"flex",gap:12,alignItems:"center"}}>
        <span style={{fontSize:22}}>{VI[veh.tipo]||"🚗"}</span>
        <div><div style={{fontFamily:"var(--fm)",fontSize:16,fontWeight:600}}>{veh.patente}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{veh.descripcion} · {ses.vehiculo_ok?<span style={{color:"var(--gr)"}}>habilitado</span>:<span style={{color:"var(--rd)"}}>bloqueado</span>}</div></div>
      </div>}
      {loading?<Spin/>:regs.length===0?<div style={{color:"var(--tx2)",textAlign:"center",padding:20}}>Sin registros</div>
      :<div>{regs.map((r,i)=>{
        const p=pers.find(x=>x.id===r.persona_id);
        return <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid var(--bd)"}}>
          <div style={{fontFamily:"var(--fm)",fontSize:11,color:"var(--tx2)",width:24}}>#{i+1}</div>
          {p?<><div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div><div style={{flex:1}}><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa} · DNI {p.dni}</div></div></>:<><div className="av" style={{fontSize:14}}>?</div><div style={{flex:1,color:"var(--tx2)"}}>DNI: {r.dni_raw}</div></>}
          <span className={r.resultado==="aprobado"?"est-ok":"est-no"} style={{fontSize:11}}>{r.resultado==="aprobado"?"ok":"denegado"}</span>
        </div>;
      })}</div>}
    </div>
  </div></div>;
}

// EditarFichadaModal (Rev91): permite corregir día + hora de una fichada (sesión o movimiento manual).
// Escenario típico: corte de luz/internet → el garitero anotó en papel → después carga
// las fichadas con la fecha/hora reales del papel. También sirve para corregir tipeos.
function EditarFichadaModal({tipo,id,currentTs,contexto,onClose,onSaved}){
  const d=currentTs?new Date(currentTs):new Date();
  const[fecha,setFecha]=useState(d.toISOString().slice(0,10));
  const[hora,setHora]=useState(d.toTimeString().slice(0,5));
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!fecha||!hora)return;
    setSaving(true);
    const newTs=new Date(fecha+"T"+hora+":00").toISOString();
    const table=tipo==="sesion"?"sesiones_acceso":"movimientos_manuales";
    const col=tipo==="sesion"?"cerrada_at":"created_at";
    const{ok,data}=await db.upd(table,{[col]:newTs},[["id","eq",id]]);
    if(!ok){alert("No se pudo guardar el cambio.\n\nDetalle: "+JSON.stringify(data));setSaving(false);return;}
    if(!data||data.length===0){
      alert("Supabase respondió OK pero no se actualizó ninguna fila.\n\nLa política RLS de la tabla "+table+" no permite UPDATE por este rol. Contactar admin.");
      setSaving(false);return;
    }
    setSaving(false);onSaved&&onSaved();onClose();
  };
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">Editar fecha/hora de fichada</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {contexto&&<div style={{padding:"9px 12px",background:"var(--s2)",border:"1px solid var(--bd)",borderRadius:5,fontSize:12,color:"var(--tx2)",marginBottom:14,fontFamily:"var(--fm)"}}>{contexto}</div>}
      <div style={{display:"flex",gap:10}}>
        <div className="f" style={{flex:1}}><label>Fecha real</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
        <div className="f" style={{flex:1}}><label>Hora real</label><input type="time" value={hora} onChange={e=>setHora(e.target.value)}/></div>
      </div>
      <div style={{fontSize:11,color:"var(--tx3)",marginTop:6}}>La fecha/hora actual guardada era <strong style={{color:"var(--tx2)"}}>{fmtTs(currentTs)}</strong>.</div>
    </div>
    <div className="mf">
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      <button className="bp" disabled={!fecha||!hora||saving} onClick={save}>{saving?"Guardando...":"Guardar cambio"}</button>
    </div>
  </div></div>;
}

function Registros({defaultPuesto,user}){
  const[list,setList]=useState([]);
  const[manual,setManual]=useState([]);
  const[personas,setPersonas]=useState({}); // id -> persona
  const[vehiculos,setVehiculos]=useState({}); // id -> vehiculo
  const[regsMap,setRegsMap]=useState({}); // sesion_id -> [regs]
  const[loading,setLoading]=useState(true);
  const[fp,setFp]=useState(defaultPuesto||"");
  const[fd,setFd]=useState("");
  const[fFecha,setFFecha]=useState(today());
  const[fTipo,setFTipo]=useState("");
  const[search,setSearch]=useState("");
  const[detalle,setDetalle]=useState(null);
  const[edit,setEdit]=useState(null); // {tipo, id, currentTs, contexto}
  // Rev91: solo admin + puesto (P1/P2/P3) pueden editar fecha/hora
  const canEdit=!!user&&(user.rol==="admin"||user.rol==="puesto");

  const onHabSaved=(newHab)=>{
    setHabs(prev=>{
      // Remove old hab for same entity+tipo+proyecto
      const filtered=prev.filter(h=>!(
        h.entity_type===newHab.entity_type&&
        h.persona_id===newHab.persona_id&&
        h.vehiculo_id===newHab.vehiculo_id&&
        h.tipo===newHab.tipo&&
        h.proyecto_id===newHab.proyecto_id
      ));
      return [...filtered, newHab];
    });
    setHabKey(k=>k+1);
  };
  const load=async()=>{
    setLoading(true);
    const sf=[...(fp?[["puesto","eq",fp]]:[])];
    if(fFecha){sf.push(["cerrada_at","gte",fFecha+"T00:00:00"]);sf.push(["cerrada_at","lte",fFecha+"T23:59:59"]);}
    const mf=[...(fp?[["puesto","eq",fp]]:[])];
    if(fFecha){mf.push(["created_at","gte",fFecha+"T00:00:00"]);mf.push(["created_at","lte",fFecha+"T23:59:59"]);}
    const[{data:ses},{data:man}]=await Promise.all([
      db.sel("sesiones_acceso",{f:sf,ord:"cerrada_at.desc",lim:200}),
      db.sel("movimientos_manuales",{f:mf,ord:"created_at.desc",lim:200}),
    ]);
    const sesData=ses||[];const manData=man||[];
    setList(sesData);setManual(manData);
    // Load vehicle patentes
    const vids=[...new Set(sesData.filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
    if(vids.length){
      const{data:vehs}=await db.sel("vehiculos",{cols:"id,patente,descripcion,tipo"});
      const vm={};(vehs||[]).forEach(v=>{vm[v.id]=v;});setVehiculos(vm);
    }
    // Load registros_acceso for all sessions
    if(sesData.length){
      const sesIds=sesData.map(s=>s.id);
      const{data:regs}=await db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado,orden_escaneo",inFilter:["sesion_id",sesIds]});
      const rm={};
      (regs||[]).forEach(r=>{if(!rm[r.sesion_id])rm[r.sesion_id]=[];rm[r.sesion_id].push(r);});
      setRegsMap(rm);
      // Load personas for names
      const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
      if(pids.length){
        const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido"});
        const pm={};(pers||[]).forEach(p=>{pm[p.id]=p;});setPersonas(pm);
      }
    }
    setLoading(false);
  };
  useEffect(()=>{load();const i=setInterval(load,30000);return()=>clearInterval(i);},[fp,fFecha]);

  const sesFiltered=list.filter(s=>(!fd||s.direccion===fd)&&(!search||(vehiculos[s.vehiculo_id]?.patente||"").toLowerCase().includes(search.toLowerCase())||(regsMap[s.id]||[]).some(r=>personas[r.persona_id]&&(`${personas[r.persona_id].nombre} ${personas[r.persona_id].apellido}`).toLowerCase().includes(search.toLowerCase()))));
  const manFiltered=manual.filter(m=>(!fd||m.direccion===fd)&&(!search||m.nombre_raw?.toLowerCase().includes(search.toLowerCase())||m.dni_raw?.includes(search)));
  const showSes=fTipo===""||fTipo==="vehiculo";
  const showMan=fTipo===""||fTipo==="manual";

  const getPaxLabel=(sesId)=>{
    const regs=(regsMap[sesId]||[]).filter(r=>r.resultado==="aprobado");
    if(!regs.length)return"sin pasajeros";
    const names=regs.map(r=>{const p=personas[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
    const max=2;
    if(names.length<=max)return names.join(", ");
    return names.slice(0,max).join(", ")+" y "+( names.length-max)+" mas";
  };

  return <div>
    <div className="ph2"><div className="ptit">Registros de <span>Acceso</span></div></div>
    <div className="sg">
      <div className="sc"><div className="sv">{list.filter(s=>s.cerrada_at&&s.cerrada_at.startsWith(today())).length}</div><div className="slb">Sesiones hoy</div></div>
      <div className="sc"><div className="sv">{list.length}</div><div className="slb">Total</div></div>
      <div className="sc"><div className="sv">{manual.length}</div><div className="slb">Manuales</div></div>
      <div className="sc"><div className="sv" style={{color:"var(--rd)"}}>{list.reduce((a,s)=>a+(s.total_rechazados||0),0)}</div><div className="slb">Denegados</div></div>
    </div>
    <div className="fb" style={{flexWrap:"wrap",gap:8}}>
      <input className="fi" placeholder="Buscar patente o persona..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:220}}/>
      <input className="fi" type="date" value={fFecha} onChange={e=>setFFecha(e.target.value)}/>
      <select className="fi" value={fp} onChange={e=>setFp(e.target.value)}><option value="">Todos los puestos</option><option>Puesto 1</option><option>Puesto 2</option><option>Puesto 3</option></select>
      <select className="fi" value={fd} onChange={e=>setFd(e.target.value)}><option value="">Entrada y salida</option><option value="entrada">Entrada</option><option value="salida">Salida</option></select>
      <select className="fi" value={fTipo} onChange={e=>setFTipo(e.target.value)}><option value="">Todo</option><option value="vehiculo">Con vehiculo</option><option value="manual">Manuales</option></select>
    </div>
    {loading?<Spin/>:<>
      {showSes&&sesFiltered.length>0&&<>
        <div style={{fontFamily:"var(--fm)",fontSize:11,color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Ingresos con vehiculo — {sesFiltered.length}</div>
        <div className="tw" style={{marginBottom:16}}><table>
          <thead><tr><th>Hora</th><th>Dir.</th><th>Puesto</th><th>Patente</th><th>Quienes</th><th>Pers.</th><th>Deneg.</th>{canEdit&&<th></th>}</tr></thead>
          <tbody>{sesFiltered.map(s=>{

// ─── SYNC SHEET (export fichadas a Google Sheet) ─────────────────────────────
const SYNC_URL_KEY="controlobra_sync_url";
const SYNC_SECRET_KEY="controlobra_sync_secret";
const SYNC_SHEET_KEY="controlobra_sync_sheet_url";

function SyncSheetPanel(){
  const[url,setUrl]=useState(()=>localStorage.getItem(SYNC_URL_KEY)||"");
  const[secret,setSecret]=useState(()=>localStorage.getItem(SYNC_SECRET_KEY)||"");
  const[sheetUrl,setSheetUrl]=useState(()=>localStorage.getItem(SYNC_SHEET_KEY)||"");
  const[showConfig,setShowConfig]=useState(false);
  const[urlDraft,setUrlDraft]=useState(url);
  const[secretDraft,setSecretDraft]=useState(secret);
  const[sheetDraft,setSheetDraft]=useState(sheetUrl);
  const[syncing,setSyncing]=useState(false);
  const[toggling,setToggling]=useState(false);
  const[lastStatus,setLastStatus]=useState(null);
  const[lastError,setLastError]=useState(null);
  const[paused,setPaused]=useState(false);

  const configured=!!(url&&secret);

  const fetchStatus=async()=>{
    if(!configured)return;
    try{
      const r=await fetch(url+"?action=coStatus&secret="+encodeURIComponent(secret));
      const d=await r.json();
      if(d&&!d.error){setLastStatus(d);setPaused(!!d.paused);}
    }catch(e){}
  };

  useEffect(()=>{fetchStatus();},[url,secret]);

  const saveConfig=()=>{
    localStorage.setItem(SYNC_URL_KEY,urlDraft.trim());
    localStorage.setItem(SYNC_SECRET_KEY,secretDraft.trim());
    localStorage.setItem(SYNC_SHEET_KEY,sheetDraft.trim());
    setUrl(urlDraft.trim());setSecret(secretDraft.trim());setSheetUrl(sheetDraft.trim());
    setShowConfig(false);
  };

  const syncNow=async()=>{
    if(!configured){alert("Falta configurar URL y secret del Apps Script.");return;}
    setSyncing(true);setLastError(null);
    try{
      const r=await fetch(url+"?action=coExport&secret="+encodeURIComponent(secret));
      const d=await r.json();
      if(d.error){setLastError("Error: "+d.error);}
      else{setLastStatus(d);}
    }catch(e){setLastError("Error de red: "+e.message);}
    setSyncing(false);
  };

  const togglePausa=async()=>{
    if(!configured){alert("Falta configurar URL y secret del Apps Script.");return;}
    const nuevoEstado=!paused;
    const msg=nuevoEstado?"¿PAUSAR la escritura automática de fichadas al sheet?\n\nEl trigger cada 5 min sigue corriendo pero no vuelca nada mientras esté pausado.":"¿REACTIVAR la escritura automática?";
    if(!confirm(msg))return;
    setToggling(true);setLastError(null);
    try{
      const action=nuevoEstado?"coPause":"coResume";
      const r=await fetch(url+"?action="+action+"&secret="+encodeURIComponent(secret));
      const d=await r.json();
      if(d.error){
        if(d.error==="unknown action")setLastError("El Apps Script del sheet no tiene los endpoints coPause/coResume implementados. Actualizá el código del Apps Script.");
        else setLastError("Error: "+d.error);
      }
      else{setPaused(nuevoEstado);}
    }catch(e){setLastError("Error de red: "+e.message);}
    setToggling(false);
  };

  const fmtStatus=(s)=>{
    if(!s||!s.terminado)return null;
    const cuando=new Date(s.terminado).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    if(s.primera_corrida)return `${cuando} · primera corrida (punto de partida fijado, sin histórico)`;
    return `${cuando} · ${s.filas_appendeadas||0} filas nuevas · ${s.sesiones_procesadas||0} sesiones / ${s.manuales_procesados||0} manuales procesados${s.errores?` · ${s.errores} errores`:""}`;
  };

  return <div style={{marginTop:28,padding:"20px 24px",background:"rgba(139,92,246,.06)",border:"1px solid rgba(139,92,246,.3)",borderRadius:8}}>
    <div style={{fontFamily:"var(--fh)",fontSize:15,fontWeight:800,color:"#A78BFA",textTransform:"uppercase",marginBottom:6}}>Sincronización con Google Sheet</div>
    <div style={{fontSize:13,color:"var(--tx2)",marginBottom:14}}>
      El Apps Script en el sheet exporta las fichadas cada 5 min en automático. Acá podés forzar una sincronización, abrir la planilla, pausar/reactivar la escritura automática o configurar la conexión.
    </div>
    {!configured&&<div style={{padding:"9px 14px",marginBottom:12,background:"rgba(245,158,11,.1)",border:"1px solid rgba(245,158,11,.3)",borderRadius:4,fontSize:13,color:"var(--acc)"}}>
      ⚠️ Falta configurar URL y secret. Tocá "Configurar conexión" abajo.
    </div>}
    {paused&&<div style={{padding:"9px 14px",marginBottom:12,background:"rgba(251,191,36,.12)",border:"1px solid rgba(251,191,36,.4)",borderRadius:4,fontSize:13,color:"#FBBF24",fontWeight:700}}>
      ⏸️ ESCRITURA PAUSADA — el trigger sigue corriendo pero no vuelca fichadas al sheet.
    </div>}
    {lastStatus&&<div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginBottom:10}}>
      Última corrida: <strong style={{color:"var(--tx)"}}>{fmtStatus(lastStatus)}</strong>
    </div>}
    {lastError&&<div className="err" style={{marginBottom:10}}>{lastError}</div>}
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <button onClick={syncNow} disabled={!configured||syncing||paused} style={{background:configured&&!paused?"rgba(139,92,246,.2)":"var(--s2)",border:"2px solid "+(configured&&!paused?"#A78BFA":"var(--bd)"),color:configured&&!paused?"#A78BFA":"var(--tx2)",borderRadius:5,padding:"10px 22px",fontFamily:"var(--fh)",fontSize:15,fontWeight:700,textTransform:"uppercase",cursor:configured&&!syncing&&!paused?"pointer":"not-allowed",opacity:configured&&!syncing&&!paused?1:.5}}>
        {syncing?"Sincronizando...":"Volcar fichadas al sheet ahora"}
      </button>
      {sheetUrl&&<a href={sheetUrl} target="_blank" rel="noopener" style={{background:"rgba(16,185,129,.12)",border:"2px solid #10B981",color:"#10B981",borderRadius:5,padding:"10px 18px",fontFamily:"var(--fh)",fontSize:14,fontWeight:700,textTransform:"uppercase",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:6}}>
        📄 Abrir planilla
      </a>}
      {configured&&<button onClick={togglePausa} disabled={toggling} style={{background:paused?"rgba(16,185,129,.14)":"rgba(251,191,36,.14)",border:"2px solid "+(paused?"#10B981":"#FBBF24"),color:paused?"#10B981":"#FBBF24",borderRadius:5,padding:"10px 18px",fontFamily:"var(--fh)",fontSize:14,fontWeight:700,textTransform:"uppercase",cursor:toggling?"wait":"pointer",opacity:toggling?.5:1}}>
        {toggling?"...":(paused?"▶️ Reactivar":"⏸️ Pausar")}
      </button>}
      <button onClick={()=>{setShowConfig(s=>!s);setUrlDraft(url);setSecretDraft(secret);setSheetDraft(sheetUrl);}} className="bcanc">
        {showConfig?"Cerrar":"Configurar conexión"}
      </button>
    </div>
    {showConfig&&<div style={{marginTop:14,padding:14,background:"var(--s2)",borderRadius:6,border:"1px solid var(--bd)"}}>
      <div className="f">
        <label>URL del Apps Script (web app)</label>
        <input value={urlDraft} onChange={e=>setUrlDraft(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"/>
      </div>
      <div className="f">
        <label>Secret</label>
        <input type="password" value={secretDraft} onChange={e=>setSecretDraft(e.target.value)} placeholder="el valor de CO_API_SECRET"/>
      </div>
      <div className="f">
        <label>URL de la planilla (para abrir el sheet directo)</label>
        <input value={sheetDraft} onChange={e=>setSheetDraft(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/.../edit"/>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button className="bp" onClick={saveConfig} style={{flex:1}}>Guardar</button>
        <button className="bcanc" onClick={()=>setShowConfig(false)}>Cancelar</button>
      </div>
      <div style={{fontSize:11,color:"var(--tx2)",marginTop:10,fontFamily:"var(--fm)"}}>Se guardan solo en este navegador (localStorage). En cada tablet/compu que entre como admin hay que configurarlo una vez.</div>
    </div>}
  </div>;
}

function ConteoViandasChaletAddModal({user,proyectoId,existentes,onClose,onAdded}){
  const[search,setSearch]=useState("");
  const[personas,setPersonas]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(null);
  useEffect(()=>{
    db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc",lim:5000}).then(({data})=>{if(data)setPersonas(data);setLoading(false);});
  },[]);
  const existSet=new Set(existentes.map(e=>e.persona_id));
  const filtered=personas.filter(p=>!existSet.has(p.id)).filter(p=>!search||`${p.nombre} ${p.apellido} ${p.dni} ${p.empresa||""}`.toLowerCase().includes(search.toLowerCase()));
  const add=async(persona)=>{
    setSaving(persona.id);
    const todayStr=today();
    const{ok}=await db.ins("comidas_diarias",{
      proyecto_id:proyectoId,persona_id:persona.id,fecha:todayStr,
      tipo:"almuerzo",ubicacion:"chalet",come:true,fuente:"manual",
      creada_por:user.id,modificada_por:user.id,
    },true,"persona_id,fecha,tipo");
    setSaving(null);
    if(!ok){alert("No se pudo agregar.");return;}
    onAdded&&onAdded();
  };
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">Agregar comensal</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div className="f"><label>Buscar persona</label><input placeholder="Nombre, apellido o DNI..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus/></div>
      {loading?<Spin/>:<div style={{maxHeight:340,overflowY:"auto",marginTop:4}}>
        {filtered.slice(0,30).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:5,marginBottom:3,cursor:saving?"wait":"pointer",opacity:saving===p.id?.5:1}} onClick={()=>!saving&&add(p)}>
          <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
          <div style={{flex:1}}><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa||"—"} · DNI {p.dni}</div></div>
          {saving===p.id&&<span style={{fontSize:11,color:"var(--tx2)"}}>agregando...</span>}
        </div>)}
        {filtered.length===0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:20,fontSize:13}}>{personas.length===0?"Sin personas":"Sin resultados o ya están en la lista"}</div>}
      </div>}
    </div>
  </div></div>;
}

    const[{data:c},pos]=await Promise.all([
      db.sel("comidas_diarias",{f:[["fecha","eq",todayStr],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],ord:"creada_at.asc",lim:1000}),
      calcPosicionesMontana(),
    ]);
    const items=c||[];
    setComidas(items);

    const pids=items.map(x=>x.persona_id);

      const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido,empresa,dni",inFilter:["id",pids]});
      const pm={};(pers||[]).forEach(p=>{pm[p.id]=p;});
      setPersonasMap(pm);

      <div style={{fontFamily:"var(--fh)",fontSize:64,fontWeight:900,color:"var(--acc)",lineHeight:1}}>{filtered.length}</div>
      <div>
        <div style={{fontFamily:"var(--fh)",fontSize:18,fontWeight:800,color:"var(--acc)",textTransform:"uppercase",letterSpacing:".05em"}}>Comensales en Chalet</div>
        <div style={{fontSize:13,color:"var(--tx2)",marginTop:2}}>{fmtD(todayStr)} · actualiza cada 15 seg</div>
      </div>
      <button onClick={()=>{
        const lines=filtered.map(c=>{const p=personasMap[c.persona_id];return p?`${p.nombre} ${p.apellido} — ${p.empresa||""}`:`(${c.persona_id})`;});
        const txt=`COMENSALES EN CHALET ${fmtD(todayStr)} — TOTAL ${filtered.length}\n\n${lines.join("\n")}`;
        navigator.clipboard.writeText(txt).catch(()=>{const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);});
      }} style={{background:"rgba(245,158,11,.15)",border:"1px solid var(--acc)",color:"var(--acc)",borderRadius:5,padding:"7px 14px",fontFamily:"var(--fh)",fontSize:13,fontWeight:700,textTransform:"uppercase",cursor:"pointer",marginLeft:"auto"}}>Copiar lista</button>
    </div>
    {empresas.length>1&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
      {empresas.map(e=>{const on=!!filterEmpresa[e];return <button key={e} onClick={()=>setFilterEmpresa(f=>({...f,[e]:!f[e]}))} style={{padding:"3px 10px",borderRadius:12,border:"1px solid",fontSize:11,fontFamily:"var(--fm)",cursor:"pointer",background:on?"var(--acc2)":"var(--s2)",color:on?"#fff":"var(--tx2)",borderColor:on?"var(--acc2)":"var(--bd)"}}>{e}</button>;})}
      {activeEmpresas.length>0&&<button className="bsm" onClick={()=>setFilterEmpresa({})} style={{fontSize:11}}>x Limpiar filtro</button>}
