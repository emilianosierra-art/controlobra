      <div className="cmd-tblw"><table>
        <thead><tr><th>Concepto</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>

          {regla2&&<tr><td>Cambios por revisiones</td>{CMD_COMIDAS.map(c=>{const v=g.tot[c.key].revision;return <td key={c.key} className={'n '+certDifCls(v)}>{certDifTxt(v)}</td>;})}</tr>}

          <tr><td>A facturar</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{g.tot[c.key].fact}</td>)}</tr>
          <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Diferencia → este certificado</td>{CMD_COMIDAS.map(c=><td key={c.key} className={'n '+certDifCls(g.tot[c.key].dif)} style={{fontSize:14}}>{certDifTxt(g.tot[c.key].dif)}</td>)}</tr>
        </tbody>
      </table></div>
      <div className="cmd-tblw" style={{marginTop:8}}><table>
        <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
        <tbody>

            <span style={{color:'var(--tx3)',fontWeight:500}}>{r.acordado} / {r.desp} → </span><span className={certDifCls(r.dif)}>{certDifTxt(r.dif)}</span>
          </td>;})}</tr>)}
        </tbody>
      </table></div>
    </div>)}
    {df&&<div className="cmd-hint">Por día: acordado / despachado → diferencia contra lo cobrado. Positivo se suma a este certificado; negativo queda a favor de la obra.</div>}
  </div>;
}
// Detalle de un certificado de la regla 3 (semana vencida: pedido vs. despachado)
function CmdCertDetalle3({cert,preview,onVolver,onGuardar,busy,showToast}){
  const d=cert.detalle,c=d.calc;

}
function CmdCertificados({user,canEdit,showToast}){
  const hoy=cmdIsoDate(new Date());
  const semAnt=cmdAddDays(certSemanaDe(hoy),-7); // a semana vencida: por defecto, la semana anterior
  const[lista,setLista]=useState(null);
  const[err,setErr]=useState(null);
  const[ver,setVer]=useState(null);
  const[preview,setPreview]=useState(null);
  const[semC,setSemC]=useState(semAnt);
  const[busy,setBusy]=useState(false);
  const load=async()=>{
    const{data}=await db.sel("viandas_certificados",{ord:"semana.desc",lim:200});
    if(data===null){setErr('No se pudo leer el historial de certificados. Si es la primera vez, falta crear la tabla viandas_certificados en Supabase.');setLista([]);return;}
    setErr(null);setLista(data);
  };
  useEffect(()=>{load();},[]);
  const existente=(lista||[]).find(x=>x.semana===semC);
  // Regla 3: certifica la semana completa (sáb→vie): pedido = última foto con correcciones a mano, contra lo despachado.
  const calcular=async()=>{
    const semana=semC,hasta=cmdAddDays(semana,6);
    setBusy(true);
    const[f,aj,de]=await Promise.all([certFetchFoto(semana),certFetchAjustes(semana,hasta),certFetchDesp(semana,hasta)]);
    setBusy(false);
    if(!f||aj===null||de===null){alert('No se pudieron leer los datos. ¿Ya se crearon las tablas en Supabase?');return;}
    const foto=f.foto;
    if(!foto||foto.estado!=='confirmada'){alert('Falta '+(foto?'confirmar':'sacar')+' el pedido de la '+certLblSemN(semana)+'.\n\nHacelo desde "📦 Pedido semanal".');return;}
    const avisos=[];
    const revsConf=certRevs(foto).filter(r=>r.estado==='confirmada').sort((a,b)=>a.n-b.n);
    const pedido={dias:{},rev:{},ed:{},foto:{confirmada_at:foto.confirmada_at||null,confirmada_por:foto.confirmada_por_nombre||null},
      revs:revsConf.map(r=>({n:r.n,desde:r.desde,desdeC:r.desdeC||null,tomada_at:r.tomada_at||null,confirmada_at:r.confirmada_at||null,por:r.tomada_por_nombre||r.confirmada_por_nombre||null}))};
    certDias(semana).forEach(iso=>{const v=certVigente(foto,iso);pedido.dias[iso]={prog:v.prog,pedido:v.pedido};if(v.rev)pedido.rev[iso]=v.rev;if(v.ed)pedido.ed[iso]=v.ed;});
    const calc=certCalcSemana3(iso=>pedido.dias[iso],aj,de,semana);
    if(hasta>=hoy)avisos.push('La '+certLblSemN(semana)+' todavía no terminó (termina el vie '+cmdFmtDate(hasta).slice(0,5)+'): lo despachado puede cambiar.');
    const sinD=calc.sinDesp.filter(iso=>iso<=hoy);
    if(sinD.length)avisos.push('No hay despachos registrados en la app el '+sinD.map(certLblDia).join(', ')+': esos días se facturan por lo pedido.');
    const total={};CMD_COMIDAS.forEach(m=>{total[m.key]=calc.tot[m.key].fact;});
    setPreview({semana,fecha:hoy,detalle:{regla:3,semana,num:certNumSem(semana),pedido,calc,total,avisos},generado_por_nombre:certNombre(user)});
  };
  const guardar=async()=>{
    const p=preview,ya=(lista||[]).find(x=>x.semana===p.semana);
    if(ya&&!confirm(ya.detalle&&ya.detalle.regla===3
      ?'Ya hay un certificado guardado de la '+certLblSemN(p.semana)+'. ¿Reemplazarlo por este?'
      :'Ya hay un certificado de esa semana hecho con la regla anterior (el del mié '+cmdFmtDate(ya.fecha)+'). Si lo reemplazás, se pierde. ¿Reemplazarlo?'))return;
    const row={semana:p.semana,fecha:p.fecha,detalle:p.detalle,generado_por:user.id,generado_por_nombre:certNombre(user),generado_at:new Date().toISOString()};
    setBusy(true);const{ok}=await db.ins("viandas_certificados",row,true,"semana");setBusy(false);
    if(!ok){alert('No se pudo guardar el certificado. ¿Ya se creó la tabla viandas_certificados en Supabase?');return;}
    showToast({msg:'🧾 Certificado guardado'});setPreview(null);setVer(row);load();
  };
  const Det=(props)=>props.cert.detalle&&props.cert.detalle.regla===3?<CmdCertDetalle3 {...props}/>:<CmdCertDetalle {...props}/>;
  if(preview)return <Det cert={preview} preview busy={busy} onVolver={()=>setPreview(null)} onGuardar={guardar} showToast={showToast}/>;
  if(ver)return <Det cert={ver} onVolver={()=>setVer(null)} showToast={showToast}/>;
  return <div>
    {canEdit&&<div className="cmd-rep">
      <h3>🧾 Certificar una semana</h3>
      <div className="cmd-wk" style={{marginBottom:8}}>
        <button className="nav" onClick={()=>setSemC(cmdAddDays(semC,-7))} title="Semana anterior">◀</button>
        <div>
          <div className="ttl">Semana {certNumSem(semC)} · {certLblSemana(semC)}</div>
          <div className="sub">{semC===semAnt?'semana anterior (la que corresponde certificar ahora)':(semC>semAnt?'semana en curso o futura: todavía no terminó':'semana pasada')}</div>
        </div>
        <button className="nav" onClick={()=>setSemC(cmdAddDays(semC,7))} title="Semana siguiente">▶</button>
        {semC!==semAnt&&<button className="cmd-btn" onClick={()=>setSemC(semAnt)}>Semana anterior</button>}
        <button className="cmd-btn pri" style={{marginLeft:'auto'}} disabled={busy} onClick={calcular}>{busy?'Calculando…':'Calcular'}</button>
      </div>
      {existente&&<div className="cmd-aviso" style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>{existente.detalle&&existente.detalle.regla===3?'Esta semana ya tiene certificado guardado ('+fmtTs(existente.generado_at)+').':'Esta semana tiene un certificado de la regla anterior (el del mié '+cmdFmtDate(existente.fecha)+'). Si calculás y guardás uno nuevo, lo reemplaza.'}<button className="cmd-btn" onClick={()=>setVer(existente)}>Ver</button></div>}
      <div className="cmd-hint">Lagunas factura a semana vencida: en la semana N+1 se certifica la semana N completa (sábado a viernes), cruzando lo pedido (la última foto, con las correcciones a mano) con lo despachado. Desayuno: se factura {CERT3_REGLA.desayuno}. Almuerzo: {CERT3_REGLA.almuerzo}. Merienda: {CERT3_REGLA.merienda}. Cena: {CERT3_REGLA.cena}. Se calcula, lo revisás y recién ahí lo guardás.</div>
    </div>}
    <div className="cmd-rep">
      <h3>Historial de certificados</h3>
      {err&&<div className="cmd-aviso">{err}</div>}
      {lista===null?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Cargando…</div>:
       (lista.length===0?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Todavía no hay certificados guardados.</div>:
       <div className="cmd-clist">{lista.map(c=>{const r3=c.detalle&&c.detalle.regla===3;return <button key={c.semana} className="cmd-citem" onClick={()=>setVer(c)}>
         <strong>{r3?'Semana '+certNumSem(c.semana):'Mié '+cmdFmtDate(c.fecha)}</strong>
         <span style={{fontSize:12,color:'var(--tx2)'}}>{r3?certLblSemana(c.semana):'pedido '+certLblSemana(c.semana)+' · regla anterior'}</span>
         <span style={{fontFamily:'var(--fm)',fontSize:12,marginLeft:'auto'}}>{CMD_COMIDAS.map(x=>x.em+' '+((c.detalle&&c.detalle.total&&c.detalle.total[x.key])||0)).join('   ')}</span>
       </button>;})}</div>)}
    </div>
  </div>;
}

// ─── Componente Comedor (wrapper del módulo entero) — Fase B: Supabase ─────
function Comedor({user,proyectoId}){
  const isAdmin=user.rol==='admin';              // admin general de ControlObra
  const isAdminViandas=user.rol==='admin_viandas'; // admin del módulo Viandas (puede editar dieta + simular puesto en Escanear)
  const canEditDieta=isAdmin||isAdminViandas;
  // Puesto simulado para admin_viandas — arranca en null hasta que elija
  const[simuladoPuesto,setSimuladoPuesto]=useState(null);
  const userPuestoBase=cmdPuestoFromRol(user.rol);
  // userPuesto: para cocineros el que viene del rol; para admin general null (no escanea); para admin_viandas el que eligió simular
  const userPuesto=isAdmin?null:(isAdminViandas?simuladoPuesto:userPuestoBase);
  const puedeEscanear=(!isAdmin);  // cocineros y admin_viandas pueden ver Escanear
  const verPedidos=isAdmin||isAdminViandas; // Pedido semanal + Certificados: admin edita, Lagunas (admin_viandas) solo mira
  const[subtab,setSubtab]=useState(isAdmin?'listado':'scan');
  const[resInicio,setResInicio]=useState(null); // Reporte: fecha "desde" del resumen de 7 días (null = últimos 7 hasta hoy)
  const[fecha,setFecha]=useState(()=>cmdIsoDate(new Date()));
  const[personasRadar,setPersonasRadar]=useState([]); // listado del día según el Radar
  const[agregados,setAgregados]=useState({});         // dni → fila de viandas_agregados (no listados / comidas no programadas)
  const personasDia=useMemo(()=>cmdMergeAgregados(personasRadar,agregados),[personasRadar,agregados]);
  const[agregando,setAgregando]=useState(null);       // DNI inicial del modal "Agregar persona" (null = cerrado)
  const[despachosDia,setDespachosDia]=useState([]);
  const[dieta,setDieta]=useState({});
  const[chaletSet,setChaletSet]=useState(new Set()); // DNIs de personas que comen en chalet hoy
  const[platos,setPlatos]=useState({}); // dni → entregado_at (plato/tarjeta, fijo por persona)
  const[loading,setLoading]=useState(true);
  const[prefix,setPrefix]=useState(()=>new Set());
  const[picked,setPicked]=useState(null);
  const[toast,setToast]=useState(null);
  const[dietaEditing,setDietaEditing]=useState(null);
  const showToast=(o)=>{setToast(o);setTimeout(()=>setToast(null),o.dur||2200);};

  // Cargar personas del día + despachos del día + dieta + come_chalet + platos (todo desde Supabase)
  const loadAll=async()=>{
    const[p,d,di,ch,pl,ag]=await Promise.all([
      cmdFetchPersonasFecha(fecha),
      cmdFetchDespachos(fecha),
      cmdFetchDieta(),
      cmdFetchComeChalet(fecha),
      cmdFetchPlatos(),
      cmdFetchAgregados(fecha),
    ]);
    setPersonasRadar(p);setDespachosDia(d);setDieta(di);setChaletSet(ch);setPlatos(pl);setAgregados(ag);setLoading(false);
  };
  // Poll cada 3s: refresca despachos + dieta + chaletSet + platos + agregados (el calendario del día no cambia intra-día)
  const loadSync=async()=>{
    const[d,di,ch,pl,ag]=await Promise.all([cmdFetchDespachos(fecha),cmdFetchDieta(),cmdFetchComeChalet(fecha),cmdFetchPlatos(),cmdFetchAgregados(fecha)]);
    setDespachosDia(d);setDieta(di);setChaletSet(ch);setPlatos(pl);setAgregados(ag);
  };
  useEffect(()=>{setLoading(true);loadAll();},[fecha]);
  useEffect(()=>{const i=setInterval(loadSync,3000);return()=>clearInterval(i);},[fecha]);

  // repetir=true solo aplica a almuerzo y cena (se puede entregar más de un plato por persona por día, con aviso)
  const addDespacho=async(persona,comida,repetir=false)=>{
    const puedeRepetir=repetir&&cmdRepetible(comida);
    // Idempotencia: chequeo local + unique index en DB (fecha,dni,comida) para desayuno y merienda
    if(!puedeRepetir&&despachosDia.some(d=>d.dni===persona.dni&&d.comida===comida))return;
    const record={fecha,dni:persona.dni,comida,puesto:userPuesto||'ADMIN',operador_id:user.id,operador_email:user.email||null};
    const{data,ok}=await db.ins("viandas_despachos",record);
    if(!ok){showToast({msg:puedeRepetir?'No se pudo registrar el plato repetido (¿falta el cambio del índice en Supabase?)':'No se pudo despachar (¿ya despachado por el otro puesto?)',err:true});await loadSync();return;}
    const c=CMD_COMIDAS.find(x=>x.key===comida);
    showToast({msg:`${c.em} ${c.label}${puedeRepetir?' (repetida)':''} → ${persona.nombre} ${persona.apellido}`});
    // Optimista: agrega local ya, próximo poll confirma
    if(data&&data[0])setDespachosDia(prev=>[...prev,{id:data[0].id,personaId:data[0].dni,dni:data[0].dni,comida:data[0].comida,puesto:data[0].puesto,operador:data[0].operador_email,ts:data[0].ts,fecha:data[0].fecha}]);
  };
  const removeDespacho=async(id)=>{
    const des=despachosDia.find(x=>x.id===id);
    await db.del("viandas_despachos",[["id","eq",id]]);
    setDespachosDia(prev=>prev.filter(x=>x.id!==id));
    showToast({msg:'Despacho deshecho',dur:1500});
    // Si era una comida agregada y no le queda ningún otro despacho de esa comida, se saca del agregado
    // (y si no le queda ninguna comida agregada, se borra el registro: fue un error de carga).
    const a=des&&agregados[des.dni];
    if(!a||!(a.comidas||[]).includes(des.comida))return;
    if(despachosDia.some(x=>x.id!==id&&x.dni===des.dni&&x.comida===des.comida))return;
    const rest=(a.comidas||[]).filter(k=>k!==des.comida);
    if(rest.length){
      await db.upd("viandas_agregados",{comidas:rest},[["fecha","eq",fecha],["dni","eq",des.dni]]);
      setAgregados(m=>({...m,[des.dni]:{...a,comidas:rest}}));
    }else{
      await db.del("viandas_agregados",[["fecha","eq",fecha],["dni","eq",des.dni]]);
      setAgregados(m=>{const n={...m};delete n[des.dni];return n;});
    }
  };
  // Entregar a alguien que no está en el listado, o una comida que no tenía programada: se registra en
  // viandas_agregados (quién, cuándo, en qué puesto, motivo) y se despacha.
  const agregarYDespachar=async(p,comidasSel,motivo)=>{
    const prev=agregados[p.dni];
    const comidas=CMD_COMIDAS.map(c=>c.key).filter(k=>comidasSel.includes(k)||(prev&&(prev.comidas||[]).includes(k)));
    const row={fecha,dni:p.dni,nombre:p.nombre||null,apellido:p.apellido||null,empresa:p.empresa||null,comidas,
      motivo:motivo||(prev&&prev.motivo)||null,
      puesto:prev?prev.puesto:(userPuesto||'ADMIN'),
      agregado_por:prev?prev.agregado_por:user.id,
      agregado_por_email:prev?prev.agregado_por_email:(user.email||null),
      agregado_at:prev?prev.agregado_at:new Date().toISOString()};
    const{ok}=await db.ins("viandas_agregados",row,true,"fecha,dni");
    if(!ok){showToast({msg:'No se pudo registrar el agregado (¿falta crear la tabla viandas_agregados en Supabase?)',err:true,dur:4000});return false;}
    setAgregados(m=>({...m,[p.dni]:row}));
    for(const k of comidasSel)await addDespacho(p,k);
    return true;
  };
  const agregarComida=async(persona,ckey)=>{
    const c=CMD_COMIDAS.find(x=>x.key===ckey);
    if(!confirm('⚠️ '+persona.nombre+' '+persona.apellido+' NO tiene '+c.label.toLowerCase()+' programad'+(ckey==='cena'||ckey==='merienda'?'a':'o')+' hoy en el Radar.\n\n¿Entregar igual?\nQueda registrado como agregado (quién, cuándo y en qué puesto).'))return;
    await agregarYDespachar(persona,[ckey],null);
  };
  const confirmarAgregado=async(p,comidasSel,motivo)=>{
    const ok=await agregarYDespachar(p,comidasSel,motivo);
    if(!ok)return;
    setAgregando(null);
    if(subtab==='scan')setPicked({...p,id:p.dni,comidas:comidasSel});
  };
  const saveDieta=async(dni,val)=>{
    // val = {nota,hasta}; upsert por dni (PK)
    const{ok}=await db.ins("viandas_dieta",{dni,nota:val.nota||'',hasta:val.hasta||null,actualizado_por:user.id,actualizado_at:new Date().toISOString()},true,"dni");
    if(!ok){showToast({msg:'No se pudo guardar la dieta',err:true});return;}
    setDieta(prev=>({...prev,[dni]:{nota:val.nota||'',hasta:val.hasta||null}}));
    showToast({msg:'🥗 Dieta guardada'});setDietaEditing(null);
  };
  const quitDieta=async(dni)=>{
    if(!confirm('¿Quitar menú dieta para DNI '+dni+'?'))return;
    await db.del("viandas_dieta",[["dni","eq",dni]]);
    setDieta(prev=>{const n={...prev};delete n[dni];return n;});
    showToast({msg:'Dieta quitada'});setDietaEditing(null);
  };
  // Plato/tarjeta: cualquier usuario del comedor lo marca; quitarlo (por error) solo admin / admin_viandas.
  const togglePlato=async(persona)=>{
    const nom=persona.nombre+' '+persona.apellido;
    if(platos[persona.dni]){
      if(!canEditDieta){alert('Esta persona ya tiene plato/tarjeta registrado.\n\nSi fue un error, pedile a un admin de viandas que lo quite.');return;}
      if(!confirm('¿Quitar el registro de plato/tarjeta de '+nom+'?'))return;
      await db.del("viandas_plato",[["dni","eq",persona.dni]]);
      setPlatos(prev=>{const n={...prev};delete n[persona.dni];return n;});
      showToast({msg:'Plato/tarjeta quitado'});
      return;
    }
    if(!confirm('¿Confirmás que '+nom+' recibió plato/tarjeta?\n\nQueda registrado de acá en adelante.'))return;
    const{ok}=await db.ins("viandas_plato",{dni:persona.dni,entregado_por:user.id,puesto:userPuesto||'ADMIN',entregado_at:new Date().toISOString()},true,"dni");
    if(!ok){showToast({msg:'No se pudo registrar el plato/tarjeta (¿falta la tabla en Supabase?)',err:true});return;}
    setPlatos(prev=>({...prev,[persona.dni]:new Date().toISOString()}));
    showToast({msg:'🍽 Plato/tarjeta registrado → '+nom});
  };
  const verDia=(f)=>{setFecha(f);setSubtab('listado');};
  const togglePref=(k)=>setPrefix(prev=>{const n=new Set(prev);if(n.has(k))n.delete(k);else n.add(k);return n;});
  // Rev126: el contador de arriba es por PERSONAS (retiraron / tienen la comida), igual que "Pendientes". Antes mostraba
  // viandas entregadas sobre personas y no cerraba (ej. 23/10: 175/184 con 13 pendientes = 171 personas + 4 almuerzos
  // repetidos). Las viandas entregadas (con repetidas) se muestran aparte.
  const stats=useMemo(()=>{
    const t={},r={},v={},rep={},fuera={};
    CMD_COMIDAS.forEach(c=>{
      const conComida=personasDia.filter(p=>p.comidas.includes(c.key));
      const ds=despachosDia.filter(x=>x.comida===c.key);
      const dnis=new Set(ds.map(x=>normDni(x.dni)));
      t[c.key]=conComida.length;
      r[c.key]=conComida.filter(p=>dnis.has(normDni(p.dni))).length;
      v[c.key]=ds.length;
      rep[c.key]=ds.length-dnis.size;
      fuera[c.key]=dnis.size-r[c.key];
    });
    return{t,r,v,rep,fuera};
  },[personasDia,despachosDia]);
  // Días pasados: solo lectura, salvo que se habilite la "carga atrasada" para esa fecha (para pasar lo que se
  // anotó en papel cuando no hubo sistema o luz). Se habilita por fecha: al cambiar de día vuelve a quedar bloqueado.
  const hoyIso=cmdIsoDate(new Date());
  const esPasado=fecha<hoyIso;
  const[atrasoFecha,setAtrasoFecha]=useState(null);
  const isReadOnly=esPasado&&atrasoFecha!==fecha;
  const puedeCargarAtrasado=!!userPuesto||isAdmin;
  const habilitarAtraso=async()=>{
    // Si las diferencias de esa semana ya se certificaron, lo que se cargue no va a figurar en ese certificado
    const{data}=await db.sel("viandas_certificados",{cols:"semana,fecha",f:[["semana","eq",cmdAddDays(certSemanaDe(fecha),7)]]});
    const yaCert=data&&data[0];
    if(!confirm('✏️ CARGA ATRASADA — '+cmdFmtDate(fecha)+'\n\nUsala solo para pasar los despachos que se anotaron en papel cuando no hubo sistema o luz. Cada despacho queda con fecha '+cmdFmtDate(fecha)+' (y la hora real en que lo cargás).'
      +(yaCert?'\n\n⚠️ Las diferencias de esa semana ya se certificaron el mié '+cmdFmtDate(yaCert.fecha)+'. Lo que cargues ahora no va a figurar en ese certificado: avisale a un admin para que lo vuelva a generar.':'')
      +'\n\n¿Habilitar la carga para ese día?'))return;
    setAtrasoFecha(fecha);
  };
  const terminarAtraso=()=>{setAtrasoFecha(null);setFecha(hoyIso);};
  const onPickFromList=(p)=>{setPicked(p);setSubtab('scan');};
  useEffect(()=>{if(isAdmin&&subtab==='scan')setSubtab('listado');},[isAdmin]);

  // Chip del topbar: para admin_viandas sin puesto elegido decimos "🛡️ ADMIN COCINA"
  const chipLabel=userPuesto
    ?('🍽️ '+userPuesto+(isAdminViandas?' (simulado)':''))
    :(isAdminViandas?'🛡️ ADMIN COCINA':'🛡️ ADMIN VIANDAS');

  return <div className="cmd-root">
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
      <span className={'cmd-puestochip '+cmdPuestoClass(userPuesto||'ADMIN')}>{chipLabel}</span>
      {isAdminViandas&&userPuesto&&<button onClick={()=>{setSimuladoPuesto(null);setSubtab('scan');}} style={{background:'none',border:'1px solid var(--bd)',color:'var(--tx2)',padding:'3px 8px',borderRadius:4,fontSize:11,cursor:'pointer'}} title="Cambiar el puesto que estás simulando">↻ Cambiar puesto</button>}
      <RadarSyncBtn user={user} onDone={loadAll}/>
      <span style={{fontSize:10,color:'var(--tx3)',textTransform:'uppercase',letterSpacing:.3}}>{loading?'⏳ cargando…':'☁️ conectado a Supabase · sync cada 3s'}</span>
    </div>
    <div className="cmd-stats">
      {CMD_COMIDAS.map(c=>(
        <div key={c.key} className="cmd-stat">
          <span className="icon">{c.em}</span>
          <span className="num" title={stats.r[c.key]+' de '+stats.t[c.key]+' personas ya retiraron ('+(stats.t[c.key]-stats.r[c.key])+' pendientes) · '+stats.v[c.key]+' viandas entregadas'+(stats.rep[c.key]?' · '+stats.rep[c.key]+' repetida'+(stats.rep[c.key]===1?'':'s'):'')+(stats.fuera[c.key]?' · '+stats.fuera[c.key]+' a gente sin esa comida en la lista':'')}>{stats.r[c.key]}<span className="den">/{stats.t[c.key]}</span></span>
          <span className="lbl">{c.short}</span>
          {stats.v[c.key]!==stats.r[c.key]&&<span style={{fontSize:10,color:'var(--tx3)',fontFamily:'var(--fm)'}}>· {stats.v[c.key]} viandas{stats.rep[c.key]?' (+'+stats.rep[c.key]+' rep.)':''}</span>}
        </div>
      ))}
      <div style={{marginLeft:'auto',fontSize:10,color:'var(--tx3)',whiteSpace:'nowrap'}}>Fecha: <strong style={{color:'var(--tx2)'}}>{cmdFmtDate(fecha)}</strong></div>
    </div>
    {esPasado&&(isReadOnly
      ?<div className="cmd-atraso ro">
        <span className="t">📖 Estás viendo el {cmdFmtDate(fecha)}: día pasado, solo lectura.</span>
        {puedeCargarAtrasado&&<button className="cmd-btn pri" onClick={habilitarAtraso}>✏️ Cargar despachos atrasados</button>}
        <button className="cmd-btn" onClick={()=>setFecha(hoyIso)}>← Volver a hoy</button>
      </div>
      :<div className="cmd-atraso on">
        <span className="t">✏️ Carga atrasada · despachos del {cmdFmtDate(fecha)}</span>
        <button className="cmd-btn ok" onClick={terminarAtraso}>✓ Terminar y volver a hoy</button>
      </div>)}
    <div className="cmd-tabs">
      {puedeEscanear&&<button className={'cmd-tab '+(subtab==='scan'?'active':'')} onClick={()=>setSubtab('scan')}>📷 Escanear</button>}
      <button className={'cmd-tab '+(subtab==='listado'?'active':'')} onClick={()=>setSubtab('listado')}>📋 Listado</button>
      <button className={'cmd-tab '+(subtab==='reporte'?'active':'')} onClick={()=>setSubtab('reporte')}>📊 Reporte</button>
      {verPedidos&&<button className={'cmd-tab '+(subtab==='pedido'?'active':'')} onClick={()=>setSubtab('pedido')}>📦 Pedido semanal</button>}
      {verPedidos&&<button className={'cmd-tab '+(subtab==='cert'?'active':'')} onClick={()=>setSubtab('cert')}>🧾 Certificados</button>}
    </div>
    {loading?<div className="cmd-empty">Cargando datos del día…</div>:<>
      {subtab==='scan'&&puedeEscanear&&(
        // Admin viandas sin puesto elegido → pantalla de selección; luego pasa al escaneo real
        isAdminViandas&&!simuladoPuesto
          ?<CmdSeleccionPuesto onElegir={setSimuladoPuesto}/>
          :<CmdEscanear personas={personasDia} despachos={despachosDia} dieta={dieta} platos={platos} onTogglePlato={togglePlato} prefix={prefix} togglePref={togglePref} onDispatch={addDespacho} onUndispatch={removeDespacho} preloadPersona={picked} clearPreload={()=>setPicked(null)} fecha={fecha} isReadOnly={isReadOnly} onAgregarComida={agregarComida} onAgregarPersona={setAgregando}/>
      )}
      {subtab==='listado'&&<CmdListado personas={personasDia} despachos={despachosDia} fecha={fecha} setFecha={setFecha} dieta={dieta} chaletSet={chaletSet} platos={platos} onTogglePlato={togglePlato} isAdmin={canEditDieta} onOpenDieta={setDietaEditing} onPick={puedeEscanear?onPickFromList:null} onDispatch={addDespacho} onUndispatch={removeDespacho} canDispatch={!!userPuesto||isAdmin} isReadOnly={isReadOnly} onAgregarComida={agregarComida} onAgregarPersona={setAgregando}/>}
      {subtab==='reporte'&&<CmdReporte personas={personasDia} despachos={despachosDia} fecha={fecha} onVerDia={verDia} resInicio={resInicio} setResInicio={setResInicio} isAdmin={isAdmin}/>}
      {subtab==='pedido'&&verPedidos&&<CmdErrBoundary><CmdPedidoSemanal user={user} canEdit={isAdmin} showToast={showToast}/></CmdErrBoundary>}
      {subtab==='cert'&&verPedidos&&<CmdErrBoundary><CmdCertificados user={user} canEdit={isAdmin} showToast={showToast}/></CmdErrBoundary>}
    </>}
    {toast&&<div className={'cmd-toast '+(toast.err?'err':'')}>{toast.msg}</div>}
    {dietaEditing&&<CmdDietaModal persona={dietaEditing} currentValue={dieta[dietaEditing.dni]} fecha={fecha} onSave={(v)=>saveDieta(dietaEditing.dni,v)} onQuit={()=>quitDieta(dietaEditing.dni)} onClose={()=>setDietaEditing(null)}/>}
    {agregando!==null&&<CmdAgregarModal dniInicial={agregando} personas={personasDia} onClose={()=>setAgregando(null)} onConfirm={confirmarAgregado}/>}
  </div>;
}

// Botón "🔄 Actualizar calendario del Radar" — solo admins (general o viandas).
// Llama al web app del Apps Script del sheet Radar de Obra (endpoint doGet action=coSync).
// La URL + secret viven en obra.app_config (compartido por todos los dispositivos); el ⚙️ los edita.
function RadarSyncBtn({user,onDone}){
  const isAdminGral=user.rol==='admin';
  const isAdminVian=user.rol==='admin_viandas';
  const puede=isAdminGral||isAdminVian;
  const[syncing,setSyncing]=useState(false);
  const[msg,setMsg]=useState(null);
  if(!puede)return null;
  // Configura URL + secret y los guarda en Supabase (obra.app_config) → quedan disponibles
  // para todos los dispositivos logueados, no solo este navegador.
  const cfgURL=async()=>{
    const cur=await getRadarCfg()||{url:'',secret:''};
    const nueva=prompt('URL del web app del Apps Script del Radar de Obra:\n(la que termina en /exec)',cur.url);
    if(nueva===null)return false;
    const nuevaSec=prompt('Secret (CO_API_SECRET) del Radar de Obra:',cur.secret);
    if(nuevaSec===null)return false;
    if(!nueva.trim()||!nuevaSec.trim()){alert('La URL y el secret no pueden quedar vacíos.');return false;}
    const{ok}=await saveRadarCfg(nueva.trim(),nuevaSec.trim(),user.id);
    if(!ok){alert('Se guardó en este navegador, pero no se pudo guardar en Supabase (¿falta la tabla app_config?). Los demás dispositivos no la van a ver.');return true;}
    alert('✅ Configuración guardada para todos los dispositivos.');
    return true;
  };
  const doSync=async()=>{
    if(!await getRadarCfg()){
      if(!confirm('El sync del Radar todavía no está configurado. ¿Configurar ahora la URL y el secret del web app?'))return;
      if(!await cfgURL())return;
    }
    if(!confirm('¿Ejecutar sincronización del Radar de Obra ahora?\n\nLee del sheet las fechas de hoy + 10 días adelante y las pisa en viandas_calendario. Puede tardar 30-60 segundos.'))return;
    setSyncing(true);setMsg(null);
    const res=await runRadarSync();
    if(!res.ok)setMsg({t:'err',txt:res.msg.split('\n')[0]});
    else{
      const filas=res.stats.filas_upsertadas||0;const fechas=(res.stats.fechas||[]).length;
      setMsg({t:'ok',txt:'✅ Sync OK · '+filas+' filas en '+fechas+' fechas'});
      onDone&&onDone();  // Recarga los datos de la vista
    }
    setSyncing(false);
    setTimeout(()=>setMsg(null),5000);
  };
  return <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:8}}>
    <button onClick={doSync} disabled={syncing} style={{background:'rgba(96,165,250,.12)',border:'1px solid var(--cmd-info)',color:'var(--cmd-info)',borderRadius:4,padding:'5px 10px',fontFamily:'var(--fh)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.3,cursor:syncing?'wait':'pointer',opacity:syncing?.5:1}} title="Ejecutar el sync del Radar de Obra ahora (hoy + 10 días)">
      {syncing?'⏳ sincronizando…':'🔄 Actualizar calendario'}
    </button>
    <button onClick={cfgURL} style={{background:'none',border:'1px solid var(--bd)',color:'var(--tx3)',borderRadius:4,padding:'5px 7px',fontSize:11,cursor:'pointer'}} title="Configurar URL y secret del web app del Radar de Obra">⚙️</button>
    {msg&&<span style={{fontSize:11,color:msg.t==='err'?'var(--cmd-err)':'var(--cmd-ok)',fontWeight:600}}>{msg.txt}</span>}
  </div>;
}

// ─── PUESTO ESCANER ───────────────────────────────────────────────────────────
const F={V:"v",P:"p",C:"c",D:"d"};
function RecentSessions({puesto,onSelectSesion}){
  const[list,setList]=useState([]);
  const[personas,setPersonas]=useState({});
  const[vehiculos,setVehiculos]=useState({});
  const[regsMap,setRegsMap]=useState({});

  useEffect(()=>{
    const load=async()=>{
      const{data:ses}=await db.sel("sesiones_acceso",{f:[["puesto","eq",puesto],["cerrada_at","gte",today()+"T00:00:00"]],ord:"cerrada_at.desc",lim:6});
      if(!ses||!ses.length)return;
      setList(ses);
      const vids=[...new Set(ses.filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
      const sesIds=ses.map(s=>s.id);
      const[{data:vehs},{data:regs}]=await Promise.all([
        vids.length?db.sel("vehiculos",{cols:"id,patente,descripcion,tipo"}):{data:[]},
        db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado",inFilter:["sesion_id",sesIds]}),
      ]);
      const vm={};(vehs||[]).forEach(v=>{vm[v.id]=v;});setVehiculos(vm);
      const rm={};
      (regs||[]).filter(r=>sesIds.includes(r.sesion_id)).forEach(r=>{if(!rm[r.sesion_id])rm[r.sesion_id]=[];rm[r.sesion_id].push(r);});
      setRegsMap(rm);
      const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
      if(pids.length){const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido"});const pm={};(pers||[]).forEach(p=>{pm[p.id]=p;});setPersonas(pm);}
    };
    load();
  },[puesto]);

  if(!list.length)return null;

  const getPaxStr=(sesId)=>{
    const ok=(regsMap[sesId]||[]).filter(r=>r.resultado==="aprobado");
    if(!ok.length)return"sin pasajeros";
    const names=ok.map(r=>{const p=personas[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
    if(names.length<=2)return names.join(", ");
    return names.slice(0,2).join(", ")+" y "+(names.length-2)+" mas...";
  };

  return <>
    <div className="rt">Ultimos movimientos del dia en este puesto</div>
    {list.map(s=>{
      const veh=vehiculos[s.vehiculo_id];
      return <div key={s.id} className="sr" onClick={()=>onSelectSesion(s)}>
        <span className={`ld ld-${s.direccion==="entrada"?"in":"out"}`}>{dirVerbo(puesto,s.direccion)}</span>
        <div style={{flex:1,minWidth:0}}>
          <span style={{fontFamily:"var(--fm)",fontWeight:600,fontSize:13}}>{veh?veh.patente:(esSesionAPie(s)?"🚶 A pie":"—")}</span>
          <span style={{color:"var(--tx2)",fontSize:12,marginLeft:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{getPaxStr(s.id)}</span>
        </div>
        <span style={{color:"var(--tx2)",fontSize:11,fontFamily:"var(--fm)",flexShrink:0}}>{fmtTs(s.cerrada_at)}</span>
      </div>;
    })}
  </>;
}


// ─── (Funcionalidad offline eliminada) ───────────────────────────────────────
// La app trabaja solo online. Sin internet no se ficha: el garitero usa la hoja
// alternativa en papel. Se quitaron offlineStore, OfflineModePanel y PendingUploads
// para evitar que fichadas viejas se vuelquen a destiempo y descoordinen P2/P3.

function Puesto({user,pid}){
  const isAdmin=user.rol==="admin";
  const[adminPuesto,setAdminPuesto]=useState(null);
  const effPuesto=isAdmin?adminPuesto:user.puesto_nombre;
  const userEff={...user,puesto_nombre:effPuesto};
  const[paxSugFrom,setPaxSugFrom]=useState(null); // {puesto, timestamp}
  const[fase,setFase]=useState(F.V);
  const[dir,setDir]=useState("entrada");
  const[val,setVal]=useState("");
  const[veh,setVeh]=useState(null);
  const[pax,setPax]=useState([]);
  const[flash,setFlash]=useState(null);
  const[saving,setSaving]=useState(false);
  const[habs,setHabs]=useState([]);
  const[radarMap,setRadarMap]=useState({});
  const[radarLoaded,setRadarLoaded]=useState(null); // timestamp última carga
  const[refreshingRadar,setRefreshingRadar]=useState(false);
  const[radarMsg,setRadarMsg]=useState(null); // "✓ Radar actualizado" unos segundos después del botón
  const[showManual,setShowManual]=useState(false);
  const[detalleSes,setDetalleSes]=useState(null);
  const[refreshKey,setRefreshKey]=useState(0);
  const[cola,setCola]=useState([]); // escaneadas pausadas
  const ref=useRef();
  const[paxSnap,setPaxSnap]=useState([]);
  const[warnDupVeh,setWarnDupVeh]=useState(null); // {patente, dir} si ya figura adentro
  const[saveStatus,setSaveStatus]=useState(null); // null | "online"
  const[comidasHoy,setComidasHoy]=useState({}); // persona_id -> {id, come, ubicacion}
  const[warnSalidaComida,setWarnSalidaComida]=useState(null); // {paxNombres, dirFinal}

  const[offline,setOffline]=useState(!isOnline()); // sin conexión → banner + no permite fichar

  // Rev86: Radar del día en memoria — se usa para derivar cp_ingreso automáticamente
  // desde viandas_calendario del día. Refresh 1h automático + botón "🔄 Actualizar".
  const loadRadar=async()=>{
    if(!isOnline())return;
    try{const m=await fetchRadarDia();setRadarMap(m||{});setRadarLoaded(Date.now());}catch(e){console.warn("loadRadar:",e);}
  };
  // Rev125: quien no figura en el Radar cargado en este puesto (o figura de franco) se consulta en vivo antes de decidir
  const completarRadar=async(dnis)=>{
    if(cpForzadoActivo())return radarMap;
    const falt=dnis.filter(d=>{const x=radarDe(radarMap,d);return!x||!x.cpIngresoOk;});
    if(!falt.length)return radarMap;
    try{
      const extra=await fetchRadarDnis(falt);
      if(!Object.keys(extra).length)return radarMap;
      const m={...radarMap,...extra};setRadarMap(m);return m;
    }catch(e){return radarMap;}
  };
  // Botón "🔄 Actualizar": primero trae lo último del sheet del Radar (sync remoto, 30-60 s) y después re-lee.
  // Antes solo re-leía Supabase, así que un cambio recién hecho en el sheet no aparecía.
  const refreshRadarManual=async()=>{
    setRefreshingRadar(true);setRadarMsg(null);
    const res=await runRadarSync();
    await loadRadar();
    setRefreshingRadar(false);
    if(!res.ok){alert(res.msg);return;}
    setRadarMsg("✓ Radar actualizado");setTimeout(()=>setRadarMsg(null),8000);
  };
  useEffect(()=>{loadRadar();const i=setInterval(loadRadar,10*60*1000);return()=>clearInterval(i);},[pid]);

  useEffect(()=>{
    const loadHabs=async()=>{
      if(!isOnline()){setOffline(true);return;}
      try{
        const{data:h}=await db.sel("habilitaciones",{f:[["suspendida","eq",false]],lim:20000});
        if(h){setHabs(h);setOffline(false);}
        else setOffline(true);
      }catch(e){setOffline(true);}
    };
    loadHabs();
    // Refresco cada 5 min para que el garitero (que no refresca la página) tenga las habilitaciones al día.
    const i=setInterval(loadHabs,5*60*1000);
    // Actualizar el banner de conexión apenas cambia el estado de red del navegador.
    const upd=()=>{const off=!isOnline();setOffline(off);if(!off){loadHabs();loadRadar();}};
    window.addEventListener('online',upd);window.addEventListener('offline',upd);
    return()=>{clearInterval(i);window.removeEventListener('online',upd);window.removeEventListener('offline',upd);};
  },[pid]);
  useEffect(()=>{setTimeout(()=>ref.current&&ref.current.focus(),80);},[fase,flash]);

  // Carga las comidas de hoy (almuerzo) para alertas al fichar salida y para checkbox en escaneo
  const loadComidasHoy=async()=>{
    if(!isOnline())return;
    try{
      const{data}=await db.sel("comidas_diarias",{f:[["fecha","eq",today()],["tipo","eq","almuerzo"]],lim:2000});
      const map={};(data||[]).forEach(c=>{map[c.persona_id]=c;});
      setComidasHoy(map);
    }catch(e){console.warn("loadComidasHoy:",e);}
  };
  useEffect(()=>{loadComidasHoy();const i=setInterval(loadComidasHoy,30000);return()=>clearInterval(i);},[]);
  // "Almorzará en chalet" de una persona al fichar en P2/P3: si hoy ya se decidió (en el otro puesto, al bajar
  // o desde la solapa Chalet) se respeta esa decisión; si no hay nada, por defecto SÍ cuando sube antes de las 11.
  // info: fila de comidas_diarias recién leída (null = no tiene); undefined = usar la que está en memoria.
  const comidaDefault=(personaId,info)=>{
    const c=info!==undefined?info:comidasHoy[personaId];
    const decidido=!!(c&&c.tipo==="almuerzo"&&c.ubicacion==="chalet");
    const esMontana=effPuesto==="Puesto 2"||effPuesto==="Puesto 3";
    return{tieneComidaHoy:decidido&&!!c.come,comeArriba:decidido?!!c.come:(esMontana&&horaArg()<11)};
  };
  // Conductor = la primera persona escaneada después del vehículo. En P2 y P3 se avisa (no bloquea) si no tiene
  // S&H Manejo en Montaña vigente: cartel al escanearlo, marca en la lista y aviso antes de confirmar.
  const esMontanaP=effPuesto==="Puesto 2"||effPuesto==="Puesto 3";
  const manejoOk=(p)=>!!(p&&p.pills&&p.pills.some(x=>x.short==="MAN"&&x.color==="green"));
  const AVISO_MANEJO="⚠️ ATENCIÓN: NO HABILITADO PARA MANEJO EN MONTAÑA";
  const conductor=(esMontanaP&&veh&&!veh.data._aPie&&pax.length>0)?pax[0]:null;
  const conductorSinManejo=!!(conductor&&!manejoOk(conductor));
  const nombreDe=(p)=>p.person?`${p.person.nombre} ${p.person.apellido}`:`DNI ${p.raw}`;

  const sf=d=>{setFlash(d);setTimeout(()=>setFlash(null),(d&&d.dur)||2800);};

  const scanV=useCallback(async()=>{
    const v=val.trim().toUpperCase();if(!v)return;
    if(!isOnline()){sf({ok:false,label:"SIN CONEXIÓN",sub:"No se puede fichar",reason:"Registrá la fichada en la hoja alternativa"});setVal("");return;}
    let found=null;let freshHabs=habs;
    const[r1,r2,r3]=await Promise.all([
      db.sel("vehiculos",{f:[["patente","eq",v]],lim:1}),
      db.sel("habilitaciones",{f:[["entity_type","eq","vehiculo"]]}),
      db.sel("habilitaciones",{f:[["entity_type","eq","persona"]],lim:20000}),
    ]);
    if(r2.data===null||r3.data===null){
      // Las consultas fallaron: conexión inestable → no se ficha
      setOffline(true);
      sf({ok:false,label:"CONEXIÓN INESTABLE",sub:"No se pudo consultar la base",reason:"Registrá la fichada en la hoja alternativa"});
      setVal("");return;
    }
    setOffline(false); // la consulta funcionó → hay conexión
    if(r1.data&&r1.data[0])found=r1.data[0];
    freshHabs=[...(r2.data||[]),...(r3.data||[])];setHabs(freshHabs);
    if(!found){
      sf({ok:false,label:"VEHICULO NO REGISTRADO",sub:v,reason:"No esta en la base — se registran solo las personas"});
      found={id:null,patente:v,tipo:"Camioneta",descripcion:"No registrado",_noRegistrado:true};
    }
    // Sugerencia de pasajeros — SOLO en la pata siguiente del mismo viaje:
    //  · En P3 (vehículo subiendo): sugerir SOLO si su última sesión de montaña fue P2 + entrada.
    //  · En P2 (vehículo bajando):  sugerir SOLO si su última sesión de montaña fue P3 + salida.
    // En cualquier otro caso (P3 bajando del chalet, P2 subiendo de origen, etc.) NO se sugiere:
    // en el chalet cambia quién baja en cada vehículo, y la subida por P2 es el inicio del viaje.
    let suggestedPax=null;let suggestedFrom=null;
    if(found.id&&isOnline()&&(effPuesto==="Puesto 2"||effPuesto==="Puesto 3")){
      const todayStr=today();
      try{
        const{data:recentSes}=await db.sel("sesiones_acceso",{
          cols:"id,cerrada_at,direccion,puesto",
          f:[["vehiculo_id","eq",found.id],["cerrada_at","gte",todayStr+"T00:00:00"]],
          ord:"cerrada_at.desc",lim:10
        });
        const lastMontana=(recentSes||[]).find(s=>s.puesto==="Puesto 2"||s.puesto==="Puesto 3");
        const sugerirDesde=
          (effPuesto==="Puesto 3"&&lastMontana&&lastMontana.puesto==="Puesto 2"&&lastMontana.direccion==="entrada")?lastMontana:
          (effPuesto==="Puesto 2"&&lastMontana&&lastMontana.puesto==="Puesto 3"&&lastMontana.direccion==="salida")?lastMontana:
          null;
        if(sugerirDesde){
          const{data:regs}=await db.sel("registros_acceso",{
            cols:"persona_id,resultado,orden_escaneo",
            f:[["sesion_id","eq",sugerirDesde.id]],
            ord:"orden_escaneo.asc" // en el mismo orden en que se escanearon: el primero es el conductor
          });
          // Incluir TODOS los pasajeros de la sesión origen (aprobados Y bloqueados):
          // si alguien subió bloqueado por P2, igual tiene que sugerirse al llegar a P3.
          // El estado (ok/bloqueado) se recalcula más abajo con getHabPills para el puesto actual.
          const candidatos=(regs||[]).filter(rr=>rr.persona_id);
          if(candidatos.length){
            const pids=candidatos.map(rr=>rr.persona_id);
            // Comida de hoy leída en el momento (la decisión de P2 tiene que valer en P3, aunque la memoria
            // de este puesto tenga hasta 30 s de atraso)
            const[{data:pers},{data:cds}]=await Promise.all([
              db.sel("personas",{cols:"id,nombre,apellido,empresa,dni",inFilter:["id",pids]}),
              db.sel("comidas_diarias",{f:[["fecha","eq",todayStr],["tipo","eq","almuerzo"]],inFilter:["persona_id",pids]}),
            ]);
            const personasMap={};(pers||[]).forEach(p=>{personasMap[p.id]=p;});
            const cdMap={};(cds||[]).forEach(c=>{cdMap[c.persona_id]=c;});
            const rmV=await completarRadar((pers||[]).map(p=>p.dni));
            suggestedPax=candidatos.map(rr=>{
              const p=personasMap[rr.persona_id];
              if(!p)return null;
              const auth=getHabPills("persona",p.id,freshHabs,effPuesto,rmV,p.dni);
              // Antes los sugeridos no traían este dato y al entrar a P3 quedaban SIEMPRE anotados para almorzar
              // (aunque en P2 los hubieran destildado o subieran después de las 11).
              const cm=comidaDefault(p.id,cds?(cdMap[p.id]||null):undefined);
              return {raw:p.dni,person:p,ok:!auth.blocks,reason:auth.reason,pills:auth.pills,activeAuths:[],_sugerido:true,tieneComidaHoy:cm.tieneComidaHoy,comeArriba:cm.comeArriba};
            }).filter(Boolean);
            suggestedFrom={puesto:sugerirDesde.puesto,timestamp:sugerirDesde.cerrada_at,direccion:sugerirDesde.direccion};
          }
        }
      }catch(e){console.warn("scanV: error sugiriendo pasajeros",e);}
    }
    const r=found.id?getHabPills("vehiculo",found.id,freshHabs,effPuesto):{blocks:true,reason:"Vehiculo no registrado",pills:[]};
    setVeh({data:found,ok:!r.blocks,reason:r.reason,pills:r.pills,activeAuths:[]});setVal("");
    if(suggestedPax&&suggestedPax.length){setPax(suggestedPax);setPaxSugFrom(suggestedFrom);}
    else{setPaxSugFrom(null);}
    if(!r.blocks||found._noRegistrado)setFase(F.P);
  },[val,habs,user,effPuesto,radarMap]);

  // Rev129: lectura que no está en la base → queda "en duda" hasta que el garitero elige qué era (antes se cargaba directo
  // como "sin registrar" y, si era una lectura mala, quedaba en el conteo del predio).
  const[dudoso,setDudoso]=useState(null); // {raw, sugs:[{p,txt}], pareceDni}
  const mapaRef=useRef(null);
  const mapaPersonas=async()=>{
    if(mapaRef.current&&Date.now()-mapaRef.current.at<10*60000)return mapaRef.current.m;
    const{data}=await dbSelAll("personas",{f:[["deleted_at","is","null"]],ord:"id.asc"});
    const m=new Map();(data||[]).forEach(p=>{const k=fcNorm(p.dni);if(k)m.set(k,p);});
    if(data)mapaRef.current={at:Date.now(),m};
    return m;
  };
  // Arma la fila de una persona encontrada (habilitaciones, aviso de manejo, almuerzo arriba)
  const armarFila=(per,conductor,rm)=>{
    const rr=getHabPills("persona",per.id,habs,effPuesto,rm||radarMap,per.dni);
    // Comida de hoy + default checkbox "almorzará arriba".
    // Regla: quien sube por P2/P3 antes de las 11 AM come en chalet por default, salvo que hoy ya se haya
    // decidido otra cosa (ej. en P2 lo destildaron). El garitero puede cambiar el checkbox.
    const cd=comidaDefault(per.id);
    return{r:rr,ok:!rr.blocks,avisoManejo:conductor&&!rr.pills.some(x=>x.short==="MAN"&&x.color==="green"),item:{raw:per.dni,person:per,ok:!rr.blocks,reason:rr.reason,pills:rr.pills,activeAuths:[],tieneComidaHoy:cd.tieneComidaHoy,comeArriba:cd.comeArriba}};
  };
  const agregarElegida=async(per)=>{
    setDudoso(null);
    if(pax.some(q=>q.person&&q.person.id===per.id)){sf({ok:false,label:"DNI REPETIDO",sub:`${per.nombre} ${per.apellido}`,reason:"Ya está en la lista"});return;}
    const conductor=esMontanaP&&!!veh&&!veh.data._aPie&&pax.length===0;
    const rm=await completarRadar([per.dni]);
    const{r,ok,avisoManejo,item}=armarFila(per,conductor,rm);
    setPax(p=>[...p,item]);
    sf({ok,label:ok?"ACCESO PERMITIDO":"ACCESO DENEGADO",sub:`${per.nombre} ${per.apellido}`,detail:`DNI ${per.dni} · ${per.empresa||""}`,reason:ok?null:r.reason,aviso:avisoManejo?AVISO_MANEJO:null,dur:avisoManejo?6000:undefined});
    if(ref.current)ref.current.focus();
  };
  const registrarDudoso=()=>{
    const d=dudoso;if(!d)return;
    setDudoso(null);
    const conductor=esMontanaP&&!!veh&&!veh.data._aPie&&pax.length===0;
    setPax(p=>[...p,{raw:d.raw,person:null,ok:false,reason:"DNI no encontrado",activeAuths:[]}]);
    sf({ok:false,label:"REGISTRADO SIN ALTA",sub:d.raw,reason:"Queda en \"Para corregir\" para identificarlo después.",aviso:conductor?AVISO_MANEJO+" (conductor sin registro)":null,dur:5000});
    if(ref.current)ref.current.focus();
  };
  const scanP=useCallback(async()=>{
    const v=val.trim();if(!v)return;
    setDudoso(null);
    if(!isOnline()){sf({ok:false,label:"SIN CONEXIÓN",sub:"No se puede fichar",reason:"Registrá la fichada en la hoja alternativa"});setVal("");return;}
    if(pax.some(p=>sameDni(p.raw,v))){sf({ok:false,label:"DNI REPETIDO",sub:v,reason:"Ya fue escaneado"});setVal("");return;}
    let found=null;
    // ilike = igual sin distinguir mayúsculas (DNI de extranjeros con letras)
    const{data}=await db.sel("personas",{f:[["dni","ilike",v],["deleted_at","is","null"]],lim:1});
    if(data===null){
      // Consulta falló: conexión inestable → no se ficha
      setOffline(true);
      sf({ok:false,label:"CONEXIÓN INESTABLE",sub:"No se pudo consultar la base",reason:"Registrá la fichada en la hoja alternativa"});
      setVal("");return;
    }
    setOffline(false); // la consulta funcionó → hay conexión
    found=data&&data[0];
    const esConductor=esMontanaP&&!!veh&&!veh.data._aPie&&pax.length===0; // el primero después del vehículo es quien maneja
    const armar=armarFila;
    if(!found){
      // Rev122: el lector a veces junta dos DNIs en una sola lectura (ej. 4325675741080690 = 43256757 + 41080690).
      // Si lo leído se parte en dos DNIs de la base, se cargan las dos personas.
      const rr=fcNorm(v);
      if(rr.length>=12){
        const cands=[];for(let i=6;i<=rr.length-6;i++)cands.push(rr.slice(0,i),rr.slice(i));
        const{data:dd}=await db.sel("personas",{inFilter:["dni",[...new Set(cands)]],f:[["deleted_at","is","null"]],lim:50});
        const m=new Map();(dd||[]).forEach(x=>m.set(fcNorm(x.dni),x));
        const dos=fcPartir(rr,m);
        if(dos){
          const per=(dos[0].id===dos[1].id?[dos[0]]:dos).filter(x=>!pax.some(q=>q.person&&q.person.id===x.id));
          const rm2=await completarRadar(per.map(x=>x.dni));
          const filas=per.map((x,i)=>armar(x,esConductor&&i===0,rm2));
          if(filas.length)setPax(p=>[...p,...filas.map(f=>f.item)]);
          const neg=filas.filter(f=>!f.ok);
          sf({ok:!neg.length,label:dos[0].id===dos[1].id?"DNI LEÍDO DOS VECES":"2 DNIs LEÍDOS JUNTOS",sub:dos[0].id===dos[1].id?`${dos[0].nombre} ${dos[0].apellido}`:`${dos[0].nombre} ${dos[0].apellido} y ${dos[1].nombre} ${dos[1].apellido}`,detail:!filas.length?(dos[0].id===dos[1].id?"Ya estaba en la lista":"Ya estaban en la lista"):(dos[0].id===dos[1].id?"Se cargó una sola vez":"Se cargaron por separado: revisá la lista"),reason:neg.length?neg.map(f=>`${f.item.person.apellido}: ${f.r.reason}`).join(" · "):null,aviso:filas.some(f=>f.avisoManejo)?AVISO_MANEJO:null,dur:6000});
          setVal("");return;
        }
      }
      // Rev129: no se carga directo. Sugerencias: DNI parecido (un dígito distinto, DNI dentro de lo leído) o, si se tipeó
      // un apellido, las personas con ese apellido. "Registrar igual" solo si parece un DNI de verdad.
      const mapa=await mapaPersonas();
      const up=normDni(v),vistos=new Set(),sugs=[];
      const sumar=(p,txt)=>{if(!p||vistos.has(p.id))return;vistos.add(p.id);sugs.push({p,txt});};
      fcSugerencias(v,mapa).forEach(x=>{if(x.personas.length===1)sumar(x.personas[0],x.txt);});
      if(/[A-Z]/.test(up)&&!/\d/.test(up)&&up.replace(/[^A-Z]/g,"").length>=3){
        const t=joNorm(v).split(" ").filter(Boolean);
        [...mapa.values()].filter(p=>{const x=" "+joNorm(`${p.apellido} ${p.nombre}`)+" ";return t.every(w=>x.includes(w));}).slice(0,8).forEach(p=>sumar(p,"por nombre"));
      }
      const r0=fcNorm(v);
      const pareceDni=/^[A-Z0-9]{6,15}$/.test(r0)&&/\d/.test(r0)&&!/^[A-Z]{2,3}\d{3}[A-Z]{0,3}$/.test(r0);
      setDudoso({raw:v.toUpperCase(),sugs:sugs.slice(0,8),pareceDni});
      sf({ok:false,label:"⚠ NO ESTÁ EN LA BASE",sub:v,reason:sugs.length?"¿Era alguno de los de abajo? Si no, volvé a escanear.":"Volvé a escanear el DNI.",dur:4000});
      setVal("");return;
    }
    const rmP=await completarRadar([found.dni]);
    const{r,ok,avisoManejo,item}=armar(found,esConductor,rmP);
    const tieneComidaHoy=item.tieneComidaHoy;
    setPax(p=>[...p,item]);
    const flashExtra=tieneComidaHoy?" · 🍽 ya contado para almorzar arriba":"";
    sf({ok,label:ok?"ACCESO PERMITIDO":"ACCESO DENEGADO",sub:`${found.nombre} ${found.apellido}${flashExtra}`,detail:`DNI ${found.dni} · ${found.empresa||""}`,reason:ok?null:r.reason,aviso:avisoManejo?AVISO_MANEJO:null,dur:avisoManejo?6000:undefined});
    setVal("");
  },[val,habs,pax,user,effPuesto,comidasHoy,veh,radarMap]);

  const scan=()=>{if(fase===F.V)scanV();else if(fase===F.P)scanP();};
  const onKey=e=>{if(e.key==="Enter")scan();};

  const cerrar=async(dirFinal)=>{
    const d=dirFinal||dir;
    if(!isOnline()){
      setOffline(true);
      alert("SIN CONEXIÓN\n\nLa fichada NO se guardó. Anotá esta pasada en la hoja alternativa.");
      return;
    }
    setSaving(true);
    setPaxSnap([...pax]); // snapshot por si hay que copiar a la hoja alternativa
    setSaveStatus(null);
    const saveOnline=async()=>{
      const r1=await db.ins("sesiones_acceso",{proyecto_id:pid,puesto:effPuesto,operador_id:user.id,vehiculo_id:veh.data.id||null,vehiculo_ok:veh.ok,vehiculo_razon:veh.data._aPie?"A pie (sin vehículo)":(veh.data._noRegistrado?("No registrado: "+veh.data.patente):(veh.reason||null)),direccion:d,total_personas:pax.length,total_aprobados:pax.filter(p=>p.ok).length,total_rechazados:pax.filter(p=>!p.ok).length});
      if(!r1.ok||!r1.data||!r1.data[0])throw new Error("sesion: "+JSON.stringify(r1.data||{}).slice(0,200));
      if(pax.length>0){
        const r2=await db.ins("registros_acceso",pax.map((p,i)=>({sesion_id:r1.data[0].id,persona_id:p.person?p.person.id:null,dni_raw:p.raw,resultado:p.ok?"aprobado":"rechazado",motivo_rechazo:p.ok?null:p.reason,orden_escaneo:i+1})));
        if(!r2.ok){
          // Rollback de la sesion para no dejar registros parciales
          try{await db.del("sesiones_acceso",[["id","eq",r1.data[0].id]]);}catch(_){}
          throw new Error("registros: "+JSON.stringify(r2.data||{}).slice(0,200));
        }
      }
      return true;
    };
    const withTimeout=(promise,ms)=>Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
    let okOnline=false;
    try{
      await withTimeout(saveOnline(),8000);
      okOnline=true;
    }catch(e){
      console.warn("cerrar: no se pudo guardar:",e.message);
    }
    if(!okOnline){
      // No se pudo guardar: NO avanzamos. El garitero usa la hoja alternativa.
      // Los datos quedan en pantalla (no se limpia pax) por si quiere copiarlos.
      setOffline(true);
      setSaving(false);
      alert("NO SE PUDO GUARDAR (conexión inestable)\n\nLa fichada NO quedó registrada. Anotala en la hoja alternativa.\nLos datos siguen en pantalla por si necesitás copiarlos.");
      return;
    }
    // Guardado OK + entrada a P2/P3 antes de las 13 → upsert comidas_diarias
    if(d==="entrada"&&(effPuesto==="Puesto 2"||effPuesto==="Puesto 3")&&horaArg()<13){
      const todayStr=today();
      for(const p of pax){
        if(!p.person||!p.ok)continue;
        try{
          await db.ins("comidas_diarias",{
            proyecto_id:pid,persona_id:p.person.id,fecha:todayStr,
            tipo:"almuerzo",ubicacion:"chalet",come:p.comeArriba!==false,
            fuente:"auto",creada_por:user.id,modificada_por:user.id,
          },true,"persona_id,fecha,tipo");
        }catch(e){console.warn("upsert comidas_diarias:",e);}
      }
      loadComidasHoy();
    }
    setDir(d);setSaving(false);setSaveStatus("online");setFase(F.D);
  };
  const nueva=()=>{setFase(F.V);setVeh(null);setPax([]);setPaxSnap([]);setVal("");setFlash(null);setPaxSugFrom(null);setSaveStatus(null);setDudoso(null);setRefreshKey(k=>k+1);};
  // Rev127: gente que pasa a pie. Mismo flujo que con vehículo (escanear DNIs, ver habilitaciones, elegir sentido), sin patente.
  const aPie=()=>{setVeh({data:{id:null,patente:"A PIE",tipo:"A pie",descripcion:"Sin vehículo",_aPie:true},ok:true,reason:null,pills:[]});setPax([]);setPaxSnap([]);setPaxSugFrom(null);setFlash(null);setVal("");setSaveStatus(null);setDudoso(null);setFase(F.P);};
  const dirLabel=dirVerbo(effPuesto,dir);

  // Admin sin puesto elegido: mostrar selector
  if(isAdmin&&!adminPuesto){
    return <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontFamily:"var(--fh)",fontSize:26,fontWeight:800,letterSpacing:".05em",color:"var(--acc)",textTransform:"uppercase"}}>Simular Puesto</div>
          <div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:2}}>Elegí qué puesto querés operar</div>
        </div>
        <Clock/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14}}>
        {["Puesto 1","Puesto 2","Puesto 3"].map(p=><button key={p} onClick={()=>setAdminPuesto(p)} style={{background:"var(--s1)",border:"2px solid var(--bd)",borderRadius:8,padding:"32px 18px",fontFamily:"var(--fh)",fontSize:24,fontWeight:800,color:"var(--tx)",letterSpacing:".05em",textTransform:"uppercase",cursor:"pointer",transition:"all .15s"}} onMouseOver={e=>{e.currentTarget.style.borderColor="var(--acc)";e.currentTarget.style.color="var(--acc)";}} onMouseOut={e=>{e.currentTarget.style.borderColor="var(--bd)";e.currentTarget.style.color="var(--tx)";}}>{p}</button>)}
      </div>
      <div style={{marginTop:20,padding:"12px 16px",background:"rgba(245,158,11,.07)",border:"1px solid rgba(245,158,11,.25)",borderRadius:6,fontSize:13,color:"var(--tx2)"}}>Las fichadas se guardarán como hechas desde el puesto que elijas. Podés cambiarlo en cualquier momento.</div>
    </div>;
  }

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
      <div>
        <div style={{fontFamily:"var(--fh)",fontSize:26,fontWeight:800,letterSpacing:".05em",color:"var(--acc)",textTransform:"uppercase"}}>{effPuesto}{isAdmin&&<span style={{fontSize:11,fontWeight:600,color:"var(--tx2)",marginLeft:10,fontFamily:"var(--fm)",letterSpacing:".05em"}}>(simulando)</span>}</div>
        <div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:2}}>Control de Acceso{isAdmin&&<button onClick={()=>{nueva();setAdminPuesto(null);}} style={{background:"none",border:"none",color:"var(--acc2)",cursor:"pointer",fontSize:11,fontFamily:"var(--fm)",marginLeft:8,textDecoration:"underline",padding:0}}>cambiar puesto</button>}</div>
      </div>

        }} style={{background:"var(--s2)",border:"1px solid var(--bd)",color:"var(--tx2)",borderRadius:5,padding:"6px 14px",cursor:"pointer",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,textTransform:"uppercase",whiteSpace:"nowrap",flexShrink:0}}>Copiar</button>

      <div style={{display:"flex",gap:28,flexWrap:"wrap"}}><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Vehiculo</div><div style={{fontFamily:"var(--fm)",fontSize:20,fontWeight:600,marginTop:3}}>{veh&&veh.data.patente}</div></div><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Personas</div><div style={{fontFamily:"var(--fh)",fontSize:26,fontWeight:800,marginTop:2}}><span style={{color:"var(--gr)"}}>{(paxSnap.length?paxSnap:pax).filter(p=>p.ok).length}</span>{(paxSnap.length?paxSnap:pax).some(p=>!p.ok)&&<span style={{color:"var(--rd)",fontSize:22}}> / {(paxSnap.length?paxSnap:pax).filter(p=>!p.ok).length}x</span>}</div></div><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Tipo</div><div style={{marginTop:6}}><span className={`ld ld-${dir==="entrada"?"in":"out"}`} style={{fontSize:13}}>{dirLabel.toUpperCase()}</span></div></div></div></div>
      <button className="bnew" onClick={nueva}>+ Nuevo vehiculo</button>
      <button className="btn-manual" style={{borderColor:"var(--acc2)",color:"var(--acc2)"}} onClick={aPie}>🚶 Pasan sin vehículo (a pie): escanear DNIs</button>
    </>}
    <RecentSessions key={refreshKey} puesto={effPuesto} onSelectSesion={setDetalleSes}/>
    {warnSalidaComida&&<div className="mo"><div className="md">
      <div className="mh"><div className="mt">🍽 Contado para almorzar arriba</div><button className="mc" onClick={()=>setWarnSalidaComida(null)}>x</button></div>
      <div className="mb">
        <div style={{padding:"10px 0 12px"}}>
          <div style={{fontSize:13,color:"var(--tx2)",marginBottom:10}}>Estas personas estaban contadas para almorzar en chalet hoy. Si bajan ahora (antes de las 13:00), seguramente no comen arriba.</div>
          <div style={{padding:"10px 14px",background:"var(--s2)",borderRadius:6,marginBottom:14}}>
            {warnSalidaComida.nombres.map((n,i)=><div key={i} style={{fontWeight:500,marginBottom:3}}>· {n}</div>)}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="bp" style={{background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} onClick={async()=>{
              // Sacarlos de la lista de comensales + registrar la salida
              const todayStr=today();
              for(const pid_ of warnSalidaComida.personaIds){
                await db.upd("comidas_diarias",{come:false,modificada_por:user.id,modificada_at:new Date().toISOString()},[["persona_id","eq",pid_],["fecha","eq",todayStr],["tipo","eq","almuerzo"]]);
              }
              setWarnSalidaComida(null);
              cerrar("salida");
            }}>Sacarlos de la lista y registrar salida</button>
            <button className="bcanc" style={{color:"var(--tx)"}} onClick={()=>{setWarnSalidaComida(null);cerrar("salida");}}>Dejarlos en la lista y registrar salida</button>
            <button className="bcanc" onClick={()=>setWarnSalidaComida(null)}>Cancelar</button>
          </div>
        </div>
      </div>
    </div></div>}
    {warnDupVeh&&<div className="mo"><div className="md">
      <div className="mh"><div className="mt">⚠️ Ya figuran adentro</div><button className="mc" onClick={()=>setWarnDupVeh(null)}>x</button></div>
      <div className="mb">
        <div style={{padding:"10px 0 16px"}}>
          {warnDupVeh.dupVeh&&<div style={{marginBottom:10}}>
            <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",marginBottom:4}}>Vehículo</div>
            <div style={{fontFamily:"var(--fm)",fontSize:18,fontWeight:700}}>{warnDupVeh.dupVeh}</div>
          </div>}
          {warnDupVeh.dupPax&&warnDupVeh.dupPax.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",marginBottom:4}}>Personas</div>
            {warnDupVeh.dupPax.map(n=><div key={n} style={{fontWeight:500,marginBottom:3}}>{n}</div>)}
          </div>}
          <div style={{color:"var(--tx2)",fontSize:13,marginBottom:20}}>Según los registros de hoy ya figuran adentro. Lo más probable es que se haya tocado <strong style={{color:"var(--tx)"}}>ENTRADA</strong> por error cuando en realidad <strong style={{color:"var(--gr)"}}>están saliendo</strong>. Se registra como SALIDA.</div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="bp" style={{background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} onClick={()=>{
              setWarnDupVeh(null);
              cerrar("salida");
            }}>↻ Corregir y registrar SALIDA</button>
            <button className="bcanc" onClick={()=>setWarnDupVeh(null)}>Cancelar</button>
          </div>
          <div style={{marginTop:16,paddingTop:12,borderTop:"1px solid var(--bd)",textAlign:"center"}}>
            <button onClick={()=>{setWarnDupVeh(null);cerrar("entrada");}} style={{background:"none",border:"none",color:"var(--tx2)",cursor:"pointer",fontSize:11,fontFamily:"var(--fm)",textDecoration:"underline"}}>
              Forzar registrar como ENTRADA igual (registro duplicado a propósito)
            </button>
          </div>
        </div>
      </div>
    </div></div>}
    {showManual&&<MovimientoManual user={userEff} proyectoId={pid} onClose={()=>setShowManual(false)} onSaved={()=>setRefreshKey(k=>k+1)}/>}
    {detalleSes&&<SesionDetalle ses={detalleSes} onClose={()=>setDetalleSes(null)}/>}
  </div>;
}

// ─── TABLERO PÚBLICO ──────────────────────────────────────────────────────────
// embedTab (Rev112): la misma vista pública dentro de la app logueada (rol sobrestante), mostrando solo esa solapa
// ("chalet" / "consulta" / "movimientos"), sin la barra de arriba ni las solapas propias.
function PublicDashboard({onBack,embedTab}){
  const[tabSt,setTab]=useState("chalet");
  const tab=embedTab||tabSt;
  const[search,setSearch]=useState("");
  const[searchResult,setSearchResult]=useState(null);
  const[searching,setSearching]=useState(false);
  const[habs,setHabs]=useState([]);
  const[radarMap,setRadarMap]=useState({});
  const[movHoy,setMovHoy]=useState([]);
  const[movVehs,setMovVehs]=useState({});
  const[movPersonas,setMovPersonas]=useState({});
  const[movRegs,setMovRegs]=useState({});
  const[movLoading,setMovLoading]=useState(true);
  const[pubChalet,setPubChalet]=useState({persChalet:null,persCamino:0,persPredio:0,vehChalet:0,vehCamino:0,persListChalet:[],persListCamino:[],persListPredio:[],vehListChalet:[],vehListCamino:[]});
  const[pubShowList,setPubShowList]=useState(null);

  const loadChalet=async()=>{
    const[pos,pred]=await Promise.all([calcPosicionesMontana(),calcPersonasEnPredio()]);
    const persIdsChalet=Object.entries(pos.persona).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const persIdsCamino=Object.entries(pos.persona).filter(([_,p])=>p==="camino").map(([k])=>k);
    const vehIdsChalet=Object.entries(pos.vehiculo).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const vehIdsCamino=Object.entries(pos.vehiculo).filter(([_,p])=>p==="camino").map(([k])=>k);
    // En predio: mismo criterio que ChaletMini (quien está en camino/chalet también cuenta como dentro)
    const persIdsPredio=Array.from(pred.inSet);
    persIdsChalet.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
    persIdsCamino.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
    const isUUID=(k)=>typeof k==="string"&&k.length===36&&k.indexOf("-")>=0;
    const allPersIds=Array.from(new Set([...persIdsChalet,...persIdsCamino,...persIdsPredio])).filter(isUUID);
    const allVehIds=[...vehIdsChalet,...vehIdsCamino].filter(isUUID);
    const[{data:pers},{data:vehs}]=await Promise.all([
      allPersIds.length?db.sel("personas",{cols:"id,nombre,apellido,empresa,dni"}):{data:[]},
      allVehIds.length?db.sel("vehiculos",{cols:"id,patente,descripcion,tipo,empresa"}):{data:[]},
    ]);
    const persMap={};(pers||[]).forEach(p=>{persMap[p.id]=p;});
    const vehMap={};(vehs||[]).forEach(v=>{vehMap[v.id]=v;});
    const synthPer=(k)=>({id:k,nombre:"Sin registrar",apellido:"",dni:k,empresa:"DNI no encontrado en la base",_synth:true});
    const synthVeh=(k)=>{const pat=String(k).indexOf("No registrado:")===0?String(k).replace("No registrado:","").trim():k;return{id:k,patente:pat,descripcion:"Vehículo no registrado en la base",tipo:"Otro",empresa:"",_synth:true};};
    setPubChalet({
      persChalet:persIdsChalet.length,
      persCamino:persIdsCamino.length,
      persPredio:persIdsPredio.length,
      vehChalet:vehIdsChalet.length,
      vehCamino:vehIdsCamino.length,
      persListChalet:persIdsChalet.map(k=>persMap[k]||synthPer(k)),
      persListCamino:persIdsCamino.map(k=>persMap[k]||synthPer(k)),
      persListPredio:persIdsPredio.map(k=>persMap[k]||synthPer(k)),
      vehListChalet:vehIdsChalet.map(k=>vehMap[k]||synthVeh(k)),
      vehListCamino:vehIdsCamino.map(k=>vehMap[k]||synthVeh(k)),
    });
  };


  useEffect(()=>{
    db.sel("habilitaciones",{f:[["suspendida","eq",false]],lim:20000}).then(({data})=>{if(data)setHabs(data);});
    fetchRadarDia().then(m=>setRadarMap(m||{}));
    loadMovimientos();
    loadChalet();
    const i=setInterval(()=>{loadMovimientos();loadChalet();},15000);
    return()=>clearInterval(i);
  },[]);

  const loadMovimientos=async()=>{
    setMovLoading(true);
    const[{data:ses},{data:man}]=await Promise.all([
      db.sel("sesiones_acceso",{f:[["cerrada_at","gte",today()+"T00:00:00"]],ord:"cerrada_at.desc",lim:100}),
      db.sel("movimientos_manuales",{f:[["created_at","gte",today()+"T00:00:00"]],ord:"created_at.desc",lim:50}),
    ]);
    setMovHoy({ses:ses||[],man:man||[]});
    if(ses&&ses.length){
      const vids=[...new Set((ses||[]).filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
      const sesIds=(ses||[]).map(s=>s.id);
      const[{data:vehs},{data:regs}]=await Promise.all([
        vids.length?db.sel("vehiculos",{cols:"id,patente,tipo"}):{data:[]},
        db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado",inFilter:["sesion_id",sesIds]}),
      ]);
      const vm={};(vehs||[]).forEach(v=>{vm[v.id]=v;});setMovVehs(vm);
      const rm={};(regs||[]).filter(r=>sesIds.includes(r.sesion_id)).forEach(r=>{if(!rm[r.sesion_id])rm[r.sesion_id]=[];rm[r.sesion_id].push(r);});setMovRegs(rm);
      const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
      if(pids.length){const{data:p}=await db.sel("personas",{cols:"id,nombre,apellido"});const pm={};(p||[]).forEach(x=>{pm[x.id]=x;});setMovPersonas(pm);}
    }
    setMovLoading(false);
  };

  const buscar=async()=>{
    if(!search.trim())return;
    setSearching(true);setSearchResult(null);
    const q=search.trim();
    // Intentar como DNI
    const{data:p}=await db.sel("personas",{f:[["dni","ilike",q],["deleted_at","is","null"]],lim:1});
    const habOk=(pid,tipo)=>habs.some(h=>h.entity_type==="persona"&&h.persona_id===pid&&h.tipo===tipo&&!h.suspendida&&(!h.fecha_hasta||(h.fecha_hasta+"").slice(0,10)>=today()));
    if(p&&p[0]){
      const shOk=habOk(p[0].id,"sh_ingreso");
      const cpOk=cpForzadoActivo()||!!(radarDe(radarMap,p[0].dni)&&radarDe(radarMap,p[0].dni).cpIngresoOk);
      setSearchResult({type:"persona",data:p[0],shOk,cpOk,estado:personaEstado(p[0].id,habs,radarMap,p[0].dni)});
      setSearching(false);return;
    }
    // Intentar como nombre
    const{data:p2}=await db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc"});
    const found=(p2||[]).filter(x=>`${x.nombre} ${x.apellido}`.toLowerCase().includes(q.toLowerCase()));
    if(found.length===1){
      const shOk=habOk(found[0].id,"sh_ingreso");
      const cpOk=cpForzadoActivo()||!!(radarDe(radarMap,found[0].dni)&&radarDe(radarMap,found[0].dni).cpIngresoOk);
      setSearchResult({type:"persona",data:found[0],shOk,cpOk,estado:personaEstado(found[0].id,habs,radarMap,found[0].dni)});
    } else if(found.length>1){
      setSearchResult({type:"multiple",items:found});
    } else {
      // Intentar como patente
      const{data:v}=await db.sel("vehiculos",{f:[["patente","eq",q.toUpperCase()],["activo","eq",true]],lim:1});
      if(v&&v[0]){
        // Buscar habs del vehiculo directo en Supabase, no del cache
        const{data:vhabs}=await db.sel("habilitaciones",{f:[["entity_type","eq","vehiculo"],["vehiculo_id","eq",v[0].id]]});
        const habVOk=(tipo)=>(vhabs||[]).some(h=>h.tipo===tipo&&!h.suspendida&&(!h.fecha_hasta||(h.fecha_hasta+"").slice(0,10)>=today()));
        const shOk=habVOk("sh_ingreso");
        // Rev131: Sub. Chalet sin cargar o vigente = habilitado; solo suspendido no sube; vencido = aviso
        const hm=(vhabs||[]).find(h=>h.tipo==="sh_manejo");
        const chaletSt=!hm?"ok":hm.suspendida?"susp":(hm.fecha_hasta&&(hm.fecha_hasta+"").slice(0,10)<today())?"venc":"ok";
        setSearchResult({type:"vehiculo",data:v[0],shOk,chaletOk:chaletSt!=="susp",chaletSt});
      } else {
        setSearchResult({type:"nada"});
      }
    }
    setSearching(false);
  };

  const getPaxStr=(sesId,max=3)=>{
    const ok=(movRegs[sesId]||[]).filter(r=>r.resultado==="aprobado");
    if(!ok.length)return"sin pasajeros";
    const names=ok.map(r=>{const p=movPersonas[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
    if(names.length<=max)return names.join(", ");
    return names.slice(0,max).join(", ")+"...";
  };

  const sesList=movHoy.ses||[];
  const manList=movHoy.man||[];

  return <div className={embedTab?"":"pub-wrap"}>
    {!embedTab&&<>
    <div className="pub-bar">
      <div className="brand">CONTROL<span>OBRA</span> <span style={{fontSize:13,fontWeight:400,color:"var(--tx2)",marginLeft:6,fontFamily:"var(--fb)"}}>vista publica</span> <span style={{fontSize:10,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3}}>{APP_REV}</span></div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div className="pub-badge"><div className="pub-dot"/>EN VIVO</div>
        <button className="btn-out" onClick={onBack}>Iniciar sesion</button>
      </div>
    </div>
    <div className="pub-tabs">
      {[{k:"chalet",l:"Conteo de Personal"},{k:"consulta",l:"Habilitaciones Personal / Vehiculos"},{k:"movimientos",l:"Movimientos del dia"}].map(t=><button key={t.k} className={`pub-tab${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}>{t.l}</button>)}
    </div>
    </>}
    <div className="pub-main" style={embedTab?{padding:0,maxWidth:1100,margin:0}:undefined}>
      {tab==="chalet"&&<>
        {/* EN PREDIO — total de personas dentro (ingresaron por P1 y no salieron) */}
        <div style={{background:"linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.04))",border:"1px solid rgba(245,158,11,.4)",borderRadius:8,overflow:"hidden",marginBottom:12}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(245,158,11,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#F59E0B"}}>En predio <span style={{textTransform:"none"}}>(campamento+camino+chalet)</span> — total dentro</div>
          <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#F59E0B",lineHeight:1}}>{pubChalet.persChalet===null?"-":pubChalet.persPredio}</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#F59E0B",textTransform:"uppercase"}}>Personas</div>
              <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>Incluye a los que están en camino y en chalet</div>
            </div>
            <button style={{background:"rgba(245,158,11,.15)",border:"1px solid rgba(245,158,11,.4)",color:"#F59E0B",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persPredio")}>Ver</button>
          </div>
        </div>
        {/* CHALET */}
        <div style={{background:"linear-gradient(135deg,rgba(139,92,246,.15),rgba(59,130,246,.1))",border:"1px solid rgba(139,92,246,.35)",borderRadius:8,overflow:"hidden",marginBottom:12}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(139,92,246,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#A78BFA"}}>En Chalet — Puesto 3</div>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",borderRight:"1px solid rgba(139,92,246,.2)",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#A78BFA",lineHeight:1}}>{pubChalet.persChalet??"-"}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#A78BFA",textTransform:"uppercase"}}>Personas</div>
              </div>
              <button style={{background:"rgba(139,92,246,.15)",border:"1px solid rgba(139,92,246,.4)",color:"#A78BFA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persChalet")}>Ver</button>
            </div>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"var(--gr)",lineHeight:1}}>{pubChalet.vehChalet}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"var(--gr)",textTransform:"uppercase"}}>Vehiculos</div>
              </div>
              <button style={{background:"rgba(16,185,129,.15)",border:"1px solid rgba(16,185,129,.4)",color:"var(--gr)",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("vehChalet")}>Ver</button>
            </div>
          </div>
        </div>
        {/* CAMINO */}
        <div style={{background:"linear-gradient(135deg,rgba(59,130,246,.12),rgba(16,185,129,.07))",border:"1px solid rgba(59,130,246,.3)",borderRadius:8,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(59,130,246,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#60A5FA"}}>En Camino — P2 a P3</div>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",borderRight:"1px solid rgba(59,130,246,.2)",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{pubChalet.persCamino}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Personas</div>
              </div>
              <button style={{background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persCamino")}>Ver</button>
            </div>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{pubChalet.vehCamino}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Vehiculos</div>
              </div>
              <button style={{background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("vehCamino")}>Ver</button>
            </div>
          </div>
        </div>
        <div style={{fontSize:12,color:"var(--tx2)",marginBottom:14}}>Se actualiza cada 5 segundos</div>
        {pubShowList&&<ListaFiltrada
          items={{persPredio:pubChalet.persListPredio,persChalet:pubChalet.persListChalet,persCamino:pubChalet.persListCamino,vehChalet:pubChalet.vehListChalet,vehCamino:pubChalet.vehListCamino}[pubShowList]}
          tipo={pubShowList.startsWith("pers")?"persona":"vehiculo"}
          titulo={{persPredio:"Personas en predio (campamento+camino+chalet)",persChalet:"Personas en Chalet",persCamino:"Personas en Camino",vehChalet:"Vehiculos en Chalet",vehCamino:"Vehiculos en Camino"}[pubShowList]}
          onClose={()=>setPubShowList(null)}
        />}
      </>}
      {tab==="movimientos"&&<>
