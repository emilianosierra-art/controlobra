            }}>↻ Corregir y registrar SALIDA</button>
            <button className="bcanc" onClick={()=>setWarnDupVeh(null)}>Cancelar</button>
          </div>
          <div style={{marginTop:16,paddingTop:12,borderTop:"1px solid var(--bd)",textAlign:"center"}}>
            <button onClick={()=>{setWarnDupVeh(null);cerrar("entrada");}} style={{background:"none",border:"none",color:"var(--tx2)",cursor:"pointer",fontSize:11,fontFamily:"var(--fm)",textDecoration:"underline"}}>
              Forzar registrar como ENTRADA igual (registro duplicado a propósito)
            </button>
          </div>
        </div>
      </div>
    </div></div>}
    {showManual&&<MovimientoManual user={userEff} proyectoId={pid} onClose={()=>setShowManual(false)} onSaved={()=>setRefreshKey(k=>k+1)}/>}
    {detalleSes&&<SesionDetalle ses={detalleSes} onClose={()=>setDetalleSes(null)}/>}
  </div>;
}

// ─── TABLERO PÚBLICO ──────────────────────────────────────────────────────────
function PublicDashboard({onBack}){
  const[tab,setTab]=useState("chalet");
  const[search,setSearch]=useState("");
  const[searchResult,setSearchResult]=useState(null);
  const[searching,setSearching]=useState(false);
  const[habs,setHabs]=useState([]);
  const[radarMap,setRadarMap]=useState({});
  const[movHoy,setMovHoy]=useState([]);
  const[movVehs,setMovVehs]=useState({});
  const[movPersonas,setMovPersonas]=useState({});
  const[movRegs,setMovRegs]=useState({});
  const[movLoading,setMovLoading]=useState(true);
  const[pubChalet,setPubChalet]=useState({persChalet:null,persCamino:0,persPredio:0,vehChalet:0,vehCamino:0,persListChalet:[],persListCamino:[],persListPredio:[],vehListChalet:[],vehListCamino:[]});
  const[pubShowList,setPubShowList]=useState(null);

  const loadChalet=async()=>{
    const[pos,pred]=await Promise.all([calcPosicionesMontana(),calcPersonasEnPredio()]);
    const persIdsChalet=Object.entries(pos.persona).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const persIdsCamino=Object.entries(pos.persona).filter(([_,p])=>p==="camino").map(([k])=>k);
    const vehIdsChalet=Object.entries(pos.vehiculo).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const vehIdsCamino=Object.entries(pos.vehiculo).filter(([_,p])=>p==="camino").map(([k])=>k);
    // En predio: mismo criterio que ChaletMini (quien está en camino/chalet también cuenta como dentro)
    const persIdsPredio=Array.from(pred.inSet);
    persIdsChalet.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
    persIdsCamino.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
    const isUUID=(k)=>typeof k==="string"&&k.length===36&&k.indexOf("-")>=0;
    const allPersIds=Array.from(new Set([...persIdsChalet,...persIdsCamino,...persIdsPredio])).filter(isUUID);
    const allVehIds=[...vehIdsChalet,...vehIdsCamino].filter(isUUID);
    const[{data:pers},{data:vehs}]=await Promise.all([
      allPersIds.length?db.sel("personas",{cols:"id,nombre,apellido,empresa,dni"}):{data:[]},
      allVehIds.length?db.sel("vehiculos",{cols:"id,patente,descripcion,tipo,empresa"}):{data:[]},
    ]);
    const persMap={};(pers||[]).forEach(p=>{persMap[p.id]=p;});
    const vehMap={};(vehs||[]).forEach(v=>{vehMap[v.id]=v;});
    const synthPer=(k)=>({id:k,nombre:"Sin registrar",apellido:"",dni:k,empresa:"DNI no encontrado en la base",_synth:true});
    const synthVeh=(k)=>{const pat=String(k).indexOf("No registrado:")===0?String(k).replace("No registrado:","").trim():k;return{id:k,patente:pat,descripcion:"Vehículo no registrado en la base",tipo:"Otro",empresa:"",_synth:true};};
    setPubChalet({
      persChalet:persIdsChalet.length,
      persCamino:persIdsCamino.length,
      persPredio:persIdsPredio.length,
      vehChalet:vehIdsChalet.length,
      vehCamino:vehIdsCamino.length,
      persListChalet:persIdsChalet.map(k=>persMap[k]||synthPer(k)),
      persListCamino:persIdsCamino.map(k=>persMap[k]||synthPer(k)),
      persListPredio:persIdsPredio.map(k=>persMap[k]||synthPer(k)),
      vehListChalet:vehIdsChalet.map(k=>vehMap[k]||synthVeh(k)),
      vehListCamino:vehIdsCamino.map(k=>vehMap[k]||synthVeh(k)),
    });
  };


  useEffect(()=>{
    db.sel("habilitaciones",{f:[["suspendida","eq",false]],lim:5000}).then(({data})=>{if(data)setHabs(data);});
    fetchRadarDia().then(m=>setRadarMap(m||{}));
    loadMovimientos();
    loadChalet();
    const i=setInterval(()=>{loadMovimientos();loadChalet();},15000);
    return()=>clearInterval(i);
  },[]);

  const loadMovimientos=async()=>{
    setMovLoading(true);
    const[{data:ses},{data:man}]=await Promise.all([
      db.sel("sesiones_acceso",{f:[["cerrada_at","gte",today()+"T00:00:00"]],ord:"cerrada_at.desc",lim:100}),
      db.sel("movimientos_manuales",{f:[["created_at","gte",today()+"T00:00:00"]],ord:"created_at.desc",lim:50}),
    ]);
    setMovHoy({ses:ses||[],man:man||[]});
    if(ses&&ses.length){
      const vids=[...new Set((ses||[]).filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
      const sesIds=(ses||[]).map(s=>s.id);
      const[{data:vehs},{data:regs}]=await Promise.all([
        vids.length?db.sel("vehiculos",{cols:"id,patente,tipo"}):{data:[]},
        db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado",inFilter:["sesion_id",sesIds]}),
      ]);
      const vm={};(vehs||[]).forEach(v=>{vm[v.id]=v;});setMovVehs(vm);
      const rm={};(regs||[]).filter(r=>sesIds.includes(r.sesion_id)).forEach(r=>{if(!rm[r.sesion_id])rm[r.sesion_id]=[];rm[r.sesion_id].push(r);});setMovRegs(rm);
      const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
      if(pids.length){const{data:p}=await db.sel("personas",{cols:"id,nombre,apellido"});const pm={};(p||[]).forEach(x=>{pm[x.id]=x;});setMovPersonas(pm);}
    }
    setMovLoading(false);
  };

  const buscar=async()=>{
    if(!search.trim())return;
    setSearching(true);setSearchResult(null);
    const q=search.trim();
    // Intentar como DNI
    const{data:p}=await db.sel("personas",{f:[["dni","ilike",q],["deleted_at","is","null"]],lim:1});
    const habOk=(pid,tipo)=>habs.some(h=>h.entity_type==="persona"&&h.persona_id===pid&&h.tipo===tipo&&!h.suspendida&&(!h.fecha_hasta||(h.fecha_hasta+"").slice(0,10)>=today()));
    if(p&&p[0]){
      const shOk=habOk(p[0].id,"sh_ingreso");
      const cpOk=!!(radarDe(radarMap,p[0].dni)&&radarDe(radarMap,p[0].dni).cpIngresoOk);
      setSearchResult({type:"persona",data:p[0],shOk,cpOk,estado:personaEstado(p[0].id,habs,radarMap,p[0].dni)});
      setSearching(false);return;
    }
    // Intentar como nombre
    const{data:p2}=await db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc"});
    const found=(p2||[]).filter(x=>`${x.nombre} ${x.apellido}`.toLowerCase().includes(q.toLowerCase()));
    if(found.length===1){
      const shOk=habOk(found[0].id,"sh_ingreso");
      const cpOk=!!(radarDe(radarMap,found[0].dni)&&radarDe(radarMap,found[0].dni).cpIngresoOk);
      setSearchResult({type:"persona",data:found[0],shOk,cpOk,estado:personaEstado(found[0].id,habs,radarMap,found[0].dni)});
    } else if(found.length>1){
      setSearchResult({type:"multiple",items:found});
    } else {
      // Intentar como patente
      const{data:v}=await db.sel("vehiculos",{f:[["patente","eq",q.toUpperCase()],["activo","eq",true]],lim:1});
      if(v&&v[0]){
        // Buscar habs del vehiculo directo en Supabase, no del cache
        const{data:vhabs}=await db.sel("habilitaciones",{f:[["entity_type","eq","vehiculo"],["vehiculo_id","eq",v[0].id]]});
        const habVOk=(tipo)=>(vhabs||[]).some(h=>h.tipo===tipo&&!h.suspendida&&(!h.fecha_hasta||(h.fecha_hasta+"").slice(0,10)>=today()));
        const shOk=habVOk("sh_ingreso");
        const chaletOk=habVOk("sh_manejo");
        setSearchResult({type:"vehiculo",data:v[0],shOk,chaletOk});
      } else {
        setSearchResult({type:"nada"});
      }
    }
    setSearching(false);
  };

  const getPaxStr=(sesId,max=3)=>{
    const ok=(movRegs[sesId]||[]).filter(r=>r.resultado==="aprobado");
    if(!ok.length)return"sin pasajeros";
    const names=ok.map(r=>{const p=movPersonas[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
    if(names.length<=max)return names.join(", ");
    return names.slice(0,max).join(", ")+"...";
  };

  const sesList=movHoy.ses||[];
  const manList=movHoy.man||[];

  return <div className="pub-wrap">
    <div className="pub-bar">
      <div className="brand">CONTROL<span>OBRA</span> <span style={{fontSize:13,fontWeight:400,color:"var(--tx2)",marginLeft:6,fontFamily:"var(--fb)"}}>vista publica</span> <span style={{fontSize:10,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3}}>{APP_REV}</span></div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div className="pub-badge"><div className="pub-dot"/>EN VIVO</div>
        <button className="btn-out" onClick={onBack}>Iniciar sesion</button>
      </div>
    </div>
    <div className="pub-tabs">
      {[{k:"chalet",l:"Conteo de Personal"},{k:"consulta",l:"Habilitaciones Personal / Vehiculos"},{k:"movimientos",l:"Movimientos del dia"}].map(t=><button key={t.k} className={`pub-tab${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}>{t.l}</button>)}
    </div>
    <div className="pub-main">
      {tab==="chalet"&&<>
        {/* EN PREDIO — total de personas dentro (ingresaron por P1 y no salieron) */}
        <div style={{background:"linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.04))",border:"1px solid rgba(245,158,11,.4)",borderRadius:8,overflow:"hidden",marginBottom:12}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(245,158,11,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#F59E0B"}}>En Predio — total dentro</div>
          <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#F59E0B",lineHeight:1}}>{pubChalet.persChalet===null?"-":pubChalet.persPredio}</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#F59E0B",textTransform:"uppercase"}}>Personas</div>
              <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>Incluye a los que están en camino y en chalet</div>
            </div>
            <button style={{background:"rgba(245,158,11,.15)",border:"1px solid rgba(245,158,11,.4)",color:"#F59E0B",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persPredio")}>Ver</button>
          </div>
        </div>
        {/* CHALET */}
        <div style={{background:"linear-gradient(135deg,rgba(139,92,246,.15),rgba(59,130,246,.1))",border:"1px solid rgba(139,92,246,.35)",borderRadius:8,overflow:"hidden",marginBottom:12}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(139,92,246,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#A78BFA"}}>En Chalet — Puesto 3</div>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",borderRight:"1px solid rgba(139,92,246,.2)",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#A78BFA",lineHeight:1}}>{pubChalet.persChalet??"-"}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#A78BFA",textTransform:"uppercase"}}>Personas</div>
              </div>
              <button style={{background:"rgba(139,92,246,.15)",border:"1px solid rgba(139,92,246,.4)",color:"#A78BFA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persChalet")}>Ver</button>
            </div>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"var(--gr)",lineHeight:1}}>{pubChalet.vehChalet}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"var(--gr)",textTransform:"uppercase"}}>Vehiculos</div>
              </div>
              <button style={{background:"rgba(16,185,129,.15)",border:"1px solid rgba(16,185,129,.4)",color:"var(--gr)",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("vehChalet")}>Ver</button>
            </div>
          </div>
        </div>
        {/* CAMINO */}
        <div style={{background:"linear-gradient(135deg,rgba(59,130,246,.12),rgba(16,185,129,.07))",border:"1px solid rgba(59,130,246,.3)",borderRadius:8,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"10px 18px",borderBottom:"1px solid rgba(59,130,246,.2)",fontFamily:"var(--fh)",fontSize:13,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#60A5FA"}}>En Camino — P2 a P3</div>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",borderRight:"1px solid rgba(59,130,246,.2)",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{pubChalet.persCamino}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Personas</div>
              </div>
              <button style={{background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("persCamino")}>Ver</button>
            </div>
            <div style={{flex:1,minWidth:160,padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontFamily:"var(--fh)",fontSize:52,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{pubChalet.vehCamino}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Vehiculos</div>
              </div>
              <button style={{background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA",borderRadius:4,padding:"5px 12px",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setPubShowList("vehCamino")}>Ver</button>
            </div>
          </div>
        </div>
        <div style={{fontSize:12,color:"var(--tx2)",marginBottom:14}}>Se actualiza cada 5 segundos</div>
        {pubShowList&&<ListaFiltrada
          items={{persPredio:pubChalet.persListPredio,persChalet:pubChalet.persListChalet,persCamino:pubChalet.persListCamino,vehChalet:pubChalet.vehListChalet,vehCamino:pubChalet.vehListCamino}[pubShowList]}
          tipo={pubShowList.startsWith("pers")?"persona":"vehiculo"}
          titulo={{persPredio:"Personas en el Predio",persChalet:"Personas en Chalet",persCamino:"Personas en Camino",vehChalet:"Vehiculos en Chalet",vehCamino:"Vehiculos en Camino"}[pubShowList]}
          onClose={()=>setPubShowList(null)}
        />}
      </>}
      {tab==="movimientos"&&<>
        <div className="sg" style={{marginBottom:18}}>
          <div className="sc"><div className="sv">{sesList.filter(s=>s.direccion==="entrada").length}</div><div className="slb">Entradas hoy</div></div>
          <div className="sc"><div className="sv">{sesList.filter(s=>s.direccion==="salida").length}</div><div className="slb">Salidas hoy</div></div>
          <div className="sc"><div className="sv">{sesList.reduce((a,s)=>a+(s.total_aprobados||0),0)}</div><div className="slb">Personas OK</div></div>
          <div className="sc"><div className="sv" style={{color:"var(--rd)"}}>{sesList.reduce((a,s)=>a+(s.total_rechazados||0),0)}</div><div className="slb">Denegados</div></div>
        </div>
        {movLoading?<Spin/>:<>
          {sesList.length>0&&<div className="tw" style={{marginBottom:14}}><table>
            <thead><tr><th>Hora</th><th>Puesto</th><th>Dir.</th><th>Patente</th><th>Pasajeros</th><th>Tot.</th></tr></thead>
            <tbody>{sesList.map(s=>{
              const v=movVehs[s.vehiculo_id];
              return <tr key={s.id}>
                <td className="mn" style={{color:"var(--tx2)",fontSize:12}}>{fmtTs(s.cerrada_at)}</td>
                <td style={{fontSize:12,color:"var(--tx2)"}}>{s.puesto}</td>
                <td><span className={`ld ld-${s.direccion==="entrada"?"in":"out"}`}>{s.direccion}</span></td>
                <td><span style={{fontFamily:"var(--fm)",fontWeight:600}}>{v?v.patente:"—"}</span></td>
                <td style={{fontSize:12,color:"var(--tx2)",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{getPaxStr(s.id)}</td>
                <td style={{fontFamily:"var(--fh)",fontSize:18,fontWeight:700}}>{s.total_personas}</td>
              </tr>;
            })}</tbody>
          </table></div>}
          {manList.length>0&&<>
            <div style={{fontFamily:"var(--fm)",fontSize:11,color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Movimientos manuales hoy</div>
            <div className="tw"><table>
              <thead><tr><th>Hora</th><th>Puesto</th><th>Dir.</th><th>Persona</th></tr></thead>
              <tbody>{manList.map(m=><tr key={m.id}>
                <td className="mn" style={{color:"var(--tx2)",fontSize:12}}>{fmtTs(m.created_at)}</td>
                <td style={{fontSize:12,color:"var(--tx2)"}}>{m.puesto}</td>
                <td><span className={`ld ld-${m.direccion==="entrada"?"in":"out"}`}>{m.direccion}</span></td>
                <td>{m.nombre_raw||<span style={{color:"var(--tx2)"}}>Sin identificar</span>}</td>
              </tr>)}</tbody>
            </table></div>
          </>}
          {sesList.length===0&&manList.length===0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:40}}>Sin movimientos registrados hoy</div>}
        </>}
      </>}

      {tab==="consulta"&&<>
        <div style={{marginBottom:20}}>
          <div style={{fontFamily:"var(--fh)",fontSize:14,color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:12}}>Buscar persona o vehiculo</div>
          <div style={{display:"flex",gap:10}}>
            <input className="fi" style={{flex:1,maxWidth:400,fontSize:15}} placeholder="DNI, nombre completo o patente..." value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()}/>
            <button className="bsc" onClick={buscar} disabled={searching}>{searching?"...":"Buscar"}</button>
          </div>
        </div>
        {searchResult&&<>
          {searchResult.type==="nada"&&<div className="err">No se encontro ningun registro con esa busqueda.</div>}
          {searchResult.type==="multiple"&&<div className="tw"><table>
            <thead><tr><th>Nombre</th><th>DNI</th><th>Empresa</th></tr></thead>
            <tbody>{searchResult.items.map(p=><tr key={p.id}><td>{p.nombre} {p.apellido}</td><td className="mn">{p.dni}</td><td style={{color:"var(--tx2)"}}>{p.empresa||"—"}</td></tr>)}</tbody>
          </table></div>}
          {searchResult.type==="persona"&&(()=>{
            const pid=searchResult.data.id;
            const dni=searchResult.data.dni;
            const habCheck=(tipo)=>{const h=habs.find(x=>x.entity_type==="persona"&&x.persona_id===pid&&x.tipo===tipo&&!x.suspendida&&(!x.fecha_hasta||(x.fecha_hasta+"").slice(0,10)>=today()));return h?{ok:true,fecha:h.fecha_hasta}:{ok:false};};
            const shIng=habCheck("sh_ingreso");const shCha=habCheck("sh_chalet");const shMan=habCheck("sh_manejo");
            const rr=radarDe(radarMap,dni);
            const cpOk=!!(rr&&rr.cpIngresoOk);
            const cpCod=rr?rr.codigo:"—";
            return <div style={{background:"var(--s1)",border:"1px solid var(--bd)",borderRadius:8,padding:"20px 24px"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                <div className="av" style={{width:44,height:44,fontSize:16}}>{ini(`${searchResult.data.nombre} ${searchResult.data.apellido}`)}</div>
                <div style={{flex:1}}><div style={{fontFamily:"var(--fh)",fontSize:22,fontWeight:700}}>{searchResult.data.nombre} {searchResult.data.apellido}</div><div style={{fontSize:13,color:"var(--tx2)"}}>{searchResult.data.empresa} · DNI {searchResult.data.dni}</div></div>
                <div>{searchResult.estado==="ok"?<span className="est-ok">Habilitado</span>:searchResult.estado==="par"?<span className="est-par">Parcial</span>:<span className="est-no">Bloqueado</span>}</div>
              </div>
              <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>S&H</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                {[{l:"Ingreso",h:shIng},{l:"Subir a Chalet",h:shCha},{l:"Manejo en Montaña",h:shMan}].map(({l,h})=><div key={l} style={{padding:"7px 12px",background:"var(--s2)",borderRadius:4,fontSize:13,border:"1px solid "+(h.ok?"rgba(16,185,129,.3)":"rgba(239,68,68,.2)")}}><span style={{color:"var(--tx2)"}}>{l}: </span><span style={{color:h.ok?"var(--gr)":"var(--rd)",fontWeight:600}}>{h.ok?"ok "+fmtD(h.fecha):"No"}</span></div>)}
              </div>
              <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>CP Ingreso <span style={{opacity:.7}}>(del Radar de Obra)</span></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <div style={{padding:"7px 12px",background:"var(--s2)",borderRadius:4,fontSize:13,border:"1px solid "+(cpOk?"rgba(16,185,129,.3)":"rgba(239,68,68,.2)")}}>
                  <span style={{color:"var(--tx2)"}}>Estado hoy: </span>
                  <span style={{color:cpOk?"var(--gr)":"var(--rd)",fontWeight:600}}>{cpOk?"ok":(rr?(rr.letra==="F"?"FRANCO":"sin CP"):"sin dato en Radar")}</span>
                  <span style={{fontFamily:"var(--fm)",fontSize:11,marginLeft:8,opacity:.7}}>{cpCod}</span>
                </div>
              </div>
            </div>;
          })()}
          {searchResult.type==="vehiculo"&&(()=>{
            const chaletOk=searchResult.chaletOk||false;
            return <div style={{background:"var(--s1)",border:"1px solid var(--bd)",borderRadius:8,padding:"20px 24px"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                <span style={{fontSize:36}}>{VI[searchResult.data.tipo]||"🚗"}</span>
                <div style={{flex:1}}><div style={{fontFamily:"var(--fm)",fontSize:22,fontWeight:600}}>{searchResult.data.patente}</div><div style={{fontSize:13,color:"var(--tx2)"}}>{searchResult.data.descripcion} · {searchResult.data.empresa}</div></div>
                <div>{searchResult.shOk?<span className="est-ok">Habilitado</span>:<span className="est-no">Bloqueado</span>}</div>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <div style={{padding:"8px 14px",background:"var(--s2)",borderRadius:4,fontSize:13}}><span style={{color:"var(--tx2)"}}>S&H Ingreso: </span><span style={{color:searchResult.shOk?"var(--gr)":"var(--rd)",fontWeight:600}}>{searchResult.shOk?"Habilitado":"No habilitado"}</span></div>
                <div style={{padding:"8px 14px",background:"var(--s2)",borderRadius:4,fontSize:13}}><span style={{color:"var(--tx2)"}}>Sub. Chalet: </span><span style={{color:chaletOk?"var(--gr)":"var(--rd)",fontWeight:600}}>{chaletOk?"Habilitado":"No habilitado"}</span></div>
              </div>
            </div>;
          })()}
        </>}
      </>}
    </div>
  </div>;
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function Login({onLogin,onPublic}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const go=async()=>{
    setLoading(true);setErr("");
    if(!isOnline()){
      setErr("Sin conexión a internet. La app necesita conexión para funcionar — registrá las fichadas en la hoja alternativa hasta que vuelva.");
      setLoading(false);return;
    }
    const r=await authApi.signIn(email,pw);
    if(r.error){setErr(r.error);setLoading(false);return;}
    const{data}=await db.sel("usuarios",{f:[["id","eq",r.userId]],lim:1});
    if(!data||!data[0]){setErr("Usuario sin perfil. Contacta al administrador.");await authApi.signOut();setLoading(false);return;}
    onLogin(data[0]);setLoading(false);
  };
  return <div className="lwrap"><div className="lcard">
    <div className="llogo">CONTROL<span>OBRA</span> <span style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3,verticalAlign:"middle"}}>{APP_REV}</span></div>
    <div className="lsub">Sistema de control de puestos</div>
    {err&&<div className="err">{err}</div>}
    <div className="f"><label>Email</label><input type="email" placeholder="usuario@obrasysistemas.com.ar" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} autoFocus/></div>
    <div className="f"><label>Contrasena</label><input type="password" placeholder="..." value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></div>
    <button className="bp" onClick={go} disabled={loading}>{loading?"Ingresando...":"Ingresar"}</button>
    <button className="lpub" onClick={onPublic}>Ver movimientos de obra (sin login)</button>
  </div></div>;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[tab,setTab]=useState(null);
  const[proyectos,setProyectos]=useState([]);
  const[checking,setChecking]=useState(true);
  const[publicMode,setPublicMode]=useState(false);
  const pid=proyectos.length>0?proyectos[0].id:null;

  useEffect(()=>{
    const uid=restoreSes();
    if(uid){
      // Intentar cargar usuario directamente, si falla por 401 el dbq lo refresca solo
      const timeout=setTimeout(()=>setChecking(false),8000); // max 8s
      db.sel("usuarios",{f:[["id","eq",uid]],lim:1}).then(({data})=>{
        clearTimeout(timeout);
        if(data&&data[0])login(data[0]);
        else setChecking(false);
      }).catch(()=>{clearTimeout(timeout);setChecking(false);});
    }
    else setChecking(false);
  },[]);

  const login=async p=>{
    setUser(p);
    setTab({puesto:"sc",sh:"per",cp:"per",admin:"per",logistica:"per",cocina_campamento:"vi",cocina_chalet:"vi",admin_viandas:"vi"}[p.rol]||"per");
    const{data}=await db.sel("proyectos",{f:[["activo","eq",true]]});
    if(data)setProyectos(data);
    setChecking(false);
  };
  const logout=async()=>{await authApi.signOut();setUser(null);setTab(null);setProyectos([]);};

  // "cvc" = Conteo Viandas Chalet (el conteo viejo, renombrado). "vi" = Viandas (módulo comedor nuevo).
  const TABS={
    puesto:           [{k:"sc",l:"Escanear"},{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    sh:               [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    cp:               [{k:"per",l:"Personal"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    logistica:        [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    cocina_campamento:[{k:"vi",l:"Viandas"}],
    cocina_chalet:    [{k:"vi",l:"Viandas"}],
    admin_viandas:    [{k:"vi",l:"Viandas"}],
    admin:            [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"sc",l:"Puestos"},{k:"reg",l:"Registros"},{k:"vi",l:"Viandas"},{k:"cvc",l:"Chalet"},{k:"adm",l:"Usuarios"}],
  };
  // Agrupación visual de solapas (cada rol ve solo los grupos donde tiene alguna solapa)
  const NAV_GROUPS=[
    {t:"Habilitaciones",    ks:["per","veh"]},
    {t:"Control de puestos",ks:["sc","reg"]},
    {t:"Gastronomía",       ks:["vi","cvc"]},
    {t:"Administración",    ks:["adm"]},
  ];

  if(checking)return <div className="lwrap"><Spin t="Iniciando..."/></div>;
  if(publicMode)return <PublicDashboard onBack={()=>setPublicMode(false)}/>;
  if(!user)return <Login onLogin={login} onPublic={()=>setPublicMode(true)}/>;
  const tabs=TABS[user.rol]||[];
  return <div className="app">
    <div className="topbar">
      <div className="brand">CONTROL<span>OBRA</span> <span style={{fontSize:10,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3}}>{APP_REV}</span></div>
      <div className="tr" style={{gap:8,flexWrap:"nowrap"}}>
        <span style={{fontSize:12,color:"var(--tx2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:80}}>{user.nombre}</span>
        <span className="rol" style={{flexShrink:0}}>{user.rol==="puesto"?user.puesto_nombre||"Puesto":user.rol.toUpperCase()}</span>
        <button className="btn-out" onClick={logout} style={{flexShrink:0}}>Salir</button>
      </div>
    </div>
    {pid&&<div style={{background:"var(--s2)",borderBottom:"1px solid var(--bd)",padding:"5px 12px",display:"flex",alignItems:"center",gap:8,overflowX:"auto"}}><ChaletMini proyectoId={pid} user={user}/></div>}
    {tabs.length>1&&<div className="nav grp">{NAV_GROUPS.map(g=>{
      const gt=tabs.filter(t=>g.ks.includes(t.k));
      if(!gt.length)return null;
      return <div key={g.t} className="ngrp">
        <div className="ngrp-t">{g.t}</div>
        <div className="ngrp-b">{gt.map(t=><button key={t.k} className={`nb${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}>{t.l}</button>)}</div>
      </div>;
    })}</div>}
    <div className="main">
      {tab==="per"&&<PersonalPanel userRole={user.rol} currentUserId={user.id} proyectoId={pid} user={user}/>}
      {tab==="veh"&&<VehiculosPanel userRole={user.rol} currentUserId={user.id} proyectoId={pid}/>}
      {tab==="reg"&&<Registros defaultPuesto={user.rol==="puesto"?user.puesto_nombre:""} user={user}/>}
      {tab==="sc" &&<Puesto user={user} pid={pid}/>}
      {tab==="cvc"&&<ConteoViandasChalet user={user} proyectoId={pid}/>}
      {tab==="vi" &&<Comedor user={user} proyectoId={pid}/>}
      {tab==="adm"&&<Usuarios currentUser={user}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
