// MÓDULO COMEDOR (tab "Viandas" nuevo) — Fase B: conectado a Supabase.
// Tablas: obra.viandas_calendario, obra.viandas_despachos, obra.viandas_dieta.
// Realtime en despachos + dieta para sync entre los 2 puestos.
// ═══════════════════════════════════════════════════════════════════════════
const CMD_COMIDAS=[
  {key:'desayuno',label:'Desayuno',short:'DES',em:'☕'},
  {key:'almuerzo',label:'Almuerzo',short:'ALM',em:'🍽️'},
  {key:'merienda',label:'Merienda',short:'MER',em:'🥐'},
  {key:'cena',    label:'Cena',    short:'CEN',em:'🌙'},
];
const CMD_LETRAS={C:'Campamento',O:'Omega',R:'Río Villegas',H:'Hostel',N:'Sin información',I:'Viaje a obra',V:'Viaje desde obra',F:'Franco'};

// Cargar personas del día: cruza viandas_calendario × personas por DNI.
// Retorna [{dni,nombre,apellido,empresa,id,code,letra,letraNom,numero,comidas:[]}]
// Solo devuelve personas que tienen al menos una comida marcada.
const cmdFetchPersonasFecha=async(fecha)=>{
  const{data:cal}=await db.sel("viandas_calendario",{f:[["fecha","eq",fecha]],lim:5000});
  const rows=(cal||[]).filter(r=>r.desayuno||r.almuerzo||r.merienda||r.cena);
  if(rows.length===0)return[];
  // Se busca cada DNI tal cual, en mayúsculas y en minúsculas (los extranjeros pueden tener letras y estar
  // cargados distinto en el Radar y en Personal); para los numéricos las tres variantes son la misma.
  const dnis=[...new Set(rows.flatMap(r=>{const s=String(r.dni).trim();return[s,s.toUpperCase(),s.toLowerCase()];}))];
  const{data:pers}=await db.sel("personas",{cols:"dni,nombre,apellido,empresa",inFilter:["dni",dnis]});
  const persMap={};(pers||[]).forEach(p=>{persMap[normDni(p.dni)]=p;});
  return rows.map(r=>{
    const p=persMap[normDni(r.dni)]||{nombre:'(no registrado)',apellido:'',empresa:''};
    const comidas=[];
    if(r.desayuno)comidas.push('desayuno');
    if(r.almuerzo)comidas.push('almuerzo');
    if(r.merienda)comidas.push('merienda');
    if(r.cena)comidas.push('cena');
    return{dni:r.dni,id:r.dni,nombre:p.nombre,apellido:p.apellido,empresa:p.empresa,code:r.codigo,letra:r.letra,letraNom:CMD_LETRAS[r.letra]||'',numero:r.numero,comidas};
  });
};
const cmdFetchDespachos=async(fecha)=>{
  const{data}=await db.sel("viandas_despachos",{f:[["fecha","eq",fecha]],ord:"ts.asc",lim:5000});
  return(data||[]).map(d=>({id:d.id,personaId:d.dni,dni:d.dni,comida:d.comida,puesto:d.puesto,operador:d.operador_email,ts:d.ts,fecha:d.fecha}));
};
const cmdFetchDieta=async()=>{
  const{data}=await db.sel("viandas_dieta",{lim:5000});
  const m={};(data||[]).forEach(d=>{m[d.dni]={nota:d.nota||'',hasta:d.hasta||null};});
  return m;
};
// cmdFetchComeChalet(fecha): Set<dni> de personas que comen en el chalet ese día.
// Se lee de la tabla comidas_diarias (ya existente, se llena en el Puesto al fichar):
// entrada a P2/P3 antes de 11 AM marca por default "come arriba" (el garitero puede modificar).
// Retorna Set de DNIs para hacer lookup rápido en el listado del comedor.
const cmdFetchComeChalet=async(fecha)=>{
  const{data:cd}=await db.sel("comidas_diarias",{f:[["fecha","eq",fecha||today()],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],cols:"persona_id",lim:2000});
  const personaIds=(cd||[]).map(x=>x.persona_id).filter(Boolean);
  if(personaIds.length===0)return new Set();
  const{data:pers}=await db.sel("personas",{cols:"id,dni",inFilter:["id",personaIds]});
  return new Set((pers||[]).map(p=>p.dni).filter(Boolean));
};
// Plato/tarjeta: se entrega una sola vez y queda fijo para la persona (no es por día). Map dni → entregado_at.
const cmdFetchPlatos=async()=>{
  const{data}=await db.sel("viandas_plato",{cols:"dni,entregado_at",lim:5000});
  const m={};(data||[]).forEach(r=>{m[r.dni]=r.entregado_at;});
  return m;
};
// Almuerzo y cena se pueden entregar más de una vez por persona por día (con aviso); desayuno y merienda, una sola.
const CMD_REPETIBLES=['almuerzo','cena'];
const cmdRepetible=(k)=>CMD_REPETIBLES.includes(k);
const cmdHora=(ts)=>new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const cmdOtro=(k)=>(k==='cena'||k==='merienda')?'otra':'otro';
// Aviso al entregar por segunda vez la misma comida: cuántas veces, a qué hora y en qué puesto la retiró.
const cmdAvisoRepetir=(persona,comida,desps)=>{
  const c=CMD_COMIDAS.find(x=>x.key===comida);
  const l=desps.filter(d=>d.dni===persona.dni&&d.comida===comida).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  return '⚠️ ATENCIÓN: '+persona.nombre+' '+persona.apellido+' YA RETIRÓ '+c.label.toUpperCase()+' HOY'+(l.length>1?' ('+l.length+' veces)':'')+'\n'
    +l.map(d=>'· '+cmdHora(d.ts)+' en '+cmdPuestoShort(d.puesto)).join('\n')
    +'\n\n¿Entregar '+cmdOtro(comida)+' '+c.label.toLowerCase()+'?';
};
// Agregados: personas que no están en el listado del día, o comidas que no tenían programadas, que la cocina
// entrega igual. Quedan registrados en obra.viandas_agregados (quién, cuándo, en qué puesto) y se suman al listado.
const cmdFetchAgregados=async(fecha)=>{
  const{data}=await db.sel("viandas_agregados",{f:[["fecha","eq",fecha]],lim:2000});
  const m={};(data||[]).forEach(r=>{m[r.dni]=r;});
  return m;
};
const cmdMergeAgregados=(radar,ag)=>{
  const keys=CMD_COMIDAS.map(c=>c.key);
  const enRadar=new Set();
  const out=radar.map(p=>{
    enRadar.add(normDni(p.dni));
    const a=ag[p.dni];if(!a)return p;
    const extras=(a.comidas||[]).filter(k=>!p.comidas.includes(k));
    if(!extras.length)return p;
    return{...p,comidas:keys.filter(k=>p.comidas.includes(k)||extras.includes(k)),extras,agregado:a};
  });
  Object.values(ag).forEach(a=>{
    if(enRadar.has(normDni(a.dni)))return;
    const comidas=keys.filter(k=>(a.comidas||[]).includes(k));
    if(!comidas.length)return;
    out.push({dni:a.dni,id:a.dni,nombre:a.nombre||'(sin nombre)',apellido:a.apellido||'',empresa:a.empresa||'',code:null,letra:null,letraNom:'',numero:null,comidas,extras:comidas,agregado:a,noListado:true});
  });
  return out;
};
// DNI válido para agregar: 5 a 15 letras/números con al menos un número (argentinos y extranjeros con letras)
const cmdPareceDni=(s)=>{const t=normDni(s);return /^[A-Z0-9]{5,15}$/.test(t)&&/\d/.test(t);};
const cmdComidaPorHora=()=>{const h=new Date().getHours();return h<10?'desayuno':(h<15?'almuerzo':(h<19?'merienda':'cena'));};
// Resumen por día: programadas (viandas_calendario) y despachadas (viandas_despachos, cuenta repeticiones de cena).
const cmdFetchResumen=async(desde,hasta)=>{
  const[{data:cal},{data:desp}]=await Promise.all([
    dbSelAll("viandas_calendario",{cols:"fecha,dni,desayuno,almuerzo,merienda,cena",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"fecha.asc,dni.asc"}),
    dbSelAll("viandas_despachos",{cols:"id,fecha,comida",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"id.asc"}),
  ]);
  const byDay={};
  const get=(f)=>byDay[f]||(byDay[f]={prog:{desayuno:0,almuerzo:0,merienda:0,cena:0},desp:{desayuno:0,almuerzo:0,merienda:0,cena:0},hayProg:false});
  (cal||[]).forEach(r=>{const x=get(r.fecha);x.hayProg=true;CMD_COMIDAS.forEach(c=>{if(r[c.key])x.prog[c.key]++;});});
  (desp||[]).forEach(r=>{const x=get(r.fecha);if(x.desp[r.comida]!==undefined)x.desp[r.comida]++;});
  return byDay;
};
// Dieta helpers: cmdIsDietaActive/ForDate/Note/Hasta acepta {nota,hasta}|null
const cmdGetDietaObj=(v)=>{
  if(v===undefined||v===null||v===false)return null;
  if(v===true)return{nota:'',hasta:null};
  if(typeof v==='string')return{nota:v,hasta:null};
  if(typeof v==='object')return{nota:v.nota||'',hasta:v.hasta||null};
  return null;
};
const cmdIsDietaActive=(v)=>cmdGetDietaObj(v)!==null;
const cmdIsDietaActiveForDate=(v,fecha)=>{const o=cmdGetDietaObj(v);if(!o)return false;if(!o.hasta)return true;return fecha<=o.hasta;};
const cmdGetDietaNote=(v)=>{const o=cmdGetDietaObj(v);return o?o.nota:'';};
const cmdGetDietaHasta=(v)=>{const o=cmdGetDietaObj(v);return o?(o.hasta||''):'';};
const cmdUuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'_'+Math.random().toString(36).slice(2));
// Fecha local (no UTC): con toISOString, en Argentina después de las 21 hs saltaba al día siguiente.
const cmdIsoDate=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cmdAddDays=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return cmdIsoDate(new Date(y,m-1,d+n));};
const cmdFmtDate=(iso)=>{const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const cmdPuestoClass=(p)=>p==='DESPACHO CAMPAMENTO'?'camp':(p==='DESPACHO CHALET'?'chal':'admin');
const cmdPuestoShort=(p)=>p==='DESPACHO CAMPAMENTO'?'Camp.':(p==='DESPACHO CHALET'?'Chalet':'Admin');
// Rol de ControlObra → puesto del comedor
const cmdPuestoFromRol=(rol)=>{
  if(rol==='cocina_campamento')return 'DESPACHO CAMPAMENTO';
  if(rol==='cocina_chalet')return 'DESPACHO CHALET';
  return 'ADMIN';
};

// Alta de alguien que no está en el listado del día: se busca el DNI en la base de personas para completar
// nombre/empresa, se eligen las comidas que se le entregan y queda registrado en viandas_agregados.
function CmdAgregarModal({dniInicial,personas,onClose,onConfirm}){
  const[dni,setDni]=useState(dniInicial||'');
  const[nombre,setNombre]=useState('');
  const[apellido,setApellido]=useState('');
  const[empresa,setEmpresa]=useState('');
  const[comidas,setComidas]=useState(()=>new Set([cmdComidaPorHora()]));
  const[motivo,setMotivo]=useState('');
  const[base,setBase]=useState(null); // null = sin buscar · false = no está en la base · objeto = encontrado
  const[saving,setSaving]=useState(false);
  const clean=normDni(dni);
  const enLista=personas.find(p=>sameDni(p.dni,clean));
  useEffect(()=>{
    if(!cmdPareceDni(clean)){setBase(null);return;}
    let vivo=true;
    db.sel("personas",{cols:"dni,nombre,apellido,empresa",f:[["dni","ilike",clean],["deleted_at","is","null"]],lim:1}).then(({data})=>{
      if(!vivo)return;
      const p=data&&data[0];
      setBase(p||false);
      if(p){setNombre(p.nombre||'');setApellido(p.apellido||'');setEmpresa(p.empresa||'');}
    });
    return()=>{vivo=false;};
  },[clean]);
  const toggle=(k)=>setComidas(prev=>{const n=new Set(prev);if(n.has(k))n.delete(k);else n.add(k);return n;});
  const valido=cmdPareceDni(clean)&&!enLista&&(nombre.trim()||apellido.trim())&&comidas.size>0;
  const confirmar=async()=>{
    if(!valido||saving)return;
    setSaving(true);
    // Si está en la base de personal se usa el DNI tal como figura ahí (para que coincida en todos lados)
    await onConfirm({dni:base?String(base.dni).trim():clean,nombre:nombre.trim(),apellido:apellido.trim(),empresa:empresa.trim()},CMD_COMIDAS.map(c=>c.key).filter(k=>comidas.has(k)),motivo.trim());
    setSaving(false);
  };
  return <div className="cmd-modov" onClick={onClose}>
    <div className="cmd-modal" onClick={e=>e.stopPropagation()}>
      <h3 style={{color:'var(--cmd-info)'}}>➕ Agregar persona al listado de hoy</h3>
      <div className="who">Para alguien que no figura en el Radar. Queda registrado quién lo agregó, cuándo y en qué puesto.</div>
      <label>DNI</label>
      <input className="cmd-inp" autoCapitalize="characters" autoComplete="off" autoFocus={!dniInicial} value={dni} onChange={e=>setDni(e.target.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase())} placeholder="Sin puntos (extranjeros: con letras)"/>
      {enLista&&<div className="cmd-aviso">{enLista.nombre} {enLista.apellido} ya está en el listado de hoy. Buscalo y tocá la comida: si no la tiene programada, la app te deja entregarla igual.</div>}
      {!enLista&&base&&<div style={{fontSize:11,color:'var(--cmd-ok)',marginTop:-6,marginBottom:10}}>✓ Encontrado en la base de personal</div>}
      {!enLista&&base===false&&<div style={{fontSize:11,color:'var(--cmd-dieta)',marginTop:-6,marginBottom:10}}>No está en la base de personal: completá el nombre a mano.</div>}
      {!enLista&&<>
        <div style={{display:'flex',gap:8}}>
          <div style={{flex:1}}><label>Nombre</label><input className="cmd-inp" value={nombre} onChange={e=>setNombre(e.target.value)} autoFocus={!!dniInicial}/></div>
          <div style={{flex:1}}><label>Apellido</label><input className="cmd-inp" value={apellido} onChange={e=>setApellido(e.target.value)}/></div>
        </div>
        <label>Empresa</label>
        <input className="cmd-inp" value={empresa} onChange={e=>setEmpresa(e.target.value)}/>
        <label>Comida que se le entrega ahora</label>
        <div className="cmd-fbar" style={{marginBottom:10}}>
          {CMD_COMIDAS.map(c=><button key={c.key} className={'cmd-fbtn '+(comidas.has(c.key)?'active':'')} onClick={()=>toggle(c.key)}>{c.em} {c.label}</button>)}
        </div>
        <label>Motivo (opcional)</label>
        <input className="cmd-inp" value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder='Ej: "visita", "no estaba en el Radar", "subcontratista nuevo"'/>
      </>}
      <div className="actions">
        <button className="btnSave" style={{background:'var(--cmd-info)'}} disabled={!valido||saving} onClick={confirmar}>{saving?'Guardando…':'Agregar y entregar'}</button>
        <button className="btnCancel" onClick={onClose}>Cancelar</button>
      </div>
    </div>
  </div>;
}

function CmdListado({personas,despachos,fecha,setFecha,dieta,chaletSet,platos,onTogglePlato,isAdmin,onOpenDieta,onPick,onDispatch,onUndispatch,canDispatch,isReadOnly,onAgregarComida,onAgregarPersona}){

  const ini=inicio||defInicio,fin=cmdAddDays(ini,6);
  const esDefault=ini===defInicio;
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const reqRef=useRef(0);
  const load=async()=>{
    const req=++reqRef.current;setLoading(true);
    // Dos rangos separados: si la fecha elegida es vieja, no traemos todos los días intermedios.
    const[a,b]=await Promise.all([cmdFetchResumen(ini,fin),cmdFetchResumen(cmdAddDays(hoy,1),cmdAddDays(hoy,7))]);
    if(req!==reqRef.current)return; // cambiaron la fecha mientras cargaba
    setData({...b,...a});setLoading(false);
  };
  useEffect(()=>{load();},[ini]);
  const pasados=[];for(let i=0;i<7;i++)pasados.push(cmdAddDays(ini,i));
  const proximos=[];for(let i=1;i<=7;i++)proximos.push(cmdAddDays(hoy,i));
  const diaLbl=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});};
  const row=(iso)=>(data&&data[iso])||{prog:{desayuno:0,almuerzo:0,merienda:0,cena:0},desp:{desayuno:0,almuerzo:0,merienda:0,cena:0},hayProg:false};
  const sum=(dias,campo,k)=>dias.reduce((a,iso)=>a+row(iso)[campo][k],0);
  const trStyle={cursor:'pointer'};
  return <div className="cmd-rep">
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
      <h3 style={{margin:0}}>{esDefault?'Últimos 7 días':('Del '+cmdFmtDate(ini).slice(0,5)+' al '+cmdFmtDate(fin).slice(0,5))} · despachadas / programadas</h3>
      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--tx2)',textTransform:'uppercase',fontWeight:700,letterSpacing:.5}}>Desde
        <input type="date" value={ini} max={hoy} onChange={e=>setInicio(e.target.value||null)} style={{background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx)',borderRadius:4,padding:'4px 8px',fontFamily:'var(--fm)',fontSize:12}}/>
      </label>
      {!esDefault&&<button onClick={()=>setInicio(null)} style={{background:'none',border:'1px solid var(--cmd-pri)',color:'var(--cmd-pri)',borderRadius:4,padding:'4px 10px',fontSize:11,cursor:'pointer'}} title="Volver a los últimos 7 días hasta hoy">↺ últimos 7 días</button>}
      <button onClick={load} style={{marginLeft:'auto',background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx2)',borderRadius:4,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>{loading?'…':'↻ actualizar'}</button>
    </div>
    {loading?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Cargando…</div>:<>
      <table>
        <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
        <tbody>
          {pasados.map(iso=>{const r=row(iso);const fut=iso>hoy;return <tr key={iso} style={trStyle} onClick={()=>onVerDia(iso)} title="Ver el detalle de ese día">
            <td>{diaLbl(iso)}{iso===hoy&&<span style={{fontSize:10,color:'var(--cmd-pri)',marginLeft:6}}>hoy · en curso</span>}{fut&&<span style={{fontSize:10,color:'var(--tx3)',marginLeft:6}}>próximo</span>}</td>
            {CMD_COMIDAS.map(c=>{const d=r.desp[c.key],p=r.prog[c.key];
              const col=(!r.hayProg||fut)?'var(--tx3)':d<p?'var(--cmd-dieta)':'var(--cmd-ok)';
              return <td key={c.key} className="n" style={{color:col}}>{r.hayProg?<>{d}<span style={{color:'var(--tx3)',fontWeight:500}}> / {p}</span></>:'—'}</td>;})}
          </tr>;})}
          <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{sum(pasados,'desp',c.key)}<span style={{color:'var(--tx3)',fontWeight:500}}> / {sum(pasados,'prog',c.key)}</span></td>)}</tr>
        </tbody>
      </table>
      <h3 style={{marginTop:18}}>Próximos 7 días · programadas</h3>
      <table>
        <thead><tr><th>Día</th>{CMD_COMIDAS.map(c=><th key={c.key} className="n">{c.em} {c.short}</th>)}</tr></thead>
        <tbody>
          {proximos.map(iso=>{const r=row(iso);return <tr key={iso} style={trStyle} onClick={()=>onVerDia(iso)} title="Ver el detalle de ese día">
            <td>{diaLbl(iso)}</td>
            {CMD_COMIDAS.map(c=><td key={c.key} className="n" style={{color:r.hayProg?'var(--tx)':'var(--tx3)'}}>{r.hayProg?r.prog[c.key]:'—'}</td>)}
          </tr>;})}
          <tr style={{borderTop:'2px solid var(--bd)'}}><td style={{fontWeight:800}}>Total</td>{CMD_COMIDAS.map(c=><td key={c.key} className="n">{sum(proximos,'prog',c.key)}</td>)}</tr>
        </tbody>
      </table>
      <div style={{marginTop:10,fontSize:11,color:'var(--tx3)',lineHeight:1.5}}>
        Tocá un día para ver el detalle por persona. "—" = el día todavía no se sincronizó desde el Radar (el sync trae hoy + 10 días).
        Las cenas cuentan todos los platos entregados, incluidas las repeticiones.
      </div>
    </>}
  </div>;
}
function CmdReporte({personas,despachos,fecha,onVerDia,resInicio,setResInicio}){

    ...c,

    agregadas:personas.filter(p=>(p.extras||[]).includes(c.key)).length,
    despachadas:despachos.filter(d=>d.comida===c.key).length,

    chal:despachos.filter(d=>d.comida===c.key&&d.puesto==='DESPACHO CHALET').length,

    pendientes:personas.filter(p=>prog(p,c.key)&&!despachos.some(d=>d.dni===p.dni&&d.comida===c.key)).length,

            <td>{c.em} {c.label}</td>

            <td className="n" style={{color:c.agregadas?'var(--cmd-info)':'var(--tx3)'}}>{c.agregadas}</td>
            <td className="n" style={{color:'var(--cmd-pri)'}}>{c.despachadas}</td>
            <td className="n" style={{color:c.repetidas?'var(--cmd-err)':'var(--tx3)'}}>{c.repetidas}</td>
            <td className="n" style={{color:'var(--cmd-info)'}}>{c.camp}</td>
            <td className="n" style={{color:'var(--cmd-purple)'}}>{c.chal}</td>
            <td className="n" style={{color:'var(--cmd-ok)'}}>{c.pendientes}</td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
    {agregadosDia.length>0&&<div className="cmd-rep">
      <h3>➕ Agregados del día ({agregadosDia.length})</h3>
      <div className="cmd-tblw"><table>
        <thead><tr><th>Persona</th><th>Comidas agregadas</th><th>Puesto</th><th>Hora</th><th>Motivo</th></tr></thead>
        <tbody>{agregadosDia.map(p=><tr key={p.dni}>
          <td>{p.nombre} {p.apellido}<div style={{fontSize:10,color:'var(--tx3)'}}>DNI {p.dni}{p.empresa?' · '+p.empresa:''}{p.noListado?' · no estaba en el listado':''}</div></td>
          <td>{p.extras.map(k=>{const c=CMD_COMIDAS.find(x=>x.key===k);return c.em+' '+c.short;}).join('  ')}</td>
          <td><span className={'cmd-ptag '+cmdPuestoClass(p.agregado.puesto)}>{cmdPuestoShort(p.agregado.puesto)}</span></td>
          <td style={{fontFamily:'var(--fm)',fontSize:11}}>{cmdHora(p.agregado.agregado_at)}</td>
          <td style={{fontSize:11}}>{p.agregado.motivo||''}</td>
        </tr>)}</tbody>
      </table></div>
    </div>}
    <div className="cmd-rep">
      <h3>Últimos despachos del día</h3>
      {despachos.length===0?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Sin despachos aún.</div>:
        <table>
          <thead><tr><th>Hora</th><th>Persona</th><th>Comida</th><th>Puesto</th></tr></thead>
          <tbody>{[...despachos].reverse().slice(0,30).map(d=>{
            const p=personas.find(x=>x.dni===d.dni);
            const c=CMD_COMIDAS.find(x=>x.key===d.comida);
            return <tr key={d.id}>
              <td style={{fontFamily:'var(--fm)',fontSize:11}}>{cmdIsoDate(new Date(d.ts))!==d.fecha
                ?<span title="Cargado después (carga atrasada)">✏️ {cmdFmtDate(cmdIsoDate(new Date(d.ts))).slice(0,5)} {cmdHora(d.ts)}</span>
                :cmdHora(d.ts)}</td>
              <td>{p?(p.nombre+' '+p.apellido):d.dni}</td>
              <td>{c.em} {c.label}</td>
              <td><span className={'cmd-ptag '+cmdPuestoClass(d.puesto)}>{cmdPuestoShort(d.puesto)}</span></td>
            </tr>;
          })}</tbody>
        </table>}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════════════════
// PEDIDO SEMANAL Y CERTIFICADOS (proveedor Lagunas del Radal) — Rev99
// Semana de facturación: sábado a viernes. El pedido se pasa el mié/jue/vie anterior: la app saca una
// "foto" del Radar (obra.viandas_fotos) que queda congelada como base de la facturación.
// El certificado de cada miércoles factura el pedido de la semana en curso + las diferencias de la
// semana anterior (ya terminada) entre lo pedido y lo que corresponde facturar.
// Reglas de la orden de compra:
//  · Almuerzo: se factura lo pedido; se pueden restar hasta 25 por día avisando antes de las 11 hs.
//  · Cena: se pide el 60% de lo proyectado, con piso de 50 por día (si lo proyectado es ≤ 50, todo).
//  · Todas: si se despacha menos de lo acordado se factura lo acordado; si se despacha más, la
//    diferencia se suma en el certificado siguiente.
// Solo los admins de obra (rol admin) sacan la foto, cargan ajustes y generan certificados;
// Lagunas (admin_viandas) lo ve en solo lectura. Tablas: viandas_fotos, viandas_ajustes, viandas_certificados.
// ═══════════════════════════════════════════════════════════════════════════
const CERT_ALM_MAX_RESTA=25;
const CERT_ALM_HORA_LIM=11;
const CERT_CENA_PCT=0.6;
const CERT_CENA_PISO=50;
const certCero=()=>({desayuno:0,almuerzo:0,merienda:0,cena:0});
// Sábado de la semana de facturación que contiene la fecha
const certSemanaDe=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return cmdAddDays(iso,-((new Date(y,m-1,d).getDay()+1)%7));};
const certDias=(semana)=>{const a=[];for(let i=0;i<7;i++)a.push(cmdAddDays(semana,i));return a;};
const certPedidoCena=(prog)=>prog<=CERT_CENA_PISO?prog:Math.max(CERT_CENA_PISO,Math.ceil(prog*CERT_CENA_PCT));
const certPedidoDe=(prog)=>({...prog,cena:certPedidoCena(prog.cena)});
const certLblDia=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});};
const certLblSemana=(s)=>'sáb '+cmdFmtDate(s).slice(0,5)+' → vie '+cmdFmtDate(cmdAddDays(s,6)).slice(0,5);
const certDifTxt=(n)=>n>0?'+'+n:String(n);
const certDifCls=(n)=>n>0?'dif-pos':(n<0?'dif-neg':'dif-0');
const certNombre=(user)=>user.nombre||user.email||'';
// ¿Se puede cargar/cambiar el ajuste de ese día? Hasta las 11 hs del mismo día (hora del dispositivo).
const certAjusteAbierto=(iso)=>{const hoy=cmdIsoDate(new Date());if(iso!==hoy)return iso>hoy;return new Date().getHours()<CERT_ALM_HORA_LIM;};
// Un día/comida: lo acordado (pedido + ajuste) se factura aunque se despache menos; lo despachado de más se suma.
const certCalc=(pedido,ajuste,desp)=>{
  const acordado=Math.max(0,pedido+ajuste),exced=Math.max(0,desp-acordado);
  return{pedido,ajuste:acordado-pedido,acordado,desp,exced,fact:acordado+exced,dif:(acordado-pedido)+exced};
};
const certCalcSemana=(foto,ajustes,desp,semana)=>{
  const dias={},tot={};
  CMD_COMIDAS.forEach(c=>{tot[c.key]={pedido:0,ajuste:0,acordado:0,desp:0,exced:0,fact:0,dif:0};});
  certDias(semana).forEach(iso=>{
    const ped=(foto&&foto.dias&&foto.dias[iso]&&foto.dias[iso].pedido)||certCero();
    const dd=(desp&&desp[iso])||certCero();
    dias[iso]={};
    CMD_COMIDAS.forEach(c=>{
      const aj=(ajustes&&ajustes[iso]&&ajustes[iso][c.key])?ajustes[iso][c.key].cantidad:0;
      const r=certCalc(ped[c.key]||0,aj,dd[c.key]||0);
      dias[iso][c.key]=r;
      Object.keys(r).forEach(k=>{tot[c.key][k]+=r[k];});
    });
  });
  return{dias,tot};
};
// Lecturas: devuelven null si la consulta falló (ej. todavía no se crearon las tablas).
const certFetchFoto=async(semana)=>{const{data}=await db.sel("viandas_fotos",{f:[["semana","eq",semana]]});return data===null?null:{foto:data[0]||null};};
const certFetchAjustes=async(desde,hasta)=>{
  const{data}=await db.sel("viandas_ajustes",{f:[["fecha","gte",desde],["fecha","lte",hasta]],lim:1000});
  if(data===null)return null;
  const m={};data.forEach(r=>{(m[r.fecha]||(m[r.fecha]={}))[r.comida]=r;});return m;
};
const certFetchDesp=async(desde,hasta)=>{
  const{data}=await dbSelAll("viandas_despachos",{cols:"id,fecha,comida",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"id.asc"});
  if(data===null)return null;
  const m={};data.forEach(r=>{const x=m[r.fecha]||(m[r.fecha]=certCero());if(x[r.comida]!==undefined)x[r.comida]++;});return m;
};
// Programadas del Radar por día/comida + código de cada persona (la foto guarda quiénes estaban en el pedido)
const certFetchRadar=async(desde,hasta)=>{
  const{data}=await dbSelAll("viandas_calendario",{cols:"fecha,dni,codigo,desayuno,almuerzo,merienda,cena",f:[["fecha","gte",desde],["fecha","lte",hasta]],ord:"fecha.asc,dni.asc"});
  if(data===null)return null;
  const prog={},personas={};
  data.forEach(r=>{
    const p=prog[r.fecha]||(prog[r.fecha]=certCero());
    if(!(r.desayuno||r.almuerzo||r.merienda||r.cena))return;
    CMD_COMIDAS.forEach(c=>{if(r[c.key])p[c.key]++;});
    (personas[r.fecha]||(personas[r.fecha]={}))[r.dni]=r.codigo||'';
  });
  return{prog,personas};
};
const certCopiar=async(txt,showToast)=>{try{await navigator.clipboard.writeText(txt);showToast({msg:'📋 Copiado'});}catch(e){prompt('Copiá el texto:',txt);}};
const certTxtPedido=(semana,dias)=>{
  const tot=certCero(),L=['Pedido de viandas — semana '+certLblSemana(semana)];
  certDias(semana).forEach(iso=>{const p=dias[iso]||certCero();CMD_COMIDAS.forEach(c=>{tot[c.key]+=p[c.key]||0;});L.push(certLblDia(iso)+': '+CMD_COMIDAS.map(c=>c.label+' '+(p[c.key]||0)).join(' · '));});
  L.push('TOTAL: '+CMD_COMIDAS.map(c=>c.label+' '+tot[c.key]).join(' · '));
  return L.join('\n');
};
const certTxtCert=(cert)=>{
  const d=cert.detalle,df=d.dif;
  const L=['Certificado de viandas — miércoles '+cmdFmtDate(cert.fecha),'','Pedido semana '+certLblSemana(d.semana)+':'];
  CMD_COMIDAS.forEach(c=>L.push('  '+c.label+': '+d.pedido.tot[c.key]));
  if(df){
    L.push('','Diferencia certificado anterior (semana '+certLblSemana(df.semana)+'):');
    CMD_COMIDAS.forEach(c=>{const t=df.tot[c.key];L.push('  '+c.label+': '+certDifTxt(t.dif)+(t.ajuste?' (ajustes '+certDifTxt(t.ajuste)+', despachado de más +'+t.exced+')':''));});
  }
  L.push('','Total a certificar:');
  CMD_COMIDAS.forEach(c=>L.push('  '+c.label+': '+d.total[c.key]));
  (d.avisos||[]).forEach(a=>L.push('','⚠️ '+a));
  return L.join('\n');
};
const certEsc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
// Abre el certificado en una ventana aparte, en blanco y negro, lista para imprimir o guardar como PDF.
const certImprimir=(cert)=>{
  const w=window.open('','_blank');
  if(!w){alert('El navegador bloqueó la ventana para imprimir. Permití las ventanas emergentes de esta página y probá de nuevo.');return;}
  const d=cert.detalle,df=d.dif;
  const th=CMD_COMIDAS.map(c=>'<th class="n">'+c.label+'</th>').join('');
  const fila=(lbl,fn,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+certEsc(lbl)+'</td>'+CMD_COMIDAS.map(c=>'<td class="n">'+fn(c.key)+'</td>').join('')+'</tr>';
  let h='<!doctype html><html><head><meta charset="utf-8"><title>Certificado viandas '+cmdFmtDate(cert.fecha)+'</title><style>'
    +'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px;font-size:12px}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:18px 0 6px}'
    +'table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 7px;text-align:left}th{background:#eee}.n{text-align:right}'
    +'.tot td{font-weight:bold;background:#f2f2f2}.av{background:#fff7e0;border:1px solid #d9a400;padding:6px 10px;margin:8px 0}.muted{color:#666;font-size:11px}'
    +'@media print{body{margin:10mm}}</style></head><body>';
  h+='<h1>Certificado de viandas — miércoles '+cmdFmtDate(cert.fecha)+'</h1>';
  h+='<div class="muted">Proveedor: Lagunas del Radal'+(cert.generado_at?' · Generado '+certEsc(fmtTs(cert.generado_at)):'')+(cert.generado_por_nombre?' por '+certEsc(cert.generado_por_nombre):'')+'</div>';
  (d.avisos||[]).forEach(a=>{h+='<div class="av">⚠ '+certEsc(a)+'</div>';});
  h+='<h2>Resumen</h2><table><thead><tr><th>Concepto</th>'+th+'</tr></thead><tbody>';
  h+=fila('Pedido semana '+certLblSemana(d.semana),k=>d.pedido.tot[k]);
  if(df){
    h+=fila('Dif. semana '+certLblSemana(df.semana)+' — ajustes avisados',k=>certDifTxt(df.tot[k].ajuste));
    h+=fila('Dif. semana '+certLblSemana(df.semana)+' — despachado de más',k=>certDifTxt(df.tot[k].exced));
  }
  h+=fila('TOTAL A CERTIFICAR',k=>d.total[k],'tot')+'</tbody></table>';
  h+='<h2>Pedido por día — semana '+certLblSemana(d.semana)+'</h2><table><thead><tr><th>Día</th>'+th+'</tr></thead><tbody>';
  certDias(d.semana).forEach(iso=>{const p=d.pedido.dias[iso]||certCero();h+=fila(certLblDia(iso),k=>p[k]||0);});
  h+=fila('Total',k=>d.pedido.tot[k],'tot')+'</tbody></table>';
  if(df){
    h+='<h2>Diferencias por día — semana '+certLblSemana(df.semana)+'</h2><div class="muted">Cada celda: acordado (pedido ± ajuste) / despachado → diferencia contra el pedido</div><table><thead><tr><th>Día</th>'+th+'</tr></thead><tbody>';
    certDias(df.semana).forEach(iso=>{const r=df.dias[iso];h+=fila(certLblDia(iso),k=>r[k].acordado+' / '+r[k].desp+' → <b>'+certDifTxt(r[k].dif)+'</b>');});
    h+=fila('Total',k=>certDifTxt(df.tot[k].dif),'tot')+'</tbody></table>';
  }
  h+='</body></html>';
  w.document.write(h);w.document.close();w.focus();setTimeout(()=>{try{w.print();}catch(e){}},400);
};
// Si algo falla al dibujar estas secciones nuevas, que no se caiga toda la app (queda el error acá adentro).
class CmdErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error('Viandas: error en sección',err,info);}
  render(){
    if(this.state.err)return <div className="cmd-empty">⚠️ Hubo un error en esta sección: {String((this.state.err&&this.state.err.message)||this.state.err)}<br/><button className="cmd-btn" style={{marginTop:10}} onClick={()=>this.setState({err:null})}>Reintentar</button></div>;
    return this.props.children;
  }
}
function CmdPedidoSemanal({user,canEdit,showToast}){
  const hoy=cmdIsoDate(new Date());
  const semHoy=certSemanaDe(hoy),semSig=cmdAddDays(semHoy,7);
  const[semana,setSemana]=useState(semHoy);
  const[foto,setFoto]=useState(null);       // fila de viandas_fotos (null = no hay)
  const[ajustes,setAjustes]=useState({});   // fecha → comida → fila de viandas_ajustes
  const[desp,setDesp]=useState({});         // fecha → comida → cantidad despachada

    const req=++reqRef.current;
    const[f,a,d,s]=await Promise.all([certFetchFoto(semana),certFetchAjustes(semana,hasta),certFetchDesp(semana,hasta),certFetchFoto(semSig)]);
    if(req!==reqRef.current)return;
    setLoading(false);

  // Datos en vivo cada 20 s (despachos y ajustes), así Lagunas ve los cambios sin recargar
  useEffect(()=>{setLoading(true);setDraft(null);load();const i=setInterval(load,20000);return()=>clearInterval(i);},[semana]);
  // El Radar se lee aparte: es la consulta más pesada y no hace falta repetirla cada 20 s
  useEffect(()=>{let vivo=true;setRadar(undefined);certFetchRadar(semana,hasta).then(r=>{if(vivo)setRadar(r?r.prog:null);});return()=>{vivo=false;};},[semana,radarTick]);

  const deRadar=!!(fotoVis&&fotoVis.origen!=='manual');
  const est=foto?foto.estado:null;

  const crearFoto=async(desdeRadar)=>{
    if(est==='confirmada'){alert('El pedido de esta semana ya está confirmado. Para cambiarlo primero tocá "🔓 Reabrir".');return;}
    if(foto&&!confirm('Ya hay un pedido en borrador para esta semana. ¿Reemplazarlo'+(desdeRadar?' con lo que dice hoy el Radar':' por uno en cero para cargar a mano')+'?\n\nSe pierden los cambios hechos a mano.'))return;
    setBusy(true);
    const d={};let personas=null;
    if(desdeRadar){
      const r=await certFetchRadar(semana,hasta);
      if(!r){setBusy(false);alert('No se pudo leer el Radar (viandas_calendario).');return;}

    if(n===0){

            <tr style={{borderTop:'2px solid var(--bd)'}}>

      </div>}
    </>)}

            <span style={{color:'var(--tx3)',fontWeight:500}}>{r.acordado} / {r.desp} → </span><span className={certDifCls(r.dif)}>{certDifTxt(r.dif)}</span>
          </td>;})}</tr>)}
        </tbody>
      </table></div>
      <div className="cmd-hint">Cada celda: acordado (pedido ± ajuste) / despachado → diferencia contra el pedido. Positivo se suma a este certificado; negativo queda a favor de la obra.</div>
    </>}
  </div>;
}
function CmdCertificados({user,canEdit,showToast}){
  const hoy=cmdIsoDate(new Date());
  const[lista,setLista]=useState(null);
  const[err,setErr]=useState(null);
  const[ver,setVer]=useState(null);        // certificado guardado abierto
  const[preview,setPreview]=useState(null);// certificado calculado sin guardar
  const[fechaN,setFechaN]=useState(()=>cmdAddDays(certSemanaDe(hoy),4));
  const[busy,setBusy]=useState(false);
  const load=async()=>{
    const{data}=await db.sel("viandas_certificados",{ord:"semana.desc",lim:200});
    if(data===null){setErr('No se pudo leer el historial de certificados. Si es la primera vez, falta crear la tabla viandas_certificados en Supabase.');setLista([]);return;}
    setErr(null);setLista(data);
  };
  useEffect(()=>{load();},[]);
  const semN=certSemanaDe(fechaN||hoy);
  const calcular=async()=>{
    const semana=semN,prev=cmdAddDays(semN,-7),prevHasta=cmdAddDays(prev,6);
    setBusy(true);
    const[f,fp,aj,de]=await Promise.all([certFetchFoto(semana),certFetchFoto(prev),certFetchAjustes(prev,prevHasta),certFetchDesp(prev,prevHasta)]);
    setBusy(false);
    if(!f||!fp||aj===null||de===null){alert('No se pudieron leer los datos. ¿Ya se crearon las tablas en Supabase?');return;}
    const foto=f.foto,fotoPrev=fp.foto;
    if(!foto||foto.estado!=='confirmada'){alert('Falta '+(foto?'confirmar':'sacar')+' la foto del pedido de la semana '+certLblSemana(semana)+'.\n\nEl certificado factura ese pedido: hacelo desde "📦 Pedido semanal".');return;}
    const avisos=[];
    const pedido={dias:{},tot:certCero()};
    certDias(semana).forEach(iso=>{const x=foto.dias&&foto.dias[iso];const p=(x&&x.pedido)||certCero();pedido.dias[iso]=p;CMD_COMIDAS.forEach(c=>{pedido.tot[c.key]+=p[c.key]||0;});});
    let dif=null;
    if(!fotoPrev||fotoPrev.estado!=='confirmada'){
      avisos.push('No hay pedido confirmado de la semana '+certLblSemana(prev)+': el certificado sale sin diferencias de la semana anterior.');
    }else{
      const cs=certCalcSemana(fotoPrev,aj,de,prev);
      dif={semana:prev,dias:cs.dias,tot:cs.tot};
      if(prevHasta>=hoy)avisos.push('La semana '+certLblSemana(prev)+' todavía no terminó: las diferencias pueden cambiar.');
      const sinDesp=certDias(prev).filter(iso=>iso<=hoy&&!de[iso]);
      if(sinDesp.length)avisos.push('En la semana '+certLblSemana(prev)+' no hay despachos registrados en la app el '+sinDesp.map(certLblDia).join(', ')+'. Para esos días se toma lo acordado, sin sumar diferencias.');
    }
    const total={};CMD_COMIDAS.forEach(c=>{total[c.key]=pedido.tot[c.key]+(dif?dif.tot[c.key].dif:0);});
    setPreview({semana,fecha:cmdAddDays(semana,4),detalle:{semana,pedido,dif,total,avisos},generado_por_nombre:certNombre(user)});
  };
  const guardar=async()=>{
    const p=preview;
    if((lista||[]).some(x=>x.semana===p.semana)&&!confirm('Ya hay un certificado guardado para el mié '+cmdFmtDate(p.fecha)+'. ¿Reemplazarlo por este?'))return;
    const row={semana:p.semana,fecha:p.fecha,detalle:p.detalle,generado_por:user.id,generado_por_nombre:certNombre(user),generado_at:new Date().toISOString()};
    setBusy(true);const{ok}=await db.ins("viandas_certificados",row,true,"semana");setBusy(false);
    if(!ok){alert('No se pudo guardar el certificado. ¿Ya se creó la tabla viandas_certificados en Supabase?');return;}
    showToast({msg:'🧾 Certificado guardado'});setPreview(null);setVer(row);load();
  };
  if(preview)return <CmdCertDetalle cert={preview} preview busy={busy} onVolver={()=>setPreview(null)} onGuardar={guardar} showToast={showToast}/>;
  if(ver)return <CmdCertDetalle cert={ver} onVolver={()=>setVer(null)} showToast={showToast}/>;
  return <div>
    {canEdit&&<div className="cmd-rep">
      <h3>🧾 Nuevo certificado</h3>
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <label style={{fontSize:11,color:'var(--tx2)',textTransform:'uppercase',fontWeight:700,letterSpacing:.5}}>Miércoles del certificado</label>
        <input type="date" value={fechaN} onChange={e=>setFechaN(e.target.value)} style={{background:'var(--s2)',border:'1px solid var(--bd)',color:'var(--tx)',borderRadius:4,padding:'6px 8px',fontFamily:'var(--fm)',fontSize:13}}/>
        <button className="cmd-btn pri" disabled={busy||!fechaN} onClick={calcular}>{busy?'Calculando…':'Calcular'}</button>
      </div>
      <div className="cmd-hint">Certificado del mié {cmdFmtDate(cmdAddDays(semN,4))}: factura el pedido de la semana {certLblSemana(semN)} + las diferencias de la semana {certLblSemana(cmdAddDays(semN,-7))}. Se calcula, lo revisás y recién ahí lo guardás.</div>
    </div>}
    <div className="cmd-rep">
      <h3>Historial de certificados</h3>
      {err&&<div className="cmd-aviso">{err}</div>}
      {lista===null?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Cargando…</div>:
       (lista.length===0?<div style={{color:'var(--tx3)',fontSize:12,padding:8}}>Todavía no hay certificados guardados.</div>:
       <div className="cmd-clist">{lista.map(c=><button key={c.semana} className="cmd-citem" onClick={()=>setVer(c)}>
         <strong>Mié {cmdFmtDate(c.fecha)}</strong>
         <span style={{fontSize:12,color:'var(--tx2)'}}>pedido {certLblSemana(c.semana)}</span>
         <span style={{fontFamily:'var(--fm)',fontSize:12,marginLeft:'auto'}}>{CMD_COMIDAS.map(x=>x.em+' '+((c.detalle&&c.detalle.total&&c.detalle.total[x.key])||0)).join('   ')}</span>
       </button>)}</div>)}
    </div>
  </div>;
}

// ─── Componente Comedor (wrapper del módulo entero) — Fase B: Supabase ─────
function Comedor({user,proyectoId}){
  const isAdmin=user.rol==='admin';              // admin general de ControlObra
  const isAdminViandas=user.rol==='admin_viandas'; // admin del módulo Viandas (puede editar dieta + simular puesto en Escanear)
  const canEditDieta=isAdmin||isAdminViandas;
  // Puesto simulado para admin_viandas — arranca en null hasta que elija
  const[simuladoPuesto,setSimuladoPuesto]=useState(null);
  const userPuestoBase=cmdPuestoFromRol(user.rol);
  // userPuesto: para cocineros el que viene del rol; para admin general null (no escanea); para admin_viandas el que eligió simular
  const userPuesto=isAdmin?null:(isAdminViandas?simuladoPuesto:userPuestoBase);
  const puedeEscanear=(!isAdmin);  // cocineros y admin_viandas pueden ver Escanear
  const verPedidos=isAdmin||isAdminViandas; // Pedido semanal + Certificados: admin edita, Lagunas (admin_viandas) solo mira
  const[subtab,setSubtab]=useState(isAdmin?'listado':'scan');
  const[resInicio,setResInicio]=useState(null); // Reporte: fecha "desde" del resumen de 7 días (null = últimos 7 hasta hoy)
  const[fecha,setFecha]=useState(()=>cmdIsoDate(new Date()));
  const[personasRadar,setPersonasRadar]=useState([]); // listado del día según el Radar
  const[agregados,setAgregados]=useState({});         // dni → fila de viandas_agregados (no listados / comidas no programadas)
  const personasDia=useMemo(()=>cmdMergeAgregados(personasRadar,agregados),[personasRadar,agregados]);
  const[agregando,setAgregando]=useState(null);       // DNI inicial del modal "Agregar persona" (null = cerrado)
  const[despachosDia,setDespachosDia]=useState([]);
  const[dieta,setDieta]=useState({});
  const[chaletSet,setChaletSet]=useState(new Set()); // DNIs de personas que comen en chalet hoy
  const[platos,setPlatos]=useState({}); // dni → entregado_at (plato/tarjeta, fijo por persona)
  const[loading,setLoading]=useState(true);
  const[prefix,setPrefix]=useState(()=>new Set());
  const[picked,setPicked]=useState(null);
  const[toast,setToast]=useState(null);
  const[dietaEditing,setDietaEditing]=useState(null);
  const showToast=(o)=>{setToast(o);setTimeout(()=>setToast(null),o.dur||2200);};

  // Cargar personas del día + despachos del día + dieta + come_chalet + platos (todo desde Supabase)
  const loadAll=async()=>{
    const[p,d,di,ch,pl,ag]=await Promise.all([
      cmdFetchPersonasFecha(fecha),
      cmdFetchDespachos(fecha),
      cmdFetchDieta(),
      cmdFetchComeChalet(fecha),
      cmdFetchPlatos(),
      cmdFetchAgregados(fecha),
    ]);
    setPersonasRadar(p);setDespachosDia(d);setDieta(di);setChaletSet(ch);setPlatos(pl);setAgregados(ag);setLoading(false);
  };
  // Poll cada 3s: refresca despachos + dieta + chaletSet + platos + agregados (el calendario del día no cambia intra-día)
  const loadSync=async()=>{
    const[d,di,ch,pl,ag]=await Promise.all([cmdFetchDespachos(fecha),cmdFetchDieta(),cmdFetchComeChalet(fecha),cmdFetchPlatos(),cmdFetchAgregados(fecha)]);
    setDespachosDia(d);setDieta(di);setChaletSet(ch);setPlatos(pl);setAgregados(ag);
  };
  useEffect(()=>{setLoading(true);loadAll();},[fecha]);
  useEffect(()=>{const i=setInterval(loadSync,3000);return()=>clearInterval(i);},[fecha]);

  // repetir=true solo aplica a almuerzo y cena (se puede entregar más de un plato por persona por día, con aviso)
  const addDespacho=async(persona,comida,repetir=false)=>{
    const puedeRepetir=repetir&&cmdRepetible(comida);
    // Idempotencia: chequeo local + unique index en DB (fecha,dni,comida) para desayuno y merienda
    if(!puedeRepetir&&despachosDia.some(d=>d.dni===persona.dni&&d.comida===comida))return;
    const record={fecha,dni:persona.dni,comida,puesto:userPuesto||'ADMIN',operador_id:user.id,operador_email:user.email||null};
    const{data,ok}=await db.ins("viandas_despachos",record);
    if(!ok){showToast({msg:puedeRepetir?'No se pudo registrar el plato repetido (¿falta el cambio del índice en Supabase?)':'No se pudo despachar (¿ya despachado por el otro puesto?)',err:true});await loadSync();return;}
    const c=CMD_COMIDAS.find(x=>x.key===comida);
    showToast({msg:`${c.em} ${c.label}${puedeRepetir?' (repetida)':''} → ${persona.nombre} ${persona.apellido}`});
    // Optimista: agrega local ya, próximo poll confirma
    if(data&&data[0])setDespachosDia(prev=>[...prev,{id:data[0].id,personaId:data[0].dni,dni:data[0].dni,comida:data[0].comida,puesto:data[0].puesto,operador:data[0].operador_email,ts:data[0].ts,fecha:data[0].fecha}]);
  };
  const removeDespacho=async(id)=>{
    const des=despachosDia.find(x=>x.id===id);
    await db.del("viandas_despachos",[["id","eq",id]]);
    setDespachosDia(prev=>prev.filter(x=>x.id!==id));
    showToast({msg:'Despacho deshecho',dur:1500});
    // Si era una comida agregada y no le queda ningún otro despacho de esa comida, se saca del agregado
    // (y si no le queda ninguna comida agregada, se borra el registro: fue un error de carga).
    const a=des&&agregados[des.dni];
    if(!a||!(a.comidas||[]).includes(des.comida))return;
    if(despachosDia.some(x=>x.id!==id&&x.dni===des.dni&&x.comida===des.comida))return;
    const rest=(a.comidas||[]).filter(k=>k!==des.comida);
    if(rest.length){
      await db.upd("viandas_agregados",{comidas:rest},[["fecha","eq",fecha],["dni","eq",des.dni]]);
      setAgregados(m=>({...m,[des.dni]:{...a,comidas:rest}}));
    }else{
      await db.del("viandas_agregados",[["fecha","eq",fecha],["dni","eq",des.dni]]);
      setAgregados(m=>{const n={...m};delete n[des.dni];return n;});
    }
  };
  // Entregar a alguien que no está en el listado, o una comida que no tenía programada: se registra en
  // viandas_agregados (quién, cuándo, en qué puesto, motivo) y se despacha.
  const agregarYDespachar=async(p,comidasSel,motivo)=>{
    const prev=agregados[p.dni];
    const comidas=CMD_COMIDAS.map(c=>c.key).filter(k=>comidasSel.includes(k)||(prev&&(prev.comidas||[]).includes(k)));
    const row={fecha,dni:p.dni,nombre:p.nombre||null,apellido:p.apellido||null,empresa:p.empresa||null,comidas,
      motivo:motivo||(prev&&prev.motivo)||null,
      puesto:prev?prev.puesto:(userPuesto||'ADMIN'),
      agregado_por:prev?prev.agregado_por:user.id,
      agregado_por_email:prev?prev.agregado_por_email:(user.email||null),
      agregado_at:prev?prev.agregado_at:new Date().toISOString()};
    const{ok}=await db.ins("viandas_agregados",row,true,"fecha,dni");
    if(!ok){showToast({msg:'No se pudo registrar el agregado (¿falta crear la tabla viandas_agregados en Supabase?)',err:true,dur:4000});return false;}
    setAgregados(m=>({...m,[p.dni]:row}));
    for(const k of comidasSel)await addDespacho(p,k);
    return true;
  };
  const agregarComida=async(persona,ckey)=>{
    const c=CMD_COMIDAS.find(x=>x.key===ckey);
    if(!confirm('⚠️ '+persona.nombre+' '+persona.apellido+' NO tiene '+c.label.toLowerCase()+' programad'+(ckey==='cena'||ckey==='merienda'?'a':'o')+' hoy en el Radar.\n\n¿Entregar igual?\nQueda registrado como agregado (quién, cuándo y en qué puesto).'))return;
    await agregarYDespachar(persona,[ckey],null);
  };
  const confirmarAgregado=async(p,comidasSel,motivo)=>{
    const ok=await agregarYDespachar(p,comidasSel,motivo);
    if(!ok)return;
    setAgregando(null);
    if(subtab==='scan')setPicked({...p,id:p.dni,comidas:comidasSel});
  };
  const saveDieta=async(dni,val)=>{
    // val = {nota,hasta}; upsert por dni (PK)
    const{ok}=await db.ins("viandas_dieta",{dni,nota:val.nota||'',hasta:val.hasta||null,actualizado_por:user.id,actualizado_at:new Date().toISOString()},true,"dni");
    if(!ok){showToast({msg:'No se pudo guardar la dieta',err:true});return;}
    setDieta(prev=>({...prev,[dni]:{nota:val.nota||'',hasta:val.hasta||null}}));
    showToast({msg:'🥗 Dieta guardada'});setDietaEditing(null);
  };
  const quitDieta=async(dni)=>{
    if(!confirm('¿Quitar menú dieta para DNI '+dni+'?'))return;
    await db.del("viandas_dieta",[["dni","eq",dni]]);
    setDieta(prev=>{const n={...prev};delete n[dni];return n;});
    showToast({msg:'Dieta quitada'});setDietaEditing(null);
  };
  // Plato/tarjeta: cualquier usuario del comedor lo marca; quitarlo (por error) solo admin / admin_viandas.
  const togglePlato=async(persona)=>{
    const nom=persona.nombre+' '+persona.apellido;
    if(platos[persona.dni]){
      if(!canEditDieta){alert('Esta persona ya tiene plato/tarjeta registrado.\n\nSi fue un error, pedile a un admin de viandas que lo quite.');return;}
      if(!confirm('¿Quitar el registro de plato/tarjeta de '+nom+'?'))return;
      await db.del("viandas_plato",[["dni","eq",persona.dni]]);
      setPlatos(prev=>{const n={...prev};delete n[persona.dni];return n;});
      showToast({msg:'Plato/tarjeta quitado'});
      return;
    }
    if(!confirm('¿Confirmás que '+nom+' recibió plato/tarjeta?\n\nQueda registrado de acá en adelante.'))return;
    const{ok}=await db.ins("viandas_plato",{dni:persona.dni,entregado_por:user.id,puesto:userPuesto||'ADMIN',entregado_at:new Date().toISOString()},true,"dni");
    if(!ok){showToast({msg:'No se pudo registrar el plato/tarjeta (¿falta la tabla en Supabase?)',err:true});return;}
    setPlatos(prev=>({...prev,[persona.dni]:new Date().toISOString()}));
    showToast({msg:'🍽 Plato/tarjeta registrado → '+nom});
  };
  const verDia=(f)=>{setFecha(f);setSubtab('listado');};
  const togglePref=(k)=>setPrefix(prev=>{const n=new Set(prev);if(n.has(k))n.delete(k);else n.add(k);return n;});
  const stats=useMemo(()=>{const t={},d={};CMD_COMIDAS.forEach(c=>{t[c.key]=personasDia.filter(p=>p.comidas.includes(c.key)).length;d[c.key]=despachosDia.filter(x=>x.comida===c.key).length;});return{t,d};},[personasDia,despachosDia]);
  // Días pasados: solo lectura, salvo que se habilite la "carga atrasada" para esa fecha (para pasar lo que se
  // anotó en papel cuando no hubo sistema o luz). Se habilita por fecha: al cambiar de día vuelve a quedar bloqueado.
  const hoyIso=cmdIsoDate(new Date());
  const esPasado=fecha<hoyIso;
  const[atrasoFecha,setAtrasoFecha]=useState(null);
  const isReadOnly=esPasado&&atrasoFecha!==fecha;
  const puedeCargarAtrasado=!!userPuesto||isAdmin;
  const habilitarAtraso=async()=>{
    // Si las diferencias de esa semana ya se certificaron, lo que se cargue no va a figurar en ese certificado
    const{data}=await db.sel("viandas_certificados",{cols:"semana,fecha",f:[["semana","eq",cmdAddDays(certSemanaDe(fecha),7)]]});
    const yaCert=data&&data[0];
    if(!confirm('✏️ CARGA ATRASADA — '+cmdFmtDate(fecha)+'\n\nUsala solo para pasar los despachos que se anotaron en papel cuando no hubo sistema o luz. Cada despacho queda con fecha '+cmdFmtDate(fecha)+' (y la hora real en que lo cargás).'
      +(yaCert?'\n\n⚠️ Las diferencias de esa semana ya se certificaron el mié '+cmdFmtDate(yaCert.fecha)+'. Lo que cargues ahora no va a figurar en ese certificado: avisale a un admin para que lo vuelva a generar.':'')
      +'\n\n¿Habilitar la carga para ese día?'))return;
    setAtrasoFecha(fecha);
  };
  const terminarAtraso=()=>{setAtrasoFecha(null);setFecha(hoyIso);};
  const onPickFromList=(p)=>{setPicked(p);setSubtab('scan');};
  useEffect(()=>{if(isAdmin&&subtab==='scan')setSubtab('listado');},[isAdmin]);

  // Chip del topbar: para admin_viandas sin puesto elegido decimos "🛡️ ADMIN COCINA"
  const chipLabel=userPuesto
    ?('🍽️ '+userPuesto+(isAdminViandas?' (simulado)':''))
    :(isAdminViandas?'🛡️ ADMIN COCINA':'🛡️ ADMIN VIANDAS');

  return <div className="cmd-root">
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
      <span className={'cmd-puestochip '+cmdPuestoClass(userPuesto||'ADMIN')}>{chipLabel}</span>
      {isAdminViandas&&userPuesto&&<button onClick={()=>{setSimuladoPuesto(null);setSubtab('scan');}} style={{background:'none',border:'1px solid var(--bd)',color:'var(--tx2)',padding:'3px 8px',borderRadius:4,fontSize:11,cursor:'pointer'}} title="Cambiar el puesto que estás simulando">↻ Cambiar puesto</button>}
      <RadarSyncBtn user={user} onDone={loadAll}/>
      <span style={{fontSize:10,color:'var(--tx3)',textTransform:'uppercase',letterSpacing:.3}}>{loading?'⏳ cargando…':'☁️ conectado a Supabase · sync cada 3s'}</span>
    </div>
    <div className="cmd-stats">
      {CMD_COMIDAS.map(c=>(
        <div key={c.key} className="cmd-stat">
          <span className="icon">{c.em}</span>
          <span className="num">{stats.d[c.key]}<span className="den">/{stats.t[c.key]}</span></span>
          <span className="lbl">{c.short}</span>
        </div>
      ))}
      <div style={{marginLeft:'auto',fontSize:10,color:'var(--tx3)',whiteSpace:'nowrap'}}>Fecha: <strong style={{color:'var(--tx2)'}}>{cmdFmtDate(fecha)}</strong></div>
    </div>
    {esPasado&&(isReadOnly
      ?<div className="cmd-atraso ro">
        <span className="t">📖 Estás viendo el {cmdFmtDate(fecha)}: día pasado, solo lectura.</span>
        {puedeCargarAtrasado&&<button className="cmd-btn pri" onClick={habilitarAtraso}>✏️ Cargar despachos atrasados</button>}
        <button className="cmd-btn" onClick={()=>setFecha(hoyIso)}>← Volver a hoy</button>
      </div>
      :<div className="cmd-atraso on">
        <span className="t">✏️ Carga atrasada · despachos del {cmdFmtDate(fecha)}</span>
        <button className="cmd-btn ok" onClick={terminarAtraso}>✓ Terminar y volver a hoy</button>
      </div>)}
    <div className="cmd-tabs">
      {puedeEscanear&&<button className={'cmd-tab '+(subtab==='scan'?'active':'')} onClick={()=>setSubtab('scan')}>📷 Escanear</button>}
      <button className={'cmd-tab '+(subtab==='listado'?'active':'')} onClick={()=>setSubtab('listado')}>📋 Listado</button>
      <button className={'cmd-tab '+(subtab==='reporte'?'active':'')} onClick={()=>setSubtab('reporte')}>📊 Reporte</button>
      {verPedidos&&<button className={'cmd-tab '+(subtab==='pedido'?'active':'')} onClick={()=>setSubtab('pedido')}>📦 Pedido semanal</button>}
      {verPedidos&&<button className={'cmd-tab '+(subtab==='cert'?'active':'')} onClick={()=>setSubtab('cert')}>🧾 Certificados</button>}
    </div>
    {loading?<div className="cmd-empty">Cargando datos del día…</div>:<>
      {subtab==='scan'&&puedeEscanear&&(
        // Admin viandas sin puesto elegido → pantalla de selección; luego pasa al escaneo real
        isAdminViandas&&!simuladoPuesto
          ?<CmdSeleccionPuesto onElegir={setSimuladoPuesto}/>
          :<CmdEscanear personas={personasDia} despachos={despachosDia} dieta={dieta} platos={platos} onTogglePlato={togglePlato} prefix={prefix} togglePref={togglePref} onDispatch={addDespacho} onUndispatch={removeDespacho} preloadPersona={picked} clearPreload={()=>setPicked(null)} fecha={fecha} isReadOnly={isReadOnly} onAgregarComida={agregarComida} onAgregarPersona={setAgregando}/>
      )}
      {subtab==='listado'&&<CmdListado personas={personasDia} despachos={despachosDia} fecha={fecha} setFecha={setFecha} dieta={dieta} chaletSet={chaletSet} platos={platos} onTogglePlato={togglePlato} isAdmin={canEditDieta} onOpenDieta={setDietaEditing} onPick={puedeEscanear?onPickFromList:null} onDispatch={addDespacho} onUndispatch={removeDespacho} canDispatch={!!userPuesto||isAdmin} isReadOnly={isReadOnly} onAgregarComida={agregarComida} onAgregarPersona={setAgregando}/>}
      {subtab==='reporte'&&<CmdReporte personas={personasDia} despachos={despachosDia} fecha={fecha} onVerDia={verDia} resInicio={resInicio} setResInicio={setResInicio}/>}
      {subtab==='pedido'&&verPedidos&&<CmdErrBoundary><CmdPedidoSemanal user={user} canEdit={isAdmin} showToast={showToast}/></CmdErrBoundary>}
      {subtab==='cert'&&verPedidos&&<CmdErrBoundary><CmdCertificados user={user} canEdit={isAdmin} showToast={showToast}/></CmdErrBoundary>}
    </>}
    {toast&&<div className={'cmd-toast '+(toast.err?'err':'')}>{toast.msg}</div>}
    {dietaEditing&&<CmdDietaModal persona={dietaEditing} currentValue={dieta[dietaEditing.dni]} onSave={(v)=>saveDieta(dietaEditing.dni,v)} onQuit={()=>quitDieta(dietaEditing.dni)} onClose={()=>setDietaEditing(null)}/>}
    {agregando!==null&&<CmdAgregarModal dniInicial={agregando} personas={personasDia} onClose={()=>setAgregando(null)} onConfirm={confirmarAgregado}/>}
  </div>;
}

// Botón "🔄 Actualizar calendario del Radar" — solo admins (general o viandas).
// Llama al web app del Apps Script del sheet Radar de Obra (endpoint doGet action=coSync).
// La URL + secret viven en obra.app_config (compartido por todos los dispositivos); el ⚙️ los edita.
function RadarSyncBtn({user,onDone}){
  const isAdminGral=user.rol==='admin';
  const isAdminVian=user.rol==='admin_viandas';
  const puede=isAdminGral||isAdminVian;
  const[syncing,setSyncing]=useState(false);
  const[msg,setMsg]=useState(null);
  if(!puede)return null;
  // Configura URL + secret y los guarda en Supabase (obra.app_config) → quedan disponibles
  // para todos los dispositivos logueados, no solo este navegador.
  const cfgURL=async()=>{
    const cur=await getRadarCfg()||{url:'',secret:''};
    const nueva=prompt('URL del web app del Apps Script del Radar de Obra:\n(la que termina en /exec)',cur.url);
    if(nueva===null)return false;
    const nuevaSec=prompt('Secret (CO_API_SECRET) del Radar de Obra:',cur.secret);
    if(nuevaSec===null)return false;
    if(!nueva.trim()||!nuevaSec.trim()){alert('La URL y el secret no pueden quedar vacíos.');return false;}
    const{ok}=await saveRadarCfg(nueva.trim(),nuevaSec.trim(),user.id);
    if(!ok){alert('Se guardó en este navegador, pero no se pudo guardar en Supabase (¿falta la tabla app_config?). Los demás dispositivos no la van a ver.');return true;}
    alert('✅ Configuración guardada para todos los dispositivos.');
    return true;
  };
  const doSync=async()=>{
    if(!await getRadarCfg()){
      if(!confirm('El sync del Radar todavía no está configurado. ¿Configurar ahora la URL y el secret del web app?'))return;
      if(!await cfgURL())return;
    }
    if(!confirm('¿Ejecutar sincronización del Radar de Obra ahora?\n\nLee del sheet las fechas de hoy + 10 días adelante y las pisa en viandas_calendario. Puede tardar 30-60 segundos.'))return;
    setSyncing(true);setMsg(null);
    const res=await runRadarSync();
    if(!res.ok)setMsg({t:'err',txt:res.msg.split('\n')[0]});
    else{
      const filas=res.stats.filas_upsertadas||0;const fechas=(res.stats.fechas||[]).length;
      setMsg({t:'ok',txt:'✅ Sync OK · '+filas+' filas en '+fechas+' fechas'});
      onDone&&onDone();  // Recarga los datos de la vista
    }
    setSyncing(false);
    setTimeout(()=>setMsg(null),5000);
  };
  return <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:8}}>
    <button onClick={doSync} disabled={syncing} style={{background:'rgba(96,165,250,.12)',border:'1px solid var(--cmd-info)',color:'var(--cmd-info)',borderRadius:4,padding:'5px 10px',fontFamily:'var(--fh)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.3,cursor:syncing?'wait':'pointer',opacity:syncing?.5:1}} title="Ejecutar el sync del Radar de Obra ahora (hoy + 10 días)">
      {syncing?'⏳ sincronizando…':'🔄 Actualizar calendario'}
    </button>
    <button onClick={cfgURL} style={{background:'none',border:'1px solid var(--bd)',color:'var(--tx3)',borderRadius:4,padding:'5px 7px',fontSize:11,cursor:'pointer'}} title="Configurar URL y secret del web app del Radar de Obra">⚙️</button>
    {msg&&<span style={{fontSize:11,color:msg.t==='err'?'var(--cmd-err)':'var(--cmd-ok)',fontWeight:600}}>{msg.txt}</span>}
  </div>;
}

// ─── PUESTO ESCANER ───────────────────────────────────────────────────────────
const F={V:"v",P:"p",C:"c",D:"d"};
function RecentSessions({puesto,onSelectSesion}){
  const[list,setList]=useState([]);
  const[personas,setPersonas]=useState({});
  const[vehiculos,setVehiculos]=useState({});
  const[regsMap,setRegsMap]=useState({});

  useEffect(()=>{
    const load=async()=>{
      const{data:ses}=await db.sel("sesiones_acceso",{f:[["puesto","eq",puesto],["cerrada_at","gte",today()+"T00:00:00"]],ord:"cerrada_at.desc",lim:6});
      if(!ses||!ses.length)return;
      setList(ses);
      const vids=[...new Set(ses.filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
      const sesIds=ses.map(s=>s.id);
      const[{data:vehs},{data:regs}]=await Promise.all([
        vids.length?db.sel("vehiculos",{cols:"id,patente,descripcion,tipo"}):{data:[]},
        db.sel("registros_acceso",{cols:"sesion_id,persona_id,dni_raw,resultado",inFilter:["sesion_id",sesIds]}),
      ]);
      const vm={};(vehs||[]).forEach(v=>{vm[v.id]=v;});setVehiculos(vm);
      const rm={};
      (regs||[]).filter(r=>sesIds.includes(r.sesion_id)).forEach(r=>{if(!rm[r.sesion_id])rm[r.sesion_id]=[];rm[r.sesion_id].push(r);});
      setRegsMap(rm);
      const pids=[...new Set((regs||[]).filter(r=>r.persona_id).map(r=>r.persona_id))];
      if(pids.length){const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido"});const pm={};(pers||[]).forEach(p=>{pm[p.id]=p;});setPersonas(pm);}
    };
    load();
  },[puesto]);

  if(!list.length)return null;

  const getPaxStr=(sesId)=>{
    const ok=(regsMap[sesId]||[]).filter(r=>r.resultado==="aprobado");
    if(!ok.length)return"sin pasajeros";
    const names=ok.map(r=>{const p=personas[r.persona_id];return p?`${p.nombre} ${p.apellido}`:r.dni_raw;});
    if(names.length<=2)return names.join(", ");
    return names.slice(0,2).join(", ")+" y "+(names.length-2)+" mas...";
  };

  return <>
    <div className="rt">Ultimos movimientos del dia en este puesto</div>
    {list.map(s=>{
      const veh=vehiculos[s.vehiculo_id];
      return <div key={s.id} className="sr" onClick={()=>onSelectSesion(s)}>
        <span className={`ld ld-${s.direccion==="entrada"?"in":"out"}`}>{s.direccion}</span>
        <div style={{flex:1,minWidth:0}}>
          <span style={{fontFamily:"var(--fm)",fontWeight:600,fontSize:13}}>{veh?veh.patente:"—"}</span>
          <span style={{color:"var(--tx2)",fontSize:12,marginLeft:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{getPaxStr(s.id)}</span>
        </div>
        <span style={{color:"var(--tx2)",fontSize:11,fontFamily:"var(--fm)",flexShrink:0}}>{fmtTs(s.cerrada_at)}</span>
      </div>;
    })}
  </>;
}


// ─── (Funcionalidad offline eliminada) ───────────────────────────────────────
// La app trabaja solo online. Sin internet no se ficha: el garitero usa la hoja
// alternativa en papel. Se quitaron offlineStore, OfflineModePanel y PendingUploads
// para evitar que fichadas viejas se vuelquen a destiempo y descoordinen P2/P3.

function Puesto({user,pid}){
  const isAdmin=user.rol==="admin";
  const[adminPuesto,setAdminPuesto]=useState(null);
  const effPuesto=isAdmin?adminPuesto:user.puesto_nombre;
  const userEff={...user,puesto_nombre:effPuesto};
  const[paxSugFrom,setPaxSugFrom]=useState(null); // {puesto, timestamp}
  const[fase,setFase]=useState(F.V);
  const[dir,setDir]=useState("entrada");
  const[val,setVal]=useState("");
  const[veh,setVeh]=useState(null);
  const[pax,setPax]=useState([]);
  const[flash,setFlash]=useState(null);
  const[saving,setSaving]=useState(false);
  const[habs,setHabs]=useState([]);
  const[radarMap,setRadarMap]=useState({});
  const[radarLoaded,setRadarLoaded]=useState(null); // timestamp última carga
  const[refreshingRadar,setRefreshingRadar]=useState(false);
  const[radarMsg,setRadarMsg]=useState(null); // "✓ Radar actualizado" unos segundos después del botón
  const[showManual,setShowManual]=useState(false);
  const[detalleSes,setDetalleSes]=useState(null);
  const[refreshKey,setRefreshKey]=useState(0);
  const[cola,setCola]=useState([]); // escaneadas pausadas
  const ref=useRef();
  const[paxSnap,setPaxSnap]=useState([]);
  const[warnDupVeh,setWarnDupVeh]=useState(null); // {patente, dir} si ya figura adentro
  const[saveStatus,setSaveStatus]=useState(null); // null | "online"
  const[comidasHoy,setComidasHoy]=useState({}); // persona_id -> {id, come, ubicacion}
  const[warnSalidaComida,setWarnSalidaComida]=useState(null); // {paxNombres, dirFinal}

  const[offline,setOffline]=useState(!isOnline()); // sin conexión → banner + no permite fichar

  // Rev86: Radar del día en memoria — se usa para derivar cp_ingreso automáticamente
  // desde viandas_calendario del día. Refresh 1h automático + botón "🔄 Actualizar".
  const loadRadar=async()=>{
    if(!isOnline())return;
    try{const m=await fetchRadarDia();setRadarMap(m||{});setRadarLoaded(Date.now());}catch(e){console.warn("loadRadar:",e);}
  };
  // Botón "🔄 Actualizar": primero trae lo último del sheet del Radar (sync remoto, 30-60 s) y después re-lee.
  // Antes solo re-leía Supabase, así que un cambio recién hecho en el sheet no aparecía.
  const refreshRadarManual=async()=>{
    setRefreshingRadar(true);setRadarMsg(null);
    const res=await runRadarSync();
    await loadRadar();
    setRefreshingRadar(false);
    if(!res.ok){alert(res.msg);return;}
    setRadarMsg("✓ Radar actualizado");setTimeout(()=>setRadarMsg(null),8000);
  };
  useEffect(()=>{loadRadar();const i=setInterval(loadRadar,60*60*1000);return()=>clearInterval(i);},[pid]);

  useEffect(()=>{
    const loadHabs=async()=>{
      if(!isOnline()){setOffline(true);return;}
      try{
        const{data:h}=await db.sel("habilitaciones",{f:[["suspendida","eq",false]],lim:5000});
        if(h){setHabs(h);setOffline(false);}
        else setOffline(true);
      }catch(e){setOffline(true);}
    };
    loadHabs();
    // Refresco cada 5 min para que el garitero (que no refresca la página) tenga las habilitaciones al día.
    const i=setInterval(loadHabs,5*60*1000);
    // Actualizar el banner de conexión apenas cambia el estado de red del navegador.
    const upd=()=>{const off=!isOnline();setOffline(off);if(!off){loadHabs();loadRadar();}};
    window.addEventListener('online',upd);window.addEventListener('offline',upd);
    return()=>{clearInterval(i);window.removeEventListener('online',upd);window.removeEventListener('offline',upd);};
  },[pid]);
  useEffect(()=>{setTimeout(()=>ref.current&&ref.current.focus(),80);},[fase,flash]);

  // Carga las comidas de hoy (almuerzo) para alertas al fichar salida y para checkbox en escaneo
  const loadComidasHoy=async()=>{
    if(!isOnline())return;
    try{
      const{data}=await db.sel("comidas_diarias",{f:[["fecha","eq",today()],["tipo","eq","almuerzo"]],lim:2000});
      const map={};(data||[]).forEach(c=>{map[c.persona_id]=c;});
      setComidasHoy(map);
    }catch(e){console.warn("loadComidasHoy:",e);}
  };
  useEffect(()=>{loadComidasHoy();const i=setInterval(loadComidasHoy,30000);return()=>clearInterval(i);},[]);
  // "Almorzará en chalet" de una persona al fichar en P2/P3: si hoy ya se decidió (en el otro puesto, al bajar
  // o desde la solapa Chalet) se respeta esa decisión; si no hay nada, por defecto SÍ cuando sube antes de las 11.
  // info: fila de comidas_diarias recién leída (null = no tiene); undefined = usar la que está en memoria.
  const comidaDefault=(personaId,info)=>{
    const c=info!==undefined?info:comidasHoy[personaId];
    const decidido=!!(c&&c.tipo==="almuerzo"&&c.ubicacion==="chalet");
    const esMontana=effPuesto==="Puesto 2"||effPuesto==="Puesto 3";
    return{tieneComidaHoy:decidido&&!!c.come,comeArriba:decidido?!!c.come:(esMontana&&horaArg()<11)};
  };

  const sf=d=>{setFlash(d);setTimeout(()=>setFlash(null),2800);};

  const scanV=useCallback(async()=>{
    const v=val.trim().toUpperCase();if(!v)return;
    if(!isOnline()){sf({ok:false,label:"SIN CONEXIÓN",sub:"No se puede fichar",reason:"Registrá la fichada en la hoja alternativa"});setVal("");return;}
    let found=null;let freshHabs=habs;
    const[r1,r2,r3]=await Promise.all([
      db.sel("vehiculos",{f:[["patente","eq",v]],lim:1}),
      db.sel("habilitaciones",{f:[["entity_type","eq","vehiculo"]]}),
      db.sel("habilitaciones",{f:[["entity_type","eq","persona"]],lim:5000}),
    ]);
    if(r2.data===null||r3.data===null){
      // Las consultas fallaron: conexión inestable → no se ficha
      setOffline(true);
      sf({ok:false,label:"CONEXIÓN INESTABLE",sub:"No se pudo consultar la base",reason:"Registrá la fichada en la hoja alternativa"});
      setVal("");return;
    }
    setOffline(false); // la consulta funcionó → hay conexión
    if(r1.data&&r1.data[0])found=r1.data[0];
    freshHabs=[...(r2.data||[]),...(r3.data||[])];setHabs(freshHabs);
    if(!found){
      sf({ok:false,label:"VEHICULO NO REGISTRADO",sub:v,reason:"No esta en la base — se registran solo las personas"});
      found={id:null,patente:v,tipo:"Camioneta",descripcion:"No registrado",_noRegistrado:true};
    }
    // Sugerencia de pasajeros — SOLO en la pata siguiente del mismo viaje:
    //  · En P3 (vehículo subiendo): sugerir SOLO si su última sesión de montaña fue P2 + entrada.
    //  · En P2 (vehículo bajando):  sugerir SOLO si su última sesión de montaña fue P3 + salida.
    // En cualquier otro caso (P3 bajando del chalet, P2 subiendo de origen, etc.) NO se sugiere:
    // en el chalet cambia quién baja en cada vehículo, y la subida por P2 es el inicio del viaje.
    let suggestedPax=null;let suggestedFrom=null;
    if(found.id&&isOnline()&&(effPuesto==="Puesto 2"||effPuesto==="Puesto 3")){
      const todayStr=today();
      try{
        const{data:recentSes}=await db.sel("sesiones_acceso",{
          cols:"id,cerrada_at,direccion,puesto",
          f:[["vehiculo_id","eq",found.id],["cerrada_at","gte",todayStr+"T00:00:00"]],
          ord:"cerrada_at.desc",lim:10
        });
        const lastMontana=(recentSes||[]).find(s=>s.puesto==="Puesto 2"||s.puesto==="Puesto 3");
        const sugerirDesde=
          (effPuesto==="Puesto 3"&&lastMontana&&lastMontana.puesto==="Puesto 2"&&lastMontana.direccion==="entrada")?lastMontana:
          (effPuesto==="Puesto 2"&&lastMontana&&lastMontana.puesto==="Puesto 3"&&lastMontana.direccion==="salida")?lastMontana:
          null;
        if(sugerirDesde){
          const{data:regs}=await db.sel("registros_acceso",{
            cols:"persona_id,resultado",
            f:[["sesion_id","eq",sugerirDesde.id]]
          });
          // Incluir TODOS los pasajeros de la sesión origen (aprobados Y bloqueados):
          // si alguien subió bloqueado por P2, igual tiene que sugerirse al llegar a P3.
          // El estado (ok/bloqueado) se recalcula más abajo con getHabPills para el puesto actual.
          const candidatos=(regs||[]).filter(rr=>rr.persona_id);
          if(candidatos.length){
            const pids=candidatos.map(rr=>rr.persona_id);
            // Comida de hoy leída en el momento (la decisión de P2 tiene que valer en P3, aunque la memoria
            // de este puesto tenga hasta 30 s de atraso)
            const[{data:pers},{data:cds}]=await Promise.all([
              db.sel("personas",{cols:"id,nombre,apellido,empresa,dni",inFilter:["id",pids]}),
              db.sel("comidas_diarias",{f:[["fecha","eq",todayStr],["tipo","eq","almuerzo"]],inFilter:["persona_id",pids]}),
            ]);
            const personasMap={};(pers||[]).forEach(p=>{personasMap[p.id]=p;});
            const cdMap={};(cds||[]).forEach(c=>{cdMap[c.persona_id]=c;});
            suggestedPax=candidatos.map(rr=>{
              const p=personasMap[rr.persona_id];
              if(!p)return null;
              const auth=getHabPills("persona",p.id,freshHabs,effPuesto,radarMap,p.dni);
              // Antes los sugeridos no traían este dato y al entrar a P3 quedaban SIEMPRE anotados para almorzar
              // (aunque en P2 los hubieran destildado o subieran después de las 11).
              const cm=comidaDefault(p.id,cds?(cdMap[p.id]||null):undefined);
              return {raw:p.dni,person:p,ok:!auth.blocks,reason:auth.reason,pills:auth.pills,activeAuths:[],_sugerido:true,tieneComidaHoy:cm.tieneComidaHoy,comeArriba:cm.comeArriba};
            }).filter(Boolean);
            suggestedFrom={puesto:sugerirDesde.puesto,timestamp:sugerirDesde.cerrada_at,direccion:sugerirDesde.direccion};
          }
        }
      }catch(e){console.warn("scanV: error sugiriendo pasajeros",e);}
    }
    const r=found.id?getHabPills("vehiculo",found.id,freshHabs,effPuesto):{blocks:true,reason:"Vehiculo no registrado",pills:[]};
    setVeh({data:found,ok:!r.blocks,reason:r.reason,pills:r.pills,activeAuths:[]});setVal("");
    if(suggestedPax&&suggestedPax.length){setPax(suggestedPax);setPaxSugFrom(suggestedFrom);}
    else{setPaxSugFrom(null);}
    if(!r.blocks||found._noRegistrado)setFase(F.P);
  },[val,habs,user,effPuesto]);

  const scanP=useCallback(async()=>{
    const v=val.trim();if(!v)return;
    if(!isOnline()){sf({ok:false,label:"SIN CONEXIÓN",sub:"No se puede fichar",reason:"Registrá la fichada en la hoja alternativa"});setVal("");return;}
    if(pax.some(p=>sameDni(p.raw,v))){sf({ok:false,label:"DNI REPETIDO",sub:v,reason:"Ya fue escaneado"});setVal("");return;}
    let found=null;
    // ilike = igual sin distinguir mayúsculas (DNI de extranjeros con letras)
    const{data}=await db.sel("personas",{f:[["dni","ilike",v],["deleted_at","is","null"]],lim:1});
    if(data===null){
      // Consulta falló: conexión inestable → no se ficha
      setOffline(true);
      sf({ok:false,label:"CONEXIÓN INESTABLE",sub:"No se pudo consultar la base",reason:"Registrá la fichada en la hoja alternativa"});
      setVal("");return;
    }
    setOffline(false); // la consulta funcionó → hay conexión
    found=data&&data[0];
    if(!found){
      setPax(p=>[...p,{raw:v.toUpperCase(),person:null,ok:false,reason:"DNI no encontrado",activeAuths:[]}]);
      sf({ok:false,label:"SIN REGISTRO",sub:v,reason:"DNI no encontrado"});
      setVal("");return;
    }
    const r=getHabPills("persona",found.id,habs,effPuesto,radarMap,found.dni);
    const ok=!r.blocks;
    // Comida de hoy + default checkbox "almorzará arriba".
    // Regla: quien sube por P2/P3 antes de las 11 AM come en chalet por default, salvo que hoy ya se haya
    // decidido otra cosa (ej. en P2 lo destildaron). El garitero puede cambiar el checkbox.
    const{tieneComidaHoy,comeArriba}=comidaDefault(found.id);

          const snap=paxSnap.length?paxSnap:pax;
          const paxStr=snap.map(p=>p.person?`${p.person.nombre} ${p.person.apellido} DNI ${p.raw}`:`DNI ${p.raw}`).join("; ");
          const txt=`${d} — ${pat}${desc}${paxStr?` - ${paxStr}`:""}`;
          navigator.clipboard.writeText(txt).catch(()=>{const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);});
        }} style={{background:"var(--s2)",border:"1px solid var(--bd)",color:"var(--tx2)",borderRadius:5,padding:"6px 14px",cursor:"pointer",fontFamily:"var(--fh)",fontSize:12,fontWeight:700,textTransform:"uppercase",whiteSpace:"nowrap",flexShrink:0}}>Copiar</button>
      </div>
      <div style={{display:"flex",gap:28,flexWrap:"wrap"}}><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Vehiculo</div><div style={{fontFamily:"var(--fm)",fontSize:20,fontWeight:600,marginTop:3}}>{veh&&veh.data.patente}</div></div><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Personas</div><div style={{fontFamily:"var(--fh)",fontSize:26,fontWeight:800,marginTop:2}}><span style={{color:"var(--gr)"}}>{(paxSnap.length?paxSnap:pax).filter(p=>p.ok).length}</span>{(paxSnap.length?paxSnap:pax).some(p=>!p.ok)&&<span style={{color:"var(--rd)",fontSize:22}}> / {(paxSnap.length?paxSnap:pax).filter(p=>!p.ok).length}x</span>}</div></div><div><div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase"}}>Tipo</div><div style={{marginTop:6}}><span className={`ld ld-${dir==="entrada"?"in":"out"}`} style={{fontSize:13}}>{dirLabel.toUpperCase()}</span></div></div></div></div>
      <button className="bnew" onClick={nueva}>+ Nuevo vehiculo</button>
      <button className="btn-manual" onClick={()=>setShowManual(true)}>+ Registrar movimiento sin vehiculo</button>
    </>}
    <RecentSessions key={refreshKey} puesto={effPuesto} onSelectSesion={setDetalleSes}/>
    {warnSalidaComida&&<div className="mo"><div className="md">
      <div className="mh"><div className="mt">🍽 Contado para almorzar arriba</div><button className="mc" onClick={()=>setWarnSalidaComida(null)}>x</button></div>
      <div className="mb">
        <div style={{padding:"10px 0 12px"}}>
          <div style={{fontSize:13,color:"var(--tx2)",marginBottom:10}}>Estas personas estaban contadas para almorzar en chalet hoy. Si bajan ahora (antes de las 13:00), seguramente no comen arriba.</div>
          <div style={{padding:"10px 14px",background:"var(--s2)",borderRadius:6,marginBottom:14}}>
            {warnSalidaComida.nombres.map((n,i)=><div key={i} style={{fontWeight:500,marginBottom:3}}>· {n}</div>)}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="bp" style={{background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} onClick={async()=>{
              // Sacarlos de la lista de comensales + registrar la salida
              const todayStr=today();
              for(const pid_ of warnSalidaComida.personaIds){
                await db.upd("comidas_diarias",{come:false,modificada_por:user.id,modificada_at:new Date().toISOString()},[["persona_id","eq",pid_],["fecha","eq",todayStr],["tipo","eq","almuerzo"]]);
              }
              setWarnSalidaComida(null);
              cerrar("salida");
            }}>Sacarlos de la lista y registrar salida</button>
            <button className="bcanc" style={{color:"var(--tx)"}} onClick={()=>{setWarnSalidaComida(null);cerrar("salida");}}>Dejarlos en la lista y registrar salida</button>
            <button className="bcanc" onClick={()=>setWarnSalidaComida(null)}>Cancelar</button>
          </div>
        </div>
      </div>
    </div></div>}
    {warnDupVeh&&<div className="mo"><div className="md">
      <div className="mh"><div className="mt">⚠️ Ya figuran adentro</div><button className="mc" onClick={()=>setWarnDupVeh(null)}>x</button></div>
      <div className="mb">
        <div style={{padding:"10px 0 16px"}}>
          {warnDupVeh.dupVeh&&<div style={{marginBottom:10}}>
            <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",marginBottom:4}}>Vehículo</div>
            <div style={{fontFamily:"var(--fm)",fontSize:18,fontWeight:700}}>{warnDupVeh.dupVeh}</div>
          </div>}
          {warnDupVeh.dupPax&&warnDupVeh.dupPax.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",marginBottom:4}}>Personas</div>
            {warnDupVeh.dupPax.map(n=><div key={n} style={{fontWeight:500,marginBottom:3}}>{n}</div>)}
          </div>}
          <div style={{color:"var(--tx2)",fontSize:13,marginBottom:20}}>Según los registros de hoy ya figuran adentro. Lo más probable es que se haya tocado <strong style={{color:"var(--tx)"}}>ENTRADA</strong> por error cuando en realidad <strong style={{color:"var(--gr)"}}>están saliendo</strong>. Se registra como SALIDA.</div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="bp" style={{background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} onClick={()=>{
              setWarnDupVeh(null);
