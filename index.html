// helper: calcula neto de personas en un puesto dado datos de sesiones+manuales+regs
// calcNet: neto de personas por puesto (clave = persona_id o dni_raw)
const calcNet=async(puesto)=>{
  const todayStr=today();
  const[{data:ses},{data:man}]=await Promise.all([
    db.sel("sesiones_acceso",{f:[["puesto","eq",puesto],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc"}),
    db.sel("movimientos_manuales",{f:[["puesto","eq",puesto],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc"}),
  ]);
  const sesIds=(ses||[]).map(s=>s.id);
  let regPersonas=[];
  if(sesIds.length>0){
    // Filtramos por sesion_id directamente en Supabase (no hay limite de filas)
    const{data:regs}=await db.sel("registros_acceso",{cols:"persona_id,dni_raw,sesion_id",inFilter:["sesion_id",sesIds]});
    regPersonas=regs||[];
  }
  // Normalizar claves: preferir persona_id pero si no hay, usar dni_raw
  // Construir mapa dni_raw -> persona_id para normalizar
  const dniToId={};
  regPersonas.forEach(r=>{if(r.persona_id&&r.dni_raw)dniToId[r.dni_raw]=r.persona_id;});
  const normKey=(pid,dni)=>pid||(dniToId[dni]||dni);

  const netMap={};
  (ses||[]).forEach(s=>{
    const delta=s.direccion==="entrada"?1:-1;
    regPersonas.filter(r=>r.sesion_id===s.id).forEach(r=>{
      const key=normKey(r.persona_id,r.dni_raw);
      netMap[key]=(netMap[key]||0)+delta;
    });
  });
  (man||[]).forEach(m=>{
    const delta=m.direccion==="entrada"?1:-1;
    const key=normKey(m.persona_id,m.dni_raw)||("m_"+m.id);
    netMap[key]=(netMap[key]||0)+delta;
  });
  return netMap;
};

// calcNetVehiculos: neto de vehiculos por puesto (clave = vehiculo_id)
const calcNetVehiculos=async(puesto)=>{
  const todayStr=today();
  const{data:ses}=await db.sel("sesiones_acceso",{
    cols:"vehiculo_id,direccion,cerrada_at,vehiculo_razon",
    f:[["puesto","eq",puesto],["cerrada_at","gte",todayStr+"T00:00:00"]],
    ord:"cerrada_at.asc"
  });
  const netMap={};
  (ses||[]).forEach(s=>{
    // Usar vehiculo_id si existe, sino usar el texto del vehiculo_razon como clave
    const key=s.vehiculo_id||(s.vehiculo_razon&&s.vehiculo_razon.startsWith("No registrado:")?s.vehiculo_razon:null);
    if(!key)return;
    netMap[key]=(netMap[key]||0)+(s.direccion==="entrada"?1:-1);
  });
  return netMap;
};

// calcPosicionesMontana: control cruzado P2 ↔ P3.
// Para cada persona/vehículo, mira TODAS sus fichadas del día en P2 y P3 (sesiones + manuales),
// las ordena por timestamp y decide la posición según la ÚLTIMA. Así, si P3 omitió la salida y P2 la
// registra, la persona deja de figurar en chalet/camino automáticamente.
//  - última P3 entrada → "chalet"
//  - última P3 salida  → "camino" (bajando)
//  - última P2 entrada → "camino" (subiendo)
//  - última P2 salida  → "fuera"
const calcPosicionesMontana=async()=>{
  const todayStr=today();
  const[r1,r2,r3,r4]=await Promise.all([
    db.sel("sesiones_acceso",{f:[["puesto","eq","Puesto 2"],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc",lim:5000}),
    db.sel("sesiones_acceso",{f:[["puesto","eq","Puesto 3"],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc",lim:5000}),
    db.sel("movimientos_manuales",{f:[["puesto","eq","Puesto 2"],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc",lim:5000}),
    db.sel("movimientos_manuales",{f:[["puesto","eq","Puesto 3"],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc",lim:5000}),
  ]);
  const ses=[...(r1.data||[]),...(r2.data||[])];
  const man=[...(r3.data||[]),...(r4.data||[])];
  const sesIds=ses.map(s=>s.id);
  let regs=[];
  if(sesIds.length>0){
    const{data}=await db.sel("registros_acceso",{cols:"persona_id,dni_raw,sesion_id",inFilter:["sesion_id",sesIds]});
    regs=data||[];
  }
  const sesById={};ses.forEach(s=>{sesById[s.id]=s;});
  const dniToId={};regs.forEach(r=>{if(r.persona_id&&r.dni_raw)dniToId[r.dni_raw]=r.persona_id;});
  const normKey=(pid,dni)=>pid||(dniToId[dni]||dni);
  const personEvents={},vehEvents={};
  regs.forEach(r=>{
    const s=sesById[r.sesion_id];if(!s)return;
    const key=normKey(r.persona_id,r.dni_raw);
    if(!personEvents[key])personEvents[key]=[];
    personEvents[key].push({t:new Date(s.cerrada_at).getTime(),puesto:s.puesto,dir:s.direccion});
  });
  man.forEach(m=>{
    const key=normKey(m.persona_id,m.dni_raw)||("m_"+m.id);
    if(!personEvents[key])personEvents[key]=[];
    personEvents[key].push({t:new Date(m.created_at).getTime(),puesto:m.puesto,dir:m.direccion});
  });
  ses.forEach(s=>{
    const key=s.vehiculo_id||(s.vehiculo_razon&&s.vehiculo_razon.startsWith("No registrado:")?s.vehiculo_razon:null);
    if(!key)return;
    if(!vehEvents[key])vehEvents[key]=[];
    vehEvents[key].push({t:new Date(s.cerrada_at).getTime(),puesto:s.puesto,dir:s.direccion});
  });
  const classifyLast=(last)=>{
    if(last.puesto==="Puesto 3"&&last.dir==="entrada")return"chalet";
    if(last.puesto==="Puesto 3"&&last.dir==="salida")return"camino";
    if(last.puesto==="Puesto 2"&&last.dir==="entrada")return"camino";
    return"fuera";
  };
  const persona={},vehiculo={},personaLast={},vehiculoLast={};
  Object.entries(personEvents).forEach(([k,e])=>{
    e.sort((a,b)=>a.t-b.t);
    const last=e[e.length-1];
    persona[k]=classifyLast(last);
    personaLast[k]=last;
  });
  Object.entries(vehEvents).forEach(([k,e])=>{
    e.sort((a,b)=>a.t-b.t);
    const last=e[e.length-1];
    vehiculo[k]=classifyLast(last);
    vehiculoLast[k]=last;
  });
  // Rev122: quien fichó por Puesto 1 DESPUÉS de su última fichada en P2/P3 ya no está en la montaña (P1 está abajo, en
  // la entrada del predio). Corrige una salida de P2/P3 mal escaneada u omitida: ej. el 21/10 COSTA fichó la salida por
  // P1 pero en P3 su DNI se leyó pegado a otro y seguía figurando en el chalet. Lo mismo para los vehículos.
  const[{data:u1},{data:s1}]=await Promise.all([
    db.sel("v_ultima_fichada",{cols:"clave,ts",f:[["puesto","eq","Puesto 1"],["ts","gte",todayStr+"T00:00:00"]],lim:5000}),
    db.sel("sesiones_acceso",{cols:"vehiculo_id,vehiculo_razon,cerrada_at",f:[["puesto","eq","Puesto 1"],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc",lim:5000}),
  ]);
  const p1={};(u1||[]).forEach(x=>{p1[x.clave]=new Date(x.ts).getTime();});
  Object.keys(persona).forEach(k=>{const t=p1[k];if(t&&t>personaLast[k].t)persona[k]="fuera";});
  const v1={};(s1||[]).forEach(x=>{const k=x.vehiculo_id||(x.vehiculo_razon&&x.vehiculo_razon.startsWith("No registrado:")?x.vehiculo_razon:null);if(k)v1[k]=new Date(x.cerrada_at).getTime();});
  Object.keys(vehiculo).forEach(k=>{const t=v1[k];if(t&&t>vehiculoLast[k].t)vehiculo[k]="fuera";});
  return{persona,vehiculo,personaLast,vehiculoLast};
};

// calcPersonasEnPredio: personas dentro del predio.
// Rev91 (2026-09-22): usa la vista SQL `obra.v_ultima_fichada` (DISTINCT ON por persona, orden por ts DESC)
// filtrada desde la fecha de inicio operativo. Esto descarta fichadas de prueba previas al arranque real
// que ensuciaban el conteo (531 falsos positivos).
//   - Si la última fichada operativa es "Puesto 1 salida" → fuera del predio.
//   - Cualquier otra cosa (P1 entrada, o P2/P3 entrada/salida) → dentro del predio.
// Fallback P1-offline sigue funcionando. Cuando arranque una nueva temporada, cambiar OPERATIVA_DESDE.
const OPERATIVA_DESDE="2026-09-21T00:00:00";
const calcPersonasEnPredio=async()=>{
  const{data}=await db.sel("v_ultima_fichada",{f:[["ts","gte",OPERATIVA_DESDE]],lim:20000});
  const inSet=new Set();
  const lastMap={};
  const iniHoy=new Date(today()+"T00:00:00").getTime();
  (data||[]).forEach(r=>{
    // Rev129: un DNI que no está en la base (lectura mala, DNIs pegados, apellido tipeado) solo cuenta el día en que se
    // fichó; si no, como nunca "sale", quedaba en el predio para siempre.
    if(!r.persona_id&&new Date(r.ts).getTime()<iniHoy)return;
    lastMap[r.clave]={t:new Date(r.ts).getTime(),puesto:r.puesto,dir:r.direccion};
    if(!(r.puesto==="Puesto 1"&&r.direccion==="salida"))inSet.add(r.clave);
  });
  return{inSet,lastMap};
};

// ─── Fichadas para corregir (Rev122) ──────────────────────────────────────────
// Caso real del 21/10: en P3 se leyó "4325675741080690" = dos DNIs pegados (SEGOVIA 43256757 + COSTA 41080690). Quedó
// como "DNI no encontrado" y los dos siguieron figurando en el chalet. Ahora: (1) al escanear, si lo leído se puede partir
// en dos DNIs de la base se cargan los dos; (2) las fichadas con DNI que no está en la base quedan en "Para corregir"
// (en el Puesto y en Registros) con sugerencias para resolverlas en un toque.
const fcNorm=(s)=>normDni(s).replace(/[^A-Z0-9]/g,"");
// a y b difieren en un solo carácter (cambiado, de más o de menos)
const fcCasi=(a,b)=>{
  if(a===b)return false;
  if(a.length===b.length){let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]&&++n>1)return false;return n===1;}
  if(Math.abs(a.length-b.length)!==1)return false;
  const[l,s]=a.length>b.length?[a,b]:[b,a];
  for(let i=0;i<l.length;i++)if(l.slice(0,i)+l.slice(i+1)===s)return true;
  return false;
};
// Partir lo leído en dos DNIs conocidos (devuelve [a,b] personas o null). porDni: Map DNI normalizado → persona
const fcPartir=(raw,porDni)=>{
  const r=fcNorm(raw);
  if(r.length<12)return null;
  for(let i=6;i<=r.length-6;i++){const a=porDni.get(r.slice(0,i)),b=porDni.get(r.slice(i));if(a&&b)return[a,b];}
  return null;
};
const fcSugerencias=(raw,porDni)=>{
  const r=fcNorm(raw),out=[],ya=new Set();
  if(!r)return out;
  const push=(personas,txt)=>{const k=personas.map(p=>p.id).join(",");if(ya.has(k))return;ya.add(k);out.push({personas,txt});};
  if(porDni.get(r))push([porDni.get(r)],"ya está dada de alta en Personal");
  const dos=fcPartir(r,porDni);
  if(dos)push(dos[0].id===dos[1].id?[dos[0]]:dos,dos[0].id===dos[1].id?"el mismo DNI leído dos veces":"2 DNIs leídos juntos");
  if(!out.length&&r.length>=10)porDni.forEach((p,d)=>{if(d.length>=7&&(r.startsWith(d)||r.endsWith(d)))push([p],"su DNI está dentro de lo leído");});
  if(!out.length&&r.length>=6&&r.length<=10)porDni.forEach((p,d)=>{if(fcCasi(r,d))push([p],"difiere en un dígito");});
  return out.slice(0,4);
};
const fcProblema=(it)=>{
  const r=fcNorm(it.raw);
  if(!r)return"fichada sin DNI";
  if(/^[A-Z]{2,3}\d{3}[A-Z]{0,3}$/.test(r))return"parece una patente leída como DNI";
  if(r.length>=12)return"lectura demasiado larga (¿2 DNIs pegados?)";
  return"el DNI no está en la base";
};
// Rev124: las correcciones van por funciones de Supabase (SECURITY DEFINER) que verifican que quien corrige sea admin o
// puesto activo de ControlObra y que solo tocan fichadas con persona sin identificar. Así no hace falta abrir permisos de
// escritura sobre las tablas (se comparten con otra app y movimientos_manuales no tiene RLS). Funciones: fc_corregir_registro,
// fc_borrar_registro, fc_corregir_manual, fc_borrar_manual (+ auxiliares fc_puede y fc_recontar, sin acceso desde afuera).
const FC_SQL_HINT='Falta correr en Supabase el SQL de la Rev124 (funciones para corregir fichadas). Avisale a un admin.';
const fcErr=(d)=>{
  const m=String((d&&(d.message||d.hint||d.details))||"");
  if((d&&d.code==="PGRST202")||/Could not find the function|does not exist/i.test(m))return FC_SQL_HINT;
  if(/sin permiso/i.test(m))return"Tu usuario no tiene permiso para corregir fichadas.";
  if(/ya fue corregida|no existe/i.test(m))return"Esa fichada ya fue corregida (o borrada) desde otro lado.";
  return"No se pudo guardar la corrección"+(m?": "+m:". Revisá la conexión y probá de nuevo.");
};
// Rev123: "para corregir" rige de acá en adelante; lo anterior ya se resolvió a mano (pedido del 2026-10-22).
const FC_DESDE='2026-10-22';
// Fichadas con DNI que no está en la base, entre dos días (hora local), de un puesto o de todos
const fcCargar=async(puesto,desde,hasta)=>{
  if(desde<FC_DESDE)desde=FC_DESDE;
  if(hasta<desde)return[];
  const ini=new Date(desde+"T00:00:00").toISOString(),fin=new Date(cmdAddDays(hasta,1)+"T00:00:00").toISOString();
  const fs=[["cerrada_at","gte",ini],["cerrada_at","lt",fin]];if(puesto)fs.push(["puesto","eq",puesto]);
  const fm=[["created_at","gte",ini],["created_at","lt",fin],["persona_id","is","null"]];if(puesto)fm.push(["puesto","eq",puesto]);
  const[{data:ses},{data:man}]=await Promise.all([
    db.sel("sesiones_acceso",{cols:"id,puesto,direccion,cerrada_at",f:fs,lim:3000}),
    db.sel("movimientos_manuales",{cols:"id,puesto,direccion,created_at,dni_raw,nombre_raw",f:fm,lim:2000}),
  ]);
  if(!ses||!man)return null;
  const sm={};ses.forEach(s=>{sm[s.id]=s;});
  const ids=ses.map(s=>s.id);let regs=[];
  for(let i=0;i<ids.length;i+=80){
    const{data}=await db.sel("registros_acceso",{cols:"id,sesion_id,dni_raw,orden_escaneo",inFilter:["sesion_id",ids.slice(i,i+80)],f:[["persona_id","is","null"]]});
    if(!data)return null;regs=regs.concat(data);
  }
  const items=[
    ...regs.map(r=>{const s=sm[r.sesion_id];return{tipo:"reg",id:r.id,sid:r.sesion_id,orden:r.orden_escaneo,raw:r.dni_raw||"",ts:s.cerrada_at,puesto:s.puesto,dir:s.direccion};}),
    // Los "Sacar" del conteo (nombre "No registrado: …") ya son una corrección: no se listan
    ...man.filter(m=>!String(m.nombre_raw||"").startsWith("No registrado")).map(m=>({tipo:"man",id:m.id,raw:m.dni_raw||"",nombre:m.nombre_raw,ts:m.created_at,puesto:m.puesto,dir:m.direccion})),
  ];
  return items.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
};
// modo "banner": franja que avisa y abre la lista en una ventana (en el Puesto). modo "panel": la lista a la vista (Registros).
function FichadasParaCorregir({puesto,desde,hasta,user,modo,refrescar,onCambio}){
  const[items,setItems]=useState(null);
  const[porDni,setPorDni]=useState(null);
  const[abierto,setAbierto]=useState(false);
  const[busy,setBusy]=useState(null);
  const[q,setQ]=useState({});
  const puede=!!user&&(user.rol==="admin"||user.rol==="puesto");
  const d1=desde||today(),d2=hasta||today();
  const load=useCallback(async()=>{const it=await fcCargar(puesto,d1,d2).catch(()=>null);if(it)setItems(it);},[puesto,d1,d2]);
  useEffect(()=>{load();const i=setInterval(load,60000);return()=>clearInterval(i);},[load,refrescar]);
  useEffect(()=>{
    if(!items||!items.length||porDni)return;
    dbSelAll("personas",{cols:"id,dni,nombre,apellido,empresa,deleted_at",ord:"id.asc"}).then(({data})=>{
      const m=new Map();(data||[]).filter(p=>!p.deleted_at).forEach(p=>{const k=fcNorm(p.dni);if(k)m.set(k,p);});setPorDni(m);
    });
  },[items,porDni]);
  if(!items||!items.length)return null;
  const nom=(p)=>`${(p.apellido||"").trim()}, ${(p.nombre||"").trim()}`;
  const corregir=async(it,personas)=>{
    setBusy(it.id);
    // La función no duplica a quien ya está en la misma pasada y recalcula los totales de la sesión
    const r=it.tipo==="man"
      ?await db.rpc("fc_corregir_manual",{p_mov:it.id,p_persona:personas[0].id})
      :await db.rpc("fc_corregir_registro",{p_registro:it.id,p_personas:personas.map(x=>x.id)});
    if(!r.ok)alert(fcErr(r.data));
    await load();onCambio&&onCambio();setBusy(null);
  };
  const borrar=async(it)=>{
    if(!confirm('¿Borrar la fichada de "'+(it.raw||"sin DNI")+'" ('+String(it.puesto).replace("Puesto ","P")+' '+dirVerbo(it.puesto,it.dir)+' '+joHora(new Date(it.ts).getTime())+')?\n\nUsalo solo si no corresponde a nadie (lectura basura). Si era una persona, mejor elegila.'))return;
    setBusy(it.id);
    const r=it.tipo==="man"?await db.rpc("fc_borrar_manual",{p_mov:it.id}):await db.rpc("fc_borrar_registro",{p_registro:it.id});
    if(!r.ok)alert(fcErr(r.data));
    await load();onCambio&&onCambio();setBusy(null);
  };
  const lista=<div>
    <div style={{fontSize:12,color:"var(--tx2)",marginBottom:10,lineHeight:1.5}}>Fichadas con un DNI que no está en la base: puede ser un DNI mal leído (por ejemplo, dos DNIs pegados) o una persona sin dar de alta. Mientras no se corrijan, esas personas no figuran bien en los conteos.{puede?" Elegí a quién corresponde o borrala si no era nadie.":""}</div>
    {items.map(it=>{
      const sug=porDni?fcSugerencias(it.raw,porDni):[];
      const qq=q[it.id]||"";
      const res=porDni&&qq.trim().length>=3?[...porDni.values()].filter(p=>(" "+empNorm(`${p.dni} ${p.apellido} ${p.nombre}`)+" ").includes(empNorm(qq))).slice(0,6):[];
      return <div key={it.tipo+it.id} style={{background:"var(--s2)",border:"1px solid rgba(245,158,11,.4)",borderLeft:"3px solid var(--acc)",borderRadius:6,padding:"9px 12px",marginBottom:8,opacity:busy===it.id?.5:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span className="mn" style={{color:"var(--tx2)"}}>{fmtTs(it.ts)}</span>
          <span style={{fontSize:12,fontWeight:600}}>{it.puesto} · {dirVerbo(it.puesto,it.dir)}{it.tipo==="man"?" · manual":""}</span>
          <span style={{fontSize:12}}>leído: <b className="mn" style={{color:"var(--acc)"}}>{it.raw||"—"}</b>{it.nombre?" ("+it.nombre+")":""}</span>
          <span style={{fontSize:11,color:"var(--tx3)",marginLeft:"auto"}}>{fcProblema(it)}</span>
        </div>
        {sug.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {sug.map((s,i)=>puede
            ?<button key={i} className="bsm" disabled={!!busy} style={{color:"var(--gr)",borderColor:"rgba(16,185,129,.45)"}} onClick={()=>corregir(it,s.personas)}>✔ {s.personas.length>1?"Eran 2: ":"Era "}{s.personas.map(nom).join(" y ")} <span style={{color:"var(--tx3)"}}>· {s.txt}</span></button>
            :<span key={i} style={{fontSize:12,color:"var(--gr)"}}>💡 {s.personas.map(nom).join(" y ")} ({s.txt})</span>)}
        </div>}
        {puede&&<div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginTop:8}}>
          <input className="fi" style={{padding:"5px 9px",fontSize:12,minWidth:200,flex:1}} placeholder="Otra persona: buscar por DNI o apellido…" value={qq} onChange={e=>setQ(x=>({...x,[it.id]:e.target.value}))}/>
          <button className="bsm bsm-r" disabled={!!busy} onClick={()=>borrar(it)}>🗑 No era nadie</button>
        </div>}
        {res.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>{res.map(p=><button key={p.id} className="bsm" disabled={!!busy} onClick={()=>corregir(it,[p])}>{nom(p)} <span style={{color:"var(--tx3)"}}>· {p.dni} · {p.empresa||"—"}</span></button>)}</div>}
      </div>;
    })}
  </div>;
  if(modo==="panel")return <div className="jo-wrap" style={{borderColor:"rgba(245,158,11,.45)"}}>
    <div className="jo-h" style={{color:"var(--acc)"}}>⚠ Para corregir ({items.length})</div>
    {lista}
  </div>;
  return <>
    <div onClick={()=>setAbierto(true)} style={{background:"rgba(245,158,11,.14)",border:"2px solid var(--acc)",borderRadius:8,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",cursor:"pointer",animation:"pulseWarn 2s infinite"}}>
      <span style={{fontSize:22}}>⚠️</span>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontFamily:"var(--fh)",fontSize:17,fontWeight:800,color:"var(--acc)",textTransform:"uppercase"}}>{items.length} fichada{items.length===1?"":"s"} para corregir</div>
        <div style={{fontSize:12,color:"var(--tx2)"}}>DNI mal leído o que no está en la base{items.some(it=>fcNorm(it.raw).length>=12)?" (hay lecturas con 2 DNIs pegados)":""}. Cuando baje el movimiento, revisalas.</div>
      </div>
      <button className="bsm" style={{flexShrink:0}}>Revisar</button>
    </div>
    {abierto&&<div className="mo"><div className="md md-lg">
      <div className="mh"><div className="mt">Fichadas para corregir</div><button className="mc" onClick={()=>setAbierto(false)}>x</button></div>
      <div className="mb">{lista}</div>
    </div></div>}
  </>;
}

function ChaletCounter({proyectoId}){
  const[countChalet,setCountChalet]=useState(null);
  const[countCamino,setCountCamino]=useState(null);
  const[countVehChalet,setCountVehChalet]=useState(0);
  const[countVehCamino,setCountVehCamino]=useState(0);
  const[personas,setPersonas]=useState([]);
  const[vehiculos,setVehiculos]=useState([]);
  const[showList,setShowList]=useState(null); // null | "personas" | "vehiculos"
  const[personasCamino,setPersonasCamino]=useState([]);
  const[vehiculosCamino,setVehiculosCamino]=useState([]);
  const load=async()=>{
    try{
    const pos=await calcPosicionesMontana();
    // Posición = última fichada en P2/P3 (control cruzado, no depende de net por puesto)
    const persIdsChalet=Object.entries(pos.persona).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const persIdsCamino=Object.entries(pos.persona).filter(([_,p])=>p==="camino").map(([k])=>k);
    setCountChalet(persIdsChalet.length);
    setCountCamino(persIdsCamino.length);
    const isUUID=(k)=>typeof k==="string"&&k.length===36&&k.indexOf("-")>=0;
    const synthPer=(k)=>({id:k,nombre:"Sin registrar",apellido:"",dni:k,empresa:"DNI no encontrado en la base",_synth:true});
    const synthVeh=(k)=>{const pat=String(k).indexOf("No registrado:")===0?String(k).replace("No registrado:","").trim():k;return{id:k,patente:pat,descripcion:"Vehículo no registrado en la base",tipo:"Otro",empresa:"",_synth:true};};
    // Load persona details (incluye placeholders para DNIs no registrados)
    const allPersIds=[...persIdsChalet,...persIdsCamino].filter(isUUID);
    let persMap={};
    if(allPersIds.length>0){
      const{data:pers}=await db.sel("personas",{cols:"id,nombre,apellido,empresa,dni"});
      (pers||[]).forEach(p=>{persMap[p.id]=p;});
    }
    setPersonas(persIdsChalet.map(k=>persMap[k]||synthPer(k)));
    setPersonasCamino(persIdsCamino.map(k=>persMap[k]||synthPer(k)));
    // Vehículos (mismo modelo cruzado: última fichada en P2/P3)
    const vehIdsChalet=Object.entries(pos.vehiculo).filter(([_,p])=>p==="chalet").map(([k])=>k);
    const vehIdsCamino=Object.entries(pos.vehiculo).filter(([_,p])=>p==="camino").map(([k])=>k);
    setCountVehChalet(vehIdsChalet.length);
    setCountVehCamino(vehIdsCamino.length);
    // Load vehiculo details (incluye placeholders para "No registrado: ...")
    const allVehIds=[...vehIdsChalet,...vehIdsCamino].filter(isUUID);
    let vehMap={};
    if(allVehIds.length>0){
      const{data:vehs}=await db.sel("vehiculos",{cols:"id,patente,descripcion,tipo,empresa"});
      (vehs||[]).forEach(v=>{vehMap[v.id]=v;});
    }
    setVehiculos(vehIdsChalet.map(k=>vehMap[k]||synthVeh(k)));
    setVehiculosCamino(vehIdsCamino.map(k=>vehMap[k]||synthVeh(k)));
    } catch(e){console.warn("ChaletCounter: error de red, manteniendo datos anteriores");}
  };
  useEffect(()=>{load();const i=setInterval(load,5000);return()=>clearInterval(i);},[]);
  if(countChalet===null)return null;
  return <>
    {/* CHALET */}
    <div style={{background:"linear-gradient(135deg,rgba(139,92,246,.15),rgba(59,130,246,.1))",border:"1px solid rgba(139,92,246,.35)",borderRadius:8,overflow:"hidden",marginBottom:10}}>
      <div style={{padding:"8px 16px",borderBottom:"1px solid rgba(139,92,246,.2)",fontFamily:"var(--fh)",fontSize:12,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#A78BFA"}}>En Chalet — Puesto 3</div>
      <div style={{display:"flex"}}>
        <div style={{flex:1,padding:"12px 16px",borderRight:"1px solid rgba(139,92,246,.2)",display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"var(--fh)",fontSize:40,fontWeight:900,color:"#A78BFA",lineHeight:1}}>{countChalet}</div>
          <div style={{flex:1}}><div style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:700,color:"#A78BFA",textTransform:"uppercase"}}>Personas</div></div>
          <button className="chalet-btn" style={{padding:"4px 10px",fontSize:12}} onClick={()=>setShowList("personas")}>Ver</button>
        </div>
        <div style={{flex:1,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"var(--fh)",fontSize:40,fontWeight:900,color:"var(--gr)",lineHeight:1}}>{countVehChalet}</div>
          <div style={{flex:1}}><div style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:700,color:"var(--gr)",textTransform:"uppercase"}}>Vehiculos</div></div>
          <button className="chalet-btn" style={{padding:"4px 10px",fontSize:12,background:"rgba(16,185,129,.15)",border:"1px solid rgba(16,185,129,.4)",color:"var(--gr)"}} onClick={()=>setShowList("vehiculos")}>Ver</button>
        </div>
      </div>
    </div>
    {/* CAMINO */}
    <div style={{background:"linear-gradient(135deg,rgba(59,130,246,.12),rgba(16,185,129,.07))",border:"1px solid rgba(59,130,246,.3)",borderRadius:8,overflow:"hidden",marginBottom:14}}>
      <div style={{padding:"8px 16px",borderBottom:"1px solid rgba(59,130,246,.2)",fontFamily:"var(--fh)",fontSize:12,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#60A5FA"}}>En Camino — P2 a P3</div>
      <div style={{display:"flex"}}>
        <div style={{flex:1,padding:"12px 16px",borderRight:"1px solid rgba(59,130,246,.2)",display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"var(--fh)",fontSize:40,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{countCamino}</div>
          <div style={{flex:1}}><div style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Personas</div></div>
          <button className="chalet-btn" style={{padding:"4px 10px",fontSize:12,background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA"}} onClick={()=>setShowList("personas-camino")}>Ver</button>
        </div>
        <div style={{flex:1,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"var(--fh)",fontSize:40,fontWeight:900,color:"#60A5FA",lineHeight:1}}>{countVehCamino}</div>
          <div style={{flex:1}}><div style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:700,color:"#60A5FA",textTransform:"uppercase"}}>Vehiculos</div></div>
          <button className="chalet-btn" style={{padding:"4px 10px",fontSize:12,background:"rgba(59,130,246,.15)",border:"1px solid rgba(59,130,246,.4)",color:"#60A5FA"}} onClick={()=>setShowList("vehiculos-camino")}>Ver</button>
        </div>
      </div>
    </div>
    {/* MODALES */}
    {showList==="personas"&&<ListaFiltrada items={personas} tipo="persona" titulo="Personas en Chalet" onClose={()=>setShowList(null)}/>}
    {showList==="personas-camino"&&<ListaFiltrada items={personasCamino} tipo="persona" titulo="Personas en Camino" onClose={()=>setShowList(null)}/>}
    {showList==="vehiculos"&&<ListaFiltrada items={vehiculos} tipo="vehiculo" titulo="Vehiculos en Chalet" onClose={()=>setShowList(null)}/>}
    {showList==="vehiculos-camino"&&<ListaFiltrada items={vehiculosCamino} tipo="vehiculo" titulo="Vehiculos en Camino" onClose={()=>setShowList(null)}/>}
  </>;
}

// ─── MOVIMIENTO MANUAL ────────────────────────────────────────────────────────
// Si alguien baja de la montaña antes de las 13 y estaba anotado para almorzar en el chalet, se pregunta si se lo
// saca de esa lista (comidas_diarias.come=false). Lo usan el movimiento manual y el "sacar del conteo de montaña";
// la bajada con vehículo tiene su propio aviso en el Puesto.
const sacarDeAlmuerzoChalet=async(personasBajan,user)=>{
  if(horaArg()>=13)return;
  const ids=personasBajan.map(p=>p.id).filter(Boolean);
  if(!ids.length)return;
  const{data:cd}=await db.sel("comidas_diarias",{f:[["fecha","eq",today()],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],inFilter:["persona_id",ids]});
  if(!cd||!cd.length)return;
  const nombres=cd.map(c=>{const p=personasBajan.find(x=>x.id===c.persona_id);return p?(p.nombre+' '+p.apellido):'';}).filter(Boolean);
  if(!confirm("🍽 Anotado para almorzar en el chalet hoy:\n\n"+nombres.map(n=>"· "+n).join("\n")+"\n\nSi baja antes de las 13 seguramente no come arriba. ¿Sacarlo de la lista de almuerzo del chalet?"))return;
  for(const c of cd)await db.upd("comidas_diarias",{come:false,modificada_por:user.id,modificada_at:new Date().toISOString()},[["id","eq",c.id]]);
};
function MovimientoManual({user,proyectoId,onClose,onSaved}){
  const[step,setStep]=useState("dir");
  const[dir,setDir]=useState(null);
  const[search,setSearch]=useState("");
  const[personas,setPersonas]=useState([]);
  const[saving,setSaving]=useState(false);
  const isP1=user.puesto_nombre==="Puesto 1";
  const labels={entrada:cap1(dirPasado(user.puesto_nombre,"entrada")),salida:cap1(dirPasado(user.puesto_nombre,"salida"))};
  useEffect(()=>{db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc"}).then(({data})=>{if(data)setPersonas(data);});},[]);
  const filtered=personas.filter(p=>search?`${p.nombre} ${p.apellido} ${p.dni} ${p.empresa||""}`.toLowerCase().includes(search.toLowerCase()):true);
  const save=async(persona)=>{
    setSaving(true);
    // Si la persona NO está en la base, conservamos el DNI tipeado como dni_raw
    // para que el movimiento pueda emparejarse con la fichada (subida) no registrada.
    const rawTyped=search.trim().toUpperCase();
    const{ok,data}=await db.ins("movimientos_manuales",{proyecto_id:proyectoId,puesto:user.puesto_nombre,operador_id:user.id,persona_id:persona?persona.id:null,dni_raw:persona?persona.dni:(rawTyped||null),nombre_raw:persona?`${persona.nombre} ${persona.apellido}`:(rawTyped?("No registrado: "+rawTyped):null),direccion:dir});
    if(!ok){alert("No se pudo guardar el movimiento.\n\nDetalle: "+JSON.stringify(data));setSaving(false);return;}
    // Baja caminando por P2/P3 antes de las 13 y estaba anotado para almorzar en el chalet: mismo aviso que con vehículo
    if(persona&&dir==="salida"&&!isP1)await sacarDeAlmuerzoChalet([persona],user);
    setSaving(false);onSaved&&onSaved();onClose();
  };
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">Movimiento manual — {user.puesto_nombre}</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {step==="dir"&&<>
        <div style={{fontSize:13,color:"var(--tx2)",marginBottom:16}}>Que movimiento queres registrar?</div>
        <div className="dir-big">
          <button className="dir-big-btn in" onClick={()=>{setDir("entrada");setStep("persona");}}>⬆️ {labels.entrada}</button>
          <button className="dir-big-btn out" onClick={()=>{setDir("salida");setStep("persona");}}>⬇️ {labels.salida}</button>
        </div>
      </>}
      {step==="persona"&&<>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <span className={`ld ld-${dir==="entrada"?"in":"out"}`}>{labels[dir]}</span>
          <button onClick={()=>setStep("dir")} style={{background:"none",border:"none",color:"var(--tx2)",cursor:"pointer",fontSize:12}}>cambiar</button>
        </div>
        <div className="f"><label>Buscar persona</label><input placeholder="Nombre, apellido o DNI..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus/></div>
        <div style={{maxHeight:280,overflowY:"auto",marginTop:4}}>
          {filtered.slice(0,20).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:5,cursor:"pointer",marginBottom:3}} onMouseOver={e=>e.currentTarget.style.background="var(--s2)"} onMouseOut={e=>e.currentTarget.style.background="transparent"} onClick={()=>save(p)}>
            <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
            <div><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa} - DNI {p.dni}</div></div>
          </div>)}
          {filtered.length===0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:20,fontSize:13}}>Sin resultados</div>}
        </div>
        <button onClick={()=>save(null)} style={{marginTop:12,width:"100%",background:"none",border:"1px dashed var(--bd)",color:"var(--tx2)",borderRadius:4,padding:"9px",cursor:"pointer",fontSize:13,fontFamily:"var(--fm)"}}>
          {saving?"Guardando...":(search.trim()?`Registrar sin identificar (DNI: ${search.trim().toUpperCase()})`:"Registrar sin identificar persona")}
        </button>
      </>}
    </div>
  </div></div>;
}

// ─── HAB MODAL ────────────────────────────────────────────────────────────────
function HabModal({hab,tipo,onClose,onSave,onDelete,saving=false}){
  const defaultFecha=()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toISOString().split("T")[0];};
  const[fecha,setFecha]=useState(hab&&hab.fecha_hasta?hab.fecha_hasta.slice(0,10):defaultFecha());
  const[susp,setSusp]=useState(hab?hab.suspendida:false);
  const[motivo,setMotivo]=useState(hab?hab.motivo_suspension||"":"");
  const[otorgadoPor,setOtorgadoPor]=useState(null); // {nombre, email} del usuario que otorgó
  // Rev86 (e): mostrar quién habilitó — se busca el nombre del usuario en la tabla usuarios
  useEffect(()=>{
    if(!hab||!hab.otorgado_por){setOtorgadoPor(null);return;}
    db.sel("usuarios",{f:[["id","eq",hab.otorgado_por]],cols:"nombre,email",lim:1}).then(({data})=>{
      if(data&&data[0])setOtorgadoPor(data[0]);
      else setOtorgadoPor({nombre:"(usuario no encontrado)",email:""});
    });
  },[hab]);
  const labels={"sh_ingreso":"S&H Ingreso","sh_chalet":"S&H Subir a Chalet","sh_manejo":"S&H Manejo en Montana","cp_ingreso":"CP Ingreso","cp_almuerzo":"CP Almuerzo","cp_cena":"CP Cena"};
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">{hab?"Editar":"Nueva"} — {labels[tipo]||tipo}</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div className="f"><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <input type="checkbox" id="susp" checked={susp} onChange={e=>setSusp(e.target.checked)} style={{width:"auto",cursor:"pointer"}}/>
        <label htmlFor="susp" style={{cursor:"pointer",fontSize:14}}>Suspender habilitacion</label>
      </div>
      {susp&&<div className="f"><label>Motivo</label><textarea value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Describe el motivo..."/></div>}
      {hab&&<div style={{padding:"10px 12px",background:"var(--s2)",border:"1px solid var(--bd)",borderRadius:5,fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:6}}>
        <div><strong style={{color:"var(--tx)"}}>Habilitado por:</strong> {otorgadoPor?(otorgadoPor.nombre||otorgadoPor.email||"—"):"cargando..."}</div>
        {hab.creada_at&&<div style={{marginTop:3}}><strong style={{color:"var(--tx)"}}>Fecha carga:</strong> {fmtTs(hab.creada_at)}</div>}
        {hab.fecha_desde&&<div style={{marginTop:3,opacity:.7}}>Vigencia desde: {fmtD(hab.fecha_desde)}</div>}
      </div>}
    </div>
    <div className="mf">
      {onDelete&&<button className="bcanc" style={{color:"var(--rd)",borderColor:"rgba(239,68,68,.3)",flex:"0 0 auto"}} onClick={onDelete}>Eliminar</button>}
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      <button className="bp" disabled={!fecha||saving} onClick={()=>onSave({fecha_hasta:fecha,suspendida:susp,motivo_suspension:motivo||null})}>{saving?"Guardando...":"Guardar"}</button>
    </div>
  </div></div>;
}

function HabCell({hab:habInit,tipo,entityType,entityId,proyectoId,canEdit,currentUserId,onRefresh,onHabSaved,tdClass}){
  const[show,setShow]=useState(false);
  const[localHab,setLocalHab]=useState(null); // null = usar habInit, object = guardado local
  const[saving,setSaving]=useState(false);

  // localHab {_deleted:true} = se acaba de eliminar: la celda vuelve a "+ Agregar" sin esperar a recargar
  // (antes ese objeto vacío se leía como habilitación vigente y mostraba "ok").
  const hab=localHab!==null?(localHab._deleted?null:localHab):habInit;
  const _d=new Date();
  const _t=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
  const st=!hab?"none":hab.suspendida?"sus":(hab.fecha_hasta&&hab.fecha_hasta<_t)?"exp":"ok";

  const save=async(form)=>{
    setSaving(true);
    try{
      const{data,ok}=await db.rpc("set_habilitacion",{
        p_entity_type:entityType,
        p_persona_id:entityType==="persona"?entityId:null,
        p_vehiculo_id:entityType==="vehiculo"?entityId:null,
        p_tipo:tipo,
        p_proyecto_id:proyectoId,
        p_otorgado_por:currentUserId,
        p_fecha_hasta:form.fecha_hasta,
        p_suspendida:form.suspendida||false,
        p_motivo:form.motivo_suspension||null
      });
      if(!ok){alert("Error: "+JSON.stringify(data));setSaving(false);return;}
      // Rev130: se relee lo guardado (confirma que quedó en la base) y se avisa a la lista. Antes solo lo recordaba la
      // celda: al buscar a otra persona y volver, la fila se armaba con la lista vieja y parecía que no tenía la
      // habilitación; el Estado, los contadores y los filtros tampoco se enteraban hasta recargar.
      const campo=entityType==="persona"?"persona_id":"vehiculo_id";
      const{data:rows}=await db.sel("habilitaciones",{f:[[campo,"eq",entityId],["tipo","eq",tipo],...(proyectoId?[["proyecto_id","eq",proyectoId]]:[])],lim:1});
      if(rows&&!rows.length){alert("La habilitación no quedó guardada en la base. Probá de nuevo.");setSaving(false);return;}
      const saved=rows?rows[0]:{entity_type:entityType,persona_id:entityType==="persona"?entityId:null,vehiculo_id:entityType==="vehiculo"?entityId:null,tipo,proyecto_id:proyectoId,fecha_hasta:form.fecha_hasta,suspendida:form.suspendida||false,motivo_suspension:form.motivo_suspension||null};
      setLocalHab(saved);
      if(onHabSaved)onHabSaved(saved);
      setShow(false);
    }catch(e){alert("Error: "+e.message);}
    setSaving(false);
  };

  const remove=async()=>{
    if(!confirm("Eliminar esta habilitacion?"))return;
    const delF=entityType==="persona"
      ?[["persona_id","eq",entityId],["tipo","eq",tipo],["proyecto_id","eq",proyectoId]]
      :[["vehiculo_id","eq",entityId],["tipo","eq",tipo],["proyecto_id","eq",proyectoId]];
    await db.del("habilitaciones",delF);
    setLocalHab({_deleted:true});
    if(onHabSaved)onHabSaved({_removed:true,entity_type:entityType,persona_id:entityType==="persona"?entityId:null,vehiculo_id:entityType==="vehiculo"?entityId:null,tipo,proyecto_id:proyectoId});
    setShow(false);
  };

  const habForModal=hab; // eliminada → el modal abre como "Nueva", sin botón Eliminar

  return <td className={tdClass||""} style={{minWidth:88}}>
    {st==="none"
      ?canEdit?<button className="hc-add" onClick={()=>setShow(true)}>+ Agregar</button>:<span style={{color:"var(--tx2)",opacity:.3,fontSize:12}}>—</span>
      :<span className={`hc hc-${st}${canEdit?" hc-edit":""}`} onClick={canEdit?()=>setShow(true):undefined}>
        {st==="ok"?"ok "+fmtD(hab.fecha_hasta):st==="exp"?"VENC "+fmtD(hab.fecha_hasta):"SUSP"}
      </span>
    }
    {show&&<HabModal hab={habForModal} tipo={tipo} saving={saving} onClose={()=>setShow(false)} onSave={save} onDelete={habForModal?remove:null}/>}
  </td>;
}

// HabCellRadar — pill de solo lectura para CP Ingreso derivado del Radar de Obra.
// Rev86+: cp_ingreso ya no es manual; se calcula de viandas_calendario del día.
// Si letra != 'F' y no es null → OK (verde). Si es F o vacía → bloqueado (rojo).
function HabCellRadar({dni,radarMap,tdClass}){
  if(cpForzadoActivo())return <td className={tdClass||""} style={{minWidth:88}} title="Habilitación permanente de CP activada: no se toma del Radar">
    <span className="hc hc-ok" style={{cursor:"help",display:"inline-flex",alignItems:"center",gap:4}}>ok <span style={{fontSize:9,opacity:.7,fontFamily:"var(--fm)"}}>perm.</span></span>
  </td>;
  const r=radarDe(radarMap,dni)||null;
  const ok=r&&r.letra&&r.letra!=="F";
  const codigo=r&&r.codigo?r.codigo:"—";
  const tip=r
    ?(ok?`CP Ingreso derivado del Radar de Obra (${codigo})`:`Bloqueado — hoy figura ${r.letra==="F"?"como Franco":"sin agendamiento"} en el Radar`)
    :"Sin registro en el Radar de Obra del día";

    </span>
  </td>;
}


// ─── HABILITACION MASIVA POR EMPRESA ──────────────────────────────────────────
function HabMasivaModal({proyectoId,currentUserId,habs,onClose,onSaved}){
  const[empresas,setEmpresas]=useState([]);
  const[empresa,setEmpresa]=useState("");
  const[personas,setPersonas]=useState([]);
  const[selected,setSelected]=useState({});
  const[tipo,setTipo]=useState("sh_ingreso");
  const[fecha,setFecha]=useState("");
  const[saving,setSaving]=useState(false);
  const[step,setStep]=useState("empresa"); // empresa | personas | fecha

  useEffect(()=>{
    db.sel("personas",{cols:"empresa",f:[["deleted_at","is","null"]]}).then(({data})=>{
      if(data){
        const emp=[...new Set(data.map(p=>p.empresa).filter(Boolean))].sort();
        setEmpresas(emp);
      }
    });
  },[]);

  const loadPersonas=async(emp)=>{
    const{data}=await db.sel("personas",{f:[["empresa","eq",emp],["deleted_at","is","null"]],ord:"apellido.asc"});
    if(data){
      setPersonas(data);
      const sel={};
      data.forEach(p=>{sel[p.id]=true;});
      setSelected(sel);
    }
  };

  const toggleAll=()=>{
    const allOn=personas.every(p=>selected[p.id]);
    const sel={};
    personas.forEach(p=>{sel[p.id]=!allOn;});
    setSelected(sel);
  };

  const save=async()=>{
    const ids=Object.entries(selected).filter(([_,v])=>v).map(([k])=>k);
    if(!ids.length||!fecha)return;
    setSaving(true);
    const tipos=tipo==="todas"?TODOS_TIPOS:[tipo];
    for(const pid of ids){
      for(const t of tipos){
        // DELETE+INSERT para evitar duplicados
        await db.del("habilitaciones",[["persona_id","eq",pid],["tipo","eq",t],["proyecto_id","eq",proyectoId]]);
        await db.ins("habilitaciones",{entity_type:"persona",persona_id:pid,tipo:t,proyecto_id:proyectoId,otorgado_por:currentUserId,fecha_desde:today(),fecha_hasta:fecha,suspendida:false});
      }
    }
    setSaving(false);onSaved();onClose();
  };

  // Rev86: cp_ingreso deriva del Radar, cp_almuerzo/cp_cena eliminados (viven en módulo Viandas)
  const TODOS_TIPOS=["sh_ingreso","sh_chalet","sh_manejo"];
  const tiposLabel={"todas":"⭐ TODAS las S&H","sh_ingreso":"S&H Ingreso","sh_chalet":"S&H Subir a Chalet","sh_manejo":"S&H Manejo en Montana"};
  const selectedCount=Object.values(selected).filter(Boolean).length;

  return <div className="mo"><div className="md md-lg">
    <div className="mh"><div className="mt">Habilitacion masiva por empresa</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {step==="empresa"&&<>
        <div className="f"><label>Tipo de habilitacion</label>
          <select value={tipo} onChange={e=>setTipo(e.target.value)}>
            {Object.entries(tiposLabel).map(([k,v])=><option key={k} value={k}>{v}</option>)}
          </select>
        </div>
        <div className="f"><label>Empresa</label>
          {empresas.length===0
            ?<div style={{color:"var(--tx2)",fontSize:13,padding:"8px 0"}}>Cargando empresas...</div>
            :<select value={empresa} onChange={e=>{setEmpresa(e.target.value);if(e.target.value)loadPersonas(e.target.value);}}>
              <option value="">-- seleccionar empresa --</option>
              {empresas.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          }
        </div>
        {empresa&&personas.length===0&&<div style={{color:"var(--tx2)",fontSize:13}}>Cargando personal...</div>}
        {empresa&&personas.length>0&&<button className="bp" onClick={()=>setStep("personas")}>Ver {personas.length} personas de {empresa} →</button>}
      </>}
      {step==="personas"&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{fontWeight:600}}>{empresa}</div>
            <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{tiposLabel[tipo]} — vence {fmtD(fecha)}</div>
          </div>
          <button className="bsm" onClick={toggleAll}>{personas.every(p=>selected[p.id])?"Quitar todos":"Seleccionar todos"}</button>
        </div>
        <div className="cbl">
          {personas.map(p=>{
            const st=habSt(getHab("persona",p.id,tipo,habs));
            return <div key={p.id} className="cbl-item" onClick={()=>setSelected(s=>({...s,[p.id]:!s[p.id]}))}>
              <input type="checkbox" checked={!!selected[p.id]} readOnly/>
              <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
              <div style={{flex:1}}><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:11,color:"var(--tx2)"}}>DNI {p.dni}</div></div>
              {st!=="none"&&<span className={`hc hc-${st}`} style={{fontSize:10}}>{st==="ok"?"actual":st==="exp"?"venc":"susp"}</span>}
            </div>;
          })}
        </div>
        <div style={{marginTop:12,fontSize:13,color:"var(--tx2)"}}>{selectedCount} personas seleccionadas</div>
        <div style={{marginTop:16}}><button className="bp" disabled={selectedCount===0} onClick={()=>setStep("fecha")}>Continuar → elegir fecha</button></div>
      </>}
      {step==="fecha"&&<>
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:600}}>{empresa}</div>
          <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{tiposLabel[tipo]} · {selectedCount} personas</div>
        </div>
        <div className="f"><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} autoFocus/></div>
      </>}
    </div>
    <div className="mf">
      {step==="personas"&&<button className="bcanc" onClick={()=>setStep("empresa")}>Atras</button>}
      {step==="fecha"&&<button className="bcanc" onClick={()=>setStep("personas")}>Atras</button>}
      <button className="bcanc" onClick={onClose}>Cancelar</button>
      {step==="fecha"&&<button className="bp" disabled={saving||!fecha} onClick={save}>{saving?"Aplicando...":"Aplicar a "+selectedCount+" personas"}</button>}
    </div>
  </div></div>;
}

// ─── HABILITAR TODO MODAL ────────────────────────────────────────────────────
function HabTodoModal({proyectoId,currentUserId,tipo,onClose,onSaved,porNombre}){
  // Rev127: se elige qué habilitar (S&H Ingreso, Subir a Chalet, Manejo) y, en Personal, la habilitación permanente de CP.
  const TIPOS=tipo==="persona"
    ?[["sh_ingreso","S&H Ingreso"],["sh_chalet","S&H Subir a Chalet"],["sh_manejo","S&H Manejo en Montaña"]]
    :[["sh_ingreso","S&H Ingreso"],["sh_manejo","S&H Subir a Chalet (vehículo)"]];
  const[fecha,setFecha]=useState("2027-01-01");
  const[sel,setSel]=useState(()=>new Set());
  const[saving,setSaving]=useState(false);
  const[prog,setProg]=useState(null); // {done, total}
  const cpAct=tipo==="persona"&&cpForzadoActivo();
  const[cpOn,setCpOn]=useState(false);
  const[cpHasta,setCpHasta]=useState(()=>cmdAddDays(today(),4));
  const tog=(k)=>{const n=new Set(sel);n.has(k)?n.delete(k):n.add(k);setSel(n);};
  const hayAlgo=sel.size>0||cpOn;
  const save=async()=>{
    if(!hayAlgo)return;
    if(sel.size&&!fecha)return;
    const quePasa=[];
    if(sel.size)quePasa.push([...sel].map(k=>TIPOS.find(x=>x[0]===k)[1]).join(", ")+" hasta el "+cmdFmtDate(fecha)+" a todos");
    if(cpOn)quePasa.push("CP Ingreso permanente (sin Radar) "+(cpHasta?"hasta el "+cmdFmtDate(cpHasta):"sin fecha de fin"));
    if(!confirm("¿Aplicar?\n\n· "+quePasa.join("\n· ")))return;
    setSaving(true);
    if(cpOn){
      const ok=await guardarCpForzado({activo:true,hasta:cpHasta||null,por:porNombre||"",at:new Date().toISOString()},currentUserId);
      if(!ok){setSaving(false);alert("No se pudo guardar la habilitación permanente de CP. Revisá la conexión.");return;}
    }
    const tipos=[...sel];
    if(tipos.length){
      const{data:entities}=tipo==="persona"
        ?await db.sel("personas",{cols:"id",f:[["deleted_at","is","null"]],lim:5000})
        :await db.sel("vehiculos",{cols:"id",f:[["activo","eq",true]],lim:2000});
      const{data:habsExist}=await db.sel("habilitaciones",{f:[["entity_type","eq",tipo==="persona"?"persona":"vehiculo"]],lim:10000});
      const habMap={};
      (habsExist||[]).forEach(h=>{const eid=tipo==="persona"?h.persona_id:h.vehiculo_id;habMap[`${eid}_${h.tipo}`]=h.id;});
      const total=(entities||[]).length*tipos.length;
      let done=0;
      for(const ent of(entities||[])){
        for(const t of tipos){
          const key=`${ent.id}_${t}`;
          if(habMap[key]){
            await db.upd("habilitaciones",{fecha_hasta:fecha,suspendida:false,motivo_suspension:null},[["id","eq",habMap[key]]]);
          }else{
            const payload={entity_type:tipo==="persona"?"persona":"vehiculo",tipo:t,proyecto_id:proyectoId,otorgado_por:currentUserId,fecha_hasta:fecha,suspendida:false};
            if(tipo==="persona")payload.persona_id=ent.id;else payload.vehiculo_id=ent.id;
            await db.ins("habilitaciones",payload);
          }
          done++;
          if(done%20===0)setProg({done,total});
        }
      }
    }
    setSaving(false);setProg(null);onSaved();onClose();
  };
  const desactivar=async()=>{
    if(!confirm("¿Desactivar la habilitación permanente de CP? CP Ingreso vuelve a tomarse del Radar."))return;
    setSaving(true);
    const ok=await guardarCpForzado({activo:false,por:porNombre||"",at:new Date().toISOString()},currentUserId);
    setSaving(false);
    if(!ok){alert("No se pudo guardar. Revisá la conexión.");return;}
    onSaved();onClose();
  };
  return <div className="mo"><div className="md" style={{maxWidth:460}}>
    <div className="mh"><div className="mt">⭐ Habilitar todo — {tipo==="persona"?"Personal":"Vehiculos"}</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div style={{fontFamily:"var(--fh)",fontWeight:700,textTransform:"uppercase",fontSize:13,color:"#60A5FA",marginBottom:6}}>Habilitaciones S&H</div>
      <div style={{color:"var(--tx2)",fontSize:12,marginBottom:10}}>Elegí cuáles aplicar a {tipo==="persona"?"todas las personas":"todos los vehículos"}: a quien ya la tiene se le actualiza la fecha; a quien no, se le crea.</div>
      {TIPOS.map(([k,l])=><label key={k} style={{display:"flex",alignItems:"center",gap:8,fontSize:14,padding:"5px 0",cursor:"pointer"}}><input type="checkbox" checked={sel.has(k)} onChange={()=>tog(k)} style={{width:"auto"}}/> {l}</label>)}
      {sel.size>0&&<div className="f" style={{marginTop:8}}><label>Fecha de vencimiento</label><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>}
      {tipo==="persona"&&<div style={{borderTop:"1px solid var(--bd)",marginTop:14,paddingTop:12}}>
        <div style={{fontFamily:"var(--fh)",fontWeight:700,textTransform:"uppercase",fontSize:13,color:"var(--gr)",marginBottom:6}}>CP Ingreso</div>
        {cpAct
          ?<div className="warn" style={{fontSize:12,marginBottom:0}}>⚠ <b>Habilitación permanente activada</b> {CP_FORZADO.hasta?"hasta el "+cmdFmtDate(CP_FORZADO.hasta):"(sin fecha de fin)"}: no se toma del Radar.{CP_FORZADO.por?" Activada por "+CP_FORZADO.por+".":""}
              <div style={{marginTop:8}}><button className="bsm" disabled={saving} onClick={desactivar}>Desactivar (volver al Radar)</button></div></div>
          :<>
            <label style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:14,cursor:"pointer"}}><input type="checkbox" checked={cpOn} onChange={e=>setCpOn(e.target.checked)} style={{width:"auto",marginTop:3}}/> <span>Habilitación permanente de CP<div style={{fontSize:12,color:"var(--tx2)"}}>Todos quedan con CP Ingreso habilitado y no se toma del Radar (por ejemplo, mientras nadie actualiza el Radar). A los admins les aparece un cartel mientras esté activa.</div></span></label>
            {cpOn&&<div className="f" style={{marginTop:8}}><label>Hasta (inclusive) — vacío = hasta que la desactives</label><input type="date" value={cpHasta} min={today()} onChange={e=>setCpHasta(e.target.value)}/></div>}
          </>}
      </div>}
      {prog&&<div style={{marginTop:12,fontSize:13,color:"var(--tx2)",textAlign:"center"}}>{prog.done} / {prog.total} habilitaciones...</div>}
      <button className="bp" style={{marginTop:14,background:"rgba(16,185,129,.2)",border:"2px solid var(--gr)",color:"var(--gr)"}} disabled={saving||!hayAlgo||(sel.size>0&&!fecha)} onClick={save}>
        {saving?"Procesando...":hayAlgo?"Aplicar":"Elegí qué habilitar"}
      </button>
    </div>
  </div></div>;
}

// ─── PERSONA DETALLE MODAL ───────────────────────────────────────────────────
function PersonaDetalleModal({persona,proyectoId,onClose}){

      // tipeó el DNI en vez de escanear el QR, la fichada quedó con persona_id=NULL y clave=dni_raw.
      // Chequeamos por id (UUID) O por dni para cubrir los 2 casos.
      const[pos,pred]=await Promise.all([calcPosicionesMontana(),calcPersonasEnPredio()]);

      const enPredio=pred.inSet.has(persona.id)||pred.inSet.has(persona.dni);
      if(p==="chalet")setUbicacion("chalet");
      else if(p==="camino")setUbicacion("camino");
      else if(enPredio)setUbicacion("predio");
      else setUbicacion("fuera");

      // Historial de accesos (últimos 20)

        db.sel("registros_acceso",{cols:"sesion_id,resultado,orden_escaneo",f:[["persona_id","eq",persona.id]],lim:2000}),
        db.sel("movimientos_manuales",{cols:"id,created_at,direccion,puesto",f:[["persona_id","eq",persona.id]],ord:"created_at.desc",lim:30}),
      ]);
      let sesiones=[];
      if(regs&&regs.length){
        const sesIds=[...new Set(regs.map(r=>r.sesion_id))];
        const{data:ses}=await db.sel("sesiones_acceso",{cols:"id,cerrada_at,direccion,puesto,vehiculo_id",inFilter:["id",sesIds],ord:"cerrada_at.desc",lim:50});
        const vids=[...new Set((ses||[]).filter(s=>s.vehiculo_id).map(s=>s.vehiculo_id))];
        let vm={};
        if(vids.length){const{data:vehs}=await db.sel("vehiculos",{cols:"id,patente",inFilter:["id",vids]});(vehs||[]).forEach(v=>{vm[v.id]=v;});}
        sesiones=(ses||[]).map(s=>({...s,veh:vm[s.vehiculo_id]||null,tipo:"sesion"}));
      }
      const manuales=(mans||[]).map(m=>({id:m.id,cerrada_at:m.created_at,direccion:m.direccion,puesto:m.puesto,veh:null,tipo:"manual"}));
      // Combinar y ordenar por fecha
      const todo=[...sesiones,...manuales].sort((a,b)=>new Date(b.cerrada_at)-new Date(a.cerrada_at)).slice(0,30);
      setHistorial(todo);
      setLoading(false);
    };
    load();
  },[persona.id]);

  const ubColor=ubicacion==="chalet"?"#A78BFA":ubicacion==="camino"?"#60A5FA":ubicacion==="predio"?"#F59E0B":"var(--tx2)";
  const ubLabel=ubicacion==="chalet"?"En Chalet":ubicacion==="camino"?"En Camino (P2→P3)":ubicacion==="predio"?"En predio (campamento o caminos)":"Fuera de la obra";
  const ubIcon=ubicacion==="chalet"?"🏔️":ubicacion==="camino"?"🚗":ubicacion==="predio"?"🏕️":"—";

  return <div className="mo"><div className="md">
    <div className="mh">
      <div>
        <div className="mt">{persona.nombre} {persona.apellido}</div>
        <div style={{fontSize:12,color:"var(--tx2)",marginTop:2}}>{persona.empresa} · DNI {persona.dni}</div>
      </div>
      <button className="mc" onClick={onClose}>x</button>
