// Reportes de Jefatura de Obra (solo admin).
//  · "Áreas o subcontratos": áreas propias de Obras y Sistemas y empresas subcontratistas, cada una con sus
//    personas (una persona está en UNA sola área) y con la fila del Excel donde se vuelca su resultado.
//  · "Parte diario": cuántas personas de cada área estuvieron cada día elegido, con descarga a Excel.
// Tablas: obra.jo_areas (nombre, tipo empresa/area, fila, col_nombre, col_dia1, claves) y
// obra.jo_area_personas (PK persona_id → area_id).
// "Estuvo ese día" = fichó en algún puesto ese día, o ya estaba adentro del predio al empezar el día (su última
// fichada anterior no fue una salida por Puesto 1). Es el mismo criterio que el conteo EN PREDIO.
const JO_SQL=`CREATE TABLE IF NOT EXISTS obra.jo_areas (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  nombre text NOT NULL,
  tipo text NOT NULL DEFAULT 'empresa' CHECK (tipo IN ('empresa','area')),
  fila integer,
  col_nombre text NOT NULL DEFAULT 'D',
  col_dia1 text NOT NULL DEFAULT 'F',
  claves text,
  creado_por uuid,
  creado_at timestamptz NOT NULL DEFAULT now(),
  actualizado_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS obra.jo_area_personas (
  persona_id uuid PRIMARY KEY REFERENCES obra.personas(id) ON DELETE CASCADE,
  area_id uuid NOT NULL REFERENCES obra.jo_areas(id) ON DELETE CASCADE,
  agregado_por uuid,
  agregado_at timestamptz NOT NULL DEFAULT now()
);
CREATE INDEX IF NOT EXISTS jo_area_personas_area_idx ON obra.jo_area_personas(area_id);
GRANT SELECT, INSERT, UPDATE, DELETE ON obra.jo_areas TO authenticated;
GRANT SELECT, INSERT, UPDATE, DELETE ON obra.jo_area_personas TO authenticated;
ALTER TABLE obra.jo_areas ADD COLUMN IF NOT EXISTS fuente text NOT NULL DEFAULT 'p1' CHECK (fuente IN ('p1','p2'));`;
const JO_TIPOS={empresa:"Empresas subcontratistas",area:"Áreas de Obras y Sistemas"};
// Listado inicial (pedido del 13/10/2026): [nombre, tipo, fila del Excel, palabras para sugerir personas].
// En todas: nombre en la columna D y día 1 en F … día 31 en AJ.
const JO_SEED=[

// Texto normalizado para comparar: mayúsculas, sin tildes, solo letras y números separados por un espacio.
const joNorm=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
// Empresa sin el prefijo "Obras y Sistemas" / "OyS" (si no, "Sistemas" coincidiría con todo el personal propio).
const joCore=(emp)=>joNorm(emp).replace(/^(OBRAS Y SISTEMAS|OYS)( |$)/,"").trim();
const joClaves=(a)=>String((a.claves&&a.claves.trim())?a.claves:a.nombre).split(",").map(joNorm).filter(Boolean);
// El cargo solo se mira en el personal propio: un maquinista de ALUSA no es del área Maquinistas de O&S.
const joEsOys=(emp)=>/^(OBRAS Y SISTEMAS|OYS)( |$)/.test(joNorm(emp));
const joTexto=(p)=>" "+joCore(p.empresa)+" "+(joEsOys(p.empresa)?joNorm(p.cargo):"")+" ";
// Busca palabras enteras: "RM" coincide con "CONSTRUCCIONES RM" pero no con "FIRMA".
const joFiltra=(lista,txt)=>{const t=joNorm(txt).split(" ").filter(Boolean);if(!t.length)return lista;
  return lista.filter(p=>{const s=" "+joNorm(`${p.nombre||""} ${p.apellido||""} ${p.dni||""} ${p.empresa||""}`)+" ";return t.every(w=>s.includes(w));});};
const joColNum=(c)=>String(c||"").toUpperCase().split("").reduce((n,ch)=>n*26+(ch.charCodeAt(0)-64),0);
const joNumCol=(n)=>{let s="";while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
const joColDia=(a,dia)=>joNumCol(joColNum(a.col_dia1||"F")+dia-1);
const joCeldaNom=(a)=>a&&a.fila?`${a.col_nombre||"D"}${a.fila}`:"";
const joUbicTxt=(a)=>a&&a.fila?`nombre en ${joCeldaNom(a)} · día 1 en ${joColDia(a,1)}${a.fila} … día 31 en ${joColDia(a,31)}${a.fila}`:"sin ubicación en el Excel";
const joParseCelda=(s)=>{const m=String(s||"").trim().toUpperCase().match(/^([A-Z]{1,3})\s*(\d{1,5})$/);return m?{col:m[1],fila:parseInt(m[2],10)}:null;};
const joRangos=(nums)=>{const v=[...new Set(nums)].filter(Boolean).sort((a,b)=>a-b);const out=[];
  v.forEach(n=>{const u=out[out.length-1];if(u&&n===u[1]+1)u[1]=n;else out.push([n,n]);});
  return out.map(([a,b])=>a===b?`${a}`:`${a}–${b}`).join(", ");};
const JO_DSEM=["dom","lun","mar","mié","jue","vie","sáb"];
const joDiaLbl=(iso)=>{const[y,m,d]=iso.split("-").map(Number);return `${JO_DSEM[new Date(y,m-1,d).getDay()]} ${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}`;};
const joPorApe=(a,b)=>`${a.apellido||""} ${a.nombre||""}`.localeCompare(`${b.apellido||""} ${b.nombre||""}`,"es");
const joHora=(t)=>{const x=new Date(t);return `${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`;};
const joFechaHora=(t)=>{const x=new Date(t);return `${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")} ${joHora(t)}`;};
const joFichTxt=(e)=>`${String(e.puesto).replace("Puesto ","P")} ${dirVerbo(e.puesto,e.dir)}`;
const joComoTxt=(x)=>x.modo==="ficho"
  ?`fichó: ${joFichTxt(x.ev)} ${joHora(x.ev.t)}${x.n>1?` (${x.n} fichadas)`:""}`
  :`ya estaba adentro (última fichada: ${joFichTxt(x.ult)} ${joFechaHora(x.ult.t)})`;
// Aviso para revisar: quien se contó por "ya estaba adentro" pero el Radar no lo tiene en obra ese día
// (puede haberse ido sin fichar la salida por Puesto 1).
const joAvisoRadar=(x,pid,radarD)=>{
  if(!radarD)return null;
  if(radarD.franco.has(pid))return"en el Radar figura de franco";
  if(x.modo==="adentro"&&!radarD.prog.has(pid))return"no figura en el Radar ese día";
  return null;
};

const joFetchBase=async()=>{
  const[a,m,p]=await Promise.all([
    db.sel("jo_areas",{ord:"fila.asc.nullslast,nombre.asc",lim:2000}),
    dbSelAll("jo_area_personas",{cols:"persona_id,area_id",ord:"persona_id.asc"}),
    dbSelAll("personas",{cols:"id,dni,nombre,apellido,empresa,cargo,deleted_at",ord:"id.asc"}),
  ]);
  if(a.data===null||m.data===null)return{falta:true}; // tablas sin crear o sin GRANT
  return{areas:a.data,miembros:m.data,personas:p.data||[]};
};
// Todo lo que se necesita de las áreas: quién está en cada una, quién no tiene área y las sugerencias por empresa.
const joDerivar=(base)=>{
  if(!base||base.falta)return null;
  const areasById={},personasById={},areaDe={},porArea={},match={},sugeridasDe={};
  base.areas.forEach(a=>{areasById[a.id]=a;});
  base.personas.forEach(p=>{personasById[p.id]=p;});
  base.miembros.forEach(m=>{if(!areasById[m.area_id])return;areaDe[m.persona_id]=m.area_id;
    const p=personasById[m.persona_id];if(p)(porArea[m.area_id]=porArea[m.area_id]||[]).push(p);});
  const activos=base.personas.filter(p=>!p.deleted_at);
  const claves=base.areas.map(a=>({id:a.id,k:joClaves(a)}));
  const sinArea=[];
  activos.forEach(p=>{
    if(areaDe[p.id])return;
    sinArea.push(p);
    const t=joTexto(p);
    const ids=claves.filter(c=>c.k.some(k=>t.includes(" "+k+" "))).map(c=>c.id);
    if(ids.length){match[p.id]=ids;ids.forEach(id=>(sugeridasDe[id]=sugeridasDe[id]||[]).push(p));}
  });
  Object.values(porArea).forEach(l=>l.sort(joPorApe));
  Object.values(sugeridasDe).forEach(l=>l.sort(joPorApe));
  sinArea.sort(joPorApe);
  return{areasById,personasById,areaDe,porArea,activos,sinArea,match,sugeridasDe};
};
// Asigna personas a un área. Si ya estaban en otra, se mueven (una persona está en una sola área).
const joAsignar=async(ids,areaId,user)=>{
  if(!ids.length)return true;
  const now=new Date().toISOString();
  const{ok}=await db.ins("jo_area_personas",ids.map(pid=>({persona_id:pid,area_id:areaId,agregado_por:user.id,agregado_at:now})),true,"persona_id");
  if(!ok)alert("No se pudo guardar. Revisá la conexión.");
  return ok;
};
const joQuitar=async(ids)=>{

};
// Fichadas operativas (sesiones de los puestos + movimientos manuales) desde OPERATIVA_DESDE, como eventos por persona
// ordenados por hora. Quien fichó sin estar registrado se cruza por DNI si después se dio de alta en Personal.
const joFetchEventos=async(personas)=>{
  const D=OPERATIVA_DESDE;
  const[s,r,m]=await Promise.all([
    dbSelAll("sesiones_acceso",{cols:"id,puesto,direccion,cerrada_at",f:[["cerrada_at","gte",D]],ord:"id.asc"}),
    dbSelAll("registros_acceso",{cols:"id,persona_id,dni_raw,sesion_id",f:[["created_at","gte",D]],ord:"id.asc"}),
    dbSelAll("movimientos_manuales",{cols:"id,persona_id,dni_raw,puesto,direccion,created_at",f:[["created_at","gte",D]],ord:"id.asc"}),
  ]);
  if(!s.data||!r.data||!m.data)return null;
  const porDni={};
  personas.forEach(p=>{const k=normDni(p.dni);if(k&&(!porDni[k]||!p.deleted_at))porDni[k]=p.id;});
  const pidDe=(pid,dni)=>pid||(dni?porDni[normDni(dni)]:null)||null;
  const ses={};s.data.forEach(x=>{ses[x.id]=x;});
  const ev=[];
  r.data.forEach(x=>{const se=ses[x.sesion_id],pid=pidDe(x.persona_id,x.dni_raw);if(se&&pid)ev.push({t:new Date(se.cerrada_at).getTime(),pid,puesto:se.puesto,dir:se.direccion});});
  m.data.forEach(x=>{const pid=pidDe(x.persona_id,x.dni_raw);if(pid)ev.push({t:new Date(x.created_at).getTime(),pid,puesto:x.puesto,dir:x.direccion});});
  ev.sort((a,b)=>a.t-b.t);
  return ev;
};
// Para cada día (YYYY-MM-DD, hora local): Map persona_id → {modo:"ficho"|"adentro", ev (1ª fichada del día), n, ult}.
const joPresencia=(ev,dias)=>{
  const out={},last={};let i=0;
  [...dias].sort().forEach(d=>{
    const ini=new Date(d+"T00:00:00").getTime(),fin=new Date(cmdAddDays(d,1)+"T00:00:00").getTime();
    while(i<ev.length&&ev[i].t<ini){last[ev[i].pid]=ev[i];i++;}
    const m=new Map();
    Object.keys(last).forEach(pid=>{const e=last[pid];if(!(e.puesto==="Puesto 1"&&e.dir==="salida"))m.set(pid,{modo:"adentro",ult:e,n:0});});
    for(let j=i;j<ev.length&&ev[j].t<fin;j++){
      const e=ev[j],x=m.get(e.pid);
      if(x&&x.modo==="ficho")x.n++;
      else m.set(e.pid,{modo:"ficho",ev:e,n:1,ult:x?x.ult:null});
    }
    out[d]=m;
  });
  return out;
};
// Rev113 — de dónde se toma el parte (lo elige quien lo genera):
//  · "p1": estuvo en el predio (fichó en algún puesto o seguía adentro) → joPresencia.
//  · "p2": subió al chalet ese día = fichó en Puesto 2 (sube o baja). También cuenta una fichada en Puesto 3, porque
//    para llegar ahí se pasa por Puesto 2 (cubre el caso de que en P2 no lo hayan escaneado). No arrastra días anteriores.
const JO_FUENTES={
  p1:{t:"Puesto 1 · en el predio",ic:"🚪",d:"Cuenta a quien estuvo en el predio: fichó en algún puesto, o ya estaba adentro desde antes (su última fichada no fue una salida por Puesto 1). Es el mismo criterio que el conteo EN PREDIO.",tot:"Total en el predio"},
  p2:{t:"Puesto 2 · subió al chalet",ic:"⛰️",d:"Cuenta solo a quien pasó por Puesto 2 ese día (subiendo o bajando). Si en P2 no lo escanearon pero fichó en Puesto 3, también cuenta. Quien estuvo en el predio y no subió no se cuenta.",tot:"Total que subió"},
};
const joPresenciaP2=(ev,dias)=>{
  const out={};
  [...dias].sort().forEach(d=>{
    const ini=new Date(d+"T00:00:00").getTime(),fin=new Date(cmdAddDays(d,1)+"T00:00:00").getTime();
    const m=new Map();
    ev.forEach(e=>{
      if(e.t<ini||e.t>=fin||(e.puesto!=="Puesto 2"&&e.puesto!=="Puesto 3"))return;
      const x=m.get(e.pid);
      if(x)x.n++;else m.set(e.pid,{modo:"ficho",ev:e,n:1,ult:null});
    });
    out[d]=m;
  });
  return out;
};

let _joXlsx=null;
const joLoadXLSX=()=>{
  if(window.XLSX)return Promise.resolve(window.XLSX);

  });

};

  const iniOys=!area&&joEsOys(nombreInicial);
  const nomIni=iniOys?(String(nombreInicial).replace(/^\s*(obras y sistemas|oys)\s*-?\s*/i,"").trim()||nombreInicial):(nombreInicial||"");
  const nueva=!area;
  const[nombre,setNombre]=useState(area?area.nombre:nomIni);
  const[tipo,setTipo]=useState(area?area.tipo:(iniOys?"area":"empresa"));
  const[celda,setCelda]=useState(area?joCeldaNom(area):"");
  const[col1,setCol1]=useState(area?(area.col_dia1||"F"):"F");
  const[claves,setClaves]=useState(area?(area.claves||""):nomIni);
  const[busy,setBusy]=useState(false);
  const pc=joParseCelda(celda);
  const c1=String(col1||"").trim().toUpperCase();
  const c1ok=/^[A-Z]{1,3}$/.test(c1);
  const prev=pc&&c1ok?{fila:pc.fila,col_nombre:pc.col,col_dia1:c1}:null;
  const otras=areas.filter(a=>!area||a.id!==area.id);
  const choca=pc?otras.filter(a=>a.fila===pc.fila):[];
  const falta=[!nombre.trim()&&"nombre",!pc&&"celda del nombre (ej. D47)",!c1ok&&"columna del día 1 (ej. F)"].filter(Boolean);
  const guardar=async()=>{
    if(falta.length)return;
    if(choca.length&&!confirm(`La fila ${pc.fila} ya la usa ${choca.map(a=>a.nombre).join(", ")}. Si quedan en la misma fila, en el Excel se pisan. ¿Guardar igual?`))return;

    const fila=Array.isArray(r.data)&&r.data[0]?r.data[0]:{...area,...payload};

        {nueva
          ?<div style={{fontSize:12,color:"var(--tx2)",marginBottom:10}}>¿En qué fila del Excel va? Poné la celda donde va el nombre y la columna del día 1; los demás días siguen hacia la derecha.</div>
          :<div style={{fontSize:12,color:"var(--tx2)",marginBottom:10}}>Hoy está configurado: <strong style={{color:"var(--tx)"}}>{joUbicTxt(area)}</strong>. Si hace falta, cambialo acá.</div>}
        <div className="row2">
          <div className="f"><label>Celda del nombre *</label><input value={celda} onChange={e=>setCelda(e.target.value.toUpperCase())} placeholder="Ej: D47"/></div>
          <div className="f"><label>Columna del día 1 *</label><input value={col1} onChange={e=>setCol1(e.target.value.toUpperCase())} placeholder="F"/></div>
        </div>
        {prev
          ?<div style={{fontSize:12,color:"var(--gr)",fontFamily:"var(--fm)"}}>→ {joUbicTxt(prev)}</div>
          :<div style={{fontSize:12,color:"var(--tx3)"}}>La celda es letra + número (ej. D47) y la columna, solo letras (ej. F).</div>}
        {choca.length>0&&<div className="warn" style={{marginTop:8,marginBottom:0}}>⚠ La fila {pc.fila} ya la usa {choca.map(a=>a.nombre).join(", ")}.</div>}
        <div style={{fontSize:11,color:"var(--tx3)",marginTop:8}}>Filas ya usadas por otras áreas: {joRangos(otras.map(a=>a.fila))||"ninguna"}</div>
      </div>

    const{ok}=await db.ins("jo_areas",JO_SEED.map(([nombre,tipo,fila,claves])=>({nombre,tipo,fila,col_nombre:"D",col_dia1:"F",claves:claves||null,creado_por:user.id})));
    setSembrando(false);
    if(!ok)alert("No se pudo cargar el listado. Revisá la conexión.");
    load();
  };
  const f=joNorm(filtro);
  const vis=areas.filter(a=>!f||joNorm(a.nombre).includes(f));
  const conSug=Object.keys(d.match).length;
  const ver=verId?d.areasById[verId]:null;
  return <div>
    <div className="ph2"><div className="ptit">Áreas <span>o subcontratos</span></div><button className="badd" onClick={()=>setEditar({})}>+ Crear área o empresa</button></div>
    {areas.length===0&&<div className="jo-wrap" style={{borderColor:"rgba(245,158,11,.4)"}}>
      <div style={{fontSize:13,color:"var(--tx2)",marginBottom:10,lineHeight:1.5}}>Todavía no hay áreas ni empresas. Podés cargar de una el listado inicial ({JO_SEED.length}: ALUSA en la fila 11 … Mecánicos en la 115) o crearlas una por una.</div>
      <button className="badd" onClick={sembrar} disabled={sembrando}>{sembrando?"Cargando…":`📥 Cargar el listado inicial (${JO_SEED.length})`}</button>
    </div>}
    <div className="sg">
      <div className="sc"><div className="sv">{areas.length}</div><div className="slb">Áreas y empresas</div></div>
      <div className="sc"><div className="sv" style={{color:"var(--gr)"}}>{d.activos.length-d.sinArea.length}</div><div className="slb">Personas con área</div></div>
      <div className="sc sc-btn" onClick={()=>setVerSin(true)} title="Ver y asignar a quienes no tienen área"><div className="sv" style={{color:d.sinArea.length?"var(--acc)":"var(--tx2)"}}>{d.sinArea.length}</div><div className="slb">Sin área · ver y asignar</div></div>
      <div className="sc"><div className="sv" style={{color:conSug?"var(--acc)":"var(--tx2)"}}>{conSug}</div><div className="slb">💡 Sin área con sugerencia</div></div>
    </div>
    {areas.length>0&&<div className="fb"><input className="fi" placeholder="Buscar área o empresa..." value={filtro} onChange={e=>setFiltro(e.target.value)} style={{width:300}}/></div>}
    {["empresa","area"].map(t=>{const l=vis.filter(a=>a.tipo===t);if(!l.length)return null;
      return <div key={t} className="jo-wrap">
        <div className="jo-h">{JO_TIPOS[t]} <span style={{color:"var(--tx3)"}}>· {l.length}</span></div>
        <div className="jo-list">{l.map(a=>{const n=(d.porArea[a.id]||[]).length,s=(d.sugeridasDe[a.id]||[]).length;
          return <div key={a.id} className="jo-row" onClick={()=>setVerId(a.id)}>
            <div className="jo-nom">{a.nombre}<div className="jo-cel">{a.fila?`${joCeldaNom(a)} · día 1 en ${joColDia(a,1)}${a.fila} → día 31 en ${joColDia(a,31)}${a.fila}`:"⚠ sin ubicación en el Excel"}</div></div>
            {s>0&&<span className="jo-sug">💡 {s} sugerida{s===1?"":"s"}</span>}
            <div className="jo-n" style={{color:n?"var(--tx)":"var(--tx3)"}}>{n}</div><div style={{fontSize:11,color:"var(--tx3)",width:52}}>persona{n===1?"":"s"}</div>
          </div>;})}</div>
      </div>;})}
    {vis.length===0&&areas.length>0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:20}}>Ninguna área coincide con "{filtro}".</div>}
    {ver&&<JoAreaDetalle key={ver.id} area={ver} d={d} user={user} onClose={()=>setVerId(null)} onChanged={load} onEditar={()=>setEditar({area:ver})}/>}
    {verSin&&<JoSinAreaModal d={d} areas={areas} user={user} onClose={()=>setVerSin(false)} onChanged={load} onCrear={(nombre)=>{setVerSin(false);setEditar({nombre});}}/>}
    {editar&&<JoAreaModal area={editar.area||null} nombreInicial={editar.nombre} areas={areas} nPersonas={editar.area?(d.porArea[editar.area.id]||[]).length:0} user={user}
      onClose={()=>setEditar(null)}
      onSaved={(a)=>{const eraNueva=!editar.area;setEditar(null);load().then(()=>{if(eraNueva&&a&&a.id)setVerId(a.id);});}}
      onDeleted={()=>{setEditar(null);setVerId(null);load();}}/>}
  </div>;
}

function JoCalendario({mes,setMes,sel,onToggle,habil,hint,minMes,maxMes}){
  const[y,m]=mes.split("-").map(Number);
  const n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
  const nombreMes=new Date(y,m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const mover=(k)=>{const dt=new Date(y,m-1+k,1);setMes(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`);};
  const hoy=today();
  return <div>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,maxWidth:360}}>
      <button className="bsm" disabled={mes<=minMes} onClick={()=>mover(-1)} style={{opacity:mes<=minMes?.3:1}}>‹</button>
      <div style={{flex:1,textAlign:"center",fontFamily:"var(--fh)",fontWeight:700,fontSize:17}}>{cap1(nombreMes)}</div>
      <button className="bsm" disabled={mes>=maxMes} onClick={()=>mover(1)} style={{opacity:mes>=maxMes?.3:1}}>›</button>
    </div>
    <div className="jo-cal">
      {["L","M","M","J","V","S","D"].map((x,i)=><div key={i} className="jo-dow">{x}</div>)}
      {Array.from({length:off}).map((_,i)=><div key={"e"+i}/>)}
      {Array.from({length:n}).map((_,i)=>{
        const iso=`${mes}-${String(i+1).padStart(2,"0")}`,ok=habil(iso),h=ok?hint(iso):null;
        return <button key={iso} className={`jo-day${sel.includes(iso)?" on":""}${iso===hoy?" hoy":""}`} disabled={!ok} onClick={()=>onToggle(iso)}
          title={!ok?(iso>hoy?"Día futuro":"Antes del inicio de la operación"):(h!=null?`${h} presentes${iso===hoy?" (día en curso)":""}`:"")}>
          <div>{i+1}</div><div className="jo-dh">{h!=null?h:""}</div>
        </button>;
      })}
    </div>
  </div>;
}

function JoDetalleCelda({celda,d,res,presD,presP1D,fuente,radarD,areas,user,onAsignado,onCerrar}){
  const sin=celda.aid==="_sin";
  const a=sin?null:d.areasById[celda.aid];
  const items=((sin?res.sinArea[celda.d]:(res.porArea[celda.aid]||{})[celda.d])||[]).slice().sort((x,y)=>joPorApe(x.p,y.p));
  const[busy,setBusy]=useState(null);
  const[verFaltan,setVerFaltan]=useState(false);
  const esP2=fuente==="p2";
  const deEsta=(pid)=>sin?!d.areaDe[pid]:d.areaDe[pid]===celda.aid;
  const aNombres=(ids)=>ids.map(pid=>d.personasById[pid]).filter(Boolean).sort(joPorApe);
  // P1: programados en el Radar que no ficharon. P2: estuvieron en el predio pero no pasaron por P2/P3 (no se cuentan).
  const faltan=esP2
    ?(presP1D?aNombres([...presP1D.keys()].filter(pid=>!presD.has(pid)&&deEsta(pid))):null)
    :(radarD?aNombres([...radarD.prog].filter(pid=>!presD.has(pid)&&deEsta(pid))):null);
  const asignar=async(pid,aid)=>{if(!aid)return;setBusy(pid);const ok=await joAsignar([pid],aid,user);setBusy(null);if(ok)onAsignado();};
  return <div className="jo-wrap">
    <div className="jo-h" style={{justifyContent:"space-between"}}>
      <span>{sin?"⚠ Sin área asignada":(a?a.nombre:"—")} · {joDiaLbl(celda.d)} · <span style={{color:"var(--tx)"}}>{items.length} {items.length===1?"persona":"personas"}</span></span>
      <button className="bsm" onClick={onCerrar}>Cerrar</button>
    </div>
    {sin&&items.length>0&&<div style={{fontSize:12,color:"var(--tx2)",marginBottom:8}}>Estuvieron ese día pero no están en ninguna área, así que no entran en el Excel. Asignalas acá o desde "Áreas o subcontratos".</div>}
    {(()=>{const n=items.filter(({p,x})=>joAvisoRadar(x,p.id,radarD)).length;return n>0?<div className="warn" style={{fontSize:12}}>⚠ {n} para revisar: el Radar no {n===1?"lo":"los"} tiene en obra ese día.{esP2?"":` Si se ${n===1?"contó":"contaron"} por "ya estaba adentro", puede que se hayan ido sin fichar la salida por Puesto 1.`}</div>:null;})()}
    {items.length===0
      ?<div style={{fontSize:13,color:"var(--tx3)",padding:"6px 2px"}}>Nadie {sin?"sin área":`de ${a?a.nombre:"esta área"}`} {esP2?"pasó por Puesto 2":"estuvo"} ese día.</div>
      :<div className="tw" style={{maxHeight:420}}><table style={{minWidth:0}}>
        <thead><tr><th>Persona</th><th>DNI</th><th>Empresa en Personal</th><th>Cómo se contó</th>{sin&&<th>Asignar a</th>}</tr></thead>
        <tbody>{items.map(({p,x})=><tr key={p.id}>
          <td style={{whiteSpace:"nowrap"}}>{p.apellido}, {p.nombre}{p.deleted_at&&<span className="jo-baja">baja</span>}</td>
          <td className="mn">{p.dni}</td>
          <td style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa||"—"}</td>
          <td style={{fontSize:12,color:"var(--tx2)"}}>{joComoTxt(x)}{(()=>{const av=joAvisoRadar(x,p.id,radarD);return av?<span style={{color:"var(--acc)"}} title="Revisar: puede haberse ido sin fichar la salida por Puesto 1"> · ⚠ {av}</span>:null;})()}</td>
          {sin&&<td><select className="fi" style={{padding:"4px 8px",fontSize:12,maxWidth:200}} value="" disabled={busy===p.id} onChange={e=>asignar(p.id,e.target.value)}>
            <option value="">{busy===p.id?"Guardando…":"Asignar a…"}</option>
            {(d.match[p.id]||[]).length>0&&<optgroup label="💡 Sugeridas">{d.match[p.id].map(id=><option key={id} value={id}>{(d.areasById[id]||{}).nombre}</option>)}</optgroup>}
            {["empresa","area"].map(t=><optgroup key={t} label={JO_TIPOS[t]}>{areas.filter(ar=>ar.tipo===t).map(ar=><option key={ar.id} value={ar.id}>{ar.nombre}</option>)}</optgroup>)}
          </select></td>}
        </tr>)}</tbody>
      </table></div>}
    {faltan&&faltan.length>0&&<div style={{marginTop:10}}>
      <button className="bsm" onClick={()=>setVerFaltan(!verFaltan)}>{verFaltan?"▾":"▸"} {esP2?"Estuvieron en el predio pero no pasaron por Puesto 2":"En el Radar ese día pero sin fichadas"}: {faltan.length}</button>
      {verFaltan&&<div style={{fontSize:12,color:"var(--tx2)",marginTop:6,lineHeight:1.7}}>{faltan.map(p=>`${p.apellido}, ${p.nombre}`).join(" · ")}</div>}
      <div style={{fontSize:11,color:"var(--tx3)",marginTop:4}}>{esP2?"No se cuentan porque el parte está tomado de Puesto 2. Si alguno subió y no lo escanearon, contalo a mano.":"No se cuentan: el Radar es lo programado y el parte cuenta lo fichado. Sirve para detectar si a alguien no lo escanearon."}</div>
    </div>}
  </div>;
}

function JoParteDiario({user}){
  const hoy=today();
  const minIso=OPERATIVA_DESDE.slice(0,10);
  const[base,setBase]=useState(null);
  const[ev,setEv]=useState(null);
  const[evErr,setEvErr]=useState(false);
  const[evAt,setEvAt]=useState(null);
  const[leyendo,setLeyendo]=useState(false);
  const[scope,setScope]=useState("todas");
  const[mes,setMesRaw]=useState(hoy.slice(0,7));
  const[dias,setDias]=useState([]);
  const[celda,setCelda]=useState(null); // {aid|"_sin", d}
  const[ocultar0,setOcultar0]=useState(false);
  const[radar,setRadar]=useState({});    // dia → {prog:Set, franco:Set}
  const[bajando,setBajando]=useState(false);
  // Rev114: cada área se cuenta desde su propio puesto (jo_areas.fuente = "p1" | "p2"), así un mismo parte mezcla
  // empresas tomadas de Puesto 1 y otras de Puesto 2. fuenteLocal = lo cambiado en esta sesión (también sirve si
  // todavía no se corrió el SQL de la columna: funciona igual, pero no queda guardado).
  const[fuenteLocal,setFuenteLocal]=useState({});
  const[verFuentes,setVerFuentes]=useState(false);
  const[avisoSql,setAvisoSql]=useState(false);
  const leerFichadas=useCallback(async(personas)=>{
    setLeyendo(true);setEvErr(false);
    const e=await joFetchEventos(personas).catch(()=>null);
    if(e){setEv(e);setEvAt(Date.now());}else setEvErr(true);
    setLeyendo(false);
  },[]);
  useEffect(()=>{(async()=>{const b=await joFetchBase();setBase(b);if(b&&!b.falta)leerFichadas(b.personas);})();},[leerFichadas]);
  const recargarBase=async()=>{const b=await joFetchBase();if(b&&!b.falta)setBase(b);};
  const d=useMemo(()=>joDerivar(base),[base]);
  const habil=(iso)=>iso>=minIso&&iso<=hoy;
  const diasMes=useMemo(()=>{const[y,m]=mes.split("-").map(Number);const n=new Date(y,m,0).getDate();const out=[];
    for(let i=1;i<=n;i++){const iso=`${mes}-${String(i).padStart(2,"0")}`;if(iso>=minIso&&iso<=hoy)out.push(iso);}return out;},[mes,minIso,hoy]);
  const presP1Mes=useMemo(()=>ev?joPresencia(ev,diasMes):null,[ev,diasMes]);
  const presP2Mes=useMemo(()=>ev?joPresenciaP2(ev,diasMes):null,[ev,diasMes]);
  // Puesto de cada área. "Sin área" siempre por Puesto 1 (es el universo de quienes estuvieron).
  const fuenteDe=useCallback((aid)=>{if(!aid||aid==="_sin")return"p1";const a=d&&d.areasById[aid];return fuenteLocal[aid]||(a&&a.fuente)||"p1";},[d,fuenteLocal]);
  const diasSel=useMemo(()=>[...dias].sort(),[dias]);
  const res=useMemo(()=>{
    if(!presP1Mes||!presP2Mes||!d)return null;
    const porArea={},sinArea={};
    diasSel.forEach(dd=>{
      sinArea[dd]=[];
      [["p1",presP1Mes[dd]],["p2",presP2Mes[dd]]].forEach(([f,m])=>{
        if(!m)return;
        m.forEach((x,pid)=>{
          const p=d.personasById[pid];if(!p)return;
          const aid=d.areaDe[pid];
          if(!aid){if(f==="p1")sinArea[dd].push({p,x});return;}
          if(fuenteDe(aid)!==f)return;
          const pa=porArea[aid]||(porArea[aid]={});(pa[dd]||(pa[dd]=[])).push({p,x});
        });
      });
    });
    return{porArea,sinArea};
  },[presP1Mes,presP2Mes,d,diasSel,fuenteDe]);
  // Radar de los días elegidos (para avisar quién estaba programado y no fichó). No cambia los números.
  const diasKey=diasSel.join(",");
  useEffect(()=>{
    if(!d)return;
    const falta=diasSel.filter(x=>!radar[x]);
    if(!falta.length)return;
    let vivo=true;
    dbSelAll("viandas_calendario",{cols:"fecha,dni,letra",inFilter:["fecha",falta],ord:"fecha.asc,dni.asc"}).then(({data})=>{
      if(!vivo||!data)return;
      const porDni={};d.activos.forEach(p=>{porDni[normDni(p.dni)]=p.id;});
      const nuevo={};falta.forEach(x=>{nuevo[x]={prog:new Set(),franco:new Set()};});
      data.forEach(r=>{const pid=porDni[normDni(r.dni)];if(!pid||!nuevo[r.fecha])return;
        if(r.letra==="F")nuevo[r.fecha].franco.add(pid);else if(r.letra)nuevo[r.fecha].prog.add(pid);});
      setRadar(prev=>({...prev,...nuevo}));
    });
    return()=>{vivo=false;};
  },[diasKey,d]);
  if(!base)return <Spin t="Cargando…"/>;
  if(base.falta)return <div><div className="ph2"><div className="ptit">Generar <span>parte diario</span></div></div><JoFaltaSql/></div>;
  const areas=base.areas;
  const colOk=areas.length===0||areas.some(a=>Object.prototype.hasOwnProperty.call(a,"fuente"));
  const setFuentes=async(ids,f)=>{
    if(!ids.length)return;
    setFuenteLocal(prev=>{const n={...prev};ids.forEach(id=>{n[id]=f;});return n;});
    setCelda(null);
    if(!colOk){setAvisoSql(true);return;}
    let ok=true;
    for(let i=0;i<ids.length;i+=50){const r=await db.upd("jo_areas",{fuente:f},[["id","in",`(${ids.slice(i,i+50).join(",")})`]]);if(!r.ok)ok=false;}
    if(!ok)setAvisoSql(true);
  };
  const scopeAreas=scope==="todas"?areas:areas.filter(a=>a.id===scope);
  const nP2=areas.filter(a=>fuenteDe(a.id)==="p2").length,nP1=areas.length-nP2;
  const setMes=(m)=>{setMesRaw(m);setDias([]);setCelda(null);};
  const toggle=(iso)=>setDias(prev=>prev.includes(iso)?prev.filter(x=>x!==iso):[...prev,iso]);
  const cuenta=(aid,dd)=>((res&&res.porArea[aid]||{})[dd]||[]).length;
  const hint=(iso)=>{
    const m1=presP1Mes&&presP1Mes[iso],m2=presP2Mes&&presP2Mes[iso];if(!m1||!m2)return null;
    let n=0;
    if(scope==="todas"){
      m1.forEach((_,pid)=>{if(!d.personasById[pid])return;const aid=d.areaDe[pid];if(!aid||fuenteDe(aid)==="p1")n++;});
      m2.forEach((_,pid)=>{const aid=d.areaDe[pid];if(aid&&fuenteDe(aid)==="p2")n++;});
      return n;
    }
    (fuenteDe(scope)==="p2"?m2:m1).forEach((_,pid)=>{if(d.areaDe[pid]===scope)n++;});
    return n;
  };
  const totalDia=(dd)=>areas.reduce((s,a)=>s+cuenta(a.id,dd),0)+((res&&res.sinArea[dd])||[]).length;
  const filas=scopeAreas.filter(a=>!ocultar0||diasSel.some(dd=>cuenta(a.id,dd)>0));
  const sinFila=scopeAreas.filter(a=>!a.fila);
  const dup={};scopeAreas.forEach(a=>{if(a.fila)(dup[a.fila]=dup[a.fila]||[]).push(a.nombre);});
  const dupTxt=Object.entries(dup).filter(([_,l])=>l.length>1).map(([f,l])=>`fila ${f}: ${l.join(" y ")}`);
  const scopeNombre=scope==="todas"?"Todas las áreas y empresas":((scopeAreas[0]||{}).nombre||"—");
  const fScope=new Set(scopeAreas.map(a=>fuenteDe(a.id)));
  const fpLbl=(f)=>f==="p2"?"P2":"P1";
  const descargar=async()=>{
    if(!res||!diasSel.length)return;
    setBajando(true);
    try{
      const XLSX=await joLoadXLSX();
      const wb=XLSX.utils.book_new();
      // Hoja 1: cada área en su fila; nombre en su celda y la cantidad de cada día elegido en la columna de ese día.
      const ws={};let maxR=0,maxC=0;
      const put=(addr,cell)=>{ws[addr]=cell;const c=XLSX.utils.decode_cell(addr);if(c.r>maxR)maxR=c.r;if(c.c>maxC)maxC=c.c;};
      scopeAreas.filter(a=>a.fila).forEach(a=>{
        put(joCeldaNom(a),{t:"s",v:a.nombre});
        diasSel.forEach(dd=>put(`${joColDia(a,parseInt(dd.slice(8),10))}${a.fila}`,{t:"n",v:cuenta(a.id,dd)}));
      });
      ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
      const cols=[];for(let c=0;c<=maxC;c++)cols.push({wch:5});
      scopeAreas.forEach(a=>{const c=joColNum(a.col_nombre||"D")-1;if(c>=0&&c<=maxC)cols[c]={wch:26};});
      ws["!cols"]=cols;
      XLSX.utils.book_append_sheet(wb,ws,"Parte diario");
      // Hoja 2: quiénes son, para controlar.
      const det=[["Fecha","Área / empresa","Fila","Puesto","Apellido","Nombre","DNI","Empresa en Personal","Cómo se contó","Revisar (Radar)"]];
      diasSel.forEach(dd=>scopeAreas.forEach(a=>((res.porArea[a.id]||{})[dd]||[]).slice().sort((x,y)=>joPorApe(x.p,y.p))
        .forEach(({p,x})=>det.push([cmdFmtDate(dd),a.nombre,a.fila||"",fpLbl(fuenteDe(a.id)),p.apellido||"",p.nombre||"",p.dni||"",p.empresa||"",joComoTxt(x),joAvisoRadar(x,p.id,radar[dd])||""]))));
      const wd=XLSX.utils.aoa_to_sheet(det);
      wd["!cols"]=[{wch:11},{wch:24},{wch:6},{wch:7},{wch:18},{wch:18},{wch:12},{wch:30},{wch:56},{wch:30}];
      XLSX.utils.book_append_sheet(wb,wd,"Detalle");
      if(scope==="todas"){
        const sa=[["Fecha","Apellido","Nombre","DNI","Empresa en Personal","Cómo se contó","Revisar (Radar)"]];
        diasSel.forEach(dd=>(res.sinArea[dd]||[]).slice().sort((x,y)=>joPorApe(x.p,y.p))
          .forEach(({p,x})=>sa.push([cmdFmtDate(dd),p.apellido||"",p.nombre||"",p.dni||"",p.empresa||"",joComoTxt(x),joAvisoRadar(x,p.id,radar[dd])||""])));
        const w2=XLSX.utils.aoa_to_sheet(sa);
        w2["!cols"]=[{wch:11},{wch:18},{wch:18},{wch:12},{wch:30},{wch:56},{wch:30}];
        XLSX.utils.book_append_sheet(wb,w2,"Sin área");
      }
      const nom=(scope==="todas"?"todas las areas":scopeNombre).replace(/[\\/:*?"<>|]+/g," ").trim();
      const suf=fScope.size>1?" (Puesto 1 y 2)":(fScope.has("p2")?" (Puesto 2)":" (Puesto 1)");
      XLSX.writeFile(wb,`Parte diario ${nom} ${mes}${suf}.xlsx`);
    }catch(e){alert("No se pudo generar el Excel: "+((e&&e.message)||e));}
    setBajando(false);
  };
  const fC=celda?fuenteDe(celda.aid):"p1";

const JO_SQL_FUENTE=`ALTER TABLE obra.jo_areas ADD COLUMN IF NOT EXISTS fuente text NOT NULL DEFAULT 'p1' CHECK (fuente IN ('p1','p2'));`;

// Elegir de qué puesto se cuenta cada área, por grupos: se tilda un grupo y se le asigna P1 o P2.
function JoFuentesModal({areas,fuenteDe,onAplicar,onClose}){
  const[q,setQ]=useState("");
  const[marc,setMarc]=useState(()=>new Set());
  const vis=areas.filter(a=>!q.trim()||joNorm(a.nombre).includes(joNorm(q)));
  const todas=vis.length>0&&vis.every(a=>marc.has(a.id));
  const tog=(id)=>{const n=new Set(marc);n.has(id)?n.delete(id):n.add(id);setMarc(n);};
  const togTodas=()=>{const n=new Set(marc);vis.forEach(a=>todas?n.delete(a.id):n.add(a.id));setMarc(n);};
  const aplicar=(f)=>{onAplicar([...marc],f);setMarc(new Set());};
  return <div className="mo"><div className="md md-lg">
    <div className="mh"><div className="mt">De qué puesto se toma cada área</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      <div style={{fontSize:12,color:"var(--tx2)",marginBottom:10,lineHeight:1.5}}>Tildá un grupo de áreas o empresas y elegí abajo de qué puesto se cuentan. Después tildá otro grupo y elegí el otro puesto. Queda guardado para los próximos partes.</div>
      <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        <input className="fi" style={{flex:1,minWidth:180}} placeholder="Filtrar áreas..." value={q} onChange={e=>setQ(e.target.value)}/>
        <button className="bsm" onClick={togTodas}>{todas?"Destildar":"Tildar"} {q.trim()?"las filtradas":"todas"}</button>
      </div>
      <div className="jo-scroll" style={{maxHeight:"46vh"}}>
        {["empresa","area"].map(t=>{const l=vis.filter(a=>a.tipo===t);if(!l.length)return null;return <div key={t}>
          <div style={{fontSize:10,fontFamily:"var(--fm)",color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".08em",padding:"8px 10px 4px"}}>{JO_TIPOS[t]}</div>
          {l.map(a=>{const f=fuenteDe(a.id);return <label key={a.id} className={`jo-chk${marc.has(a.id)?" on":""}`}>
            <input type="checkbox" checked={marc.has(a.id)} onChange={()=>tog(a.id)}/>
            <span style={{flex:1}}>{a.nombre}</span>
            <span className={`jo-fp ${f}`} style={{cursor:"inherit"}}>{f==="p2"?"P2":"P1"}</span>
          </label>;})}
        </div>;})}
      </div>
    </div>
    <div className="mf" style={{flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:13,color:"var(--tx2)"}}>{marc.size} tildada{marc.size===1?"":"s"} →</span>
      <button className="bsm" style={{padding:"8px 12px",color:"var(--acc)",borderColor:"rgba(245,158,11,.5)",opacity:marc.size?1:.4}} disabled={!marc.size} onClick={()=>aplicar("p1")}>🚪 Puesto 1 · en el predio</button>
      <button className="bsm" style={{padding:"8px 12px",color:"#A78BFA",borderColor:"rgba(167,139,250,.55)",opacity:marc.size?1:.4}} disabled={!marc.size} onClick={()=>aplicar("p2")}>⛰️ Puesto 2 · subió al chalet</button>
      <button className="bcanc" style={{marginLeft:"auto"}} onClick={onClose}>Listo</button>
    </div>
  </div></div>;
}

// ─── Horas de personal (Rev114) ───────────────────────────────────────────────
// Para pagar horas a personal de subcontratos: se eligen personas, un puesto y un período.
//  · Puesto 2 / Puesto 3: horas entre cada entrada y la salida siguiente por ese puesto (P2: subió→bajó; P3: entró
//    al chalet→salió). El tramo cuenta en el día de la entrada. Entrada sin salida, salida sin entrada o tramos de
//    más de 18 h NO se suman y quedan como aviso para revisar.
//  · Puesto 1: días en obra (no horas: hay gente que duerme en el campamento), con el criterio del parte diario.
const JO_PUESTOS_H={
  p1:{t:"Puesto 1",s:"días en obra",d:"Cuenta los días que cada persona estuvo en el predio (fichó o seguía adentro), con la primera entrada y la última salida por Puesto 1 de cada día."},
  p2:{t:"Puesto 2",s:"horas arriba",d:"Suma las horas entre que subió (entrada por Puesto 2) y bajó (salida por Puesto 2)."},
  p3:{t:"Puesto 3",s:"horas en el chalet",d:"Suma las horas entre que entró al chalet y salió (Puesto 3)."},
};
const JO_MAX_TRAMO_H=18;
const joFmtH=(ms)=>{const m=Math.round(ms/60000);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;};
const joDecH=(ms)=>(Math.round(ms/36000)/100).toFixed(2).replace(".",",");
const joRangoDias=(a,b)=>{const r=[];for(let x=a;x<=b;x=cmdAddDays(x,1))r.push(x);return r;};
const joCalcHoras=(ev,pids,puesto,desde,hasta)=>{
  const ini=new Date(desde+"T00:00:00").getTime(),fin=new Date(cmdAddDays(hasta,1)+"T00:00:00").getTime();
  const enR=(t)=>t>=ini&&t<fin;
  const porP={};pids.forEach(id=>{porP[id]=[];});
  ev.forEach(e=>{if(e.puesto===puesto&&porP[e.pid])porP[e.pid].push(e);});
  const out={};
  pids.forEach(pid=>{
    const dias={};let total=0,nAv=0,pend=null;
    const D=(t)=>{const k=cmdIsoDate(new Date(t));return dias[k]||(dias[k]={tramos:[],ms:0,avisos:[]});};
    const aviso=(t,txt)=>{D(t).avisos.push(txt);nAv++;};
    porP[pid].forEach(e=>{
      if(e.dir==="entrada"){
        if(pend&&enR(pend.t))aviso(pend.t,`entró ${joHora(pend.t)} y no tiene salida registrada: no se suma`);
        pend=e;
      }else if(pend){
        const ms=e.t-pend.t;
        if(enR(pend.t)){
          if(ms>JO_MAX_TRAMO_H*3600000)aviso(pend.t,`${joHora(pend.t)} → ${joFechaHora(e.t)}: más de ${JO_MAX_TRAMO_H} h, revisar: no se suma`);
          else{const x=D(pend.t);x.tramos.push({a:pend.t,b:e.t,ms});x.ms+=ms;total+=ms;}
        }
        pend=null;
      }else if(enR(e.t))aviso(e.t,`salió ${joHora(e.t)} sin entrada registrada: no se suma`);
    });
    if(pend&&enR(pend.t))aviso(pend.t,`entró ${joHora(pend.t)} y no tiene salida registrada${cmdIsoDate(new Date(pend.t))===today()?" (puede seguir adentro)":""}: no se suma`);
    out[pid]={dias,total,nAv,nDias:Object.values(dias).filter(x=>x.tramos.length).length};
  });
  return out;
};
const joCalcDiasP1=(ev,pids,desde,hasta)=>{
  const dias=joRangoDias(desde,hasta);
  const pres=joPresencia(ev,dias);
  const set=new Set(pids),p1={};
  ev.forEach(e=>{
    if(e.puesto!=="Puesto 1"||!set.has(e.pid))return;
    const d=cmdIsoDate(new Date(e.t));if(d<desde||d>hasta)return;
    const k=e.pid+"|"+d,x=p1[k]||(p1[k]={ent:null,sal:null,ult:null});
    if(e.dir==="entrada"){if(!x.ent)x.ent=e.t;}else x.sal=e.t;
    x.ult=e.dir;
  });
  const out={};
  pids.forEach(pid=>{
    const ds={};let n=0;
    dias.forEach(d=>{const x=pres[d]&&pres[d].get(pid);if(!x)return;n++;ds[d]={modo:x.modo,...(p1[pid+"|"+d]||{})};});
    out[pid]={dias:ds,total:n,nAv:0,nDias:n};
  });
  return out;
};
const joTxtDiaP1=(x)=>{
  const ent=x.ent?`entró ${joHora(x.ent)}`:(x.modo==="adentro"?"ya estaba adentro":"sin fichada en P1 (fichó en otro puesto)");
  const sal=!x.sal?"siguió adentro":(x.ult==="entrada"?`salió ${joHora(x.sal)} y volvió a entrar`:`salió ${joHora(x.sal)}`);
  return `${ent} · ${sal}`;
};
const joTxtTramos=(x)=>x.tramos.map(tr=>`${joHora(tr.a)} → ${cmdIsoDate(new Date(tr.b))===cmdIsoDate(new Date(tr.a))?joHora(tr.b):joFechaHora(tr.b)} (${joFmtH(tr.ms)})`).join(" · ");
const joImprimirHoras=({puesto,desde,hasta,filas,user})=>{
  const w=window.open('','_blank');
  if(!w){alert('El navegador bloqueó la ventana para imprimir. Permití las ventanas emergentes de esta página y probá de nuevo.');return;}
  const P=JO_PUESTOS_H[puesto],esP1=puesto==="p1",E=certEsc;
  const tot=filas.reduce((s,f)=>s+f.r.total,0);
  let h='<!doctype html><html><head><meta charset="utf-8"><title>'+(esP1?'Días en obra':'Horas de personal')+' '+cmdFmtDate(desde)+' al '+cmdFmtDate(hasta)+'</title><style>'
    +'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px;font-size:12px}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:18px 0 6px;page-break-after:avoid}'
    +'table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 7px;text-align:left;vertical-align:top}th{background:#eee}.n{text-align:right;white-space:nowrap}'
    +'.tot td{font-weight:bold;background:#f2f2f2}.av{color:#9a6700}.muted{color:#666;font-size:11px}.per{page-break-inside:avoid}'
    +'@media print{body{margin:10mm}}</style></head><body>';
  h+='<h1>'+(esP1?'Días en obra — Puesto 1':'Horas de personal — '+P.t+' ('+P.s+')')+'</h1>';
  h+='<div class="muted">Período: '+cmdFmtDate(desde)+' al '+cmdFmtDate(hasta)+' · '+filas.length+' persona'+(filas.length===1?'':'s')+' · Generado '+E(joFechaHora(Date.now()))+(user&&user.nombre?' por '+E(user.nombre):'')+'</div>';
  h+='<div class="muted" style="margin-top:4px">'+E(P.d)+(esP1?'':' Entradas sin salida, salidas sin entrada y tramos de más de '+JO_MAX_TRAMO_H+' h no se suman: figuran como aviso.')+'</div>';
  h+='<h2>Resumen</h2><table><thead><tr><th>Persona</th><th>DNI</th><th>Empresa</th>'+(esP1?'<th class="n">Días</th>':'<th class="n">Días con horas</th><th class="n">Horas (h:mm)</th><th class="n">Horas (decimal)</th><th class="n">Avisos</th>')+'</tr></thead><tbody>';
  filas.forEach(({p,r})=>{h+='<tr><td>'+E(p.apellido+', '+p.nombre)+'</td><td>'+E(p.dni)+'</td><td>'+E(p.empresa||'')+'</td>'+(esP1?'<td class="n">'+r.total+'</td>':'<td class="n">'+r.nDias+'</td><td class="n">'+joFmtH(r.total)+'</td><td class="n">'+joDecH(r.total)+'</td><td class="n">'+(r.nAv||'')+'</td>')+'</tr>';});
  h+='<tr class="tot"><td colspan="3">Total</td>'+(esP1?'<td class="n">'+tot+'</td>':'<td></td><td class="n">'+joFmtH(tot)+'</td><td class="n">'+joDecH(tot)+'</td><td class="n">'+(filas.reduce((s,f)=>s+f.r.nAv,0)||'')+'</td>')+'</tr></tbody></table>';
  h+='<h2>Detalle por persona</h2>';
  filas.forEach(({p,r})=>{
    const ds=Object.keys(r.dias).sort();
    h+='<div class="per"><h2>'+E(p.apellido+', '+p.nombre)+' <span class="muted">· '+E(p.empresa||'')+' · DNI '+E(p.dni)+' · '+(esP1?r.total+' día'+(r.total===1?'':'s'):joFmtH(r.total)+' h')+'</span></h2>';
    if(!ds.length){h+='<div class="muted">Sin registros en el período.</div></div>';return;}
    h+='<table><thead><tr><th style="width:90px">Fecha</th><th>'+(esP1?'Detalle':'Tramos')+'</th>'+(esP1?'':'<th class="n" style="width:70px">Horas</th>')+'</tr></thead><tbody>';
    ds.forEach(dd=>{const x=r.dias[dd];
      h+='<tr><td>'+E(joDiaLbl(dd))+'</td><td>'+(esP1?E(joTxtDiaP1(x)):E(joTxtTramos(x))+(x.avisos.length?(x.tramos.length?'<br>':'')+'<span class="av">⚠ '+x.avisos.map(E).join('<br>⚠ ')+'</span>':''))+'</td>'+(esP1?'':'<td class="n">'+(x.ms?joFmtH(x.ms):'—')+'</td>')+'</tr>';});
    h+='</tbody></table></div>';
  });
  h+='</body></html>';
  w.document.write(h);w.document.close();w.focus();setTimeout(()=>{try{w.print();}catch(e){}},400);
};

function JoHoras({user}){
  const hoy=today(),minIso=OPERATIVA_DESDE.slice(0,10);
  const iniMes=(iso)=>{const x=iso.slice(0,8)+"01";return x<minIso?minIso:x;};
  const[base,setBase]=useState(null);
  const[ev,setEv]=useState(null);
  const[evErr,setEvErr]=useState(false);
  const[evAt,setEvAt]=useState(null);
  const[leyendo,setLeyendo]=useState(false);
  const[q,setQ]=useState("");
  const[sel,setSel]=useState(()=>new Set());
  const[puesto,setPuesto]=useState("p2");
  const[desde,setDesde]=useState(iniMes(hoy));
  const[hasta,setHasta]=useState(hoy);
  const[abierto,setAbierto]=useState(null);
  const[ocultar0,setOcultar0]=useState(true); // ocultar a quienes no tienen registros en el período (tabla y PDF)
  const leer=useCallback(async(personas)=>{
    setLeyendo(true);setEvErr(false);
    const e=await joFetchEventos(personas).catch(()=>null);
    if(e){setEv(e);setEvAt(Date.now());}else setEvErr(true);
    setLeyendo(false);
  },[]);
  useEffect(()=>{(async()=>{
    let b=await joFetchBase();
    if(!b||b.falta){const{data}=await dbSelAll("personas",{cols:"id,dni,nombre,apellido,empresa,cargo,deleted_at",ord:"id.asc"});b={areas:[],miembros:[],personas:data||[]};}
    setBase(b);leer(b.personas);
  })();},[leer]);
  const d=useMemo(()=>base?joDerivar(base):null,[base]);
  const rangoOk=!!(desde&&hasta&&desde<=hasta&&desde>=minIso&&hasta<=hoy);
  const calc=useMemo(()=>{
    if(!ev||!rangoOk||!sel.size)return null;
    const ids=[...sel];
    return puesto==="p1"?joCalcDiasP1(ev,ids,desde,hasta):joCalcHoras(ev,ids,puesto==="p2"?"Puesto 2":"Puesto 3",desde,hasta);
  },[ev,sel,puesto,desde,hasta,rangoOk]);
  if(!d)return <Spin t="Cargando…"/>;
  const res=q.trim().length>=2?joFiltra(d.activos,q):[];
  const vis=res.slice(0,150);
  const todasVis=vis.length>0&&vis.every(p=>sel.has(p.id));
  const tog=(id)=>{const n=new Set(sel);n.has(id)?n.delete(id):n.add(id);setSel(n);};
  const togVis=()=>{const n=new Set(sel);vis.forEach(p=>todasVis?n.delete(p.id):n.add(p.id));setSel(n);};
  const sumarArea=(aid)=>{if(!aid)return;const n=new Set(sel);(d.porArea[aid]||[]).filter(p=>!p.deleted_at).forEach(p=>n.add(p.id));setSel(n);};
  const selP=[...sel].map(id=>d.personasById[id]).filter(Boolean).sort(joPorApe);
  const filas=calc?selP.map(p=>({p,r:calc[p.id]})).filter(x=>x.r&&(!ocultar0||x.r.total>0||x.r.nAv>0)).sort((a,b)=>(a.p.empresa||"").localeCompare(b.p.empresa||"","es")||joPorApe(a.p,b.p)):[];
  const esP1=puesto==="p1";
  const tot=filas.reduce((s,f)=>s+f.r.total,0),totAv=filas.reduce((s,f)=>s+f.r.nAv,0);
  const periodo=(k)=>{
    if(k==="mes"){setDesde(iniMes(hoy));setHasta(hoy);}
    if(k==="ant"){const[y,m]=hoy.split("-").map(Number);const a=cmdIsoDate(new Date(y,m-2,1)),b=cmdIsoDate(new Date(y,m-1,0));setDesde(a<minIso?minIso:a);setHasta(b);}
    if(k==="7"){const a=cmdAddDays(hoy,-6);setDesde(a<minIso?minIso:a);setHasta(hoy);}
  };

        <div style={{fontSize:12,color:"var(--tx2)",marginBottom:14,lineHeight:1.5}}>{JO_PUESTOS_H[puesto].d}</div>
        <div className="jo-h">3 · Período</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:6}}>
          <input className="fi" type="date" value={desde} min={minIso} max={hoy} onChange={e=>setDesde(e.target.value)}/>
          <span style={{color:"var(--tx3)"}}>al</span>
          <input className="fi" type="date" value={hasta} min={minIso} max={hoy} onChange={e=>setHasta(e.target.value)}/>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
          <button className="bsm" onClick={()=>periodo("mes")}>Este mes</button>
          <button className="bsm" onClick={()=>periodo("ant")}>Mes anterior</button>
          <button className="bsm" onClick={()=>periodo("7")}>Últimos 7 días</button>
        </div>
        {!rangoOk&&<div className="warn" style={{fontSize:12}}>Revisá las fechas: "desde" tiene que ser anterior a "hasta", entre el {cmdFmtDate(minIso)} y hoy.</div>}
        <div className="jo-h" style={{marginTop:12}}>4 · Descargar</div>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--tx2)",cursor:"pointer",marginBottom:8}}><input type="checkbox" checked={ocultar0} onChange={e=>setOcultar0(e.target.checked)}/> Ocultar a quienes no tienen registros en el período</label>
        <button className="badd" disabled={!filas.length} style={{opacity:filas.length?1:.5}} onClick={()=>joImprimirHoras({puesto,desde,hasta,filas,user})}>📄 Descargar PDF</button>
        <div style={{fontSize:11,color:"var(--tx3)",marginTop:6,lineHeight:1.5}}>Se abre la vista para imprimir: elegí "Guardar como PDF". Trae el resumen con totales y el detalle día por día de cada persona.</div>

    </div>
    {!ev&&!evErr&&<Spin t="Leyendo fichadas…"/>}

    {ev&&rangoOk&&sel.size===0&&<div style={{textAlign:"center",color:"var(--tx3)",padding:24}}>Elegí personas arriba para ver {esP1?"los días":"las horas"}.</div>}
    {calc&&sel.size>0&&filas.length===0&&<div style={{textAlign:"center",color:"var(--tx3)",padding:24}}>Ninguna de las {sel.size} personas elegidas tiene registros en {JO_PUESTOS_H[puesto].t} entre el {cmdFmtDate(desde)} y el {cmdFmtDate(hasta)}.</div>}
    {filas.length>0&&<>

        <div style={{fontFamily:"var(--fh)",fontSize:18,fontWeight:700,textTransform:"uppercase"}}>{JO_PUESTOS_H[puesto].t} · {JO_PUESTOS_H[puesto].s}</div>
        <div style={{fontSize:12,color:"var(--tx2)"}}>{cmdFmtDate(desde)} al {cmdFmtDate(hasta)} · tocá una persona para ver el detalle</div>

            <tr style={{cursor:"pointer"}} onClick={()=>setAbierto(ab?null:p.id)}>
              <td style={{whiteSpace:"nowrap"}}>{ab?"▾":"▸"} {p.apellido}, {p.nombre}</td>

                <td className="mn" style={{textAlign:"right"}}>{joDecH(r.total)}</td>
                <td className="mn" style={{textAlign:"right",color:r.nAv?"var(--acc)":"var(--tx3)"}}>{r.nAv||"—"}</td>
              </>}
            </tr>
            {ab&&<tr><td colSpan={esP1?4:7} style={{background:"var(--bg)",padding:"8px 14px"}}>
              {ds.length===0?<div style={{fontSize:12,color:"var(--tx3)"}}>Sin registros en el período.</div>:
                ds.map(dd=>{const x=r.dias[dd];return <div key={dd} style={{display:"flex",gap:10,fontSize:12,padding:"3px 0",borderBottom:"1px solid rgba(42,47,66,.5)"}}>
                  <span className="mn" style={{width:80,flexShrink:0,color:"var(--tx2)"}}>{joDiaLbl(dd)}</span>
                  <span style={{flex:1}}>{esP1?joTxtDiaP1(x):<>{joTxtTramos(x)}{x.avisos.map((a,i)=><div key={i} style={{color:"var(--acc)"}}>⚠ {a}</div>)}</>}</span>
                  {!esP1&&<span className="mn" style={{width:50,textAlign:"right"}}>{x.ms?joFmtH(x.ms):"—"}</span>}
                </div>;})}
            </td></tr>}
          </React.Fragment>;})}
          <tr className="tot"><td colSpan={3} style={{fontWeight:700,borderTop:"2px solid var(--bd)"}}>Total ({filas.length} persona{filas.length===1?"":"s"})</td>
            {esP1?<td className="mn" style={{textAlign:"right",fontWeight:700,borderTop:"2px solid var(--bd)"}}>{tot}</td>:<>
              <td style={{borderTop:"2px solid var(--bd)"}}></td>
              <td className="mn" style={{textAlign:"right",fontWeight:700,borderTop:"2px solid var(--bd)"}}>{joFmtH(tot)}</td>
              <td className="mn" style={{textAlign:"right",borderTop:"2px solid var(--bd)"}}>{joDecH(tot)}</td>
              <td className="mn" style={{textAlign:"right",borderTop:"2px solid var(--bd)",color:totAv?"var(--acc)":"var(--tx3)"}}>{totAv||"—"}</td>
            </>}
          </tr>
        </tbody>
      </table></div>
    </>}
  </div>;
}

            <option value="">{busy===p.id?"Guardando…":"Agregar a…"}</option>
            {sug.length>0&&<optgroup label="💡 Sugeridas">{sug.map(id=><option key={id} value={id}>{(d.areasById[id]||{}).nombre}</option>)}</optgroup>}
            {["empresa","area"].map(tp=><optgroup key={tp} label={JO_TIPOS[tp]}>{areas.filter(a=>a.tipo===tp).map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}</optgroup>)}
          </select>}
      </div>;})}
    </div>

  </div></div>;

function JoAvisoSinArea({user}){
  const[pend,setPend]=useState([]);
  const[ctx,setCtx]=useState(null);
  const[ver,setVer]=useState(null);
  const pers=useRef({at:0,list:[]});
  const check=useCallback(async()=>{
    try{
      const desde=cmdAddDays(today(),-2)+"T00:00:00";
      if(Date.now()-pers.current.at>10*60000){
        const{data}=await dbSelAll("personas",{cols:"id,dni,nombre,apellido,empresa,cargo,deleted_at",ord:"id.asc"});
        if(data)pers.current={at:Date.now(),list:data};
      }
      const[a,m,s,mm]=await Promise.all([
        db.sel("jo_areas",{ord:"fila.asc.nullslast,nombre.asc",lim:2000}),
        dbSelAll("jo_area_personas",{cols:"persona_id,area_id",ord:"persona_id.asc"}),
        db.sel("sesiones_acceso",{cols:"id,cerrada_at",f:[["puesto","eq","Puesto 1"],["direccion","eq","entrada"],["cerrada_at","gte",desde]],lim:3000}),
        db.sel("movimientos_manuales",{cols:"persona_id,dni_raw,created_at",f:[["puesto","eq","Puesto 1"],["direccion","eq","entrada"],["created_at","gte",desde]],lim:3000}),
      ]);
      if(!a.data||!m.data||!s.data||!mm.data||!a.data.length)return;
      let regs=[];const ids=s.data.map(x=>x.id);
      for(let i=0;i<ids.length;i+=80){
        const{data}=await db.sel("registros_acceso",{cols:"persona_id,dni_raw,sesion_id",inFilter:["sesion_id",ids.slice(i,i+80)]});
        if(!data)return;regs=regs.concat(data);
      }
      const tSes={};s.data.forEach(x=>{tSes[x.id]=new Date(x.cerrada_at).getTime();});
      const porDni={};pers.current.list.forEach(p=>{const k=normDni(p.dni);if(k&&(!porDni[k]||!p.deleted_at))porDni[k]=p.id;});
      const ult={};const nota=(pid,t)=>{if(pid&&t&&(!ult[pid]||t>ult[pid]))ult[pid]=t;};
      regs.forEach(r=>nota(r.persona_id||(r.dni_raw?porDni[normDni(r.dni_raw)]:null),tSes[r.sesion_id]));
      mm.data.forEach(x=>nota(x.persona_id||(x.dni_raw?porDni[normDni(x.dni_raw)]:null),new Date(x.created_at).getTime()));
      const dd=joDerivar({areas:a.data,miembros:m.data,personas:pers.current.list});
      const lista=Object.keys(ult).map(pid=>({p:dd.personasById[pid],t:ult[pid]})).filter(x=>x.p&&!x.p.deleted_at&&!dd.areaDe[x.p.id]).sort((x,y)=>y.t-x.t);
      setCtx({d:dd,areas:a.data});setPend(lista);
      let av={};try{av=JSON.parse(localStorage.getItem("jo_avisados")||"{}")||{};}catch(e){}
      const lim=cmdAddDays(today(),-7);Object.keys(av).forEach(k=>{if(av[k]<lim)delete av[k];});
      const nuevos=lista.filter(x=>!av[x.p.id]);
      nuevos.forEach(x=>{av[x.p.id]=today();});
      try{localStorage.setItem("jo_avisados",JSON.stringify(av));}catch(e){}
      if(nuevos.length)setVer(v=>v||lista);
    }catch(e){}
  },[]);
  useEffect(()=>{check();const i=setInterval(check,120000);return()=>clearInterval(i);},[check]);
  return <>
    {pend.length>0&&<div className="jo-aviso" onClick={()=>setVer(pend)}>
      <span>⚠ {pend.length===1?`Ingresó ${pend[0].p.nombre} ${pend[0].p.apellido} y no está`:`${pend.length} personas ingresaron por Puesto 1 y no están`} en ningún área del parte diario.</span>
      <button className="bsm" style={{marginLeft:"auto",flexShrink:0}}>Asignar área</button>
    </div>}
    {ver&&ctx&&<JoIngresoSinAreaModal lista={ver} d={ctx.d} areas={ctx.areas} user={user} onClose={()=>setVer(null)} onAsignado={check}/>}
  </>;
}

function Login({onLogin,onPublic}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const go=async()=>{
    setLoading(true);setErr("");
    if(!isOnline()){
      setErr("Sin conexión a internet. La app necesita conexión para funcionar — registrá las fichadas en la hoja alternativa hasta que vuelva.");

    const r=await authApi.signIn(email,pw);

    const{data}=await db.sel("usuarios",{f:[["id","eq",r.userId]],lim:1});
    if(!data||!data[0]){setErr("Usuario sin perfil. Contacta al administrador.");await authApi.signOut();setLoading(false);return;}
    onLogin(data[0]);setLoading(false);
  };
  return <div className="lwrap"><div className="lcard">
    <div className="llogo">CONTROL<span>OBRA</span> <span style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3,verticalAlign:"middle"}}>{APP_REV}</span></div>
    <div className="lsub">Sistema de control de puestos</div>
    {err&&<div className="err">{err}</div>}
    <div className="f"><label>Email</label><input type="email" placeholder="usuario@obrasysistemas.com.ar" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} autoFocus/></div>
    <div className="f"><label>Contrasena</label><input type="password" placeholder="..." value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></div>
    <button className="bp" onClick={go} disabled={loading}>{loading?"Ingresando...":"Ingresar"}</button>
    <button className="lpub" onClick={onPublic}>Ver movimientos de obra (sin login)</button>
  </div></div>;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[tab,setTab]=useState(null);
  const[proyectos,setProyectos]=useState([]);
  const[checking,setChecking]=useState(true);
  const[publicMode,setPublicMode]=useState(false);
  const pid=proyectos.length>0?proyectos[0].id:null;

  useEffect(()=>{
    const uid=restoreSes();
    if(uid){
      // Intentar cargar usuario directamente, si falla por 401 el dbq lo refresca solo
      const timeout=setTimeout(()=>setChecking(false),8000); // max 8s
      db.sel("usuarios",{f:[["id","eq",uid]],lim:1}).then(({data})=>{
        clearTimeout(timeout);
        if(data&&data[0])login(data[0]);
        else setChecking(false);
      }).catch(()=>{clearTimeout(timeout);setChecking(false);});
    }
    else setChecking(false);
  },[]);

  // Rev114: Escape cierra la ventana abierta de más arriba (todas tienen la "x" .mc; las de Viandas cierran tocando el fondo).
  useEffect(()=>{
    const onKey=(e)=>{
      if(e.key!=="Escape")return;
      const ovs=document.querySelectorAll(".mo, .cmd-modov");
      if(!ovs.length)return;
      const top=ovs[ovs.length-1];
      if(top.classList.contains("cmd-modov")){top.click();return;}
      const b=top.querySelector(".mc");
      if(b)b.click();
    };
    document.addEventListener("keydown",onKey);
    return()=>document.removeEventListener("keydown",onKey);
  },[]);

  // Rev127: habilitación permanente de CP (app_config). Se lee al entrar y cada 2 minutos; al cambiar, se redibuja todo.
  const[cpTick,setCpTick]=useState(0);
  useEffect(()=>{CP_SUBS.add(setCpTick);return()=>{CP_SUBS.delete(setCpTick);};},[]);
  useEffect(()=>{if(!user)return;cargarCpForzado();const i=setInterval(cargarCpForzado,120000);return()=>clearInterval(i);},[user]);
  const desactivarCp=async()=>{
    if(!confirm("¿Desactivar la habilitación permanente de CP?\n\nCP Ingreso vuelve a tomarse del Radar."))return;
    const ok=await guardarCpForzado({activo:false,por:user.nombre||user.email||"",at:new Date().toISOString()},user.id);
    if(!ok)alert("No se pudo guardar. Revisá la conexión.");
  };

  const login=async p=>{
    setUser(p);
    setTab({puesto:"sc",sh:"per",cp:"per",admin:"per",logistica:"per",cocina_campamento:"vi",cocina_chalet:"vi",admin_viandas:"vi",sobrestante:"jpd",jefe_obra:"jpd"}[p.rol]||"per");
    const{data}=await db.sel("proyectos",{f:[["activo","eq",true]]});
    if(data)setProyectos(data);
    setChecking(false);
  };
  const logout=async()=>{await authApi.signOut();setUser(null);setTab(null);setProyectos([]);};

  // "cvc" = Conteo Viandas Chalet (el conteo viejo, renombrado). "vi" = Viandas (módulo comedor nuevo).
  const TABS_SOB=[{k:"reg",l:"Registros"},{k:"pc",l:"Conteo de personal"},{k:"ph",l:"Consulta habilitaciones"},{k:"pm",l:"Movimientos del día"},{k:"jpd",l:"Parte diario"},{k:"jhs",l:"Horas de personal"}];
  const TABS={
    puesto:           [{k:"sc",l:"Escanear"},{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    sh:               [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    cp:               [{k:"per",l:"Personal"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    logistica:        [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"reg",l:"Registros"},{k:"cvc",l:"Chalet"}],
    cocina_campamento:[{k:"vi",l:"Viandas"}],
    cocina_chalet:    [{k:"vi",l:"Viandas"}],
    admin_viandas:    [{k:"vi",l:"Viandas"}],
    // Rev112: lo mismo que la vista sin login (como solapas) + Reportes JO completo. Rev114: + Registros (solo ver).
    sobrestante:      TABS_SOB,
    jefe_obra:        TABS_SOB,
    admin:            [{k:"per",l:"Personal"},{k:"veh",l:"Vehiculos"},{k:"sc",l:"Puestos"},{k:"reg",l:"Registros"},{k:"vi",l:"Viandas"},{k:"cvc",l:"Chalet"},{k:"jpd",l:"Parte diario"},{k:"jhs",l:"Horas de personal"},{k:"adm",l:"Usuarios"}],
  };
  // Agrupación visual de solapas (cada rol ve solo los grupos donde tiene alguna solapa)
  const NAV_GROUPS=[
    {t:"Habilitaciones",    ks:["per","veh"]},
    {t:"Control de puestos",ks:["sc","reg"]},
    {t:"Gastronomía",       ks:["vi","cvc"]},
    {t:"Movimientos de obra",ks:["pc","ph","pm"]},
    {t:"Reportes JO",       ks:["jpd","jhs"]},
    {t:"Administración",    ks:["adm"]},
  ];

  if(checking)return <div className="lwrap"><Spin t="Iniciando..."/></div>;
  if(publicMode)return <PublicDashboard onBack={()=>setPublicMode(false)}/>;
  if(!user)return <Login onLogin={login} onPublic={()=>setPublicMode(true)}/>;
  const tabs=TABS[user.rol]||[];
  return <div className="app">
    <div className="topbar">
      <div className="brand">CONTROL<span>OBRA</span> <span style={{fontSize:10,fontFamily:"var(--fm)",color:"var(--tx3)",marginLeft:6,fontWeight:400,letterSpacing:.3}}>{APP_REV}</span></div>
      <div className="tr" style={{gap:8,flexWrap:"nowrap"}}>
        <span style={{fontSize:12,color:"var(--tx2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:80}}>{user.nombre}</span>
        <span className="rol" style={{flexShrink:0}}>{user.rol==="puesto"?user.puesto_nombre||"Puesto":(ROL_LBL[user.rol]||user.rol).toUpperCase()}</span>
        <button className="btn-out" onClick={logout} style={{flexShrink:0}}>Salir</button>
      </div>
    </div>
    {pid&&<div style={{background:"var(--s2)",borderBottom:"1px solid var(--bd)",padding:"5px 12px",display:"flex",alignItems:"center",gap:8,overflowX:"auto"}}><ChaletMini proyectoId={pid} user={user}/></div>}
    {/* Rev116: el aviso de ingresos sin área es solo para sobrestantes (no para jefe de obra). */}
    {user.rol==="sobrestante"&&<CmdErrBoundary><JoAvisoSinArea user={user}/></CmdErrBoundary>}
    {user.rol==="admin"&&cpForzadoActivo()&&<div style={{background:"rgba(245,158,11,.16)",borderBottom:"2px solid var(--acc)",color:"var(--acc)",padding:"8px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",fontSize:13}}>
      <span style={{fontSize:18}}>⚠️</span>
      <span style={{flex:1,minWidth:220}}><b>HABILITACIÓN PERMANENTE DE CP ACTIVADA</b> {CP_FORZADO.hasta?"hasta el "+cmdFmtDate(CP_FORZADO.hasta):"(sin fecha de fin)"}: CP Ingreso no se toma del Radar y figuran todos habilitados.{CP_FORZADO.por?" Activada por "+CP_FORZADO.por+(CP_FORZADO.at?" el "+fmtTs(CP_FORZADO.at):""):""}</span>
      <button className="bsm" style={{flexShrink:0}} onClick={desactivarCp}>Desactivar</button>
    </div>}
    {tabs.length>1&&<div className="nav grp">{NAV_GROUPS.map(g=>{
      const gt=tabs.filter(t=>g.ks.includes(t.k));
      if(!gt.length)return null;
      return <div key={g.t} className="ngrp">
        <div className="ngrp-t">{g.t}</div>
        <div className="ngrp-b">{gt.map(t=><button key={t.k} className={`nb${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}>{t.l}</button>)}</div>
      </div>;
    })}</div>}
    <div className="main">
      {tab==="per"&&<PersonalPanel userRole={user.rol} currentUserId={user.id} proyectoId={pid} user={user}/>}
      {tab==="veh"&&<VehiculosPanel userRole={user.rol} currentUserId={user.id} proyectoId={pid}/>}
      {tab==="reg"&&<Registros defaultPuesto={user.rol==="puesto"?user.puesto_nombre:""} user={user}/>}
      {tab==="sc" &&<Puesto user={user} pid={pid}/>}
      {tab==="cvc"&&<ConteoViandasChalet user={user} proyectoId={pid}/>}
      {tab==="vi" &&<Comedor user={user} proyectoId={pid}/>}
      {tab==="pc" &&<PublicDashboard embedTab="chalet"/>}
      {tab==="ph" &&<PublicDashboard embedTab="consulta"/>}
      {tab==="pm" &&<PublicDashboard embedTab="movimientos"/>}
      {tab==="jpd"&&<CmdErrBoundary><JoParteDiarioSec user={user}/></CmdErrBoundary>}
      {tab==="jhs"&&<CmdErrBoundary><JoHoras user={user}/></CmdErrBoundary>}
      {tab==="adm"&&<Usuarios currentUser={user}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
