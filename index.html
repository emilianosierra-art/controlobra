<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ControlObra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0C0E14;--s1:#141720;--s2:#1C2030;--bd:#2A2F42;--acc:#F59E0B;--acc2:#3B82F6;--tx:#E8EAF0;--tx2:#8892A4;--tx3:#5C6577;--gr:#10B981;--rd:#EF4444;--pu:#8B5CF6;--fh:'Barlow Condensed',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Barlow',sans-serif}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--s1);border-bottom:2px solid var(--bd);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:.05em}.brand span{color:var(--acc)}
.tr{display:flex;align-items:center;gap:10px}
.rol{background:var(--s2);border:1px solid var(--bd);padding:3px 10px;border-radius:4px;font-size:11px;font-family:var(--fm);color:var(--acc);text-transform:uppercase}
.btn-out{background:none;border:1px solid var(--bd);color:var(--tx2);padding:5px 12px;border-radius:4px;cursor:pointer;font-size:13px}.btn-out:hover{border-color:var(--rd);color:var(--rd)}
.nav{background:var(--s2);border-bottom:1px solid var(--bd);display:flex;padding:0 20px;overflow-x:auto;gap:2px}
.nb{background:none;border:none;color:var(--tx2);padding:11px 18px;cursor:pointer;font-family:var(--fh);font-size:14px;letter-spacing:.05em;font-weight:600;text-transform:uppercase;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}.nb:hover{color:var(--tx)}.nb.on{color:var(--acc);border-bottom-color:var(--acc)}
.nav.grp{padding:8px 20px 0;gap:10px;align-items:flex-end}
.ngrp{display:flex;flex-direction:column;flex-shrink:0;border:1px solid var(--bd);border-bottom:none;border-radius:6px 6px 0 0;background:rgba(0,0,0,.12)}
.ngrp-t{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:5px 12px 0;white-space:nowrap}
.ngrp-b{display:flex}
.ngrp .nb{padding:7px 14px 9px}
.main{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto}
/* LOGIN */
.lwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,var(--bd) 39px,var(--bd) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,var(--bd) 39px,var(--bd) 40px);background-size:40px 40px}
.lcard{background:var(--s1);border:2px solid var(--bd);border-radius:8px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.llogo{font-family:var(--fh);font-size:36px;font-weight:800;letter-spacing:.05em;margin-bottom:4px}.llogo span{color:var(--acc)}
.lsub{color:var(--tx2);font-size:13px;font-family:var(--fm);letter-spacing:.05em;margin-bottom:28px;text-transform:uppercase}
.lpub{width:100%;background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:4px;padding:11px;font-family:var(--fh);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:all .15s}.lpub:hover{border-color:var(--pu);color:#A78BFA}
/* FORMS */
.f{margin-bottom:14px}.f label{display:block;font-size:11px;font-family:var(--fm);color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:9px 13px;color:var(--tx);font-size:14px;font-family:var(--fb);transition:border-color .15s;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}.f input::placeholder{color:var(--tx2);opacity:.4}.f textarea{resize:vertical;min-height:70px}.f select{cursor:pointer;background:var(--s2)}
.bp{width:100%;background:var(--acc);color:#000;border:none;border-radius:4px;padding:12px;font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.bp:hover{filter:brightness(1.1)}.bp:disabled{opacity:.35;cursor:not-allowed;filter:none}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:var(--rd);padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:16px}
.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:var(--acc);padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:12px}
.row2{display:flex;gap:12px}.row2 .f{flex:1}
.badd{background:var(--acc);color:#000;border:none;border-radius:4px;padding:8px 18px;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.badd:hover{filter:brightness(1.1)}
.bsm{border:1px solid var(--bd);background:var(--s2);color:var(--tx2);border-radius:3px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s}.bsm:hover{border-color:var(--acc2);color:var(--acc2)}.bsm-r:hover{border-color:var(--rd)!important;color:var(--rd)!important}
.bcanc{background:var(--s2);color:var(--tx2);border:1px solid var(--bd);border-radius:4px;padding:12px 20px;font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.bcanc:hover{border-color:var(--tx2)}
/* TABLE */
.ph2{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ptit{font-family:var(--fh);font-size:28px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.ptit span{color:var(--acc)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:14px 16px}
.sc-btn{cursor:pointer;transition:all .15s}.sc-btn:hover{border-color:var(--acc2);background:rgba(59,130,246,.05)}
.sv{font-family:var(--fh);font-size:34px;font-weight:800;line-height:1}.slb{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-top:4px;font-family:var(--fm)}
.fb{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.fi{background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:8px 13px;color:var(--tx);font-size:13px;outline:none;transition:border-color .15s}.fi:focus{border-color:var(--acc2)}.fi::placeholder{color:var(--tx2);opacity:.45}
.tw{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 200px)}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:var(--s2);padding:8px 12px;text-align:left;font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;z-index:10}
th.sh-h{color:#60A5FA;border-left:2px solid rgba(59,130,246,.25)}th.cp-h{color:var(--gr);border-left:2px solid rgba(16,185,129,.25)}
td{padding:9px 12px;border-bottom:1px solid rgba(42,47,66,.5);font-size:13px;vertical-align:middle}
td.sh-c{border-left:2px solid rgba(59,130,246,.1)}td.cp-c{border-left:2px solid rgba(16,185,129,.1)}
tr:last-child td{border-bottom:none}tr:hover td{background:rgba(255,255,255,.012)}
.mn{font-family:var(--fm);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-family:var(--fm);text-transform:uppercase;letter-spacing:.05em;border:1px solid}
.t-a{background:rgba(16,185,129,.1);color:var(--gr);border-color:rgba(16,185,129,.3)}.t-e{background:rgba(245,158,11,.1);color:var(--acc);border-color:rgba(245,158,11,.3)}.t-v{background:rgba(139,92,246,.1);color:#A78BFA;border-color:rgba(139,92,246,.3)}.t-p{background:rgba(59,130,246,.1);color:#60A5FA;border-color:rgba(59,130,246,.3)}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:11px;font-weight:700;background:var(--s2);border:1px solid var(--bd);color:var(--tx2);flex-shrink:0}
/* HAB CELL */
.hc{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:11px;font-family:var(--fm);font-weight:600;border:1px solid;white-space:nowrap;transition:all .15s}
.hc-ok{background:rgba(16,185,129,.1);color:var(--gr);border-color:rgba(16,185,129,.3)}.hc-exp{background:rgba(245,158,11,.1);color:var(--acc);border-color:rgba(245,158,11,.3)}.hc-sus{background:rgba(239,68,68,.1);color:var(--rd);border-color:rgba(239,68,68,.3)}
.hc-edit{cursor:pointer}.hc-edit:hover{filter:brightness(1.25)}
.hc-add{background:none;border:1px dashed var(--bd);color:var(--tx2);border-radius:4px;padding:3px 8px;font-size:11px;font-family:var(--fm);cursor:pointer;transition:all .15s}.hc-add:hover{border-color:var(--acc);color:var(--acc)}
.est-ok{display:inline-flex;align-items:center;gap:4px;background:rgba(16,185,129,.12);color:var(--gr);border:1px solid rgba(16,185,129,.3);border-radius:4px;padding:3px 10px;font-family:var(--fh);font-size:13px;font-weight:700;text-transform:uppercase}
.est-no{display:inline-flex;align-items:center;gap:4px;background:rgba(239,68,68,.1);color:var(--rd);border:1px solid rgba(239,68,68,.3);border-radius:4px;padding:3px 10px;font-family:var(--fh);font-size:13px;font-weight:700;text-transform:uppercase}
.est-par{display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,.08);color:var(--acc);border:1px solid rgba(245,158,11,.25);border-radius:4px;padding:3px 10px;font-family:var(--fh);font-size:13px;font-weight:700;text-transform:uppercase}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.md{background:var(--s1);border:1px solid var(--bd);border-radius:8px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7)}
.md-lg{max-width:680px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bd)}
.mt{font-family:var(--fh);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mc{background:none;border:none;color:var(--tx2);font-size:22px;cursor:pointer;line-height:1}.mc:hover{color:var(--rd)}
.mb{padding:22px 24px}.mf{display:flex;gap:10px;padding:0 24px 22px}.mf .bp{flex:1}
/* LOADER */
.load{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--tx2);font-family:var(--fm);font-size:13px;gap:10px}
.spin{width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* CHALET BAR */
.chalet-bar{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(59,130,246,.1));border:1px solid rgba(139,92,246,.35);border-radius:8px;padding:16px 22px;margin-bottom:18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.chalet-num{font-family:var(--fh);font-size:52px;font-weight:900;color:#A78BFA;line-height:1}
.chalet-label{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A78BFA}
.chalet-sub{font-size:12px;color:var(--tx2);font-family:var(--fm);margin-top:3px}
.chalet-btn{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);color:#A78BFA;border-radius:5px;padding:7px 16px;font-family:var(--fh);font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-left:auto}.chalet-btn:hover{background:rgba(139,92,246,.25)}
/* PUESTO STEPS */
.steps{display:flex;margin-bottom:18px}
.step{display:flex;align-items:center;gap:8px;padding:10px 18px;font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);border-bottom:3px solid var(--bd);flex:1;transition:all .2s}
.sn{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.step.on{color:var(--acc);border-bottom-color:var(--acc)}.step.on .sn{background:var(--acc);border-color:var(--acc);color:#000}
.step.dn{color:var(--gr);border-bottom-color:var(--gr)}.step.dn .sn{background:var(--gr);border-color:var(--gr);color:#000}
.vc{background:var(--s1);border:2px solid var(--bd);border-radius:8px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vc.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.04)}.vc.no{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.04)}
.vp{font-family:var(--fm);font-size:26px;font-weight:600;letter-spacing:.1em}.vd{font-size:13px;color:var(--tx2);margin-top:2px}
.vs{margin-left:auto;text-align:right}.vsl{font-family:var(--fh);font-size:22px;font-weight:800;text-transform:uppercase}.vsl.ok{color:var(--gr)}.vsl.no{color:var(--rd)}
.sbox{background:var(--s1);border:2px solid var(--bd);border-radius:8px;padding:18px 22px;margin-bottom:14px}
.slbl{font-family:var(--fh);font-size:12px;letter-spacing:.1em;color:var(--tx2);text-transform:uppercase;margin-bottom:10px}
.srow{display:flex;gap:10px}
.sinp{flex:1;background:var(--bg);border:2px solid var(--acc);border-radius:4px;padding:13px 16px;color:var(--tx);font-size:22px;font-family:var(--fm);letter-spacing:.08em;outline:none;text-transform:uppercase}.sinp::placeholder{color:var(--tx2);opacity:.3;font-size:15px}.sinp:focus{box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.bsc{background:var(--acc);color:#000;border:none;border-radius:4px;padding:0 22px;font-family:var(--fh);font-size:16px;font-weight:700;text-transform:uppercase;cursor:pointer}.bsc:hover{filter:brightness(1.1)}
.sh-hint{font-size:12px;color:var(--tx2);margin-top:7px;font-family:var(--fm)}
.fl{padding:13px 18px;border-radius:6px;margin-bottom:12px;animation:fi .15s ease}
.fl-ok{background:rgba(16,185,129,.1);border:2px solid var(--gr)}.fl-no{background:rgba(239,68,68,.1);border:2px solid var(--rd)}
.fll{font-family:var(--fh);font-size:22px;font-weight:800}.fl-ok .fll{color:var(--gr)}.fl-no .fll{color:var(--rd)}
@keyframes fi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.pi{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:5px;margin-bottom:5px;border:1px solid transparent}
.pi.ok{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.22)}.pi.no{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.22)}
.pd{width:9px;height:9px;border-radius:50%;flex-shrink:0}.pd.ok{background:var(--gr)}.pd.no{background:var(--rd)}
.bcl{width:100%;background:var(--s2);border:2px solid var(--gr);color:var(--gr);border-radius:6px;padding:13px;font-family:var(--fh);font-size:17px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-top:14px}.bcl:hover{background:rgba(16,185,129,.14)}.bcl:disabled{opacity:.35;cursor:not-allowed}
.bnew{width:100%;background:var(--acc);color:#000;border:none;border-radius:6px;padding:14px;font-family:var(--fh);font-size:18px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-top:10px}.bnew:hover{filter:brightness(1.1)}
.scard{background:var(--s1);border:2px solid var(--bd);border-radius:8px;padding:20px 24px;margin-bottom:14px}
.stit{font-family:var(--fh);font-size:20px;font-weight:800;text-transform:uppercase;margin-bottom:14px;color:var(--acc)}
.dtog{display:flex;gap:8px;margin-bottom:14px}
.db{flex:1;background:var(--s2);border:2px solid var(--bd);border-radius:4px;padding:10px;color:var(--tx2);font-family:var(--fh);font-size:16px;font-weight:700;text-transform:uppercase;cursor:pointer}
.db-in.on{background:rgba(59,130,246,.15);border-color:#3B82F6;color:#60A5FA}.db-out.on{background:rgba(245,158,11,.1);border-color:var(--acc);color:var(--acc)}
.rt{font-family:var(--fh);font-size:12px;letter-spacing:.1em;color:var(--tx2);text-transform:uppercase;margin-bottom:8px;margin-top:22px}
.sr{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--s1);border:1px solid var(--bd);border-radius:4px;margin-bottom:5px;font-size:13px;cursor:pointer;transition:all .15s}.sr:hover{border-color:var(--acc2)}
.ld{font-family:var(--fm);font-size:11px;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.ld-in{background:rgba(59,130,246,.15);color:#60A5FA;border:1px solid rgba(59,130,246,.3)}.ld-out{background:rgba(245,158,11,.1);color:#FCD34D;border:1px solid rgba(245,158,11,.3)}
.btn-manual{background:var(--s2);border:1px solid var(--bd);color:var(--tx2);border-radius:5px;padding:9px 16px;font-family:var(--fh);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .15s;width:100%;margin-top:8px}.btn-manual:hover{border-color:var(--acc);color:var(--acc)}
.dir-big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.dir-big-btn{background:var(--s2);border:2px solid var(--bd);border-radius:6px;padding:18px;font-family:var(--fh);font-size:22px;font-weight:800;text-transform:uppercase;cursor:pointer;transition:all .15s;text-align:center}
.dir-big-btn.in:hover{background:rgba(59,130,246,.15);border-color:#3B82F6;color:#60A5FA}
.dir-big-btn.out:hover{background:rgba(245,158,11,.1);border-color:var(--acc);color:var(--acc)}
/* PUBLIC DASHBOARD */
.pub-wrap{min-height:100vh;background:var(--bg)}
.pub-bar{background:var(--s1);border-bottom:2px solid var(--bd);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.pub-tabs{display:flex;gap:2px;padding:0 20px;background:var(--s2);border-bottom:1px solid var(--bd);overflow-x:auto}
.pub-tab{background:none;border:none;color:var(--tx2);padding:11px 18px;cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:600;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}.pub-tab:hover{color:var(--tx)}.pub-tab.on{color:var(--pu);border-bottom-color:var(--pu)}
.pub-main{padding:24px;max-width:1100px;margin:0 auto}
.pub-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#A78BFA;border-radius:4px;padding:3px 10px;font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.pub-dot{width:7px;height:7px;border-radius:50%;background:#A78BFA;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* CHECKBOX LIST */
.cbl{max-height:320px;overflow-y:auto;border:1px solid var(--bd);border-radius:4px}
.cbl-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid rgba(42,47,66,.5);cursor:pointer;transition:background .1s}
.cbl-item:last-child{border-bottom:none}.cbl-item:hover{background:var(--s2)}
.cbl-item input[type=checkbox]{width:auto;cursor:pointer;accent-color:var(--acc)}
.offline-bar{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(245,158,11,.1));border:2px solid rgba(239,68,68,.5);border-radius:8px;padding:14px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.offline-title{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--rd);text-transform:uppercase;letter-spacing:.05em}
.btn-offline{background:rgba(239,68,68,.15);border:2px solid var(--rd);color:var(--rd);border-radius:5px;padding:8px 18px;font-family:var(--fh);font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .15s;width:100%;margin-top:8px}
.btn-offline:hover{background:rgba(239,68,68,.25)}
.pending-bar{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.4);border-radius:8px;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:600px){
  button{min-height:40px}
  .bsc,.bcl,.bnew,.badd,.bp,.bcanc{min-height:44px;font-size:14px}
  .btn-out{min-height:36px}
  .bsm{min-height:34px;padding:6px 12px}
  .top{padding:6px 10px;gap:6px}
  .tr{gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tr .btn-out{padding:5px 10px;font-size:12px}
  .tr .rol{font-size:10px;padding:2px 7px}
  .tr span{font-size:11px}
  .tabs{padding:0 8px;gap:0;overflow-x:auto}
  .tabs button{padding:10px 10px;font-size:11px;white-space:nowrap}
  .main{padding:10px}
  .sr{flex-wrap:wrap;gap:6px}
  .sr>div{min-width:0;flex:1}
  .sr .mn{display:block;font-size:11px}
  .steps{gap:4px}
  .step{font-size:10px;gap:4px;padding:6px 4px}
  .sn{width:18px;height:18px;font-size:10px}
}

/* ═══════════════════════════════════════════════════════════════════════════
   MÓDULO COMEDOR (nuevo tab "Viandas")
   Prefijos .cmd- para no chocar con las clases existentes.
   ═══════════════════════════════════════════════════════════════════════════ */
.cmd-root{--cmd-pri:#F59E0B;--cmd-ok:#10B981;--cmd-err:#EF4444;--cmd-info:#60A5FA;--cmd-purple:#A78BFA;--cmd-dieta:#FBBF24;font-family:var(--fh);}
.cmd-puestochip{display:inline-block;font-size:11px;padding:4px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;margin-right:8px;}
.cmd-puestochip.camp{color:var(--cmd-info);background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.5);}
.cmd-puestochip.chal{color:var(--cmd-purple);background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.5);}
.cmd-puestochip.admin{color:var(--cmd-pri);background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.5);}
.cmd-stats{padding:10px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;display:flex;gap:10px;align-items:center;overflow-x:auto;margin-bottom:12px;}
.cmd-stat{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:5px;padding:6px 12px;white-space:nowrap;}
.cmd-stat .icon{font-size:16px;}
.cmd-stat .num{font-family:var(--fm);font-weight:800;color:var(--cmd-pri);font-size:15px;}
.cmd-stat .num .den{color:var(--tx3);font-weight:500;}
.cmd-stat .lbl{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;}
.cmd-tabs{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px;}
.cmd-tab{flex:1;padding:12px 10px;text-align:center;background:none;border:none;color:var(--tx2);font-weight:600;border-bottom:2px solid transparent;font-size:14px;cursor:pointer;font-family:var(--fh);}
.cmd-tab.active{color:var(--cmd-pri);border-bottom-color:var(--cmd-pri);background:rgba(245,158,11,.06);}
.cmd-datebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;flex-wrap:wrap;}
.cmd-datebar label{font-size:11px;color:var(--tx2);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.cmd-datebar input[type=date]{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:4px;padding:8px 10px;font-family:var(--fm);font-size:14px;}
.cmd-datebar .btnDate{background:var(--s2);border:1px solid var(--bd);color:var(--tx2);padding:8px 12px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;}
.cmd-datebar .btnDate.today{border-color:var(--cmd-pri);color:var(--cmd-pri);}
.cmd-datebar .warn{margin-left:auto;font-size:11px;color:var(--cmd-dieta);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.cmd-search{width:100%;padding:12px 14px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:5px;font-size:15px;margin-bottom:12px;font-family:var(--fh);}
.cmd-search:focus{outline:none;border-color:var(--cmd-pri);}
.cmd-fbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.cmd-fbar .lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;font-weight:700;margin-right:4px;}
.cmd-fbtn{padding:7px 12px;background:var(--s2);border:1px solid var(--bd);color:var(--tx2);border-radius:5px;font-size:12px;text-transform:uppercase;font-weight:600;letter-spacing:.3px;cursor:pointer;font-family:var(--fh);}
.cmd-fbtn.active{background:rgba(245,158,11,.15);border-color:var(--cmd-pri);color:var(--cmd-pri);}
.cmd-fbtn.status.active{background:rgba(16,185,129,.15);border-color:var(--cmd-ok);color:var(--cmd-ok);}
.cmd-fbtn.loc.active{background:rgba(96,165,250,.15);border-color:var(--cmd-info);color:var(--cmd-info);}
.cmd-fbtn.dieta.active{background:rgba(251,191,36,.18);border-color:var(--cmd-dieta);color:var(--cmd-dieta);}
.cmd-fbtn.chalet.active{background:rgba(167,139,250,.18);border-color:var(--cmd-purple);color:var(--cmd-purple);}
.cmd-row .badgePlato{background:var(--cmd-ok);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;}
.cmd-row .badgePlato.no{background:transparent;color:var(--tx3);border:1px dashed var(--tx3);font-weight:700;}
.cmd-row .badgePlato.no:hover{color:var(--cmd-ok);border-color:var(--cmd-ok);}
.cmd-plato{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-bottom:12px;border-radius:6px;padding:10px 14px;font-family:var(--fh);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
.cmd-plato.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.5);color:var(--cmd-ok);}
.cmd-plato.ok button{background:none;border:1px solid var(--bd);color:var(--tx3);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;text-transform:none;}
.cmd-plato.pend{display:block;text-align:left;background:rgba(251,191,36,.1);border:2px dashed var(--cmd-dieta);color:var(--cmd-dieta);cursor:pointer;}
.cmd-undo{background:none;border:1px solid var(--bd);color:var(--tx3);border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;font-family:var(--fh);white-space:nowrap;}
.cmd-undo:hover{color:var(--cmd-err);border-color:var(--cmd-err);}
.cmd-row .badgeChalet{background:var(--cmd-purple);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;}

.cmd-row{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.cmd-row .info{flex:1;min-width:0;}
.cmd-row .nameRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cmd-row .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.cmd-row .letra{font-family:var(--fm);font-size:11px;color:var(--tx3);background:var(--s2);border:1px solid var(--bd);padding:2px 6px;border-radius:3px;margin-left:auto;text-transform:uppercase;}
.cmd-row .meta{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.cmd-row .meals{display:flex;gap:4px;flex-shrink:0;}
.cmd-mp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:5px;border:1px solid var(--bd);min-width:46px;background:var(--s2);}

.cmd-mp.pend .lbl{color:var(--cmd-ok);}
.cmd-mp.disp{background:rgba(245,158,11,.2);border-color:var(--cmd-pri);}
.cmd-mp.disp .lbl{color:var(--cmd-pri);}
.cmd-mp .check{position:absolute;top:-4px;right:-4px;background:var(--cmd-pri);color:#000;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.cmd-editbtn{background:var(--s2);border:1px dashed var(--tx3);color:var(--tx2);border-radius:4px;padding:5px 9px;font-size:11px;font-weight:700;margin-left:8px;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:3px;cursor:pointer;font-family:var(--fh);}
.cmd-editbtn:hover{background:var(--s1);border-color:var(--cmd-dieta);color:var(--cmd-dieta);}
.cmd-editbtn.on{color:#000;background:var(--cmd-dieta);border:1px solid var(--cmd-dieta);border-style:solid;}
.cmd-dnote{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);border-left:3px solid var(--cmd-dieta);border-radius:4px;padding:6px 10px;margin-top:6px;font-size:12px;color:var(--cmd-dieta);width:100%;}
.cmd-dnote strong{color:#000;background:var(--cmd-dieta);padding:1px 6px;border-radius:3px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;margin-right:6px;font-weight:800;}
.cmd-prefix{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:14px;}
.cmd-prefix .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.cmd-prefix .top .lbl{font-size:11px;color:var(--tx2);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.cmd-prefix .top .actv{margin-left:auto;font-size:12px;color:var(--cmd-pri);font-weight:800;text-transform:uppercase;}
.cmd-prefix .top .inactv{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;}
.cmd-prefix .btns{display:flex;gap:8px;flex-wrap:wrap;}

.cmd-scaninp{display:flex;gap:6px;margin-bottom:10px;}
.cmd-scaninp input{flex:1;padding:8px 10px;background:var(--s2);border:2px solid var(--cmd-pri);color:var(--tx);border-radius:5px;font-size:14px;font-family:var(--fm);text-align:center;letter-spacing:.5px;font-weight:700;}
.cmd-scaninp input:focus{outline:none;background:rgba(245,158,11,.06);}
.cmd-scaninp button{padding:0 14px;background:var(--cmd-pri);border:none;color:#000;font-weight:800;border-radius:5px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;font-family:var(--fh);}
.cmd-pcard{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:18px 20px;margin-top:10px;}
.cmd-pcard.dieta{border-left:4px solid var(--cmd-dieta);}
.cmd-pcard h2{font-size:22px;margin-bottom:4px;line-height:1.2;}
.cmd-pcard .metaRow{color:var(--tx2);font-size:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.cmd-pcard .letra{font-family:var(--fm);color:var(--tx);background:var(--s2);border:1px solid var(--bd);padding:3px 8px;border-radius:3px;font-size:12px;font-weight:700;}
.cmd-dbanner{background:var(--cmd-dieta);color:#000;padding:14px 16px;border-radius:6px;font-weight:800;text-align:center;margin-bottom:14px;font-size:16px;letter-spacing:.3px;text-transform:uppercase;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;}
.cmd-mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cmd-mbtn{padding:20px 12px;border:2px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer;font-family:var(--fh);}
.cmd-mbtn .em{font-size:34px;line-height:1;}
.cmd-mbtn .lbl{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.5px;}
.cmd-mbtn .st{font-size:11px;text-transform:uppercase;color:var(--tx3);font-weight:600;letter-spacing:.3px;}
.cmd-mbtn.na{opacity:.3;cursor:not-allowed;}
.cmd-mbtn.na.agr{opacity:.55;cursor:pointer;border-style:dashed;}
.cmd-warnbox{color:var(--cmd-err)!important;background:rgba(239,68,68,.12);border:2px solid var(--cmd-err);border-radius:6px;padding:12px!important;font-weight:800;font-size:14px;margin-bottom:8px;}
.cmd-row .badgeAgreg{background:var(--cmd-info);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;}
.cmd-inp{width:100%;padding:9px 10px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;font-size:14px;font-family:var(--fh);margin-bottom:10px;}

.cmd-modal .btnSave:disabled{opacity:.4;cursor:not-allowed;}
.cmd-atraso{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:700;}
.cmd-atraso .t{flex:1;min-width:200px;}
.cmd-atraso.ro{background:var(--s1);border:1px solid var(--bd);color:var(--tx2);}
.cmd-atraso.on{background:rgba(245,158,11,.15);border:2px solid var(--cmd-pri);color:var(--cmd-pri);text-transform:uppercase;letter-spacing:.3px;}
.cmd-mbtn.pend{border-color:var(--cmd-ok);background:rgba(16,185,129,.06);}
.cmd-mbtn.pend .lbl,.cmd-mbtn.pend .st{color:var(--cmd-ok);}
.cmd-mbtn.disp{border-color:var(--cmd-pri);background:rgba(245,158,11,.12);}
.cmd-mbtn.disp .lbl,.cmd-mbtn.disp .st{color:var(--cmd-pri);}
.cmd-mbtn .dtag{position:absolute;top:6px;right:6px;background:var(--cmd-dieta);color:#000;font-size:8px;font-weight:800;padding:1px 4px;border-radius:2px;letter-spacing:.3px;}
.cmd-empty{text-align:center;color:var(--tx3);font-size:13px;padding:40px 20px;line-height:1.6;}
.cmd-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cmd-ok);color:#000;padding:12px 20px;border-radius:8px;font-weight:800;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.5);max-width:90vw;text-align:center;}

.cmd-modal .who{font-size:13px;color:var(--tx2);margin-bottom:14px;}

.cmd-modal textarea{width:100%;padding:10px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;font-size:14px;font-family:var(--fh);resize:vertical;min-height:70px;}
.cmd-modal textarea:focus{outline:none;border-color:var(--cmd-dieta);}
.cmd-modal .hint{font-size:11px;color:var(--tx3);margin-top:6px;line-height:1.4;}
.cmd-modal .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.cmd-modal .btnSave{flex:1;padding:10px;background:var(--cmd-dieta);border:none;color:#000;font-weight:800;border-radius:6px;font-size:13px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;font-family:var(--fh);}
.cmd-modal .btnQuit{padding:10px 14px;background:transparent;border:1px solid var(--cmd-err);color:var(--cmd-err);font-weight:700;border-radius:6px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;font-family:var(--fh);}
.cmd-modal .btnCancel{padding:10px 14px;background:transparent;border:1px solid var(--bd);color:var(--tx2);font-weight:600;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--fh);}
.cmd-rep{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.cmd-rep h3{font-size:14px;color:var(--cmd-pri);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:800;}
.cmd-rep table{width:100%;border-collapse:collapse;font-size:12px;}
.cmd-rep th,.cmd-rep td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);}
.cmd-rep th{color:var(--tx2);text-transform:uppercase;font-size:10px;letter-spacing:.3px;}
.cmd-rep td.n,.cmd-rep th.n{text-align:right;font-family:var(--fm);font-weight:700;}
.cmd-ptag{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
.cmd-ptag.camp{color:var(--cmd-info);background:rgba(96,165,250,.15);}
.cmd-ptag.chal{color:var(--cmd-purple);background:rgba(167,139,250,.15);}
.cmd-ptag.admin{color:var(--cmd-pri);background:rgba(245,158,11,.15);}

.cmd-btn.ok{background:var(--cmd-ok);border-color:var(--cmd-ok);color:#000;}

.cmd-hint{margin-top:10px;font-size:11px;color:var(--tx3);line-height:1.5;}

.dif-pos{color:var(--cmd-dieta)!important;}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback,useMemo}=React;
// Etiqueta de versión — chip visible en topbar / login / vista pública para saber qué código está corriendo.
// Actualizar en cada revisión nueva. Si cambia y en tablet/celu no lo ves, hay que borrar caché o abrir en incógnito.
const APP_REV="Rev103";
const SB_URL="https://fuqemgiaspxkvfktsjmo.supabase.co";
const SB_KEY="sb_publishable_HjbSY_QNP7X4SY83tbXM5g_b5ls7tjZ";
let _tok=null,_uid=null;
const setSes=(t,u,email,pw)=>{_tok=t;_uid=u;try{localStorage.setItem("sb",JSON.stringify({t,u,email,pw,ts:Date.now()}));}catch(e){}};
const clearSes=()=>{_tok=null;_uid=null;try{localStorage.removeItem("sb");}catch(e){}};
const restoreSes=()=>{try{const s=localStorage.getItem("sb");if(s){const{t,u}=JSON.parse(s);_tok=t;_uid=u;return u;}}catch(e){}return null;};
// Refresca el token si está cerca de vencer o si da error 401
const refreshToken=async()=>{
  try{
    const s=localStorage.getItem("sb");
    if(!s)return false;
    const{email,pw}=JSON.parse(s);
    if(!email||!pw)return false;
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    if(!r.ok)return false;
    const d=await r.json();
    setSes(d.access_token,d.user.id,email,pw);
    return true;
  }catch(e){return false;}
};

// ─── CONEXIÓN ─────────────────────────────────────────────────────────────────
// La app trabaja SOLO online: sin internet no se permite fichar (se usa hoja alternativa).
// No hay cache ni cola offline para evitar descoordinar conteos entre puestos.
const isOnline=()=>navigator.onLine;
const H=(x={})=>({"apikey":SB_KEY,"Authorization":`Bearer ${_tok||SB_KEY}`,"Content-Type":"application/json","Accept-Profile":"obra","Content-Profile":"obra",...x});
const authApi={
  signIn:async(email,pw)=>{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    const d=await r.json();if(!r.ok)return{error:d.error_description||"Email o contrasena incorrectos"};
    setSes(d.access_token,d.user.id,email,pw);return{userId:d.user.id};
  },
  signOut:async()=>{await fetch(`${SB_URL}/auth/v1/logout`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":`Bearer ${_tok}`}});clearSes();}
};
const dbq=async(path,opts={},_retry=false)=>{
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:H(opts.h||{}),...opts});
    if(r.status===401&&!_retry){
      // Token vencido: refrescar y reintentar
      const ok=await refreshToken();
      if(ok)return dbq(path,opts,true);
    }
    const d=await r.json().catch(()=>({}));return{data:d,ok:r.ok};
  }catch(e){
    return{data:null,ok:false};
  }
};
const db={
  sel:async(table,{cols="*",f=[],ord=null,lim=null,inFilter=null,off=null}={})=>{
    let u=`${table}?select=${encodeURIComponent(cols)}`;
    f.forEach(([k,op,v])=>{u+=`&${k}=${op}.${encodeURIComponent(v)}`;});
    if(inFilter){u+=`&${inFilter[0]}=in.(${inFilter[1].join(",")})`;}
    if(ord)u+=`&order=${ord}`;if(lim)u+=`&limit=${lim}`;if(off)u+=`&offset=${off}`;
    const{data,ok}=await dbq(u,{h:{"Accept":"application/json"}});
    return{data:ok?(Array.isArray(data)?data:[data]):null};
  },
  ins:async(table,payload,upsert=false,onConflict=null)=>{
    const body=Array.isArray(payload)?payload:[payload];
    const prefer=upsert?"resolution=merge-duplicates,return=representation":"return=representation";
    let path=table;
    if(upsert&&onConflict)path+=`?on_conflict=${onConflict}`;
    const{data,ok}=await dbq(path,{method:"POST",h:{"Prefer":prefer},body:JSON.stringify(body)});
    return{data:ok?(Array.isArray(data)?data:[data]):null,ok};
  },
  upd:async(table,payload,filters)=>{
    let u=`${table}?`;filters.forEach(([k,op,v])=>{u+=`&${k}=${op}.${encodeURIComponent(v)}`;});
    const{data,ok}=await dbq(u,{method:"PATCH",h:{"Prefer":"return=representation"},body:JSON.stringify(payload)});
    if(!ok)console.error("db.upd failed",table,payload,data);
    return{data,ok};
  },
  rpc:async(fn,params)=>{
    const{data,ok}=await dbq(`rpc/${fn}`,{method:"POST",h:{},body:JSON.stringify(params)});
    return{data,ok};
  },
  del:async(table,filters)=>{
    let u=`${table}?`;filters.forEach(([k,op,v])=>{u+=`&${k}=${op}.${encodeURIComponent(v)}`;});
    await dbq(u,{method:"DELETE"});
  },
};
// Trae todas las filas de a páginas de 1000 (Supabase corta cada respuesta en 1000 filas).
// Necesita `ord` con columnas que no se repitan, para que las páginas no se pisen.
const dbSelAll=async(table,opts={})=>{
  const out=[];const PAGE=1000;
  for(let off=0;;off+=PAGE){
    const{data}=await db.sel(table,{...opts,lim:PAGE,off});
    if(data===null)return{data:null};
    out.push(...data);
    if(data.length<PAGE)return{data:out};
  }
};
const VI={Camioneta:"🛻",Combi:"🚐",Colectivo:"🚌","Camión":"🚛",Auto:"🚗",Maquinaria:"🚜",Otro:"🚗"};
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
// DNI normalizado: los extranjeros pueden tener letras (ej. pasaporte "AAB123456"). Se compara sin espacios y en
// mayúsculas, así "aab123456" y "AAB123456" son la misma persona. Las búsquedas en la base usan ilike (no distingue
// mayúsculas) por si quedó alguno cargado en minúsculas.
const normDni=(s)=>String(s==null?'':s).trim().toUpperCase();
const sameDni=(a,b)=>normDni(a)===normDni(b);

// fetchRadarDia(fecha): retorna mapa {dni: {letra, numero, cpIngresoOk, comidas:[...]}} desde
// viandas_calendario. Se usa para (i) derivar cp_ingreso automáticamente en Puesto/Personal
// (letra != 'F' y != null → OK) y (ii) mostrar info del Radar en la UI.
// Configuración del sync del Radar (URL del web app + secret). Se guarda en la tabla obra.app_config
// para que todos los dispositivos logueados (garitas, tablets) la tomen sin configurar nada.
// Si en Supabase todavía no está, cae al localStorage del navegador (config vieja por dispositivo).
const getRadarCfg=async()=>{
  const{data}=await db.sel("app_config",{inFilter:["clave",["radar_sync_url","radar_sync_secret"]]});
  const m={};(data||[]).forEach(r=>{m[r.clave]=r.valor;});
  if(m.radar_sync_url&&m.radar_sync_secret)return{url:m.radar_sync_url,secret:m.radar_sync_secret};
  let url=null,secret=null;
  try{url=localStorage.getItem('controlobra_radar_sync_url');secret=localStorage.getItem('controlobra_radar_sync_secret');}catch(e){}
  return(url&&secret)?{url,secret}:null;
};
const saveRadarCfg=async(url,secret,userId)=>{
  try{localStorage.setItem('controlobra_radar_sync_url',url);localStorage.setItem('controlobra_radar_sync_secret',secret);}catch(e){}
  const now=new Date().toISOString();
  return db.ins("app_config",[
    {clave:'radar_sync_url',valor:url,actualizado_por:userId,actualizado_at:now},
    {clave:'radar_sync_secret',valor:secret,actualizado_por:userId,actualizado_at:now},
  ],true,"clave");
};
// Dispara el sync remoto del Radar (sheet → viandas_calendario). Devuelve {ok, msg, stats}.
const runRadarSync=async()=>{
  const cfg=await getRadarCfg();
  if(!cfg)return{ok:false,msg:"La sincronización con el Radar no está configurada.\n\nUn admin tiene que entrar a la solapa Viandas y tocar el ⚙️ al lado de \"🔄 Actualizar calendario\" (se configura una sola vez para todos los dispositivos)."};
  try{
    const r=await fetch(cfg.url+'?action=coSync&secret='+encodeURIComponent(cfg.secret));
    const d=await r.json();
    if(d.error)return{ok:false,msg:"El sync del Radar falló: "+d.error+(d.error==='unknown action'?"\n\nRevisar que el Apps Script del Radar tenga el doGet actualizado y un New version en el deploy.":(d.error==='unauthorized'?"\n\nEl secret guardado no coincide con el del Apps Script. Un admin tiene que corregirlo en Viandas → ⚙️.":""))};
    return{ok:true,stats:d};
  }catch(e){return{ok:false,msg:"Error de red al llamar al sync del Radar: "+e.message};}
};
const fetchRadarDia=async(fecha)=>{
  const{data}=await db.sel("viandas_calendario",{f:[["fecha","eq",fecha||today()]],lim:5000});
  const map={}; // clave = DNI normalizado (normDni); leer siempre con radarDe(map,dni)
  (data||[]).forEach(r=>{
    map[normDni(r.dni)]={
      letra:r.letra,
      numero:r.numero,
      codigo:r.codigo,
      cpIngresoOk:!!(r.letra&&r.letra!=="F"),
      comidas:{desayuno:!!r.desayuno,almuerzo:!!r.almuerzo,merienda:!!r.merienda,cena:!!r.cena},
    };
  });
  return map;
};
const radarDe=(map,dni)=>(map&&dni)?map[normDni(dni)]:undefined;
const ini=n=>(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const fmtD=d=>d?d.split("-").reverse().join("/"):"";
const fmtTs=ts=>new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const habSt=h=>{if(!h)return"none";if(h.suspendida)return"sus";const _d=new Date();const _t=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;if(h.fecha_hasta&&h.fecha_hasta<_t)return"exp";return"ok";};
const getHab=(et,eid,tipo,habs)=>habs.find(h=>h.entity_type===et&&(et==="persona"?h.persona_id:h.vehiculo_id)===eid&&h.tipo===tipo)||null;
// personaEstado(id, habs, radarMap?, dni?)
// Rev86+: si se pasa radarMap y dni, cp_ingreso se DERIVA del Radar de Obra:
//   letra != 'F' y letra != null → cp OK, sino → cp bloqueado.
// Si no se pasa radarMap, cae al viejo comportamiento leyendo de habs.
const personaEstado=(id,habs,radarMap,dni)=>{
  // Bloqueada: falta (vencida, sin fecha o suspendida) el INGRESO de S&H y/o el INGRESO de Control de Personal
  const shIng=habSt(getHab("persona",id,"sh_ingreso",habs));
  let cpIng;
  if(radarMap&&dni){
    const r=radarDe(radarMap,dni);
    cpIng=(r&&r.letra&&r.letra!=="F")?"ok":"exp";
  }else{
    cpIng=habSt(getHab("persona",id,"cp_ingreso",habs));
  }
  if(shIng!=="ok"||cpIng!=="ok")return"no";
  // Parcial: los dos ingresos OK pero falta alguna otra habilitación S&H (Subir a Chalet / Manejo en Montaña).
  const shChalet=habSt(getHab("persona",id,"sh_chalet",habs));
  const shManejo=habSt(getHab("persona",id,"sh_manejo",habs));
  if(shChalet!=="ok"||shManejo!=="ok")return"par";
  return"ok";
};
// vehiculoEstado(id, habs) — Rev86: retorna "no" (sin sh_ingreso), "par" (sh_ingreso OK pero
// sh_manejo no — desde Rev98 solo advierte, no bloquea en ningún puesto), "ok" (todo OK).
const vehiculoEstado=(id,habs)=>{
  const shIng=habSt(getHab("vehiculo",id,"sh_ingreso",habs));
  if(shIng!=="ok")return"no";
  const shMan=habSt(getHab("vehiculo",id,"sh_manejo",habs));
  if(shMan!=="ok")return"par";
  return"ok";
};
const chkAuth=(type,id,habs)=>{
  const all=habs.filter(a=>a.entity_type===type&&(type==="persona"?a.persona_id:a.vehiculo_id)===id);
  const active=all.filter(a=>!a.suspendida&&(!a.fecha_hasta||(a.fecha_hasta+'').slice(0,10)>=today()));
  const shOk=active.some(a=>a.tipo==="sh_ingreso");
  const cpOk=type==="vehiculo"||active.some(a=>a.tipo==="cp_ingreso");
  const ok=shOk&&cpOk;
  const reason=ok?null:(!shOk?"Sin habilitacion S&H Ingreso":"Sin habilitacion CP Ingreso");
  return{ok,reason,activeAuths:active};
};
// Devuelve pills coloreadas + decisión de bloqueo según el puesto (P1 / P2 / P3).
// Reglas:
//  Persona — P1 bloquea si falta sh_ingreso o cp_ingreso. P2/P3 bloquea además si falta sh_chalet.
//            sh_manejo solo advierte (naranja), nunca bloquea.
//  Vehiculo — todos los puestos bloquean solo si falta sh_ingreso. sh_manejo (subir chalet) solo advierte
//             (naranja) desde Rev98; antes bloqueaba en P2/P3.
//
// Rev86+: cp_ingreso se DERIVA de viandas_calendario del día vía `radarMap` (Radar de Obra).
//   - radarMap[dni].cpIngresoOk === true  → CP Ingreso OK
//   - radarMap[dni] undefined o letra='F' → CP Ingreso bloqueado
//   Si radarMap no se pasa (contextos donde no está disponible), cae al viejo comportamiento
//   leyendo de habs para no romper.
const getCpIngresoStatusFromRadar=(dni,radarMap)=>{
  if(!radarMap)return null;
  const r=radarDe(radarMap,dni);
  if(!r||!r.letra||r.letra==="F")return"expired";
  return"ok";
};
const getHabPills=(entityType,entityId,habs,puesto,radarMap,personaDni)=>{
  const t_=today();
  const getStatus=(tipo)=>{
    const h=habs.find(a=>a.entity_type===entityType&&(entityType==="persona"?a.persona_id:a.vehiculo_id)===entityId&&a.tipo===tipo);
    if(!h)return"missing";
    if(h.suspendida)return"suspended";
    if(h.fecha_hasta&&String(h.fecha_hasta).slice(0,10)<t_)return"expired";
    return"ok";
  };
  const isP1=puesto==="Puesto 1";
  if(entityType==="persona"){
    const shIng=getStatus("sh_ingreso"),shCha=getStatus("sh_chalet"),shMan=getStatus("sh_manejo");
    // cp_ingreso: derivar del Radar si está disponible; sino leer de habs (backward-compat)
    const cpFromRadar=personaDni?getCpIngresoStatusFromRadar(personaDni,radarMap):null;
    const cpIng=cpFromRadar||getStatus("cp_ingreso");
    const blocks=isP1?(shIng!=="ok"||cpIng!=="ok"):(shIng!=="ok"||shCha!=="ok"||cpIng!=="ok");
    const reasons=[];
    if(shIng!=="ok")reasons.push("S&H Ingreso");
    if(!isP1&&shCha!=="ok")reasons.push("S&H Subir Chalet");
    if(cpIng!=="ok")reasons.push("CP Ingreso");
    return{
      pills:[
        {label:"S&H Ingreso",short:"ING",color:shIng==="ok"?"green":"red"},
        {label:"Subir a Chalet",short:"CHA",color:shCha==="ok"?"green":"red"},
        {label:"Manejo Montaña",short:"MAN",color:shMan==="ok"?"green":"orange"},
        {label:"CP Ingreso",short:"CP",color:cpIng==="ok"?"green":"red",tooltip:cpFromRadar?"Derivado del Radar de Obra":undefined},
      ],
      blocks,
      reason:blocks?("Falta: "+reasons.join(" + ")):null,
    };
  }
  // vehiculo — Rev98: solo bloquea por S&H Ingreso en todos los puestos; Subir Chalet (sh_manejo) solo advierte.
  const shIng=getStatus("sh_ingreso"),shMan=getStatus("sh_manejo");
  const blocks=shIng!=="ok";
  const reasons=[];
  if(shIng!=="ok")reasons.push("S&H Ingreso");
  return{
    pills:[
      {label:"S&H Ingreso",short:"ING",color:shIng==="ok"?"green":"red"},
      {label:"Subir Chalet",short:"CHA",color:shMan==="ok"?"green":"orange"},
    ],
    blocks,
    reason:blocks?("Falta: "+reasons.join(" + ")):null,
  };
};

function Spin({t="Cargando..."}){return <div className="load"><div className="spin"/>{t}</div>;}
function Clock(){
  const[t,setT]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i);},[]);
  return <span style={{fontFamily:"var(--fm)",fontSize:13,color:"var(--tx2)"}}>{t.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})} — {t.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}</span>;
}

// ─── LISTA CON FILTRO EMPRESA ────────────────────────────────────────────────
function ListaFiltrada({items,tipo,titulo,onClose,onRemove}){
  const empresas=[...new Set(items.map(x=>x.empresa||"Sin empresa").filter(Boolean))].sort();
  const[activas,setActivas]=useState(()=>{
    const s={};empresas.forEach(e=>{s[e]=true;});return s;
  });
  // Re-init when empresas change
  useEffect(()=>{
    const s={};empresas.forEach(e=>{s[e]=s[e]!==undefined?s[e]:true;});
    setActivas(s);
  },[items.length]);

  const toggleEmpresa=(e)=>setActivas(a=>({...a,[e]:!a[e]}));
  const toggleTodas=()=>{
    const todasOn=empresas.every(e=>activas[e]);
    const s={};empresas.forEach(e=>{s[e]=!todasOn;});setActivas(s);
  };
  const filtrados=items.filter(x=>(activas[x.empresa||"Sin empresa"]));
  const[removing,setRemoving]=useState(null);
  const handleRemove=async(item)=>{
    if(removing)return;
    setRemoving(item.id);
    try{await onRemove(item);}finally{setRemoving(null);}
  };

  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">{titulo} — hoy</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {empresas.length>1&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:11,fontFamily:"var(--fm)",color:"var(--tx2)",textTransform:"uppercase",letterSpacing:".07em"}}>Filtrar por empresa</div>
          <button className="bsm" style={{fontSize:11}} onClick={toggleTodas}>{empresas.every(e=>activas[e])?"Quitar todas":"Todas"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
          {empresas.map(e=><button key={e} onClick={()=>toggleEmpresa(e)} style={{padding:"3px 10px",borderRadius:12,border:"1px solid",fontSize:11,fontFamily:"var(--fm)",cursor:"pointer",background:activas[e]?"var(--acc2)":"var(--s2)",color:activas[e]?"#fff":"var(--tx2)",borderColor:activas[e]?"var(--acc2)":"var(--bd)",transition:"all .15s"}}>{e}</button>)}
        </div>
        <div style={{fontSize:12,color:"var(--tx2)",marginBottom:10}}>{filtrados.length} de {items.length}</div>
      </>}
      {filtrados.length===0
        ?<div style={{color:"var(--tx2)",textAlign:"center",padding:20}}>Sin resultados.</div>
        :<div>{filtrados.map(item=><div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid var(--bd)"}}>
          {tipo==="vehiculo"
            ?<><span style={{fontSize:20}}>{VI[item.tipo]||"🚗"}</span><div><div style={{fontFamily:"var(--fm)",fontWeight:600}}>{item.patente}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{item.descripcion||item.tipo} · {item.empresa||"—"}</div></div></>
            :<><div className="av">{ini(`${item.nombre} ${item.apellido}`)}</div><div><div style={{fontWeight:500}}>{item.nombre} {item.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{item.empresa||"—"} · DNI {item.dni}</div></div></>
          }
          {onRemove&&<button className="bsm bsm-r" style={{marginLeft:"auto",flexShrink:0}} disabled={removing===item.id} onClick={()=>handleRemove(item)}>{removing===item.id?"...":"Sacar"}</button>}
        </div>)}</div>
      }
    </div>
  </div></div>;
}

// ─── CHALET MINI (topbar) ─────────────────────────────────────────────────────
function ChaletMini({proyectoId,user}){
  const[data,setData]=useState({pc:null,pm:0,vc:0,vm:0,ep:0,plc:[],plm:[],vlc:[],vlm:[],plp:[]});
  const[showList,setShowList]=useState(null);
  const load=async()=>{
    try{
      const[pos,pred]=await Promise.all([
        calcPosicionesMontana(),
        calcPersonasEnPredio(),
      ]);
      const persIdsChalet=Object.entries(pos.persona).filter(([_,p])=>p==="chalet").map(([k])=>k);
      const persIdsCamino=Object.entries(pos.persona).filter(([_,p])=>p==="camino").map(([k])=>k);
      const vehIdsChalet=Object.entries(pos.vehiculo).filter(([_,p])=>p==="chalet").map(([k])=>k);
      const vehIdsCamino=Object.entries(pos.vehiculo).filter(([_,p])=>p==="camino").map(([k])=>k);
      const persIdsPredio=Array.from(pred.inSet);
      // Fallback extra: si alguien figura en camino/chalet pero no en el set del predio
      // (podría pasar si el evento P2/P3 se ordena distinto por milisegundos), forzarlo dentro.
      persIdsChalet.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
      persIdsCamino.forEach(k=>{if(!pred.inSet.has(k))persIdsPredio.push(k);});
      const isUUID=(k)=>typeof k==="string"&&k.length===36&&k.indexOf("-")>=0;
      const allPIds=Array.from(new Set([...persIdsChalet,...persIdsCamino,...persIdsPredio])).filter(isUUID);
      const allVIds=[...vehIdsChalet,...vehIdsCamino].filter(isUUID);
      const[{data:pers},{data:vehs}]=await Promise.all([
        allPIds.length?db.sel("personas",{cols:"id,nombre,apellido,empresa,dni"}):{data:[]},
        allVIds.length?db.sel("vehiculos",{cols:"id,patente,descripcion,tipo,empresa"}):{data:[]},
      ]);
      const persMap={};(pers||[]).forEach(p=>{persMap[p.id]=p;});
      const vehMap={};(vehs||[]).forEach(v=>{vehMap[v.id]=v;});
      const synthPer=(k)=>({id:k,nombre:"Sin registrar",apellido:"",dni:k,empresa:"DNI no encontrado en la base",_synth:true});
      const synthVeh=(k)=>{const pat=String(k).indexOf("No registrado:")===0?String(k).replace("No registrado:","").trim():k;return{id:k,patente:pat,descripcion:"Vehículo no registrado en la base",tipo:"Otro",empresa:"",_synth:true};};
      const buildPer=(ids)=>ids.map(k=>persMap[k]||synthPer(k));
      const buildVeh=(ids)=>ids.map(k=>vehMap[k]||synthVeh(k));
      setData({
        pc:persIdsChalet.length,pm:persIdsCamino.length,
        vc:vehIdsChalet.length,vm:vehIdsCamino.length,
        ep:persIdsPredio.length,
        plc:buildPer(persIdsChalet),
        plm:buildPer(persIdsCamino),
        vlc:buildVeh(vehIdsChalet),
        vlm:buildVeh(vehIdsCamino),
        plp:buildPer(persIdsPredio),
      });
    } catch(e){
      console.warn("ChaletMini: error de red, manteniendo datos anteriores", e.message);
    }
  };
  useEffect(()=>{load();const i=setInterval(load,10000);return()=>clearInterval(i);},[]);
  if(data.pc===null)return null;
  const Pill=({n,label,color,listKey})=><div style={{display:"flex",alignItems:"center",gap:3,background:"rgba(0,0,0,.3)",border:`1px solid ${color}33`,borderRadius:4,padding:"2px 5px",cursor:"pointer"}} onClick={()=>setShowList(listKey)}>
    <span style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:800,color,lineHeight:1}}>{n}</span>
    <span style={{fontSize:9,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase"}}>{label}</span>
    <span style={{fontSize:8,color,opacity:.7}}>▾</span>
  </div>;
  // Sacar a alguien del conteo de montaña: registra una BAJADA manual por Puesto 2
  // (clasifica como "fuera", sale del camino y del chalet). Empareja por persona_id si
  // está registrada, o por el dni_raw exacto si no lo está. Solo admin / P2 / P3.
  const canRemove=!!user&&(user.rol==="admin"||user.puesto_nombre==="Puesto 2"||user.puesto_nombre==="Puesto 3");
  const sacar=async(item)=>{
    const nom=item._synth?("DNI "+item.dni):`${item.nombre} ${item.apellido}`.trim();
    if(!confirm(`¿Sacar a ${nom||item.dni} del conteo de montaña?\n\nSe registra una BAJADA manual por Puesto 2 (queda fuera del camino y del chalet).`))return;
    const{ok}=await db.ins("movimientos_manuales",{proyecto_id:proyectoId,puesto:"Puesto 2",operador_id:user.id,persona_id:item._synth?null:item.id,dni_raw:item.dni||null,nombre_raw:item._synth?("No registrado: "+(item.dni||"")):`${item.nombre} ${item.apellido}`,direccion:"salida"});
    if(!ok){alert("No se pudo registrar la salida. Reintentá.");return;}
    if(!item._synth)await sacarDeAlmuerzoChalet([item],user);
    await load();
  };
  // Sacar un VEHÍCULO del conteo: los vehículos NO usan movimientos_manuales (su posición sale
  // solo de sesiones_acceso), así que registramos una sesión de salida por Puesto 2 con 0 personas.
  // Empareja por vehiculo_id (registrado) o por el vehiculo_razon exacto "No registrado: X" (synth).
  const sacarVeh=async(item)=>{
    const nombre=item.patente||item.id;
    if(!confirm(`¿Sacar el vehículo ${nombre} del conteo de montaña?\n\nSe registra una BAJADA por Puesto 2 (queda fuera del camino y del chalet).`))return;
    const{ok}=await db.ins("sesiones_acceso",{proyecto_id:proyectoId,puesto:"Puesto 2",operador_id:user.id,vehiculo_id:item._synth?null:item.id,vehiculo_ok:true,vehiculo_razon:item._synth?item.id:null,direccion:"salida",total_personas:0,total_aprobados:0,total_rechazados:0});
    if(!ok){alert("No se pudo sacar el vehículo. Reintentá.");return;}
    await load();
  };
  // Sacar una persona del PREDIO: registra una SALIDA manual por Puesto 1.
  // Solo admin. Efecto: al recomputarse calcPersonasEnPredio, su última fichada del día será
  // "Puesto 1 salida" → sale del conteo EN PREDIO (y por transitividad si estaba en camino/chalet
  // también deja de sumar ahí, porque el algoritmo se basa en la última fichada global).
  const canRemovePredio=!!user&&user.rol==="admin";
  const sacarPredio=async(item)=>{
    const nom=item._synth?("DNI "+item.dni):`${item.nombre} ${item.apellido}`.trim();
    if(!confirm(`¿Sacar a ${nom||item.dni} del predio?\n\nSe registra una SALIDA manual por Puesto 1 (la persona queda fuera del predio).`))return;
    const{ok}=await db.ins("movimientos_manuales",{proyecto_id:proyectoId,puesto:"Puesto 1",operador_id:user.id,persona_id:item._synth?null:item.id,dni_raw:item.dni||null,nombre_raw:item._synth?("No registrado: "+(item.dni||"")):`${item.nombre} ${item.apellido}`,direccion:"salida"});
    if(!ok){alert("No se pudo registrar la salida. Reintentá.");return;}
    await load();
  };
  const listData={plc:data.plc,plm:data.plm,vlc:data.vlc,vlm:data.vlm,plp:data.plp};
  const listTitles={plc:"Personas en Chalet",plm:"Personas en Camino",vlc:"Vehiculos en Chalet",vlm:"Vehiculos en Camino",plp:"Personas en el Predio"};
  // Píldora TOTAL (más grande, color distintivo): personas en el predio.
  const TotalPill=({n,label,color,listKey})=><div title="Total de personas dentro del predio (basado en Puesto 1, con fallback si aparecen en P2/P3)" style={{display:"flex",alignItems:"center",gap:5,background:"rgba(0,0,0,.4)",border:`1.5px solid ${color}66`,borderRadius:5,padding:"3px 8px",cursor:"pointer"}} onClick={()=>setShowList(listKey)}>
    <span style={{fontSize:8,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",letterSpacing:.5}}>{label}</span>
    <span style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:900,color,lineHeight:1}}>{n}</span>
    <span style={{fontSize:9,color,opacity:.7}}>▾</span>
  </div>;
  return <>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <TotalPill n={data.ep} label="EN PREDIO" color="#F59E0B" listKey="plp"/>
      <span style={{color:"var(--tx3)",fontSize:16,opacity:.35,margin:"0 2px"}}>│</span>
      <span style={{fontSize:8,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",marginRight:1}}>CAM</span>
      <Pill n={data.pm} label="pers" color="#60A5FA" listKey="plm"/>
      <Pill n={data.vm} label="veh" color="#60A5FA" listKey="vlm"/>
      <span style={{fontSize:8,color:"var(--tx2)",fontFamily:"var(--fm)",textTransform:"uppercase",marginLeft:4,marginRight:1}}>CH</span>
      <Pill n={data.pc} label="pers" color="#A78BFA" listKey="plc"/>
      <Pill n={data.vc} label="veh" color="#10B981" listKey="vlc"/>
    </div>
    {showList&&<ListaFiltrada
      items={listData[showList]}
      tipo={showList.startsWith("v")?"vehiculo":"persona"}
      titulo={listTitles[showList]}
      onClose={()=>setShowList(null)}
      onRemove={showList==="plp"?(canRemovePredio?sacarPredio:null):(canRemove?(showList.startsWith("v")?sacarVeh:sacar):null)}
    />}
  </>;
}

// helper: calcula neto de personas en un puesto dado datos de sesiones+manuales+regs
// calcNet: neto de personas por puesto (clave = persona_id o dni_raw)
const calcNet=async(puesto)=>{
  const todayStr=today();
  const[{data:ses},{data:man}]=await Promise.all([
    db.sel("sesiones_acceso",{f:[["puesto","eq",puesto],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc"}),
    db.sel("movimientos_manuales",{f:[["puesto","eq",puesto],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc"}),
  ]);
  const sesIds=(ses||[]).map(s=>s.id);
  let regPersonas=[];
  if(sesIds.length>0){
    // Filtramos por sesion_id directamente en Supabase (no hay limite de filas)
    const{data:regs}=await db.sel("registros_acceso",{cols:"persona_id,dni_raw,sesion_id",inFilter:["sesion_id",sesIds]});
    regPersonas=regs||[];
  }
  // Normalizar claves: preferir persona_id pero si no hay, usar dni_raw
  // Construir mapa dni_raw -> persona_id para normalizar
  const dniToId={};
  regPersonas.forEach(r=>{if(r.persona_id&&r.dni_raw)dniToId[r.dni_raw]=r.persona_id;});
  const normKey=(pid,dni)=>pid||(dniToId[dni]||dni);

  const netMap={};
  (ses||[]).forEach(s=>{
    const delta=s.direccion==="entrada"?1:-1;
    regPersonas.filter(r=>r.sesion_id===s.id).forEach(r=>{
      const key=normKey(r.persona_id,r.dni_raw);
      netMap[key]=(netMap[key]||0)+delta;
    });
  });
  (man||[]).forEach(m=>{
    const delta=m.direccion==="entrada"?1:-1;
    const key=normKey(m.persona_id,m.dni_raw)||("m_"+m.id);
    netMap[key]=(netMap[key]||0)+delta;
  });
  return netMap;
};

// calcNetVehiculos: neto de vehiculos por puesto (clave = vehiculo_id)
const calcNetVehiculos=async(puesto)=>{
  const todayStr=today();
  const{data:ses}=await db.sel("sesiones_acceso",{
    cols:"vehiculo_id,direccion,cerrada_at,vehiculo_razon",
    f:[["puesto","eq",puesto],["cerrada_at","gte",todayStr+"T00:00:00"]],
    ord:"cerrada_at.asc"
  });
  const netMap={};
  (ses||[]).forEach(s=>{
    // Usar vehiculo_id si existe, sino usar el texto del vehiculo_razon como clave
    const key=s.vehiculo_id||(s.vehiculo_razon&&s.vehiculo_razon.startsWith("No registrado:")?s.vehiculo_razon:null);
    if(!key)return;
    netMap[key]=(netMap[key]||0)+(s.direccion==="entrada"?1:-1);
  });
  return netMap;
};

// calcPosicionesMontana: control cruzado P2 ↔ P3.
// Para cada persona/vehículo, mira TODAS sus fichadas del día en P2 y P3 (sesiones + manuales),
// las ordena por timestamp y decide la posición según la ÚLTIMA. Así, si P3 omitió la salida y P2 la
// registra, la persona deja de figurar en chalet/camino automáticamente.
//  - última P3 entrada → "chalet"
//  - última P3 salida  → "camino" (bajando)
//  - última P2 entrada → "camino" (subiendo)
//  - última P2 salida  → "fuera"
const calcPosicionesMontana=async()=>{
  const todayStr=today();
  const[r1,r2,r3,r4]=await Promise.all([
    db.sel("sesiones_acceso",{f:[["puesto","eq","Puesto 2"],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc",lim:5000}),
    db.sel("sesiones_acceso",{f:[["puesto","eq","Puesto 3"],["cerrada_at","gte",todayStr+"T00:00:00"]],ord:"cerrada_at.asc",lim:5000}),
    db.sel("movimientos_manuales",{f:[["puesto","eq","Puesto 2"],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc",lim:5000}),
    db.sel("movimientos_manuales",{f:[["puesto","eq","Puesto 3"],["created_at","gte",todayStr+"T00:00:00"]],ord:"created_at.asc",lim:5000}),
  ]);
  const ses=[...(r1.data||[]),...(r2.data||[])];
  const man=[...(r3.data||[]),...(r4.data||[])];
  const sesIds=ses.map(s=>s.id);
  let regs=[];
  if(sesIds.length>0){
    const{data}=await db.sel("registros_acceso",{cols:"persona_id,dni_raw,sesion_id",inFilter:["sesion_id",sesIds]});
    regs=data||[];
  }
  const sesById={};ses.forEach(s=>{sesById[s.id]=s;});
  const dniToId={};regs.forEach(r=>{if(r.persona_id&&r.dni_raw)dniToId[r.dni_raw]=r.persona_id;});
  const normKey=(pid,dni)=>pid||(dniToId[dni]||dni);
  const personEvents={},vehEvents={};
  regs.forEach(r=>{
    const s=sesById[r.sesion_id];if(!s)return;
    const key=normKey(r.persona_id,r.dni_raw);
    if(!personEvents[key])personEvents[key]=[];
    personEvents[key].push({t:new Date(s.cerrada_at).getTime(),puesto:s.puesto,dir:s.direccion});
  });
  man.forEach(m=>{
    const key=normKey(m.persona_id,m.dni_raw)||("m_"+m.id);
    if(!personEvents[key])personEvents[key]=[];
    personEvents[key].push({t:new Date(m.created_at).getTime(),puesto:m.puesto,dir:m.direccion});
  });
  ses.forEach(s=>{
    const key=s.vehiculo_id||(s.vehiculo_razon&&s.vehiculo_razon.startsWith("No registrado:")?s.vehiculo_razon:null);
    if(!key)return;
    if(!vehEvents[key])vehEvents[key]=[];
    vehEvents[key].push({t:new Date(s.cerrada_at).getTime(),puesto:s.puesto,dir:s.direccion});
  });
  const classifyLast=(last)=>{
    if(last.puesto==="Puesto 3"&&last.dir==="entrada")return"chalet";
    if(last.puesto==="Puesto 3"&&last.dir==="salida")return"camino";
    if(last.puesto==="Puesto 2"&&last.dir==="entrada")return"camino";
    return"fuera";
  };
  const persona={},vehiculo={},personaLast={},vehiculoLast={};
  Object.entries(personEvents).forEach(([k,e])=>{
    e.sort((a,b)=>a.t-b.t);
    const last=e[e.length-1];
    persona[k]=classifyLast(last);
    personaLast[k]=last;
  });
  Object.entries(vehEvents).forEach(([k,e])=>{
    e.sort((a,b)=>a.t-b.t);
    const last=e[e.length-1];
    vehiculo[k]=classifyLast(last);
    vehiculoLast[k]=last;
  });
  return{persona,vehiculo,personaLast,vehiculoLast};
};

// calcPersonasEnPredio: personas dentro del predio.
// Rev91 (2026-09-22): usa la vista SQL `obra.v_ultima_fichada` (DISTINCT ON por persona, orden por ts DESC)
// filtrada desde la fecha de inicio operativo. Esto descarta fichadas de prueba previas al arranque real
// que ensuciaban el conteo (531 falsos positivos).
//   - Si la última fichada operativa es "Puesto 1 salida" → fuera del predio.
//   - Cualquier otra cosa (P1 entrada, o P2/P3 entrada/salida) → dentro del predio.
// Fallback P1-offline sigue funcionando. Cuando arranque una nueva temporada, cambiar OPERATIVA_DESDE.
const OPERATIVA_DESDE="2026-09-21T00:00:00";
const calcPersonasEnPredio=async()=>{
  const{data}=await db.sel("v_ultima_fichada",{f:[["ts","gte",OPERATIVA_DESDE]],lim:20000});
  const inSet=new Set();
  const lastMap={};
  (data||[]).forEach(r=>{
    lastMap[r.clave]={t:new Date(r.ts).getTime(),puesto:r.puesto,dir:r.direccion};
    if(!(r.puesto==="Puesto 1"&&r.direccion==="salida"))inSet.add(r.clave);
  });
  return{inSet,lastMap};
};

// ─── MOVIMIENTO MANUAL ────────────────────────────────────────────────────────
// Si alguien baja de la montaña antes de las 13 y estaba anotado para almorzar en el chalet, se pregunta si se lo
// saca de esa lista (comidas_diarias.come=false). Lo usan el movimiento manual y el "sacar del conteo de montaña";
// la bajada con vehículo tiene su propio aviso en el Puesto.
const sacarDeAlmuerzoChalet=async(personasBajan,user)=>{
  if(horaArg()>=13)return;
  const ids=personasBajan.map(p=>p.id).filter(Boolean);
  if(!ids.length)return;
  const{data:cd}=await db.sel("comidas_diarias",{f:[["fecha","eq",today()],["tipo","eq","almuerzo"],["ubicacion","eq","chalet"],["come","eq",true]],inFilter:["persona_id",ids]});
  if(!cd||!cd.length)return;
  const nombres=cd.map(c=>{const p=personasBajan.find(x=>x.id===c.persona_id);return p?(p.nombre+' '+p.apellido):'';}).filter(Boolean);
  if(!confirm("🍽 Anotado para almorzar en el chalet hoy:\n\n"+nombres.map(n=>"· "+n).join("\n")+"\n\nSi baja antes de las 13 seguramente no come arriba. ¿Sacarlo de la lista de almuerzo del chalet?"))return;
  for(const c of cd)await db.upd("comidas_diarias",{come:false,modificada_por:user.id,modificada_at:new Date().toISOString()},[["id","eq",c.id]]);
};
function MovimientoManual({user,proyectoId,onClose,onSaved}){
  const[step,setStep]=useState("dir");
  const[dir,setDir]=useState(null);
  const[search,setSearch]=useState("");
  const[personas,setPersonas]=useState([]);
  const[saving,setSaving]=useState(false);
  const isP1=user.puesto_nombre==="Puesto 1";
  const labels=isP1?{entrada:"Entro",salida:"Salio"}:{entrada:"Subio",salida:"Bajo"};
  useEffect(()=>{db.sel("personas",{f:[["deleted_at","is","null"]],ord:"apellido.asc"}).then(({data})=>{if(data)setPersonas(data);});},[]);
  const filtered=personas.filter(p=>search?`${p.nombre} ${p.apellido} ${p.dni} ${p.empresa||""}`.toLowerCase().includes(search.toLowerCase()):true);
  const save=async(persona)=>{
    setSaving(true);
    // Si la persona NO está en la base, conservamos el DNI tipeado como dni_raw
    // para que el movimiento pueda emparejarse con la fichada (subida) no registrada.
    const rawTyped=search.trim().toUpperCase();
    const{ok,data}=await db.ins("movimientos_manuales",{proyecto_id:proyectoId,puesto:user.puesto_nombre,operador_id:user.id,persona_id:persona?persona.id:null,dni_raw:persona?persona.dni:(rawTyped||null),nombre_raw:persona?`${persona.nombre} ${persona.apellido}`:(rawTyped?("No registrado: "+rawTyped):null),direccion:dir});
    if(!ok){alert("No se pudo guardar el movimiento.\n\nDetalle: "+JSON.stringify(data));setSaving(false);return;}
    // Baja caminando por P2/P3 antes de las 13 y estaba anotado para almorzar en el chalet: mismo aviso que con vehículo
    if(persona&&dir==="salida"&&!isP1)await sacarDeAlmuerzoChalet([persona],user);
    setSaving(false);onSaved&&onSaved();onClose();
  };
  return <div className="mo"><div className="md">
    <div className="mh"><div className="mt">Movimiento manual — {user.puesto_nombre}</div><button className="mc" onClick={onClose}>x</button></div>
    <div className="mb">
      {step==="dir"&&<>
        <div style={{fontSize:13,color:"var(--tx2)",marginBottom:16}}>Que movimiento queres registrar?</div>
        <div className="dir-big">
          <button className="dir-big-btn in" onClick={()=>{setDir("entrada");setStep("persona");}}>entro / subio</button>
          <button className="dir-big-btn out" onClick={()=>{setDir("salida");setStep("persona");}}>salio / bajo</button>
        </div>
      </>}
      {step==="persona"&&<>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <span className={`ld ld-${dir==="entrada"?"in":"out"}`}>{labels[dir]}</span>
          <button onClick={()=>setStep("dir")} style={{background:"none",border:"none",color:"var(--tx2)",cursor:"pointer",fontSize:12}}>cambiar</button>
        </div>
        <div className="f"><label>Buscar persona</label><input placeholder="Nombre, apellido o DNI..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus/></div>
        <div style={{maxHeight:280,overflowY:"auto",marginTop:4}}>
          {filtered.slice(0,20).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:5,cursor:"pointer",marginBottom:3}} onMouseOver={e=>e.currentTarget.style.background="var(--s2)"} onMouseOut={e=>e.currentTarget.style.background="transparent"} onClick={()=>save(p)}>
            <div className="av">{ini(`${p.nombre} ${p.apellido}`)}</div>
            <div><div style={{fontWeight:500}}>{p.nombre} {p.apellido}</div><div style={{fontSize:12,color:"var(--tx2)"}}>{p.empresa} - DNI {p.dni}</div></div>
          </div>)}
          {filtered.length===0&&<div style={{textAlign:"center",color:"var(--tx2)",padding:20,fontSize:13}}>Sin resultados</div>}
        </div>
        <button onClick={()=>save(null)} style={{marginTop:12,width:"100%",background:"none",border:"1px dashed var(--bd)",color:"var(--tx2)",borderRadius:4,padding:"9px",cursor:"pointer",fontSize:13,fontFamily:"var(--fm)"}}>
          {saving?"Guardando...":(search.trim()?`Registrar sin identificar (DNI: ${search.trim().toUpperCase()})`:"Registrar sin identificar persona")}
        </button>
      </>}
    </div>
  </div></div>;
}

// ─── HAB MODAL ────────────────────────────────────────────────────────────────
function HabModal({hab,tipo,onClose,onSave,onDelete,saving=false}){
  const defaultFecha=()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toISOString().split("T")[0];};
  const[fecha,setFecha]=useState(hab&&hab.fecha_hasta?hab.fecha_hasta.slice(0,10):defaultFecha());
  const[susp,setSusp]=useState(hab?hab.suspendida:false);
  const[motivo,setMotivo]=useState(hab?hab.motivo_suspension||"":"");
  const[otorgadoPor,setOtorgadoPor]=useState(null); // {nombre, email} del usuario que otorgó
  // Rev86 (e): mostrar quién habilitó — se busca el nombre del usuario en la tabla usuarios
  useEffect(()=>{
    if(!hab||!hab.otorgado_por){setOtorgadoPor(null);return;}
    db.sel("usuarios",{f:[["id","eq",hab.otorgado_por]],cols:"nombre,email",lim:1}).then(({data})=>{
      if(data&&data[0])setOtorgadoPor(data[0]);

  const labels={"sh_ingreso":"S&H Ingreso","sh_chalet":"S&H Subir a Chalet","sh_manejo":"S&H Manejo en Montana","cp_ingreso":"CP Ingreso","cp_almuerzo":"CP Almuerzo","cp_cena":"CP Cena"};

      {hab&&<div style={{padding:"10px 12px",background:"var(--s2)",border:"1px solid var(--bd)",borderRadius:5,fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",marginTop:6}}>
        <div><strong style={{color:"var(--tx)"}}>Habilitado por:</strong> {otorgadoPor?(otorgadoPor.nombre||otorgadoPor.email||"—"):"cargando..."}</div>

      <button className="bp" disabled={!fecha||saving} onClick={()=>onSave({fecha_hasta:fecha,suspendida:susp,motivo_suspension:motivo||null})}>{saving?"Guardando...":"Guardar"}</button>
